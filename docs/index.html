<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI & ML Interview Guide</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script src="vendor/katex/katex.min.js"></script>
<style>:root {
  --bg: #f6f7f9;
  --card: #ffffff;
  --ink: #111827;
  --sub: #4b5563;
  --muted: #6b7280;
  --line: #e5e7eb;
  --line-strong: #d1d5db;
  --accent: #2563eb;
  --accent-bg: #eff6ff;
  --teal: #0f766e;
  --teal-bg: #f0fdfa;
  --purple: #6d28d9;
  --purple-bg: #f5f3ff;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14.5px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1080px;
  margin: 0 auto;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.brand {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.3px;
  color: var(--ink);
  text-decoration: none !important;
}
.tabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.tabs a {
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--sub);
  text-decoration: none;
  transition: background 0.12s, color 0.12s;
}
.tabs a:hover { background: #f3f4f6; color: var(--ink); }
.tabs a.active {
  background: var(--ink);
  color: #ffffff;
}

.container {
  max-width: 1080px;
  margin: 0 auto;
  padding: 32px 24px 72px;
}

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin: 34px 0 14px;
  flex-wrap: wrap;
}
.section-head:first-child { margin-top: 0; }
.section-head h2 {
  margin: 0;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.section-head span {
  font-size: 12.5px;
  color: var(--muted);
}

/* Framework switching pills */
.seg-bar {
  display: inline-flex;
  background: #eaecef;
  padding: 3px;
  border-radius: 8px;
  gap: 2px;
  margin-bottom: 18px;
}
.seg-btn {
  border: 0;
  background: transparent;
  padding: 6px 14px;
  border-radius: 6px;
  font: 600 13px var(--sans);
  color: var(--sub);
  cursor: pointer;
}
.seg-btn.active {
  background: var(--card);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
}

/* Visual Pipeline Strip */
.flow-strip {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 16px;
}
.flow-step {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 600;
  background: #f8fafc;
  border: 1px solid var(--line);
}
.flow-step small {
  font-weight: 400;
  color: var(--muted);
  font-size: 11.5px;
}
.flow-arrow {
  color: #9ca3af;
  font-size: 14px;
  user-select: none;
}

/* Visual Framework Cards */
.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.fw-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px 20px;
  box-shadow: 0 1px 2px rgba(17, 24, 39, 0.03);
}
.fw-card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.step-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 6px;
  font: 700 11.5px var(--sans);
  background: var(--accent-bg);
  color: var(--accent);
  flex-shrink: 0;
}
.theme-teal .step-num { background: var(--teal-bg); color: var(--teal); }
.theme-purple .step-num { background: var(--purple-bg); color: var(--purple); }

.fw-card h3 {
  margin: 0;
  font-size: 14.5px;
  font-weight: 650;
  letter-spacing: -0.15px;
}
.fw-card ul {
  margin: 0;
  padding-left: 17px;
  color: var(--sub);
  font-size: 13.5px;
}
.fw-card li { margin: 5px 0; }
.fw-card li strong { color: var(--ink); font-weight: 600; }

.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.chip {
  display: inline-block;
  font-size: 11.5px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 999px;
  background: #f3f4f6;
  color: var(--sub);
}

/* Accordion prompts & solutions */
details.clean-acc {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  margin-bottom: 8px;
}
details.clean-acc > summary {
  padding: 12px 16px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
details.clean-acc > summary::-webkit-details-marker { display: none; }
details.clean-acc > summary::after {
  content: "+";
  color: var(--muted);
  font-weight: 500;
  font-size: 16px;
}
details.clean-acc[open] > summary::after { content: "−"; }
details.clean-acc[open] > summary { border-bottom: 1px solid var(--line); }
.acc-body {
  padding: 14px 18px;
  font-size: 13.5px;
  color: var(--sub);
}
.acc-body ul { margin: 0; padding-left: 18px; }
.acc-body li { margin: 5px 0; }

/* LeetCode 75 Checklist */
.lc-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.lc-stats {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 13.5px;
  font-weight: 600;
}
.lc-bar {
  width: 140px;
  height: 7px;
  background: #e5e7eb;
  border-radius: 999px;
  overflow: hidden;
}
.lc-bar-fill {
  height: 100%;
  background: #10b981;
  transition: width 0.15s ease;
}
.lc-filters {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.filter-btn {
  border: 1px solid var(--line);
  background: #f9fafb;
  color: var(--sub);
  border-radius: 6px;
  padding: 5px 10px;
  font: 500 12.5px var(--sans);
  cursor: pointer;
}
.filter-btn.active {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}
.reset-btn {
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 12px;
  cursor: pointer;
  padding: 4px 6px;
}
.reset-btn:hover { color: #dc2626; }

.lc-group {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.lc-group-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 11px 16px;
  background: #f9fafb;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  font-weight: 650;
}
.lc-group-head span {
  font-weight: 500;
  font-size: 12px;
  color: var(--muted);
}
.lc-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 16px;
  border-bottom: 1px solid #f3f4f6;
  font-size: 13.5px;
}
.lc-row:last-child { border-bottom: 0; }
.lc-row:hover { background: #fafbfc; }
.lc-row input[type="checkbox"] {
  width: 15px;
  height: 15px;
  accent-color: #10b981;
  cursor: pointer;
  margin: 0;
  flex-shrink: 0;
}
.lc-num {
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  min-width: 34px;
}
.lc-title {
  color: var(--ink);
  font-weight: 500;
  flex: 1;
}
.lc-row.done .lc-title {
  color: #9ca3af;
  text-decoration: line-through;
}
.diff {
  font-size: 11px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 999px;
}
.diff-E { background: #ecfdf5; color: #047857; }
.diff-M { background: #fffbeb; color: #b45309; }
.diff-H { background: #fef2f2; color: #b91c1c; }
.local-pill {
  font-size: 10.5px;
  padding: 1px 6px;
  border-radius: 4px;
  background: #eff6ff;
  color: #1d4ed8;
}

/* Tables & Code Snippets (used sparingly where genuinely code/tabular) */
.clean-table-wrap {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
}
th, td {
  padding: 11px 14px;
  border-bottom: 1px solid #f1f5f9;
  text-align: left;
  vertical-align: top;
}
tr:last-child td { border-bottom: 0; }
th {
  background: #f8fafc;
  font-size: 12px;
  font-weight: 650;
  color: var(--sub);
  border-bottom: 1px solid var(--line);
}

code {
  font: 12.5px/1.4 var(--mono);
  background: #f1f5f9;
  padding: 2px 5px;
  border-radius: 4px;
}
pre {
  margin: 10px 0 0;
  padding: 13px 15px;
  background: #0f172a;
  color: #e2e8f0;
  border-radius: 8px;
  overflow-x: auto;
  font: 12px/1.6 var(--mono);
}
pre code { background: transparent; padding: 0; color: inherit; }

@media (max-width: 860px) {
  .grid-3, .grid-2 { grid-template-columns: 1fr; }
}

/* Reading-first design layout and offline syntax colors. */
.framework-list {max-width:900px;padding-left:26px}.framework-list>li{padding:12px 0;border-bottom:1px solid #e3e7ec}.framework-list h3{margin:0 0 8px}.framework-list ul{line-height:1.8}.design-list{display:block}.design-list .fw-card{border:0;border-bottom:1px solid #e3e7ec;border-radius:0;margin-bottom:12px}.diagram{overflow-x:auto;margin:24px 0}.diagram svg{display:block;width:100%;min-width:760px;height:auto}pre{background:#f5f7fb!important;color:#23334b!important;line-height:1.65;tab-size:4}.syntax-keyword{color:#7337a3;font-weight:600}.syntax-string{color:#166941}.syntax-comment{color:#5d6879;font-style:italic}.syntax-number{color:#a34519}section{margin-bottom:28px}.tabs{flex-wrap:wrap}

/* Theory is a continuous chapter, with no answer accordions. */
.theory-reader { max-width: 850px; margin: 0 auto; }
.theory-reader h1 { font-size: 28px; letter-spacing: -.6px; margin: 0 0 12px; }
.theory-intro { font-size: 16px; color: var(--sub); }
.theory-toc { margin: 26px 0; padding: 20px 24px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.theory-toc h2 { margin: 0 0 10px; font-size: 17px; }
.theory-toc ol { margin: 0; padding-left: 22px; }
.theory-toc ol > li { margin: 12px 0; font-weight: 600; }
.theory-toc ul { display: flex; flex-wrap: wrap; gap: 4px 18px; list-style: none; padding: 3px 0 0; font-size: 13px; font-weight: 400; }
.theory-toc ul a { color: var(--sub); }
.theory-section { margin-top: 48px; }
.theory-section > h2 { font-size: 24px; letter-spacing: -.4px; border-bottom: 2px solid var(--line-strong); padding-bottom: 12px; }
.theory-section-number { color: var(--muted); }
.theory-subsection { margin-top: 32px; }
.theory-subsection > h3 { font-size: 18px; color: var(--teal); margin: 0 0 6px; }
.theory-section, .theory-subsection { scroll-margin-top: 120px; }
.theory-topic { padding: 20px 0; border-bottom: 1px solid var(--line); }
.theory-topic:last-child { border-bottom: 0; }
.theory-topic h4 { font-size: 16px; margin: 0 0 10px; }
.theory-topic p { margin: 10px 0; line-height: 1.8; }
.theory-formula { background: var(--card); border-left: 3px solid var(--accent); padding: 14px 18px; margin: 16px 0 8px; overflow-x: auto; font-size: 16px; }
.theory-formula > div { white-space: nowrap; }
.theory-formula .katex-display { margin: .7em 0; text-align: left; }
.theory-formula .katex-display > .katex { text-align: left; }
.theory-formula .katex { font-size: 1.12em; }
.theory-notation, .theory-follow { color: var(--sub); font-size: 13.5px; }
.theory-sources { font-size: 12.5px; color: var(--muted); }
.theory-topic .clean-table-wrap { margin: 16px 0; }
.theory-topic tbody th { background: #fff; font-size: 13.5px; color: var(--ink); min-width: 120px; }
.theory-topic table { min-width: 560px; }
.theory-reader a:focus-visible, .theory-reader [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
@media (max-width: 600px) {
  .theory-toc { padding: 16px; }
  .theory-toc ul { display: block; }
  .theory-toc ul li { margin: 4px 0; }
  .theory-section > h2 { font-size: 21px; }
  .theory-formula { padding: 10px 12px; font-size: 16px; }
}
@media print {
  .theory-toc, .theory-reader > a { display: none; }
  .theory-reader { max-width: none; }
  .theory-topic h4, .theory-subsection > h3 { break-after: avoid; }
  .theory-formula { overflow: visible; }
  .theory-formula > div { white-space: normal; }
  .theory-topic table { min-width: 0; }
}

/* Keep short answers scannable while making deeper study explicit. */
.theory-depth { margin: 12px 0 24px; border-left: 3px solid #d5dfeb; padding: 0 16px; }
.theory-depth > summary { cursor: pointer; color: #275c83; font-weight: 600; padding: 8px 0; }
.theory-depth[open] > summary { margin-bottom: 8px; }
.theory-example { background: #f3f7fb; padding: 12px 16px; border-radius: 8px; }
.design-reading { background: #f3f7fb; padding: 12px 16px; border-radius: 8px; margin: 22px 0 0; font-size: 13.5px; }
.design-reading h3 { margin: 0 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--sub); }
.design-reading p { margin: 0; line-height: 1.65; }

/* Narrative blog-style ML Design essays & inline concept tooltips. */
.design-reader { max-width: 850px; margin: 0 auto; font-size: 15.5px; line-height: 1.78; }
.design-primers { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 11px 16px; margin: 22px 0 12px; font-size: 13.5px; line-height: 1.65; color: var(--sub); }
.design-primers strong { color: var(--ink); }
.design-index { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 14px; background: #eef2f7; border-radius: 9px; margin: 0 0 36px; font-size: 13px; }
.design-index-label { font-weight: 600; color: var(--sub); margin-right: 2px; }
.design-index a { background: var(--card); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; font-weight: 550; color: var(--ink); text-decoration: none; transition: border-color 0.12s, color 0.12s; }
.design-index a:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }

.design-essay { padding: 36px 0 44px; border-top: 2px solid var(--line-strong); scroll-margin-top: 84px; }
.essay-header { margin-bottom: 22px; }
.essay-kicker { display: block; font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--teal); margin-bottom: 6px; }
.design-essay h2 { margin: 0 0 12px; font-size: 25px; letter-spacing: -0.45px; line-height: 1.25; }
.essay-lede { margin: 0; font-size: 16.5px; line-height: 1.72; color: var(--sub); }
.design-essay h3 { margin: 30px 0 10px; font-size: 18px; letter-spacing: -0.2px; color: var(--ink); }
.design-essay p { margin: 0 0 16px; color: #1f2937; }
.design-essay ul { margin: 0 0 18px; padding-left: 22px; color: #1f2937; }
.design-essay ul > li { margin: 9px 0; line-height: 1.74; }
.design-essay a { font-weight: 500; text-decoration: underline; text-decoration-color: #93c5fd; text-underline-offset: 3px; }
.design-essay a:hover { text-decoration-color: var(--accent); }
.design-essay .clean-table-wrap { margin: 22px 0; font-size: 13.5px; line-height: 1.55; }
.design-essay .framework-list { font-size: 15px; line-height: 1.72; margin: 12px 0 18px; }
.design-essay .framework-list > li { padding: 9px 0; }

.essay-qa { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--teal); border-radius: 8px; padding: 14px 18px; margin: 24px 0 18px; font-size: 14.5px; line-height: 1.7; }
.essay-qa h3 { margin: 0 0 10px; font-size: 15px; color: var(--teal); }
.essay-qa p { margin: 0 0 10px; }
.essay-qa p:last-child { margin-bottom: 0; }

.concept-term, .concept-demo {
  appearance: none;
  border: 0;
  border-bottom: 1.5px dotted var(--teal);
  background: rgba(15, 118, 110, 0.06);
  color: #0f514c;
  font: inherit;
  font-weight: 550;
  padding: 0 4px;
  border-radius: 4px 4px 0 0;
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
.concept-demo { cursor: default; }
.concept-term:hover, .concept-term:focus-visible, .concept-term.is-open {
  background: rgba(15, 118, 110, 0.16);
  color: #093835;
  outline: none;
}

.concept-popover {
  position: fixed;
  z-index: 50;
  width: min(380px, calc(100vw - 24px));
  background: #ffffff;
  color: var(--ink);
  border: 1px solid #cbd5e1;
  border-top: 3px solid var(--teal);
  border-radius: 10px;
  padding: 13px 15px 14px;
  box-shadow: 0 14px 34px rgba(15, 23, 42, 0.16), 0 2px 6px rgba(15, 23, 42, 0.08);
  font-size: 13.5px;
  line-height: 1.62;
}
.concept-popover[hidden] { display: none !important; }
.concept-popover-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.concept-popover-head strong { font-size: 14px; color: var(--ink); }
.concept-popover-close { border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 4px; cursor: pointer; border-radius: 4px; }
.concept-popover-close:hover { background: #f1f5f9; color: var(--ink); }
.concept-popover p { margin: 0; color: #334155; }
</style>
</head>

<script>const COURSE = {"frameworks": {"ml": {"theme": "", "steps": [{"title": "Clarify the Product Goal & Constraints", "items": ["<strong>Business → ML objective:<\/strong> translate what the product wants (e.g., long-term retention, verified answers, prevented fraud) into a concrete prediction target without creating clickbait or gaming loops.", "<strong>Scope &amp; modality:<\/strong> clarify what inputs exist (tabular logs, text, images, session events) and whether predictions run live per request or offline in batch.", "<strong>Scale &amp; latency budget:<\/strong> pin down rough catalog size, QPS and p95/p99 latency (e.g., 150 ms for a feed vs. 2–5 s streaming for RAG)."], "tags": ["Scope", "Live vs Batch", "Latency"]}, {"title": "Lock Online & Offline Metrics First", "items": ["<strong>Online north-star + guardrails:<\/strong> pair the primary win metric (conversions, completed tasks, retention) with hard guardrails (p99 latency, hide/bounce rate, cost, safety/ACL leaks).", "<strong>Stage-matched offline metrics:<\/strong> grade candidate retrieval on coverage (<code>Recall@K<\/code>), rankers on ordering (<code>NDCG@K<\/code>, <code>PR-AUC<\/code>), and probability heads on calibration (<code>LogLoss<\/code>, <code>ECE<\/code>)."], "tags": ["Online", "Offline", "Guardrails"]}, {"title": "Sketch the End-to-End Architecture (V0 → V1)", "items": ["<strong>Start with a simple baseline:<\/strong> state a non-ML or lightweight baseline you could ship in week 1, then explain which bottleneck justifies a multi-stage pipeline.", "<strong>Funnel decomposition:<\/strong> for large catalogs or corpora, separate fast candidate retrieval → feature hydration / reranking → final business policy &amp; filtering."], "tags": ["Two-Stage Funnel"]}, {"title": "Data, Labels & Leak-Free Splits", "items": ["<strong>Honest labels &amp; negatives:<\/strong> separate observed dislikes (hides, bounces) from unexposed items, respect delayed conversion windows, and sample negatives carefully.", "<strong>Features &amp; point-in-time joins:<\/strong> combine slow historical profiles with fresh in-session signals, computing every training feature strictly as of request time.", "<strong>Evaluation split:<\/strong> split chronologically (or by user/query group) so future facts never leak into training."], "tags": ["Labels", "Features", "Temporal Split"]}, {"title": "Modeling Progression & Loss Choice", "items": ["<strong>Earn complexity:<\/strong> progress from heuristic / GBDT baseline → two-tower / fine-tuned encoder → sequence or multi-task architecture only where offline + latency math justify it.", "<strong>Match loss to serving:<\/strong> use pointwise cross-entropy when downstream formulas need calibrated probabilities; use pairwise/listwise or contrastive losses when relative order is enough."], "tags": ["Baseline First", "Loss", "Calibration"]}, {"title": "Serving, Monitoring & Failure Loops", "items": ["<strong>Fast path &amp; fallbacks:<\/strong> precompute static item/doc representations offline, cache safely within permission boundaries, and define graceful fallbacks when a model times out.", "<strong>Post-launch operations:<\/strong> shadow → canary → A/B ramp, monitor score/feature drift before delayed labels arrive, and debug train–serve skew before blindly retraining."], "tags": ["Serving", "Policy Layer", "Drift"]}]}}, "theory": [{"group": "Model selection & classical ML", "subgroup": "Learning setups", "q": "Supervised, unsupervised, self-supervised and reinforcement learning?", "a": "They differ in where the teaching signal comes from: human-provided answers (supervised), patterns in raw inputs alone (unsupervised), fill-in-the-blank tasks hidden inside the data itself (self-supervised), or delayed trial-and-error rewards from acting in an environment (RL).", "nuance": "Self-supervision is a way to obtain a training signal, not a model architecture. An autoregressive language model can be pretrained with self-supervision, instruction-tuned with supervision, then optimized using preference feedback.", "detail": "Self-supervision is the trick that unlocked modern foundation models: by masking a word or predicting the next token, any raw document becomes thousands of supervised training steps with zero human labeling. Modern LLMs stack three paradigms in order: self-supervised pretraining for world knowledge, supervised fine-tuning (SFT) to follow instructions, and RL / preference optimization to align behavior and reasoning.", "example": "Predicting tomorrow's next token on Wikipedia is self-supervised; training on 10k human-written support replies is supervised; optimizing code generation against unit-test pass/fail rewards is RL.", "follow": "Why does next-token self-supervision scale better than human-labeled classification, yet still need post-training?"}, {"group": "Model selection & classical ML", "subgroup": "Learning setups", "q": "Discriminative versus generative models?", "a": "A discriminative classifier learns the boundary directly \\(P(y\\mid x)\\), whereas a generative classifier models each class \\(P(x\\mid y)\\) + \\(P(y)\\) (and generative LMs model full sequences \\(P(x)\\)). **In practice:** discriminative models (logistic regression, GBDTs, fine-tuned encoders) win almost every pure classification benchmark once you have ≥ hundreds of labels; generative Naive Bayes is mainly a fast tiny-data baseline, while generative LLMs win when one model must handle zero-shot tasks, reasoning or text generation.", "nuance": "“Generative” is broader than chat or image generation. Logistic regression and Naive Bayes can solve the same classification task with different modeling assumptions.", "formula": "P(y \\mid x) = \\frac{P(x \\mid y)\\,P(y)}{P(x)}", "sources": [{"title": "Stanford CS229 notes", "url": "https://cs229.stanford.edu/main_notes.pdf"}], "detail": "Analogy: to tell Spanish from French, a discriminative model memorizes only the telltale differences (like 'ñ' vs. 'ç'), whereas a generative model learns how to speak both languages and asks which language makes the sentence more plausible. Discriminative models usually win on raw classification accuracy once data is plentiful because they don't waste capacity modeling every input detail.", "example": "Logistic regression directly scores P(spam | words); Naive Bayes estimates how often spam vs. ham emails generate each word, then combines that with overall spam rate.", "follow": "When can Naive Bayes beat logistic regression on tiny datasets, and why does logistic regression usually overtake it as n grows?"}, {"group": "Model selection & classical ML", "q": "L1 versus L2 regularization?", "a": "L1 penalizes \\(|w|\\) (snapping weak features to exact zero), whereas L2 penalizes \\(w^2\\) (shrinking weights smoothly together). **In practice:** **L2** (or decoupled **AdamW weight decay** in deep learning) is the default in 95% of production models because it handles correlated features cleanly and gives higher accuracy; reach for **L1 / Elastic Net** specifically when you need sparse feature selection over wide linear tables.", "follow": "Why does the intercept often remain unpenalized?", "subgroup": "Linear models & probability", "formula": "\\mathcal{L}_{L_1}(w) = \\mathcal{L}_{\\mathrm{data}}(w) + \\lambda \\sum_j |w_j|\n\\mathcal{L}_{L_2}(w) = \\mathcal{L}_{\\mathrm{data}}(w) + \\lambda \\sum_j w_j^2", "notation": "\\(\\lambda\\ge 0\\) controls penalty strength; whether the loss is a sum or mean changes its effective scale.", "nuance": "With correlated features, L1 may select one arbitrarily; L2 tends to distribute weight. Elastic net combines both penalties. L2 regularization and decoupled weight decay are not equivalent for adaptive optimizers.", "detail": "Why does L1 hit exact zero? An L2 penalty's derivative \\(2\\lambda w\\) vanishes as \\(w \\to 0\\), so tiny weights barely feel any pull; L1's derivative stays a constant \\(\\pm\\lambda\\) all the way to zero, snapping weak features shut. Always standardize continuous features first—otherwise measuring price in cents instead of dollars changes its penalty 100-fold!", "comparison": {"headers": ["Penalty", "Effect on weights", "Best fit / watch-out"], "rows": [["L1 (Lasso)", "Constant pull toward 0 → sparse exact zeros.", "Built-in feature selection; picks arbitrarily among collinear features."], ["L2 (Ridge)", "Proportional pull → small, shared weights.", "Stable with correlated features; keeps every feature nonzero."], ["Elastic Net (L1 + L2)", "Sparsity plus grouped sharing.", "Good when many correlated features exist and some groups are pure noise."], ["AdamW weight decay", "Decoupled shrinkage applied directly to weights.", "Use instead of L2-in-loss with Adam so adaptive variance scaling doesn't weaken regularization."]]}, "example": "If w = 0.01 and λ = 1, L1 pushes toward zero with slope 1, whereas L2 pushes with slope 2(0.01) = 0.02—50× weaker near zero."}, {"group": "Model selection & classical ML", "q": "Linear versus logistic regression?", "a": "Linear regression predicts continuous numbers by minimizing squared error (`MSE` / `Huber`); logistic regression passes a linear score through a sigmoid \\(\\sigma(w^\\top x+b)\\) and minimizes binary cross-entropy to output probabilities in `(0, 1)`. **In practice:** use linear/Huber regression for continuous targets (ETA, price, demand) and logistic regression as your fast, calibrated 5-minute baseline for binary events (click, fraud, churn).", "follow": "Why use cross entropy rather than squared error here? What happens on perfectly separable data? How would you add L2?", "subgroup": "Linear models & probability", "formula": "\\hat y = x^\\top w + b\np = \\sigma(x^\\top w+b) = \\frac{1}{1+\\exp(-x^\\top w-b)}\n\\mathcal{L}_{\\mathrm{BCE}} = -\\frac{1}{n}\\sum_{i=1}^n \\left[y_i\\log p_i + (1-y_i)\\log(1-p_i)\\right]", "notation": "Rows of X are examples; p and y are length-n vectors. For mean BCE, \\(\\nabla_w\\mathcal{L}=X^\\top(p-y)/n\\).", "nuance": "Logistic regression learns a linear decision boundary in its input features. Polynomial or other feature transforms can make that boundary nonlinear in the original input space.", "sources": [{"title": "Stanford CS229 notes", "url": "https://cs229.stanford.edu/main_notes.pdf"}], "detail": "For binary labels, write the Bernoulli likelihood, take its negative log, and substitute the sigmoid score. The chain rule simplifies the derivative with respect to each logit to prediction minus label. Matrix multiplication then accumulates each feature’s contribution. Add an intercept separately so you can leave it unpenalized. Logistic regression is convex in its weights, but arbitrary neural feature learning is not.", "example": "For x=[1,2], y=1 and zero weights/bias, p=0.5. The weight gradient for this one example is [-0.5,-1], so a descent step increases both weights."}, {"group": "Model selection & classical ML", "q": "Why not invert XᵀX?", "a": "Explicitly inverting \\(X^\\top X\\) fails whenever two features are collinear or redundant, and squaring the matrix squares its numerical condition number—amplifying floating-point rounding errors. Use QR or SVD least-squares solvers (`lstsq`) instead.", "follow": "Show a matrix with n>d and duplicate columns.", "subgroup": "Linear models & probability", "formula": "\\hat w_{\\mathrm{OLS}} = (X^\\top X)^{-1}X^\\top y\n\\hat w_{\\mathrm{ridge}} = (X^\\top X+\\lambda I)^{-1}X^\\top y", "notation": "The displayed ridge form penalizes all columns. If X includes an intercept, normally exclude that coordinate from the penalty.", "nuance": "These are algebraic solutions, not instructions to explicitly compute an inverse. QR/SVD avoids squaring the condition number through \\(X^\\top X\\); use a solver for ridge.", "sources": [{"title": "Stanford CS229 notes", "url": "https://cs229.stanford.edu/main_notes.pdf"}], "detail": "Even with 1 million rows and only 3 features, if feature 3 equals feature 1 + feature 2 (say, `total_price = item_price + tax`), infinite weight combinations give the exact same predictions, making \\(X^\\top X\\) non-invertible. `np.linalg.lstsq` uses SVD to find the minimum-norm solution cleanly without ever forming \\((X^\\top X)^{-1}\\).", "example": "With X = [[1, 1], [2, 2], [3, 3]], n=3 > d=2, yet XᵀX = [[14, 14], [14, 14]] has determinant 0 and blows up `np.linalg.inv`."}, {"group": "Model selection & classical ML", "q": "What does Naive Bayes assume?", "a": "Once you know the class label, every feature gives independent evidence—like assuming 'free' and 'jackpot' appear independently inside spam emails. You just add the class log-prior to each feature's log-likelihood, using Laplace smoothing so a new word never zeroes out the whole product.", "follow": "Why can it classify well but be poorly calibrated?", "subgroup": "Linear models & probability", "formula": "\\log P(y\\mid x) = C(x) + \\log P(y) + \\sum_j \\log P(x_j\\mid y)", "nuance": "Repeated correlated evidence gets counted more than once, which can make probabilities overconfident even when the winning class is correct.", "notation": "\\(C(x)=-\\log P(x)\\) does not depend on the class, so it can be omitted when choosing the most likely class.", "sources": [{"title": "Stanford CS229 notes", "url": "https://cs229.stanford.edu/main_notes.pdf"}], "detail": "Why does it still rank well when features are blatantly correlated? Because even if double-counting 'New' and 'York' pushes the spam probability to 0.9999 instead of 0.85, spam still beats ham on the decision boundary! That makes Naive Bayes a fast, strong ranker/classifier on small data, but a terrible probability estimator without post-hoc calibration.", "example": "If P(spam)=0.5 and three identical copied columns each favor spam 3:1, Naive Bayes multiplies 3×3×3 = 27:1 odds (96.4%) when the true odds are still 3:1 (75%)."}, {"group": "Model selection & classical ML", "q": "When are linear regression assumptions needed?", "a": "Fitting a line by least squares only needs independent columns for a unique answer—it does NOT require Gaussian features! Classical assumptions (uncorrelated, constant-variance, Gaussian residuals) matter mainly when you trust textbook p-values and confidence intervals.", "follow": "What changes with heteroscedastic errors?", "subgroup": "Linear models & probability", "sources": [{"title": "Stanford CS229 notes", "url": "https://cs229.stanford.edu/main_notes.pdf"}], "detail": "Separate 'can I predict well?' from 'are my standard errors valid?'. Skewed inputs like income are fine (though log-transforming skewed targets helps if you care about relative errors). If error variance grows with house price (heteroscedasticity), OLS weights remain unbiased, but ordinary standard errors lie—use robust (Huber-White) standard errors, weighted least squares, or bootstrap intervals.", "example": "Predicting delivery time across 1-mile and 30-mile trips has much wider error spread at 30 miles; OLS still estimates the average slope, but naive ±2σ bands are too wide at 1 mile and too narrow at 30."}, {"group": "Model selection & classical ML", "q": "What happens to logistic regression on separable data?", "a": "If a hyperplane separates positives and negatives with zero mistakes, unregularized logistic regression pushes weights toward infinity so sigmoid probabilities approach exact 1 and 0—adding L2 regularization anchors the weights at a finite optimum.", "follow": "What does stronger L2 do to the predicted probabilities?", "subgroup": "Linear models & probability", "detail": "Cross-entropy keeps rewarding higher confidence forever: going from p=0.99 to p=0.9999 lowers loss further, achieved simply by multiplying `w` by 10 without moving the boundary! In practice, gradient descent stops slowly or overflows unless L2 regularization penalizes weight growth.", "example": "With x=-1 → y=0 and x=+1 → y=1, w=10 gives p(+1)=0.99995; w=100 gives 1 − 3.7e-44. Only a penalty like λw² creates a finite stopping point."}, {"group": "Model selection & classical ML", "subgroup": "Linear models & probability", "q": "Maximum likelihood versus MAP estimation?", "a": "MLE fits weights purely to observed data; MAP adds a prior belief keeping weights near zero (a Gaussian prior becomes L2 ridge; a Laplace prior becomes L1 lasso). **In practice:** nobody writes 'MLE' in production because unregularized models overfit rare features or blow up on separable classes—almost every production model uses MAP in disguise via L2/weight decay, early stopping or smoothing priors.", "formula": "\\hat\\theta_{\\mathrm{MLE}} = \\operatorname*{arg\\,max}_{\\theta}\\log P(D\\mid\\theta)\n\\hat\\theta_{\\mathrm{MAP}} = \\operatorname*{arg\\,max}_{\\theta}\\left[\\log P(D\\mid\\theta)+\\log P(\\theta)\\right]", "nuance": "MAP returns a point estimate, not a full posterior. The exact regularization coefficient depends on the prior scale, likelihood noise and sum-versus-mean loss convention.", "sources": [{"title": "Stanford CS229 notes", "url": "https://cs229.stanford.edu/main_notes.pdf"}], "detail": "Intuitively, MLE trusts 3 coin flips of Heads to say P(Heads)=1.0; MAP starts with a prior centered near 0.5 (or weights near 0) and demands enough data evidence to pull parameters away. Note that MAP still returns one single best parameter vector, unlike full Bayesian inference which averages predictions across the whole distribution of plausible weights.", "example": "Minimizing mean squared error \\(\\frac{1}{2\\sigma^2}\\sum(y_i - w^\\top x_i)^2\\) plus a zero-mean Gaussian prior \\(\\frac{1}{2\\tau^2}\\|w\\|_2^2\\) is algebraically identical to Ridge regression with \\(\\lambda = \\sigma^2 / \\tau^2\\).", "follow": "Why does the prior matter less and less as sample size n grows toward infinity?"}, {"group": "Model selection & classical ML", "q": "What does k-means optimize?", "a": "It minimizes inertia—the total squared Euclidean distance from every point to its assigned cluster center—by alternating two exact coordinate-descent steps: assign each point to its closest center, then move each center to the average of its points.", "follow": "Why is a mean appropriate for squared distance but not absolute distance?", "subgroup": "Trees, clustering & features", "formula": "J = \\sum_{i=1}^n \\left\\lVert x_i-\\mu_{c_i}\\right\\rVert_2^2", "notation": "\\(c_i\\) is the cluster assigned to example i; \\(\\mu_{c_i}\\) is its centroid.", "nuance": "It favors roughly spherical groups under the chosen distance. Raw feature scale can dominate; elongated clusters, unequal densities and outliers can make this a poor model.", "sources": [{"title": "Stanford CS229 notes", "url": "https://cs229.stanford.edu/main_notes.pdf"}], "detail": "Why the arithmetic mean? Because calculus says the point minimizing sum of *squared* distances to a group is their mean (whereas minimizing *absolute* L1 distances requires the coordinate-wise median—k-medians). Because Euclidean distance treats all axes equally, an unscaled salary column (0–200,000) will completely drown out age (20–70) unless you standardize first.", "example": "For 1D points [1, 2, 9], mean = 4 gives squared error 9+4+25 = 38 (minimum possible for 1 cluster), whereas L1 absolute distance is minimized at the median 2 (error 1+0+7 = 8)."}, {"group": "Model selection & classical ML", "q": "Bagging versus boosting?", "a": "Bagging averages independent deep trees trained on resampled rows/features to cut variance; boosting adds small shallow trees sequentially to fix the previous ensemble's gradient errors (cutting bias). **In practice:** **boosted trees (LightGBM / XGBoost)** are the go-to winner on tabular accuracy and latency once paired with early stopping; pick **Random Forest** when you want a zero-tuning baseline that trains in parallel and resists noisy labels out of the box.", "follow": "Why do correlated trees limit bagging’s gain? What is the next boosting tree fitting for squared error versus logistic loss?", "subgroup": "Trees, clustering & features", "comparison": {"headers": ["Method", "How it learns", "Main tradeoff"], "rows": [["Random forest / bagging", "Fit resampled trees independently; random forests also subsample features.", "Averaging reduces variance when errors are not perfectly correlated; training parallelizes."], ["Gradient boosting", "Add a weak learner fitted to negative loss gradients.", "Strong tabular baseline; sequential fitting and depth/rate/rounds need tuning."]]}, "detail": "A random forest averages trees trained with bootstrap samples and random feature subsets; the randomness reduces correlation so averaging reduces variance. Boosting adds learners sequentially to improve a shared objective. It can overfit too: validate the number of rounds and tree complexity. Choose based on data, latency and validation results rather than assuming one universally wins.", "example": "If many deep trees all rely on the same dominant feature, their errors remain correlated. Feature subsampling can make their average more useful."}, {"group": "Model selection & classical ML", "q": "How do you handle missing and categorical features?", "a": "For tree models (LightGBM/XGBoost), let native missing-value routing and category splits do the heavy lifting first. For linear or neural models, impute using training-only statistics plus an `is_missing` flag, and pick one-hot, target encoding (out-of-fold!), hashing or learned embeddings by cardinality.", "follow": "When would median imputation hide an important signal?", "subgroup": "Trees, clustering & features", "detail": "Never treat missingness as pure clerical noise: an empty `credit_score` or `days_since_last_purchase` is often the strongest signal in the table! And watch out for naive target encoding—computing mean conversion per `zip_code` on the whole training set lets rare zip codes memorize their own label (`y`), causing massive overfitting while validation collapses.", "example": "If `zip_code = 99999` appears once in train with y=1, naive target encoding gives it feature value 1.0 (100% leaked!); out-of-fold smoothed encoding shrinks it back toward the global mean.", "sources": [{"title": "Scikit-learn preprocessing", "url": "https://scikit-learn.org/stable/modules/preprocessing.html"}]}, {"group": "Model selection & classical ML", "q": "PCA, LDA and feature selection?", "a": "PCA compresses features unsupervised along max-variance axes, LDA uses labels to separate classes, and feature selection drops weak original columns directly. **In practice:** **feature selection** (via validation permutation/SHAP pruning or L1) wins in real production pipelines because dropping 200 dead columns saves upstream SQL/Redis compute and keeps features readable! Use **PCA** mainly to shrink dense embeddings (e.g., 1536d → 256d for cheaper ANN RAM) or visualize clusters.", "follow": "Why fit dimensionality reduction inside each validation fold?", "subgroup": "Trees, clustering & features", "nuance": "Center data before PCA; standardize if differences in units should not determine importance. High variance need not mean useful signal. Here LDA means linear discriminant analysis, not latent Dirichlet allocation.", "sources": [{"title": "Stanford CS229 notes", "url": "https://cs229.stanford.edu/main_notes.pdf"}], "detail": "Common interview trap: assuming the highest-variance PCA component holds the predictive signal! Imagine classifying pancakes stacked flat on top of each other: width has 100× more variance than height, so 1-component PCA throws away height—the *only* axis that separates the two pancakes.", "example": "If x₁ ~ N(0, 100) is pure noise and x₂ = 0.1·y separates classes perfectly, top-1 PCA keeps x₁ (0% accuracy) while LDA keeps x₂ (100% accuracy)."}, {"group": "Model selection & classical ML", "q": "Does k-means converge to the global optimum?", "a": "Guaranteed to stop at a local minimum in finitely many steps, NOT guaranteed to find the global best clustering. Both steps monotonically lower (or hold flat) the same non-negative squared-error objective over finitely many partitions, so it cannot cycle if ties are broken consistently.", "follow": "What does k-means++ improve?", "subgroup": "Trees, clustering & features", "detail": "Bad random starting centers can put two centroids inside one dense blob and force a single centroid to straddle two distant blobs forever. `k-means++` fixes most bad starts cheaply by picking the first center at random and sampling each next center with probability proportional to squared distance \\(D(x)^2\\) from existing centers.", "example": "With 4 tight clusters at (0,0), (0,1), (100,0), (100,100) and k=3, placing two initial centers near (0,0) traps k-means in a high-inertia local optimum unless re-run with k-means++."}, {"group": "Model selection & classical ML", "subgroup": "Trees, clustering & features", "q": "Decision tree versus linear model versus neural network?", "a": "Match the model to data type, scale and constraints. **In practice:** **boosted trees (LightGBM / XGBoost)** are the default winner on structured tabular data (<10M rows, mixed units, missing values, sharp thresholds); **linear / logistic models** win for 5-minute baselines, strict sub-ms SLAs, regulated coefficient explainability, or extrapolating time/price trends beyond training ranges; **neural networks** win on unstructured data (text, images, audio, user sequences), multi-task sharing, or 100M+ row embedding catalogs.", "comparison": {"headers": ["Model", "Strength", "Caveat"], "rows": [["Linear / logistic", "Fast, transparent coefficients after accounting for scaling.", "Needs engineered interactions for nonlinear boundaries."], ["Boosted trees", "Strong on heterogeneous tabular features.", "Piecewise predictions extrapolate poorly; preprocessing and leakage still matter."], ["Neural network", "Shared representations for text, images and multimodal input.", "More choices in architecture, data and optimization; not automatically better on small tables."]]}, "detail": "Match the inductive bias to the data geometry: heterogeneous tables full of irregular thresholds (`age > 65 AND cart < $10`), missing values and skewed units favor GBDTs; smooth additive relationships or strict extrapolation outside historical ranges (like time trends or pricing elasticity) favor linear models; raw text, audio, images and long event sequences favor neural representation learning.", "example": "If house prices rise $10k/year from 2015–2025 ($200k to $300k), a tree asked to predict 2028 caps out at its highest training leaf ($300k)—it cannot extrapolate above the training max!", "follow": "How would you combine a linear trend model with boosted trees when you need both tabular interactions and smooth extrapolation?"}, {"group": "Model selection & classical ML", "subgroup": "Trees, clustering & features", "q": "How does a decision tree choose a split?", "a": "Choose the feature and threshold with the largest weighted impurity reduction. Classification commonly uses Gini or entropy; regression commonly minimizes squared error within leaves.", "detail": "A split is useful when child nodes are purer than their parent after weighting by child size. Greedy local choices do not guarantee a globally optimal tree. Minimum leaf size, depth limits and pruning control complexity. Scaling a continuous feature monotonically usually preserves candidate partitions.", "example": "A balanced binary parent has Gini 0.5. Splitting it into two equally sized pure leaves reduces impurity to 0; isolating one rare example gives a much smaller weighted gain.", "follow": "Why weight child impurities by size? How do high-cardinality features and small leaves encourage overfitting?", "sources": [{"title": "Decision tree learning", "url": "https://scikit-learn.org/stable/modules/tree.html"}], "formula": "G=1-\\sum_c p_c^2\n\\Delta=I_P-\\frac{n_L}{n_P}I_L-\\frac{n_R}{n_P}I_R", "notation": "p_c is the class fraction; I is impurity; n is node sample count; P/L/R denote parent/left/right."}, {"group": "Model selection & classical ML", "subgroup": "Trees, clustering & features", "q": "What exactly does gradient boosting learn at each round?", "a": "Add a small tree that improves the current ensemble’s loss. For squared error, its training targets are residuals; for general losses, use negative gradients and sometimes curvature.", "detail": "The ensemble score is updated additively. For binary log loss, the score is a logit and the negative gradient is y−sigmoid(score). Tree leaf values depend on the objective and implementation; fitting residuals is not a complete description for every loss. Tune learning rate together with rounds, depth/leaves, row/feature subsampling and early stopping.", "example": "A positive example predicted at 0.2 has a larger correction signal (0.8) than one predicted at 0.9 (0.1).", "follow": "Why do smaller learning rates often need more trees? When is a forest a better baseline?", "sources": [{"title": "Gradient boosting and ensembles", "url": "https://scikit-learn.org/stable/modules/ensemble.html"}], "formula": "F_m(x)=F_{m-1}(x)+\\eta h_m(x)", "notation": "F is the ensemble score; h_m is the new tree; η is shrinkage."}, {"group": "Model selection & classical ML", "subgroup": "Trees, clustering & features", "q": "XGBoost versus LightGBM: why use second-order gradients (Hessians)?", "a": "Plain gradient boosting only looks at the slope \\(g_i\\) of the loss; XGBoost and LightGBM use a second-order Taylor approximation with both slope \\(g_i\\) and curvature \\(h_i\\) (Hessian)—taking cautious small steps where the loss curves sharply and confident steps where curvature is flat, while building regularized leaf penalties directly into the split score.", "detail": "Feynman picture: imagine walking downhill in fog. Knowing only the slope (`g_i`) tells you which way is down, not whether the cliff flattens out in 1 inch or 10 yards! The second derivative (`h_i`) acts like a per-example certainty weight—for logistic loss, \\(h_i = p_i(1-p_i)\\), which automatically shrinks near 0 when an example is already confidently classified (`p ≈ 0.99`) and peaks at `0.25` for uncertain `p = 0.5` points! Both libraries also bin continuous features into ~256 histogram buckets (`O(#bins)` instead of sorting `O(n log n)`) and learn a default left/right branch for `NaN`s automatically.", "comparison": {"headers": ["Choice", "How trees grow & split", "Practical trade-off"], "rows": [["XGBoost (depth-wise default)", "Splits all nodes at depth d before depth d+1; exact or histogram bins.", "Balanced trees resist overfitting on smaller/noisier datasets."], ["LightGBM (leaf-wise)", "Always splits whichever single leaf gives largest loss drop; GOSS + EFB.", "Very fast and accurate on large tables; always cap `num_leaves` / `min_child_samples` so small data doesn't overfit."], ["Native `NaN` & `'category'`", "Routes missing values to whichever child lowers loss more; partitions category bins by `G / H`.", "Eliminates manual imputation and huge one-hot matrices in 30-min interviews and production."]]}, "formula": "w_j^* = -\\frac{G_j}{H_j + \\lambda}, \\qquad \\mathrm{Gain} = \\frac{1}{2}\\left[\\frac{G_L^2}{H_L+\\lambda} + \\frac{G_R^2}{H_R+\\lambda} - \\frac{(G_L+G_R)^2}{H_L+H_R+\\lambda}\\right] - \\gamma", "notation": "\\(G_j = \\sum_{i\\in I_j} g_i\\) sums first derivatives in leaf \\(j\\); \\(H_j = \\sum_{i\\in I_j} h_i\\) sums second derivatives; \\(\\lambda\\) is L2 leaf regularization; \\(\\gamma\\) is minimum gain to keep a split.", "example": "For binary log-loss, if 10 leaf examples all have y=1 and p=0.5, G = −5 and H = 2.5. With λ=0, optimal logit step is −(−5)/2.5 = +2.0; with λ=2.5, it shrinks safely to +1.0.", "follow": "Why can leaf-wise growth with `num_leaves = 255` overfit a 2,000-row table much faster than depth-4 level-wise trees?", "sources": [{"title": "XGBoost paper (Chen & Guestrin)", "url": "https://arxiv.org/abs/1603.02754"}]}, {"group": "Model selection & classical ML", "subgroup": "Model deep dives", "q": "Deep dive: logistic regression from objective to launch", "a": "For a binary outcome, start with an interpretable probability baseline: define the label window, prepare features, minimize regularized BCE, validate probabilities and pick a decision threshold for the product.", "detail": "Explain the linear log-odds assumption and derive p−y. Fit scaling and categorical encoding on training data; use temporal validation for future outcomes. Inspect slices and nonlinear interactions the model cannot express. Tune regularization, calibrate if needed, and compare with a tree baseline. Monitor missingness, score distribution and label delay after launch.", "example": "For whether a user applies to a job within seven days, only train on impressions old enough to have a mature label. Useful features include skill overlap and recency, all computed at impression time.", "follow": "What fails if applications are rare? Can a good AUC still yield poor decisions? How would you explain a coefficient?", "sources": [{"title": "Stanford CS229 notes", "url": "https://cs229.stanford.edu/main_notes.pdf"}]}, {"group": "Model selection & classical ML", "subgroup": "Model deep dives", "q": "Deep dive: boosted trees for tabular prediction", "a": "Use boosted trees as a strong candidate when heterogeneous tabular features and nonlinear interactions matter. Explain split selection, additive learning, loss choice and capacity controls.", "detail": "Begin with a simple baseline and point-in-time feature table. Inspect missing/categorical handling for the chosen implementation. Validate by time or entity as required. Use early stopping on validation data and report quality, inference cost and calibration. Trees do not naturally extrapolate smoothly outside observed feature ranges; learned representations may be better for raw text or images.", "example": "A cancellation model can combine lead time, price, prior behavior and policy features. A suspiciously dominant post-booking support feature warrants a leakage investigation before celebrating the lift.", "follow": "How do you diagnose overfitting? Why might a linear model extrapolate better? What changes for ranking?", "sources": [{"title": "Gradient boosting and ensembles", "url": "https://scikit-learn.org/stable/modules/ensemble.html"}]}, {"group": "Data & generalization", "q": "Bias versus variance?", "a": "High training error suggests underfitting or an optimization/data issue; low training error with a large validation gap suggests overfitting. Compare learning curves before choosing more data, capacity or regularization.", "follow": "What would more data change? How would you distinguish underfitting from a broken training loop?", "subgroup": "Generalization & validation", "nuance": "Bias–variance is a decomposition of expected squared prediction error across possible training sets, not a diagnosis you can read directly from one loss curve. An irreducible noise term remains even with a perfect model.", "formula": "\\mathbb{E}\\!\\left[(Y-\\hat f(x))^2\\mid x\\right] = \\operatorname{Bias}[\\hat f(x)]^2 + \\operatorname{Var}[\\hat f(x)] + \\sigma^2(x)", "notation": "At a fixed input \\(x\\), expectation averages over training sets and a fresh outcome. \\(\\sigma^2(x)=\\operatorname{Var}(Y\\mid x)\\) is irreducible noise.", "detail": "Use learning curves to form a hypothesis. High training and validation error suggests insufficient signal, an unsuitable model, excessive regularization or optimization failure. Low training error with worse validation error suggests overfitting or a distribution mismatch. More data helps only some causes; inspect the split and labels before changing capacity.", "example": "A network cannot fit 50 clean examples. Before collecting a million more, check targets, gradients, loss reduction and whether parameters are actually updated."}, {"group": "Data & generalization", "q": "How do you prevent leakage?", "a": "Split before fitting scalers, imputers or feature selection. Use time splits for forecasting and group splits for repeated entities. Features must exist at prediction time; tune on validation, evaluate once on held-out test.", "follow": "How would you construct a point-in-time join? When is the same user in train and test legitimate?", "subgroup": "Generalization & validation", "nuance": "A random split can put the same user, near-duplicate document or future interaction on both sides. Choose the split that matches the actual deployment question; an unseen-user split tests something different from predicting future activity for existing users.", "sources": [{"title": "Validation and splitting strategies", "url": "https://scikit-learn.org/stable/modules/cross_validation.html"}], "detail": "Define exactly when a prediction is made, then allow only features available at that time. Split before fitting imputers, scalers, feature selectors or target encoders. Group related records if deployment involves unseen entities; use time splits if deployment predicts future behavior. Historical joins need event time and availability time, not merely the latest database value.", "example": "A fraud feature counting chargebacks leaks if it includes chargebacks reported after the transaction. A time split alone does not fix a feature table populated with future outcomes."}, {"group": "Data & generalization", "subgroup": "Generalization & validation", "q": "Training, validation, test and cross-validation?", "a": "Training teaches weights; validation picks hyperparameters, features and decision thresholds; the held-out test set gives one honest final grade right before launch. K-fold cross-validation rotates the validation slice across K splits when data is too small to waste 20% on a single noisy split.", "nuance": "Repeatedly checking the test set turns it into validation data. For small datasets and extensive tuning, nested cross-validation separates selection from evaluation. Use grouped or chronological folds when observations are dependent.", "sources": [{"title": "Validation and splitting strategies", "url": "https://scikit-learn.org/stable/modules/cross_validation.html"}], "detail": "Every time you look at the test score and tweak a feature or threshold in response, information from the test set leaks into your modeling choices—quietly turning the test set into a second validation set. Fit all scalers, vocabularies and encoders *inside* each CV fold's training portion, never once on the whole dataset upfront.", "example": "Selecting the 'best' 10 features by correlation on all 500 rows before running 5-fold CV can yield 80% CV accuracy on pure random noise!", "follow": "When is 5-fold shuffled CV actively wrong compared to a single forward-chaining time split?"}, {"group": "Data & generalization", "subgroup": "Generalization & validation", "q": "When should you split by time, user or query?", "a": "Match the split to the generalization claim. Time splits test future behavior; group splits test unseen entities; ranking candidates for one query must stay together.", "detail": "A random row split can leak near-duplicates, shared sessions or entity-specific information. A user-disjoint split is not automatically best when production serves returning users; measure both returning and cold-start slices if both matter. Fit preprocessing only on the training fold and leave a final test set untouched.", "example": "If five impressions belong to one search, splitting them across folds creates dependence and can distort query-level ranking metrics.", "follow": "How would you evaluate new items and existing users separately? When do you need a gap between temporal folds?", "sources": [{"title": "Validation and splitting strategies", "url": "https://scikit-learn.org/stable/modules/cross_validation.html"}]}, {"group": "Data & generalization", "q": "Data drift versus concept drift?", "a": "Data (covariate) drift means the *inputs* arriving in production look different \\(P(X)\\) changes; concept drift means the *rule connecting inputs to answers* changed \\(P(Y\\mid X)\\) changes. Input shift is an early warning, while concept drift breaks the model even on familiar inputs.", "follow": "What can you detect before labels arrive?", "subgroup": "Data shifts & production checks", "nuance": "Label shift changes P(y) while P(X | y) stays fixed. These are assumptions, not exhaustive labels for real incidents; multiple distributions can change together.", "detail": "Plain-English picture: if your store suddenly gets twice as many teen shoppers, that's covariate drift—if your model already knows teen preferences well, accuracy might stay fine! If inflation suddenly makes the exact same shopper stop buying $8 coffee, that's concept drift—the input vector didn't change, the human behavior did.", "example": "During a holiday sale, cart sizes jump (P(X) shifts) AND fraudsters switch tactics so previously safe patterns turn fraudulent (P(Y|X) shifts)."}, {"group": "Data & generalization", "q": "How do you test an ML pipeline beyond accuracy?", "a": "Treat data, features and model behavior like software contracts: unit-test feature transforms and point-in-time joins, assert schema/null/range bounds on live inputs, verify online–offline feature parity on logged requests, and run directional invariance/slice tests before shipping.", "follow": "What would you inspect first after a sudden quality regression?", "subgroup": "Data shifts & production checks", "detail": "90% of silent ML production bugs aren't math bugs—they're plumbing bugs: a mobile app update renames `'US'` to `'usa'`, a Redis timeout defaults an online feature to `0.0` (which meant 'high risk' in training, where missing was `-1`), or a single slice (new iOS users) drops 30% while global AUC barely moves.", "example": "Replay 1,000 production request logs through both the online feature service and the offline training pipeline: if `user_7d_clicks` differs by more than 1%, fix train–serve skew before retraining!"}, {"group": "Data & generalization", "q": "Shadow, canary and blue-green deployment?", "a": "Shadow mode copies live requests to the new model silently in the background to test latency, crashes and score distributions with zero user impact. Canary exposes 1–5% of real traffic with auto-rollback alarms. Blue-green keeps old and new serving stacks warm side by side for instant cutover.", "follow": "How do you ensure a shadow model cannot cause tool side effects?", "subgroup": "Data shifts & production checks", "detail": "Keep infrastructure rollout separate from causal measurement: a canary saves you from NaNs, OOMs and p99 latency spikes in the first 30 minutes, whereas an A/B experiment runs across randomized users over days/weeks to prove product lift. Note that in shadow mode, the new model's actions aren't shown to users—so you can check latency and score parity, not counterfactual click lift.", "example": "Shadowing a new RAG agent must stub or block external write tools—otherwise the 'silent' shadow model will send duplicate customer emails!"}, {"group": "Data & generalization", "subgroup": "Data shifts & production checks", "q": "How do you catch drift before labels arrive, and which feature importances lie?", "a": "Before delayed ground-truth labels arrive, monitor **model output score distributions**, null/default rates, and top-feature shifts (using PSI or KS distance). To pick which features actually matter, use **permutation importance** or **SHAP** on held-out validation—default tree split-gain inflates high-cardinality noisy IDs.", "detail": "Why monitor the *predicted score* distribution first? Because a table might have 300 features—295 could be noisy harmless drift, while a bug in 1 top-3 feature immediately shifts your predicted probability histogram! And why does default tree impurity importance lie? A random `user_zip` or continuous noise column offers thousands of possible split thresholds on training data, letting deep trees rack up bogus training impurity drops that vanish completely when you permute that column on validation data.", "comparison": {"headers": ["Importance / Drift tool", "How it works", "Main blind spot"], "rows": [["Tree split / impurity gain", "Sums training loss reduction whenever a feature splits.", "Biased toward continuous / high-cardinality features; blind to validation generalization."], ["Permutation importance", "Shuffles one column on validation data and measures metric drop.", "Cheap and honest, but shuffling one of two duplicate correlated columns shows ~0 drop!"], ["SHAP (TreeSHAP)", "Averages marginal contribution of a feature across feature subsets.", "Consistent local + global attribution; correlated features still split credit and shouldn't be read causally."], ["PSI / KS on features & scores", "Compares live bucket fractions or CDF gap against a baseline window.", "Flags *that* distribution moved, not whether P(Y|X) broke—focus alerts on high-SHAP features + output scores."]]}, "example": "Add a pure random float `rand_id` to a tree: training split-gain ranks `rand_id` near the top, whereas validation permutation importance shows slightly *negative* importance (shuffling it removes overfitting!).", "follow": "If two identical copies of a strong feature exist (`price_usd` and `price_cents`), what happens to permutation importance vs. SHAP?", "sources": [{"title": "SHAP: A unified approach to interpreting predictions", "url": "https://arxiv.org/abs/1705.07874"}]}, {"group": "Data & generalization", "subgroup": "Features & supervision", "q": "How do you handle class imbalance without breaking probabilities?", "a": "Select metrics and decisions for the product first. Class weights or resampling change optimization emphasis, but they also change the effective class distribution and can distort probability estimates.", "detail": "Use a representative validation/test set. Compare PR curves, recall at a precision target and cost-sensitive decisions. With case-control sampling independent of features within each class, an odds correction can account for retention rates; otherwise calibrate on representative held-out data rather than applying a blind correction.", "example": "If all positives and 10% of negatives are retained, a 0.5 sampled posterior corresponds to odds 0.1 in the original population, or probability about 0.091, under the stated sampling assumptions.", "follow": "Why is 99% accuracy useless at 1% prevalence? How do weighting and threshold tuning differ?", "sources": [{"title": "Probability calibration", "url": "https://scikit-learn.org/stable/modules/calibration.html"}, {"title": "Classification and ranking metrics", "url": "https://scikit-learn.org/stable/modules/model_evaluation.html"}]}, {"group": "Data & generalization", "subgroup": "Features & supervision", "q": "What do delayed or noisy labels change?", "a": "Define a label window, wait for outcomes to mature, and distinguish a true negative from an outcome that has not arrived yet. Audit disagreement and missingness by slice.", "detail": "Train on mature examples or explicitly model censoring when freshness demands it. Human labels need a written rubric, overlap samples and adjudication. Pseudo-labels can amplify a teacher’s errors; evaluate on independent human-reviewed data. Never use downstream outcomes as features at prediction time.", "example": "A job impression from an hour ago with no application is not equivalent to one from two weeks ago with no application.", "follow": "How would you balance freshness and label maturity? What if negative feedback is selectively reported?", "sources": [{"title": "Airbnb embedding-based retrieval", "url": "https://airbnb.tech/ai-ml/embedding-based-retrieval-for-airbnb-search/"}]}, {"group": "Data & generalization", "q": "What if labels are scarce?", "a": "Spend your first human budget on a clean evaluation set, not training rows. Then bootstrap training signal using pretrained embeddings, programmatic rules (weak supervision), or an LLM teacher, and use active learning to label only the most informative gaps.", "follow": "Why must you never evaluate your student model on LLM-generated or rule-generated test labels?", "subgroup": "Features & supervision", "sources": [{"title": "Snorkel weak supervision", "url": "https://arxiv.org/abs/1711.10160"}, {"title": "Ramp industry classification", "url": "https://builders.ramp.com/post/industry_classification"}], "detail": "Think of label scarcity like mapping a dark room with a tiny battery: first stake out fixed reference landmarks (a locked human-labeled test set) so you never fool yourself. Next, get cheap broad light from zero-shot embeddings, domain rules, or a slow frontier LLM teacher, then train a fast student model. Finally, send humans a mix of borderline cases (uncertainty), distinct clusters (diversity), and a small random sample so the model does not trap itself in its own blind spots.", "comparison": {"headers": ["Approach", "When it shines", "Failure mode to guard against"], "rows": [["LLM teacher + distillation", "Nuanced text/multimodal rubrics a large model handles well offline.", "Inherits teacher biases; always measure student against human gold labels."], ["Weak supervision (Snorkel)", "Experts can write regexes, thresholds or cross-table heuristics.", "Correlated rules double-count evidence unless a label model weights them."], ["Active learning", "Large unlabeled pool with expensive SME annotators.", "Pure uncertainty sampling chases outliers and creates confirmation bias; mix in diversity + 5% random."], ["Semi-supervised pseudo-labels", "Strong initial model + abundant in-domain unlabeled data.", "Confident early mistakes snow-ball unless filtered by calibrated thresholds."]]}, "example": "With 150 labeled fraud cases and 5M unlabeled transactions, hold out 100 positives + stratified negatives for testing, use an LLM + rules to soft-label 100k rows for a GBDT student, and review 200 uncertain + diverse cases weekly."}, {"group": "Evaluation & experiments", "q": "Metrics for imbalanced classification?", "a": "Precision measures correctness among predicted positives; recall measures coverage of actual positives. Choose the threshold using error costs or a precision/recall constraint. PR curves emphasize rare-positive performance; ROC-AUC alone can hide a poor operating point.", "follow": "Can a high-AUC model have bad probability calibration?", "subgroup": "Metrics, thresholds & ranking", "formula": "\\mathrm{Precision} = \\frac{\\mathrm{TP}}{\\mathrm{TP}+\\mathrm{FP}}\n\\mathrm{Recall} = \\frac{\\mathrm{TP}}{\\mathrm{TP}+\\mathrm{FN}}\nF_1 = \\frac{2\\,\\mathrm{Precision}\\,\\mathrm{Recall}}{\\mathrm{Precision}+\\mathrm{Recall}}", "nuance": "F1 ignores true negatives and assumes a particular balance between precision and recall. PR performance depends on prevalence: compare on the same population. Define how zero denominators are handled.", "sources": [{"title": "Classification and ranking metrics", "url": "https://scikit-learn.org/stable/modules/model_evaluation.html"}], "detail": "Why does ROC-AUC fool people on 0.1% fraud? Because ROC-AUC's x-axis divides false positives by *all* negatives: flagging 10,000 innocent users out of 1,000,000 gives a tiny 1% FPR (great ROC-AUC!), yet if there are only 1,000 real fraudsters, 91% of your fraud alerts are false alarms (9% precision)! PR-AUC puts predicted positives in the denominator, exposing false-alarm overload immediately.", "example": "With 100 positives and 99,900 negatives, catching 90 positives while raising 900 false alarms gives TPR=90%, FPR=0.9% (stellar ROC point), but Precision = 90 / 990 = 9.1%."}, {"group": "Evaluation & experiments", "q": "Offline versus online recommender quality?", "a": "Offline ranking metrics (Recall@K, NDCG@K) only check whether you rank yesterday's *already-shown* winners higher—they cannot see novel items the old model never exposed, session fatigue, latency slowdowns or creator/inventory side effects. Online A/B tests measure real user behavior with guardrails.", "follow": "How do you evaluate items that the old policy never showed?", "subgroup": "Metrics, thresholds & ranking", "sources": [{"title": "Classification and ranking metrics", "url": "https://scikit-learn.org/stable/modules/model_evaluation.html"}], "detail": "Offline replay suffers from a closed-loop blind spot: if the old ranker only showed sports posts, a new ranker that surfaces a brilliant cooking post gets penalized or ignored offline because there is no historical label on that cooking post! Use offline metrics as fast sanity gates to filter broken candidates, not to crown the final winner.", "example": "Recommending 10 nearly identical viral videos scores sky-high offline pointwise CTR, yet tanks online session length because users get bored after video #2."}, {"group": "Evaluation & experiments", "q": "How do you calibrate a classifier?", "a": "Calibration asks whether predictions near 0.8 are correct about 80% of the time. Inspect reliability plots, log loss or Brier score, and subgroup behavior. Fit Platt scaling or isotonic regression on disjoint calibration data. Resampling or class weighting can change probabilities; validate calibration under the serving distribution.", "follow": "Why can a monotonic calibration map preserve ranking? When can calibration drift after launch?", "subgroup": "Metrics, thresholds & ranking", "formula": "\\mathrm{Brier} = \\frac{1}{n}\\sum_{i=1}^n (p_i-y_i)^2", "nuance": "Ranking and calibration are different: strictly increasing score transforms preserve AUC but can change calibration. Reliability diagrams depend on binning; log loss strongly punishes confidently wrong predictions.", "sources": [{"title": "Classification and ranking metrics", "url": "https://scikit-learn.org/stable/modules/model_evaluation.html"}], "detail": "Evaluate predicted probabilities against observed outcomes on held-out data. Fit a sigmoid or monotonic isotonic mapping on separate calibration data; select the method with enough support in relevant probability ranges. Calibrate on the serving distribution, especially after negative sampling or reweighting. Ranking quality and probability quality answer different questions.", "example": "Two models rank every user identically, but one predicts 0.9 for a group with 0.3 observed conversion. Their AUC can match while expected-value decisions differ badly."}, {"group": "Evaluation & experiments", "q": "MRR, MAP, NDCG and MMR?", "a": "MRR grades the rank of the *first* hit; MAP averages precision across all binary hits; NDCG@K weights graded relevance by log-position decay; MMR is a diversity reranker, not a metric. **In practice:** use **MRR** when one right answer finishes the task (QA, navigational lookup), **NDCG@K** as the default for feeds and product search with graded signals (`click=1, buy=3`), **Recall@K** for first-stage candidate retrieval, and **MMR** in the final policy layer to suppress near-duplicates.", "follow": "Which metric fits a single factual answer versus a feed? Why can identical NDCG hide poor catalog coverage?", "subgroup": "Metrics, thresholds & ranking", "formula": "\\mathrm{DCG}@K = \\sum_{r=1}^K \\frac{2^{\\mathrm{rel}(r)}-1}{\\log_2(r+1)}\n\\mathrm{NDCG}@K = \\frac{\\mathrm{DCG}@K}{\\mathrm{IDCG}@K}", "notation": "\\(\\mathrm{rel}(r)\\) is relevance at rank \\(r\\); \\(\\mathrm{IDCG}\\) is DCG under the ideal ordering. State the gain convention and how queries with no relevant results are handled.", "nuance": "MRR emphasizes the first useful result; recall@K emphasizes finding all required evidence; NDCG handles graded relevance and ordering. A reranker cannot recover a relevant document missing from its candidate set.", "sources": [{"title": "Classification and ranking metrics", "url": "https://scikit-learn.org/stable/modules/model_evaluation.html"}], "detail": "MRR rewards the first relevant result; AP averages precision at relevant ranks, and MAP averages AP across queries. NDCG gives graded relevance more weight near the top and normalizes against the ideal ordering. MMR is a selection rule trading relevance against redundancy, not a relevance metric. State how queries with no positives and ties are treated.", "example": "For binary relevance [1,0,1] with two total relevant items: RR=1, AP=(1+2/3)/2=0.833. Binary DCG@3=1+1/log2(4)=1.5; ideal DCG=1+1/log2(3), giving NDCG≈0.920."}, {"group": "Evaluation & experiments", "q": "Micro versus macro metrics for multilabel tasks?", "a": "Micro-averaging pools every prediction across all classes into one giant confusion matrix—so huge head classes dominate. Macro-averaging computes the metric separately for each class and averages them equally—so failing on a rare 0.1% safety label hurts just as much as failing on a 50% topic tag.", "follow": "When would a good micro score hide a failed rare label?", "subgroup": "Metrics, thresholds & ranking", "sources": [{"title": "Classification and ranking metrics", "url": "https://scikit-learn.org/stable/modules/model_evaluation.html"}], "detail": "Pick based on business pain: if every individual item error costs the same (e.g., routing tickets across balanced queues), report micro; if every *category* must work reliably regardless of volume (e.g., 50 policy-violation types where 5 are rare but severe), track macro plus worst-class recall.", "example": "Class A has 990 items (99% F1) and Class B has 10 items (0% F1): micro-F1 is ~98% (looks great!), while macro-F1 is (99% + 0%) / 2 = 49.5% (flags the broken class)."}, {"group": "Evaluation & experiments", "subgroup": "Metrics, thresholds & ranking", "q": "ROC-AUC versus PR-AUC versus log loss?", "a": "ROC-AUC scores overall pairwise ranking across all negatives; PR-AUC focuses strictly on precision vs. recall among positive predictions; Log Loss grades exact probability calibration. **In practice:** use **PR-AUC** (plus Recall at a target Precision/FPR) whenever positives are rare (<5%: fraud, abuse, alerts); **ROC-AUC** only as a balanced ranking check; and **Log Loss / Normalized Cross-Entropy + ECE** whenever probabilities drive dollar math (`eCPM = bid × pCTR`).", "comparison": {"headers": ["Measure", "What it captures", "Watch out"], "rows": [["ROC-AUC", "Probability a positive outranks a negative, with tie convention.", "Many true negatives can coexist with too many false alerts."], ["PR-AUC / average precision", "Precision–recall tradeoff; AP uses recall-weighted precision increments.", "Depends on prevalence; trapezoidal PR-AUC and AP are not identical."], ["Log loss", "Quality of predicted probabilities.", "Sensitive to confidently wrong labels and label noise."]]}, "sources": [{"title": "Classification and ranking metrics", "url": "https://scikit-learn.org/stable/modules/model_evaluation.html"}], "detail": "Think of them as three progressively stricter exams: ROC-AUC asks 'did positives get higher scores than negatives overall?'; PR-AUC asks 'among the top items we actually flag positive, are they mostly real positives?'; Log Loss asks 'can I trust the exact probability number 0.03 vs. 0.30 for bidding, pricing or expected-cost math?'.", "example": "Dividing every predicted probability by 10 leaves ROC-AUC and PR-AUC 100% unchanged, but wrecks Log Loss and underbids ad auctions by 10×!", "follow": "Which of the three metrics should be your primary offline gate for an ads pCTR model, and why?"}, {"group": "Evaluation & experiments", "subgroup": "Metrics, thresholds & ranking", "q": "Statistical significance versus practical significance?", "a": "A p-value < 0.05 only says 'with this much traffic, the true difference probably isn't literally zero'—it does NOT say the lift pays for engineering complexity, GPU cost or latency. Always look at the confidence interval around the effect size against a pre-agreed minimum shippable bar.", "nuance": "Repeated peeking and testing many metrics inflate false positives without an appropriate design. Bootstrap users or another independent unit rather than correlated rows; paired evaluation helps compare models on the same examples.", "sources": [{"title": "Classification and ranking metrics", "url": "https://scikit-learn.org/stable/modules/model_evaluation.html"}], "detail": "At 100M users, a +0.02% CTR bump can have p = 0.0001 while adding 40 ms of GPU latency that costs $2M/year. Confidence intervals unify both questions: `[+0.01%, +0.03%]` tells you the lift is real *and* trivially small; `[-0.5%, +3.5%]` tells you the test is underpowered and needs more samples or variance reduction.", "example": "If shipping a heavier reranker requires +0.5% conversion to break even on GPU spend, a statistically significant `[+0.08%, +0.22%]` result is a confident 'do not ship'.", "follow": "What happens to your false-positive rate if you check p < 0.05 every morning for 14 days and stop the first day it crosses?"}, {"group": "Evaluation & experiments", "subgroup": "Metrics, thresholds & ranking", "q": "How do you choose a threshold from business costs?", "a": "A probability model and a decision policy are separate. Choose the threshold on validation data using false-positive/false-negative costs, capacity constraints or a required precision/recall.", "detail": "For calibrated probabilities and constant costs, predict positive when the expected cost of acting is less than not acting. This yields C_FP/(C_FP+C_FN). The formula changes with action-dependent benefits, heterogeneous costs or limited review capacity. Check performance across relevant slices.", "example": "If a false negative costs 9 and a false positive costs 1, the ideal threshold is 0.1 under those assumptions—not automatically 0.5.", "follow": "What if you can review only 1,000 cases a day? What if probabilities are miscalibrated?", "sources": [{"title": "Classification and ranking metrics", "url": "https://scikit-learn.org/stable/modules/model_evaluation.html
