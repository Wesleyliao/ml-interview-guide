t", "KV heads stored", "Serving & quality trade-off"], "rows": [["MHA (Multi-Head)", "H_kv = H_q (1 per query head)", "Highest KV cache footprint; decode quickly hits HBM bandwidth wall."], ["GQA (Grouped-Query)", "1 < H_kv < H_q (e.g., 8 KV for 32 Q)", "4×–8× smaller KV cache & faster decode with near-MHA quality; modern standard."], ["MQA (Multi-Query)", "H_kv = 1 across all query heads", "Smallest simple KV cache, but more noticeable quality drop unless trained/adapted carefully."], ["MLA (Multi-Head Latent)", "Compressed low-rank latent c_t^(KV)", "Even smaller KV cache than GQA at stronger quality, with extra projection math."]]}, "example": "Shifting from MHA (32 KV heads) to GQA (8 KV heads) shrinks KV cache 4×, letting the same GPU serve 4× larger concurrent batch size or 4× longer context!", "follow": "In PyTorch code, how do 8 KV heads broadcast or repeat to match 32 Query heads before `Q @ K.transpose(-1, -2)`?"}, {"group": "Tokenizers & Transformers", "subgroup": "Efficient attention & inference", "q": "Prefill, decode and batching: where does latency come from?", "a": "Prefill processes the prompt; decode generates subsequent tokens with cached attention state. Track time to first token, time per output token and total request latency separately.", "detail": "Long prompts increase prefill work and cache occupancy. Decode often faces memory-bandwidth limits at small batches; batching can improve utilization but adds queueing and memory pressure. Continuous batching admits and retires requests as they progress. Prefix caching reuses compatible prompt-prefix computation, while output caching reuses a response; their correctness conditions differ.", "example": "An agent making eight serial model calls may be slower than one call with the same total tokens because every call adds scheduling, prefill and network overhead.", "follow": "How does a long output affect concurrency? When can a larger batch hurt p95 latency?", "sources": [{"title": "PagedAttention and serving", "url": "https://arxiv.org/abs/2309.06180"}]}, {"group": "Tokenizers & Transformers", "q": "Fine-tuning, LoRA or RAG?", "a": "RAG injects fresh external facts at query time; LoRA trains tiny low-rank adapter matrices to change model behavior/style; full fine-tuning updates every weight. **In practice:** always start with **prompting + RAG** when facts update, permissions matter or citations are required; add **LoRA SFT** to lock in strict formatting, domain tone/routing or distilling an expensive prompt into a fast 8B model; reserve **full fine-tuning** for heavy continued pretraining.", "follow": "What evidence would justify fine-tuning? What must stay in an external data source?", "subgroup": "Training objectives & adaptation", "nuance": "LoRA reduces trainable parameters and optimizer state, but the frozen base weights still need to be stored or quantized. RAG cannot fix a model that consistently ignores supplied evidence; fine-tuning cannot guarantee fresh facts.", "sources": [{"title": "LoRA paper", "url": "https://arxiv.org/abs/2106.09685"}], "detail": "Diagnose the failure first: unavailable or changing facts suggest retrieval; output conventions or task behavior may benefit from supervised examples; a poor prompt or tool contract should be fixed directly. RAG and adaptation can be combined. LoRA changes which parameters are trained, not whether the task is retrieval or generation.", "example": "For current account balances, query an authorized system of record. For consistently producing a validated domain-specific schema, improve prompting and measure whether SFT adds value."}, {"group": "Tokenizers & Transformers", "subgroup": "Training objectives & adaptation", "q": "Pretraining versus SFT versus preference optimization?", "a": "Pretraining learns broad patterns from a large corpus. Supervised fine-tuning (SFT) learns desired responses from demonstrations. Preference optimization uses comparisons or rewards to favor better responses; DPO learns directly from chosen/rejected pairs, while RL methods optimize rewards through policy updates.", "nuance": "Better preference scores do not guarantee factuality or task success. The preference data, rubric and reward model can be biased or exploitable; keep held-out task evaluations and inspect regressions.", "sources": [{"title": "Direct Preference Optimization", "url": "https://arxiv.org/abs/2305.18290"}], "detail": "Why isn't pretraining enough? Because a raw pretrained model trained on internet text treats `'How do I fix a leaky faucet?'` as the start of a quiz page and happily outputs `'Question 2: How do I wire a lamp?'`! **SFT** teaches the assistant *format and helpfulness* by imitating curated `(prompt, ideal_response)` demos. **Preference optimization (DPO / RLHF / GRPO)** teaches *judgment*: it is often much easier to grade or compare two candidate answers (or run a code unit test) than to write a single gold human essay for every hard prompt.", "example": "Pretraining learns Python syntax and libraries; SFT learns to answer coding questions politely with markdown blocks; RL/GRPO with test execution teaches the model to catch subtle off-by-one bugs.", "follow": "When can aggressive SFT or DPO make a model *more* confident in hallucinations ('alignment tax' / sycophancy)?"}, {"group": "Tokenizers & Transformers", "subgroup": "Training objectives & adaptation", "q": "Temperature versus top-k versus top-p sampling?", "a": "Temperature scales logit sharpness before softmax; top-k caps candidate count; top-p (nucleus) dynamically keeps just enough top tokens to cover probability mass `p`. **In practice:** set **`temperature = 0`** for deterministic JSON extraction, SQL, classification and evals; use **`temperature ≈ 0.6–0.8` + `top_p ≈ 0.9–0.95`** (leaving `top_k` off or wide) for natural chat/writing; and use **`temperature ≈ 0.7–1.0`** when sampling diverse candidates for best-of-N or RL (GRPO).", "formula": "p_i(T) = \\frac{\\exp(z_i/T)}{\\sum_j\\exp(z_j/T)},\\qquad T>0", "nuance": "Greedy decoding takes the maximum directly rather than dividing by zero. Sampling temperature is a decoding choice; contrastive-loss temperature shapes a training objective. Reducing randomness does not guarantee truth or globally optimal sequences.", "detail": "Even at low temperature (`T = 0.7`), standard softmax assigns tiny nonzero probability to 100,000 absurd tail tokens—over 1,000 tokens, summing 100,000 tiny tails can still sample nonsense! **Top-k** chops off everything past rank `k`, which fails in both directions: if 1 token has 99% probability, `k=50` still lets 49 weird tokens in; if 100 creative words tie at 1%, `k=50` cuts half off arbitrarily. **Top-p (nucleus)** adapts dynamically: keep just enough top tokens to cover 90–95% of probability mass (1 token when certain, 80 tokens when open-ended), then renormalize.", "example": "For `'2 + 2 ='` where `' 4'` has p=0.98, `top_p=0.95` keeps ONLY `' 4'` (size 1); for `'Write a story starting with'` where probabilities are flat, `top_p=0.95` keeps dozens of valid openings.", "follow": "When should you set `temperature = 0` (greedy), and why do best-of-N / RL rollouts require `temperature > 0`?"}, {"group": "Tokenizers & Transformers", "subgroup": "Training objectives & adaptation", "q": "LoRA versus QLoRA versus full fine-tuning: what uses memory?", "a": "Full fine-tuning pays ~16 bytes/param for weights, grads and AdamW states; LoRA freezes BF16 base weights (`2B/param`) and trains tiny rank-`r` adapters; QLoRA quantizes the frozen base to 4-bit `NF4` (`~0.5B/param`). **In practice:** **BF16 LoRA** is the default workhorse for 90% of fine-tunes (fast kernels, merges cleanly into base weights for zero serving overhead); use **QLoRA** only when VRAM is tight on a single GPU; use **full fine-tuning** for large mid-training domain shifts on multi-GPU clusters.", "detail": "Separate base weights, gradients, optimizer states, activations and temporary buffers in the memory budget. Adapter training reduces trainable state but long sequences still consume activation memory. Checkpointing recomputes activations to save memory. Quantization introduces approximation; benchmark quality and supported serving kernels.", "example": "For a d×d matrix, rank-r LoRA has 2dr parameters instead of d² for its update. With d=4096 and r=8, that is 65,536 versus 16,777,216.", "follow": "Why can LoRA still run out of memory? What does merging an adapter change at serving time?", "sources": [{"title": "LoRA", "url": "https://arxiv.org/abs/2106.09685"}, {"title": "QLoRA", "url": "https://arxiv.org/abs/2305.14314"}], "formula": "W=W_0+\\frac{\\alpha}{r}BA", "notation": "A has shape (r,d_in), B has shape (d_out,r); W0 is frozen."}, {"group": "Tokenizers & Transformers", "subgroup": "Training objectives & adaptation", "q": "How does knowledge distillation help production?", "a": "Train a smaller student to reproduce useful teacher behavior, then validate the quality-cost trade-off on the real task. Distillation can target probabilities, representations or generated examples.", "detail": "Soft targets convey relative preferences beyond the winning class. For classification, a common loss combines hard-label cross entropy with temperature-scaled teacher/student KL. Generated-label distillation also needs filtering and coverage checks: the student inherits teacher errors and may miss rare cases.", "example": "An expensive reranker labels candidate pairs offline; a small model learns to score them online. Evaluate independently of the teacher’s labels before shipping.", "follow": "Why use temperature in soft-target distillation? How do you keep the teacher from contaminating evaluation?", "sources": [{"title": "Knowledge distillation", "url": "https://arxiv.org/abs/1503.02531"}], "formula": "\\mathcal L=(1-\\lambda)\\operatorname{CE}(y,p_s)+\\lambda T^2\\operatorname{KL}(p_t^T\\Vert p_s^T)", "notation": "λ is the loss weight; T is temperature; p_t and p_s are teacher and student distributions."}, {"group": "Tokenizers & Transformers", "subgroup": "Training objectives & adaptation", "q": "SFT versus DPO versus online RL: what data do they need?", "a": "SFT imitates `(prompt, gold_response)` demos; DPO contrasts offline `(chosen, rejected)` pairs; online RL (PPO/GRPO) grades live model rollouts with a reward/verifier. **In practice:** run **SFT** first to teach format and baseline behavior; use **DPO** as the simplest offline way to polish tone, style and human preference rankings without RL infra; use **online RL (GRPO)** when you have a deterministic verifier (unit tests, math/SQL execution, schema/state sandboxes) where exploration beats human demos.", "detail": "SFT demonstrations need correct behavior and representative coverage. Preference pairs must compare responses to the same prompt and may encode annotator biases. Online rollouts can explore new behavior but require reward validation, rollout infrastructure and careful evaluation for reward exploitation. DPO is not a substitute for fixing missing evidence or an unreliable tool.", "example": "If preferences reward long answers, both preference learning and reward optimization may increase verbosity without improving correctness.", "follow": "What would make a preference pair ambiguous? How would you detect reward hacking?", "sources": [{"title": "Direct Preference Optimization", "url": "https://arxiv.org/abs/2305.18290"}]}, {"group": "Tokenizers & Transformers", "subgroup": "Training objectives & adaptation", "q": "What makes a good supervised fine-tuning dataset?", "a": "Use representative, correct input-output examples with a stable task definition. Deduplicate and split by underlying task/source before generating variants, then evaluate held-out behavior.", "detail": "Choose a loss mask appropriate to the task: instruction tuning commonly supervises assistant output rather than treating user text as the target. Preserve tool schemas and valid argument/result relationships for tool-use examples. Mix coverage deliberately, audit synthetic labels, and compare against the unadapted model and prompting baseline.", "example": "Twenty paraphrases of one source document split across train and test exaggerate generalization. Group by source or task family before augmentation.", "follow": "How would you detect memorization? Which failures suggest missing data versus an unsuitable objective?", "sources": [{"title": "LoRA", "url": "https://arxiv.org/abs/2106.09685"}]}, {"group": "Tokenizers & Transformers", "subgroup": "Model deep dives", "q": "Deep dive: how modern 2025–2026 LLMs differ from the 2017 Transformer", "a": "Walk through five clean upgrades over the original 2017 paper: **(1) Decoder-only + Pre-RMSNorm** for stable deep gradients, **(2) RoPE (+ QK-Norm)** for relative positions without length walls, **(3) GQA or MLA** to slash KV-cache memory during decode, **(4) SwiGLU 3-matrix FFNs** for stronger expressiveness per FLOP, and **(5) Sparse Mixture-of-Experts (MoE)** to scale knowledge capacity (`total params`) without scaling per-token latency (`active params`).", "detail": "Explain *why* each change happened rather than reciting buzzwords: Post-LayerNorm required fragile warmup or diverged at depth → **Pre-RMSNorm** leaves an untouched residual highway and skips mean subtraction; **QK-Norm** applies RMSNorm to queries and keys right before attention so massive scale/long-context logits don't spike; **SwiGLU** uses 3 projections (`gate, up, down`), so hidden width shrinks from `4d` to `(8/3)d` to keep total FFN parameter count constant at `8d²`; and **Sparse MoE** replaces one giant FFN with `E` smaller expert FFNs where a lightweight router activates only top-`k` (e.g., 8 of 256) experts per token—giving 200B+ knowledge capacity at ~20B active FLOP cost, provided router load-balancing prevents every token from crowding into 2 experts!", "formula": "\\operatorname{SwiGLU}(x) = \\left(\\operatorname{SiLU}(xW_{\\mathrm{gate}}) \\odot xW_{\\mathrm{up}}\\right) W_{\\mathrm{down}}\n\\operatorname{MoE}(x) = \\sum_{e \\in \\operatorname{TopK}(g(x))} g_e(x)\\,\\operatorname{FFN}_e(x)", "notation": "\\(\\operatorname{SiLU}(z) = z\\,\\sigma(z)\\); with \\(d_{\\mathrm{ff}} = \\frac{8}{3}d\\), three \\(d \\times d_{\\mathrm{ff}}\\) matrices total \\(3 \\cdot d \\cdot \\frac{8}{3}d = 8d^2\\) parameters (matching a classic 2-matrix \\(4d\\) FFN).", "example": "A 64-expert MoE activating top-2 experts per token has ~8× the total FFN RAM requirement of a dense model (all 64 experts must sit in GPU memory!), yet runs roughly the same FLOPs per single token as the dense model.", "follow": "Why is a Sparse MoE great for high-throughput batched cloud serving, yet painful on a single laptop GPU during batch-1 decoding?", "sources": [{"title": "Sebastian Raschka: The Big LLM Architecture Comparison", "url": "https://magazine.sebastianraschka.com/p/the-big-llm-architecture-comparison"}]}, {"group": "Systems, scaling & inference", "subgroup": "Memory, roofline & parallelism", "q": "Where does GPU memory go in training (the 16-byte rule), and what is the Roofline limit?", "a": "In standard mixed-precision AdamW training, static model state alone costs roughly **16 bytes per parameter** (`2B` BF16 weights + `2B` BF16 gradients + `12B` FP32 master weights, momentum \\(m\\) and variance \\(v\\))—before adding activations! And speed is governed by **arithmetic intensity** (FLOPs divided by HBM bytes moved): large-batch matrix multiplies are *compute-bound*, while batch-1 token decoding is *memory-bandwidth-bound*.", "detail": "Two mental-math rules that win systems interviews immediately: (1) **Why FP32 master weights?** In BF16 (only 7 mantissa bits!), a tiny learning-rate update like `w − 1e-4 · grad = 1.0 − 0.0001` rounds straight back to `1.000` (zero learning!) unless accumulated in a 4-byte FP32 master copy. On top of that `16Ψ` static budget, activations grow with `Batch × Seq × Layers × Hidden`; **activation checkpointing** saves only layer boundaries during forward and recomputes inside each layer during backward (~33% extra compute for massive memory savings). (2) **Roofline:** an H100 does ~990 TFLOPS (BF16) on ~3.35 TB/s HBM bandwidth → ridge point `990 / 3.35 ≈ 295 FLOPs/byte`. Any op doing fewer than ~295 math ops per byte fetched from HBM stalls waiting on memory wires!", "formula": "\\text{Static AdamW RAM} \\approx (2_{\\text{param}} + 2_{\\text{grad}} + 4_{\\text{master}} + 4_m + 4_v)\\,\\Psi = 16\\Psi\\text{ bytes}\n\\text{Arithmetic Intensity} = \\frac{\\text{FLOPs}}{\\text{Bytes moved from/to HBM}}", "notation": "\\(\\Psi\\) = trainable parameter count. For pure BF16 inference, optimizer/gradient/activation-graph states vanish, leaving \\(2\\Psi\\text{ bytes} + \\text{KV cache}\\).", "example": "A 7B model needs ~14 GB in BF16 just to run inference (`2 × 7B`), ~112 GB just for static AdamW state (`16 × 7B`, already exceeding one 80 GB GPU before batch=1 activations!), and `Y = xW` at batch=1 moves `2 bytes` per weight to do `2 FLOPs` (`1 FLOP/byte` ≪ 295 → completely bandwidth-bound!).", "follow": "Why does doubling decode batch size from 1 to 16 barely increase per-step latency on a GPU until you hit the Roofline ridge point?", "sources": [{"title": "JAX Scaling Book: Rooflines & memory", "url": "https://jax-ml.github.io/scaling-book/"}]}, {"group": "Systems, scaling & inference", "subgroup": "Memory, roofline & parallelism", "q": "Distributed training: DDP versus FSDP (ZeRO) versus Tensor and Pipeline Parallelism?", "a": "**DDP** copies the full model onto every GPU and averages gradients (`AllReduce`)—simple until 1 GPU can't hold `16Ψ` bytes. **FSDP / ZeRO** slices optimizer states, gradients and weights across GPUs, fetching each layer just-in-time (`AllGather`). **Tensor Parallelism (TP)** splits individual weight matrices *within* a layer across fast intra-node NVLink GPUs, while **Pipeline Parallelism (PP)** assigns consecutive layer blocks across nodes with microbatches to shrink idle bubbles.", "detail": "How to combine them ('3D Parallelism') without memorizing trivia: **TP** synchronizes activations *twice inside every single Transformer block* (after MHA and after FFN), so it demands ultra-fast intra-node NVLink (8 GPUs inside 1 box)—never run TP across slow inter-node Ethernet! **PP** only passes boundary activations between layer chunks across nodes, trading communication for a pipeline bubble `(P − 1) / M` shrunk by splitting a batch into `M` microbatches. **FSDP / ZeRO-3** works across nodes by overlapping next-layer `AllGather` with current-layer compute.", "comparison": {"headers": ["Strategy", "What each GPU holds", "Communication & placement rule"], "rows": [["DDP", "Full 16Ψ replica + 1/N of batch.", "One `AllReduce` of gradients per step; fails as soon as model + activations > 1 GPU."], ["ZeRO-1 / ZeRO-2", "Shards optimizer states (ZeRO-1) + gradients (ZeRO-2); keeps weights.", "Cuts static RAM from 16Ψ → ~6Ψ (ZeRO-1) → ~4Ψ (ZeRO-2) with almost identical comms to DDP."], ["FSDP / ZeRO-3", "Shards all 16Ψ (weights, grads, opt) by 1/N.", "`AllGather` weights before forward & backward + `ReduceScatter` grads (~1.5× DDP comms); scales across nodes."], ["Tensor Parallel (TP)", "1/T slice of each matrix column/row.", "`AllReduce` inside *every* layer → keep strictly inside 1 node (NVLink, T ≤ 8)."], ["Pipeline Parallel (PP)", "Contiguous slice of layers (e.g., layers 1–8, 9–16).", "Point-to-point p2p activations across nodes; needs microbatching (1F1B) to hide idle bubble."]]}, "example": "Training a 70B model (~1.12 TB static AdamW state) on 64 × 80 GB GPUs: TP=8 inside each 8-GPU node + FSDP=8 across the 8 nodes leaves plenty of HBM per GPU with fast NVLink inside and overlapped Ethernet outside.", "follow": "When you double cluster size using DDP/FSDP, what happens to your effective global batch size and how should learning rate / warmup adjust?", "sources": [{"title": "Hugging Face Ultra-Scale Playbook", "url": "https://huggingface.co/spaces/nanotron/ultrascale-playbook"}, {"title": "JAX Scaling Book", "url": "https://jax-ml.github.io/scaling-book/"}]}, {"group": "Systems, scaling & inference", "subgroup": "Inference optimization & quantization", "q": "Quantization (FP8, W8A8, W4A16 AWQ/GPTQ) and speculative decoding: how do they speed up serving?", "a": "Because autoregressive decoding stalls waiting to load weights from GPU memory, **weight-only quantization (`W4A16` like AWQ/GPTQ)** packs weights into 4 bits and dequantizes on-chip to BF16—cutting memory traffic ~4× for a near-linear decode speedup! For heavy prefill or high QPS, **`FP8` / `W8A8`** quantizes *both* weights and activations to unlock 2× faster Tensor Cores. **Speculative decoding** uses a tiny draft model to guess `K` tokens cheaply, then verifies all `K` in *one* parallel forward pass of the target model with **zero change** to the output distribution.", "detail": "Two crisp nuances interviewers probe: (1) **Why naive `INT8` (`W8A8`) breaks above ~6B params:** Transformers develop a handful of extreme *activation outlier channels* (20–100× larger than normal channels) that stretch a tensor's quantization scale so 99% of normal values round to zero! **AWQ** protects the ~1% of weight channels multiplied by large activations during `W4A16`, while **SmoothQuant / FP8** shifts scale smoothly or uses floating-point exponents that handle wide dynamic range natively. (2) **Why speculative decoding is mathematically lossless:** the target model computes probabilities for all `K` drafted tokens in parallel (compute-rich, like prefill!); rejection sampling accepts token `t` with probability `min(1, p_target / p_draft)` and—on the first rejection—samples a replacement from the residual `norm(max(0, p_target − p_draft))`, guaranteeing the exact target distribution plus 1 bonus token even if every draft guess was rejected!", "comparison": {"headers": ["Technique", "Bottleneck solved", "Quality & serving caveat"], "rows": [["Weight-only `W4A16` (AWQ / GPTQ)", "HBM weight bandwidth + VRAM capacity at small decode batch.", "Great for low-concurrency latency; at huge batch sizes dequant overhead can slow compute-bound GEMMs."], ["`FP8` / `W8A8` (Weight + Activation)", "Both HBM traffic AND Tensor Core compute throughput.", "Shines on Hopper/Blackwell GPUs for prefill + high-QPS serving; needs outlier-aware scaling for INT8."], ["KV-cache quantization (FP8/INT4)", "Long-context / large-batch KV memory capacity & decode reads.", "Calibrate per-head/per-token scales carefully—Key outliers are typically more sensitive than Values."], ["Speculative decoding", "Serial token-by-token decode wall-clock latency.", "2–3× lower latency on predictable text (code, JSON, RAG quotes) when GPU has spare FLOPs; less gain at saturated batch sizes."]]}, "example": "A 70B model in BF16 takes ~140 GB (needs 2 × 80 GB GPUs); `W4A16` AWQ shrinks weights to ~35–40 GB (fits on ONE 80 GB GPU with 40 GB left for KV cache!) and roughly triples batch-1 tokens/sec.", "follow": "When would Post-Training Quantization (PTQ) not be enough, forcing Quantization-Aware Training (QAT)?", "sources": [{"title": "Lilian Weng: Transformer inference optimization", "url": "https://lilianweng.github.io/posts/2023-01-10-inference-optimization/"}]}, {"group": "Applied LLM evaluation", "subgroup": "Diagnosis & measurement", "q": "How do you separate retrieval failures from generation failures?", "a": "Evaluate the evidence retrieved, then evaluate the answer given that evidence. Run a gold-context experiment to isolate whether the generator can solve the task with sufficient information.", "detail": "Build cases with verified supporting spans, conflicting dates, multiple sources and no answer. Score retrieval recall and context coverage separately from answer correctness and citation support. Missing evidence suggests retrieval/chunking problems; wrong answers with complete evidence suggest reasoning, instructions or context-use problems. Gold-context results are diagnostic, not deployment performance.", "example": "A numerical answer may be fully grounded in an outdated report and still be wrong for the requested quarter. Include version/date correctness in the rubric.", "follow": "What if the retrieved passage contains the answer but is truncated during context packing? How do you score abstention?", "sources": [{"title": "Agent evaluation design", "url": "https://www.anthropic.com/research/demystifying-evals-for-ai-agents"}]}, {"group": "Applied LLM evaluation", "subgroup": "Diagnosis & measurement", "q": "How do you validate an LLM judge?", "a": "Define a narrow rubric, compare judgments against held-out human labels, and investigate systematic disagreements. A model-generated score is a measurement instrument that needs validation.", "detail": "Use deterministic checks for parsable facts, arithmetic and final state. Use semantic judges for criteria that genuinely require interpretation, with supporting evidence. Blind system identity and randomize pair order; inspect length/style bias. Keep grader versions fixed during comparisons and periodically recheck them as tasks change.", "example": "A judge rewards a polished answer that omits a required spreadsheet tab. A deterministic tab-existence check catches a failure the prose rubric missed.", "follow": "How would you handle disagreement among humans? What changes when the judge and candidate are the same model family?", "sources": [{"title": "Agent evaluation design", "url": "https://www.anthropic.com/research/demystifying-evals-for-ai-agents"}]}, {"group": "Applied LLM evaluation", "subgroup": "Diagnosis & measurement", "q": "How do you measure agent success across repeated runs?", "a": "Grade the final deliverable or environment state, along with prohibited side effects. Repeat trials to estimate reliability, and report cost and latency for the actual deployment policy.", "detail": "Separate infrastructure failures from agent errors, but report their user-facing impact too. At-least-one success among k attempts measures a different policy from one-shot success or all-k consistency. A successful transcript claim is not a verified state change. Hold out task templates and compare models on matched, resettable environments.", "example": "An agent says it saved a report, but no file exists. Outcome validation fails even if its final message sounds perfect.", "follow": "Who selects the winning attempt in best-of-k? How would you restore the environment between trials?", "sources": [{"title": "Agent evaluation design", "url": "https://www.anthropic.com/research/demystifying-evals-for-ai-agents"}]}, {"group": "Applied LLM evaluation", "subgroup": "Diagnosis & measurement", "q": "Constrained decoding, hallucinations and reward hacking: what can and cannot be guaranteed?", "a": "**Constrained decoding** runs a finite-state machine / grammar alongside generation to mask out illegal next tokens (`-∞`), guaranteeing **100% valid JSON or tool schemas**—but it NEVER guarantees the values inside are true! Separate **intrinsic hallucinations** (contradicting the supplied RAG passage) from **extrinsic hallucinations** (inventing unsupported facts beyond the context), and watch RL/DPO/GRPO for **reward hacking** (verbosity inflation, sycophancy or exploiting brittle graders).", "detail": "Feynman distinction: constrained decoding is like a web form dropdown that forces you to type a valid 5-digit ZIP code—it stops parser crashes, not wrong addresses! Even subtlety matters: forcing JSON keys in an unnatural order (putting `\"verdict\": true` *before* `\"reasoning\"`) can actually *hurt* accuracy because causal tokens can't revise an early boolean! Meanwhile, Goodhart's Law hits post-training hard: if human raters or LLM judges slightly prefer longer, confident-sounding bullet lists, DPO/RL policies quickly bloat answer length by 2×; in code/agent RL (GRPO), an un-sandboxed policy may delete a failing test or hardcode expected cases unless tests are hidden/read-only.", "example": "Schema-constrained JSON `{ \"q3_revenue_millions\": 999.9, \"citation\": \"doc_1\" }` parses on try #1 with zero retries, yet `999.9` can still be fabricated—you still need deterministic span/math verification.", "follow": "Why should structured schemas place a short `'evidence_quote'` or `'step_by_step_check'` field *before* `'final_decision'` in autoregressive JSON output?", "sources": [{"title": "Lilian Weng: Extrinsic hallucinations in LLMs", "url": "https://lilianweng.github.io/posts/2024-07-07-hallucination/"}, {"title": "Lilian Weng: Reward hacking in RL", "url": "https://lilianweng.github.io/posts/2024-11-28-reward-hacking/"}]}, {"group": "Optional specialist reading", "q": "ARMA, ARIMA and stationarity?", "a": "ARMA typically models a stationary series; ARIMA incorporates differencing to address nonstationarity. The ADF test has a unit-root null: a small p-value is evidence against that null, not a generic proof of every kind of stationarity. Evaluate with time-ordered backtests and account for seasonality.", "follow": "Why can ordinary shuffled cross-validation mislead?", "subgroup": "Time series", "detail": "Most ML models assume rows are interchangeable—time series violates that through trend, seasonality and autocorrelation! A raw stock price or cumulative user curve drifts upward so its mean and variance change every month (non-stationary). Differencing (`y_t − y_{t-1}`, the `'I'` in ARIMA) turns levels into changes so past relationships stay meaningful, and evaluation must use **rolling/expanding origin backtests** rather than random K-fold splits.", "example": "Predicting tomorrow's temperature with random train/test split lets Tuesday and Thursday leak Wednesday's exact cold front into training!"}, {"group": "Optional specialist reading", "subgroup": "Specialized attention", "q": "Softmax, sparse and linear attention: what changes?", "a": "Dense softmax attention compares each query with every allowed key. Sparse or sliding-window attention restricts which token pairs interact. Recurrent linear attention summarizes earlier keys/values in a fixed-size state for fixed head dimensions, changing the representation of history.", "comparison": {"headers": ["Approach", "What is saved", "What stays / changes"], "rows": [["FlashAttention", "Memory traffic and materialized score storage.", "Computes dense softmax attention; quadratic pairwise work remains."], ["Sliding-window attention", "Only a bounded neighborhood is scored per layer.", "Distant access needs propagation, global tokens or other mechanisms."], ["Recurrent linear attention", "No growing token-by-token cache in those layers.", "Compresses history; it is not identical to softmax and may lose fine-grained recall."]]}, "nuance": "“Linear” is scaling in sequence length with width held fixed, not a linear function of the input. Parallel chunk algorithms can train recurrent-style layers efficiently; a mathematical recurrence need not imply a fully sequential training kernel.", "sources": [{"title": "FlashAttention", "url": "https://arxiv.org/abs/2205.14135"}, {"title": "Transformers are RNNs: linear attention", "url": "https://arxiv.org/abs/2006.16236"}], "detail": "Why can't pure linear/RNN compression completely replace softmax attention everywhere? Think of copying a random 12-digit confirmation code buried 40,000 tokens back: dense softmax keeps an uncompressed slot per past token in the KV cache (`exact lookup`), whereas recurrent linear attention squashes all 40,000 tokens into one fixed-size matrix `S_t` (`lossy summary`). Modern long-context hybrids interleave mostly fast linear/sliding layers with periodic full-attention layers to get both speed and exact needle-in-a-haystack recall.", "example": "In a 3:1 hybrid of 32 layers, 24 linear layers hold constant-size state `O(d²)` while only 8 full-attention layers grow a KV cache—cutting KV memory ~4×.", "follow": "Which task breaks first when you compress KV history into a fixed-size state: broad summarization or exact passkey/UUID retrieval?"}, {"group": "Optional specialist reading", "subgroup": "Specialized attention", "q": "What is Kimi Delta Attention (KDA)?", "a": "KDA is a gated recurrent linear-attention mechanism. Its memory stores key–value associations; a delta-rule update writes a correction to the value currently predicted for a key. KDA adds feature-wise forgetting, finer-grained than a single scalar decay per head.", "formula": "\\text{Ungated delta-rule intuition:}\nS_t = S_{t-1} + \\beta_t\\left(v_t-S_{t-1}k_t\\right)k_t^\\top\no_t = S_tq_t", "notation": "Use column vectors and S of shape \\((d_v,d_k)\\). \\(\\beta_t\\) controls the write. This is the ungated intuition, not the full KDA equation.", "nuance": "Kimi Linear (2025) interleaves three KDA layers with one full-attention MLA layer. KDA layers keep fixed-size state, but the hybrid still has growing caches in its full-attention layers. Compressed memory trades exact historical access for efficiency; this is an architecture change, unlike FlashAttention’s exact-attention kernel optimization.", "sources": [{"title": "Kimi Linear technical report, §§2–4", "url": "https://arxiv.org/html/2510.26692v1"}], "detail": "Plain linear attention just keeps adding `v_t k_tᵀ` into memory matrix `S_t`, which eventually overflows like writing new phone numbers on top of old ones without an eraser! The **delta rule** turns `S_t` into an associative key–value dictionary: before writing `(k_t, v_t)`, it checks what `S_{t-1} k_t` currently recalls and writes only the *error correction* `(v_t − S_{t-1} k_t) k_tᵀ`, while KDA's per-channel gates selectively erase stale dimensions.", "example": "If `x = 5` at token 10 and `x = 9` at token 200, un-gated additive linear attention blurs both values together; a gated delta update overwrites key `'x'` toward `9`.", "follow": "Why does Kimi Linear still keep 1 full-attention layer for every 3 KDA layers instead of going 100% KDA?"}], "diagrams": {"recommender": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1100 430\" role=\"img\" aria-labelledby=\"title desc\"><title id=\"title\">Recommender · serving + learning loop<\/title><desc id=\"desc\">Online request path above; offline ingestion and training below. Dashed arrows deploy artifacts into serving.<\/desc><defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6\" fill=\"none\" stroke=\"#52647b\"/><\/marker><\/defs><rect width=\"1100\" height=\"430\" rx=\"14\" fill=\"#f6f8fc\"/><g font-family=\"system-ui\" fill=\"#20334d\"><text x=\"24\" y=\"35\" font-size=\"21\" font-weight=\"700\">Recommender · serving + learning loop<\/text><text x=\"24\" y=\"70\" font-size=\"13\">ONLINE · request path<\/text><text x=\"24\" y=\"260\" font-size=\"13\">OFFLINE / STREAMING · data and artifacts<\/text><rect x=\"25\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"120\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">UI / load balancer<\/text><text x=\"120\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Recommendation API<\/text><text x=\"120\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Request cache<\/text><path d=\"M215,140 H237\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"240\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"335\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Candidate generation<\/text><text x=\"335\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">ANN + follows + fresh<\/text><text x=\"335\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Merge / deduplicate<\/text><path d=\"M430,140 H452\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"455\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"550\" 00 430\" role=\"img\" aria-labelledby=\"title desc\"><title id=\"title\">RAG · permission-aware retrieval + grounded answers<\/title><desc id=\"desc\">Online request path above; offline ingestion and training below. Dashed arrows deploy artifacts into serving.<\/desc><defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6\" fill=\"none\" stroke=\"#52647b\"/><\/marker><\/defs><rect width=\"1100\" height=\"430\" rx=\"14\" fill=\"#f6f8fc\"/><g font-family=\"system-ui\" fill=\"#20334d\"><text x=\"24\" y=\"35\" font-size=\"21\" font-weight=\"700\">RAG · permission-aware retrieval + grounded answers<\/text><text x=\"24\" y=\"70\" font-size=\"13\">ONLINE · request path<\/text><text x=\"24\" y=\"260\" font-size=\"13\">OFFLINE / STREAMING · data and artifacts<\/text><rect x=\"25\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"120\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">User / API<\/text><text x=\"120\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Identity + query<\/text><text x=\"120\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Scoped cache<\/text><path d=\"M215,140 H237\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"240\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"335\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Hybrid retrieval<\/text><text x=\"335\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Lexical + vector index<\/text><text x=\"335\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">ACL / tenant filtering<\/text><path d=\"M430,140 H452\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"455\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"550\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Rerank + context<\/text><text x=\"550\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Dedup / token budget<\/text><text x=\"550\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Source IDs retained<\/text><path d=\"M645,140 H667\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"670\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"765\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Generate + validate<\/text><text x=\"765\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">LLM + citations<\/text><text x=\"765\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Abstain / timeout<\/text><path d=\"M860,140 H882\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"885\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"980\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Answer + feedback<\/text><text x=\"980\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Citations / audit<\/text><text x=\"980\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Latency + cost<\/text><rect x=\"25\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"120\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Documents + ACLs<\/text><text x=\"120\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Parse / chunk / version<\/text><text x=\"120\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Deletes + updates<\/text><path d=\"M215,330 H237\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"240\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"335\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Embedding pipeline<\/text><text x=\"335\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Index text + vectors<\/text><text x=\"335\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Metadata / ACL sync<\/text><path d=\"M430,330 H452\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"455\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"550\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Retrieval evaluation<\/text><text x=\"550\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Gold query / doc pairs<\/text><text x=\"550\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Recall + rerank quality<\/text><path d=\"M645,330 H667\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"670\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"765\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Prompt/model versions<\/text><text x=\"765\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Answer eval + safety<\/text><text x=\"765\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Canary / rollback<\/text><path d=\"M860,330 H882\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"885\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"980\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Monitoring<\/text><text x=\"980\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Grounding / access<\/text><text x=\"980\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Freshness + failures<\/text><path d=\"M335,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><path d=\"M550,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><path d=\"M765,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><text x=\"25\" y=\"410\" font-size=\"13\">Log impressions / responses + outcomes → event stream → offline evaluation and monitoring → retrain or rollback<\/text><\/g><\/svg>"}, "classics": [{"label": "Linear Regression", "path": "ml_coding/classics/linear_regression.py", "code": "import numpy as np\n\n# Your fit/predict structure, with a stable least-squares solve.\nclass LinearRegressor:\n    def __init__(self):\n        self.W = None\n\n    def fit(self, X, y):\n        # X: (n, d), y: (n,). Add intercept, then solve least squares.\n        n, d = X.shape\n        X = np.concatenate([np.ones((n, 1)), X], axis=1)\n        # n >= d+1 does NOT guarantee independent columns.\n        self.W = np.linalg.lstsq(X, y, rcond=None)[0]\n        return self\n\n    def predict(self, X):\n        # Add the same intercept column, then multiply by fitted weights.\n        # Output: (n,).\n        n, _ = X.shape\n        X = np.concatenate([np.ones((n, 1)), X], axis=1)\n        return X @ self.W\n"}, {"label": "Logistic Regression", "path": "ml_coding/classics/logistic_regression.py", "code": "import numpy as np\n\n\ndef sigmoid(z):\n    # Overflow-safe sigmoid: 1 / (1 + exp(-z)) == exp(-logaddexp(0, -z)).\n    return np.exp(-np.logaddexp(0, -z))\n\n\ndef loss_and_gradient(X, y, w, b):\n    # X: (n, d), y: (n,) in {0, 1}, w: (d,), b: scalar.\n    # 1. Linear scores (logits) and predicted probabilities.\n    z = X @ w + b\n    p = sigmoid(z)\n    # 2. Stable binary cross-entropy and gradients: dL/dz = (p - y) / n.\n    loss = np.logaddexp(0, (1 - 2 * y) * z).mean()\n    error = p - y\n    return loss, (X.T @ error) / len(y), error.mean()\n\n\nclass LogisticRegressor:\n    def __init__(self, learning_rate=0.1, steps=1000):\n        self.learning_rate = learning_rate\n        self.steps = steps\n\n    def fit(self, X, y):\n        # 1. Initialize weights and bias to zero.\n        n, d = X.shape\n        self.w = np.zeros(d)\n        self.b = 0.0\n        self.losses = []\n        # 2. Run full-batch gradient descent.\n        for _ in range(self.steps):\n            loss, dw, db = loss_and_gradient(X, y, self.w, self.b)\n            self.losses.append(loss)\n            self.w -= self.learning_rate * dw\n            self.b -= self.learning_rate * db\n        return self\n\n    def predict_proba(self, X):\n        return sigmoid(X @ self.w + self.b)\n\n    def predict(self, X, threshold=0.5):\n        return (self.predict_proba(X) >= threshold).astype(int)\n"}, {"label": "K-Means Clustering", "path": "ml_coding/classics/kmeans.py", "code": "import numpy as np\n\nclass Kmeans:\n    def __init__(self, k, seed=0):\n        self.k = k\n        self.seed = seed\n        self.centroids = None  # (k, d)\n\n    def calc_pairwise_distances(self, X, centroids):\n        # Calculate squared distance from every point to every center.\n        # X: (n, d); centroids: (k, d); returns: (n, k).\n        # (n, 1, d) - (1, k, d) -> (n, k, d) -> (n, k)\n        # Squared distance has the same argmin; no sqrt needed.\n        return ((X[:, None, :] - centroids[None, :, :]) ** 2).sum(axis=2)\n\n    def get_assignments(self, distances):\n        # Assign each point to its nearest center; returns (n,).\n        return np.argmin(distances, axis=1)\n\n    def get_updated_centroids(self, X, assignments):\n        # Make each center the mean of its assigned points; returns (k, d).\n        # Keep the previous center if no points were assigned to it.\n        centers = self.centroids.copy()\n        for i in range(self.k):\n            points = X[assignments == i]\n            if len(points):  # Keep previous center for an empty cluster.\n                centers[i] = points.mean(axis=0)\n        return centers\n\n    def fit(self, X, max_iter=100, tol=1e-6):\n        # X: (n, d). Convert to float so centroid means are not truncated.\n        X = np.asarray(X, dtype=float)\n        if not 1 <= self.k <= len(X) or max_iter < 1:\n            raise ValueError('Require 1 <= k <= n and max_iter >= 1')\n        # 1. Assign initial centroids by sampling k data points.\n        rng = np.random.default_rng(self.seed)\n        self.centroids = X[rng.choice(len(X), self.k, replace=False)].copy()\n        # 2. Alternate assignments and centroid updates until convergence.\n        for _ in range(max_iter):\n            # Calculate pairwise distances and assign nearest centers.\n            labels = self.predict(X)\n            # Make each centroid the average of the points assigned to it.\n            updated = self.get_updated_centroids(X, labels)\n            # Check whether centers stopped moving (or hit max_iter).\n            converged = np.max(np.abs(updated - self.centroids)) <= tol\n            self.centroids = updated\n            if converged:\n                break\n        # 3. Compute final loss: sum of squared distances to nearest centers.\n        self.inertia_ = np.min(self.calc_pairwise_distances(X, self.centroids), axis=1).sum()\n        return self\n\n    def predict(self, X):\n        # Calculate distances, then return nearest-center labels: (n,).\n        return self.get_assignments(self.calc_pairwise_distances(X, self.centroids))\n"}, {"label": "Categorical Naive Bayes", "path": "ml_coding/classics/naive_bayes.py", "code": "import math\nfrom collections import Counter, defaultdict\n\n# Categorical features, hashable labels; positive alpha, nonempty training data.\nclass NaiveBayes:\n    def __init__(self, nclass=None, alpha=1.0):\n        if alpha <= 0:\n            raise ValueError('alpha must be positive')\n        self.alpha = alpha\n\n    def fit(self, X, y):\n        # Count class priors and feature values conditioned on each class.\n        self.count_y = Counter(y)\n        self.count_x_y = defaultdict(lambda: defaultdict(Counter))\n        self.vocab = [set() for _ in X[0]]\n        for row, label in zip(X, y):\n            for i, value in enumerate(row):\n                self.vocab[i].add(value)\n                self.count_x_y[label][i][value] += 1\n        return self\n\n    def predict(self, X):\n        # For each row: log prior + sum of log conditional likelihoods.\n        # Choose the label with the largest score; no normalization needed.\n        labels = []\n        total = sum(self.count_y.values())\n        for row in X:\n            scores = {}\n            for label, count in self.count_y.items():\n                score = math.log(count / total)\n                for i, value in enumerate(row):\n                    # Reserve one unknown category per feature.\n                    denominator = count + self.alpha * (len(self.vocab[i]) + 1)\n                    numerator = self.count_x_y[label][i][value] + self.alpha\n                    score += math.log(numerator / denominator)\n                scores[label] = score\n            labels.append(max(scores, key=scores.get))\n        return labels\n"}, {"label": "Masked Sequence Pooling", "path": "ml_coding/classics/pooling.py", "code": "import numpy as np\n\n\ndef masked_pool(X, mask, mode=\"mean\"):\n    # X: (B, T, D) token embeddings; mask: (B, T) with 1/True for real tokens, 0/False for pad.\n    # Returns: (B, D), with zeros for an all-padding row.\n    valid = np.asarray(mask, dtype=bool)[..., None]  # (B, T, 1) broadcasts over D\n    count = valid.sum(axis=1)  # (B, 1)\n\n    if mode == \"mean\":\n        # 1. Zero out padded positions, sum over T, and divide by valid token count.\n        total = np.where(valid, X, 0.0).sum(axis=1)\n        return total / np.maximum(count, 1)\n\n    if mode == \"max\":\n        # 2. Fill pad with -inf before max so 0-padding never beats negative real values.\n        pooled = np.where(valid, X, -np.inf).max(axis=1)\n        return np.where(count > 0, pooled, 0.0)\n"}, {"label": "Exact Top-K Cosine Retrieval", "path": "ml_coding/classics/cosine_retrieval.py", "code": "import numpy as np\n\n\ndef top_k_cosine(query, items, k):\n    # query: (d,), items: (n, d). Returns top-k (indices, cosine_scores).\n    query = np.asarray(query, dtype=float)\n    items = np.asarray(items, dtype=float)\n    k = min(max(k, 0), len(items))\n\n    # 1. L2-normalize query and items (use denominator 1 so zero vectors stay 0).\n    q_norm = np.linalg.norm(query)\n    q = query / (q_norm if q_norm > 0 else 1.0)\n    item_norms = np.linalg.norm(items, axis=1, keepdims=True)\n    normed_items = items / np.where(item_norms > 0, item_norms, 1.0)\n\n    # 2. Dot product of unit vectors equals cosine similarity: (n,).\n    scores = normed_items @ q\n\n    # 3. Sort descending (stable keeps smaller index first on exact ties).\n    indices = np.argsort(-scores, kind=\"stable\")[:k]\n    return indices, scores[indices]\n"}, {"label": "ROC-AUC & NDCG@K From Scratch", "path": "ml_coding/classics/ranking_metrics.py", "code": "import numpy as np\n\n\ndef roc_auc(y_true, y_score):\n    # y_true: (n,) in {0, 1}, y_score: (n,) predicted scores.\n    y_true = np.asarray(y_true, dtype=int)\n    y_score = np.asarray(y_score, dtype=float)\n    n_pos = y_true.sum()\n    n_neg = len(y_true) - n_pos\n\n    # 1. Sort from highest score to lowest score.\n    order = np.argsort(-y_score, kind=\"stable\")\n    y_sorted, s_sorted = y_true[order], y_score[order]\n\n    # 2. Walk down distinct score groups and sum trapezoid slices under the ROC curve.\n    group_ends = np.flatnonzero(np.r_[s_sorted[:-1] != s_sorted[1:], True])\n    tp = area = 0.0\n    start = 0\n    for end in group_ends:\n        pos_step = y_sorted[start : end + 1].sum()\n        neg_step = (end - start + 1) - pos_step\n        area += (tp + tp + pos_step) * 0.5 * neg_step\n        tp += pos_step\n        start = end + 1\n\n    return float(area / (n_pos * n_neg))\n\n\ndef ndcg_at_k(relevances, scores, k):\n    # relevances: (n,) graded relevance, scores: (n,) model scores.\n    rel = np.asarray(relevances, dtype=float)\n    sc = np.asarray(scores, dtype=float)\n    k = min(k, len(rel))\n    discounts = np.log2(np.arange(2, k + 2))\n\n    # 1. DCG@k of model ranking vs. IDCG@k of ideal ranking.\n    top_rel = rel[np.argsort(-sc, kind=\"stable\")[:k]]\n    ideal_rel = np.sort(rel)[::-1][:k]\n    dcg = np.sum((2.0 ** top_rel - 1.0) / discounts)\n    idcg = np.sum((2.0 ** ideal_rel - 1.0) / discounts)\n    return float(dcg / idcg) if idcg > 0 else 0.0\n"}, {"label": "Scaled Attention & Pre-Norm Block (NumPy)", "path": "ml_coding/classics/self_attention_numpy.py", "code": "import numpy as np\n\n\nclass SelfAttentionNumpy:\n    # Single head, no mask, no bias. Weights are supplied so tests are repeatable.\n    def __init__(self, Wq, Wk, Wv):\n        # Wq, Wk: (embed_dim, key_dim); Wv: (embed_dim, val_dim)\n        self.Wq, self.Wk, self.Wv = Wq, Wk, Wv\n\n    def forward(self, X):\n        # Input: (batch, seq_len, embed_dim)\n        # Outline: project Q/K/V -> scaled scores -> softmax -> weighted values.\n        # einsum labels: b=batch, t=query position, s=key position,\n        # e=embedding feature, k=key feature, v=value feature.\n\n        # 1. Project each token into query, key and value vectors.\n        Q = np.einsum('bte,ek->btk', X, self.Wq)  # (B, T, K)\n        K = np.einsum('bse,ek->bsk', X, self.Wk)  # (B, S, K); S=T\n        V = np.einsum('bse,ev->bsv', X, self.Wv)  # (B, S, V)\n\n        # 2. Dot each query with every key, summing over key features.\n        scores = np.einsum('btk,bsk->bts', Q, K) / np.sqrt(Q.shape[-1])\n        # scores: (B, T, S). A causal mask would go here, before softmax.\n\n        # 3. Stable softmax over keys for each query (last axis).\n        scores = scores - scores.max(axis=-1, keepdims=True)\n        weights = np.exp(scores)\n        weights = weights / weights.sum(axis=-1, keepdims=True)\n\n        # 4. Sum values weighted by attention, contracting key positions.\n        return np.einsum('bts,bsv->btv', weights, V)  # (B, T, V)\n\n\nclass TransformerBlockNumpy:\n    # Same pre-norm structure as PyTorch; no learned norm scale/bias or biases.\n    def __init__(self, Wq, Wk, Wv, W1, W2):\n        # Wq/Wk/Wv: (E, E); W1: (E, H); W2: (H, E).\n        # Attention must return E features so the residual shapes match.\n        self.attention = SelfAttentionNumpy(Wq, Wk, Wv)\n        self.W1, self.W2 = W1, W2\n\n    def layer_norm(self, X):\n        # Normalize features independently for each token: (B, T, E).\n        mean = X.mean(axis=-1, keepdims=True)\n        variance = X.var(axis=-1, keepdims=True)\n        return (X - mean) / np.sqrt(variance + 1e-5)\n\n    def forward(self, X):\n        # 1. Normalize -> self-attention -> residual: (B, T, E).\n        X = X + self.attention.forward(self.layer_norm(X))\n\n        # 2. Normalize -> expand -> ReLU -> project back -> residual.\n        normalized = self.layer_norm(X)\n        hidden = np.einsum('bte,eh->bth', normalized, self.W1)\n        hidden = np.maximum(hidden, 0)  # ReLU: (B, T, H)\n        output = np.einsum('bth,he->bte', hidden, self.W2)\n        return X + output  # (B, T, E)\n"}, {"label": "Practical End-to-End LightGBM Classification Baseline", "path": "ml_coding/classics/tabular_gbdt_baseline.py", "code": "import lightgbm as lgb\nimport numpy as np\nimport pandas as pd\nfrom sklearn.metrics import accuracy_score, precision_recall_fscore_support, roc_auc_score\nfrom sklearn.model_selection import train_test_split\n\n\ndef run_tabular_baseline(df, target_col=\"target\"):\n    # 1. Quick data check & split FIRST (use a time cutoff instead if forecasting!).\n    print(\"shape:\", df.shape, \"pos rate:\", df[target_col].mean())\n    X = df.drop(columns=[target_col])\n    y = df[target_col]\n    X_train, X_test, y_train, y_test = train_test_split(\n        X, y, test_size=0.2, stratify=y, random_state=42\n    )\n\n    # 2. Fastest categorical + missing handling: cast strings to 'category'.\n    # LightGBM handles NaNs and 'category' columns natively—no imputer or one-hot encoder needed.\n    cat_cols = X_train.select_dtypes(include=[\"object\", \"string\", \"category\"]).columns\n    for col in cat_cols:\n        X_train[col] = X_train[col].astype(\"category\")\n        X_test[col] = pd.Categorical(X_test[col], categories=X_train[col].cat.categories)\n\n    # 3. Fit barebones LightGBM baseline.\n    clf = lgb.LGBMClassifier(n_estimators=200, learning_rate=0.05, random_state=42, verbose=-1)\n    clf.fit(X_train, y_train)\n\n    # 4. Evaluation (compare train vs. test to spot overfitting, plus precision/recall/F1/AUC).\n    y_train_pred = clf.predict(X_train)\n    train_accuracy = accuracy_score(y_train, y_train_pred)\n\n    y_test_pred = clf.predict(X_test)\n    test_accuracy = accuracy_score(y_test, y_test_pred)\n    precision, recall, f1, _ = precision_recall_fscore_support(\n        y_test, y_test_pred, average=\"binary\", zero_division=0\n    )\n    test_auc = roc_auc_score(y_test, clf.predict_proba(X_test)[:, 1])\n\n    print(\"train acc:\", round(train_accuracy, 4), \"test acc:\", round(test_accuracy, 4))\n    print(\"precision:\", round(precision, 4), \"recall:\", round(recall, 4), \"f1:\", round(f1, 4), \"auc:\", round(test_auc, 4))\n    return clf\n\n\n# Where to iterate next once this baseline runs end-to-end:\n# - Overfitting (train_acc >> test_acc): add early_stopping on a val split, lower num_leaves / max_depth.\n# - Leakage check: print sorted zip(X_train.columns, clf.feature_importances_) to catch suspiciously perfect columns.\n# - Feature ideas: add 2-3 domain ratios, recency deltas, or train-only group aggregates.\n# - Imbalanced classes: tune threshold on clf.predict_proba(X_val)[:, 1] instead of default 0.5.\n"}], "designReferences": "<div class=\"design-primers\">\n  <strong>General system design primers:<\/strong>\n  <a href=\"https://eugeneyan.com/writing/system-design-for-discovery\" target=\"_blank\" rel=\"noopener\">Eugene Yan’s Discovery Guide<\/a> ·\n  <a href=\"https://blog.reachsumit.com/\" target=\"_blank\" rel=\"noopener\">Sumit’s Diary<\/a> ·\n  <a href=\"https://github.com/alirezadir/AIMLInterviews\" target=\"_blank\" rel=\"noopener\">alirezadir Case Studies<\/a> ·\n  <a href=\"https://aman.ai/primers/ai/\" target=\"_blank\" rel=\"noopener\">Aman’s AI Primers<\/a> ·\n  <a href=\"https://vinija.ai/concepts/loss/\" target=\"_blank\" rel=\"noopener\">Vinija’s Loss Primer<\/a> ·\n  <a href=\"https://huyenchip.com/2024/07/25/genai-platform.html\" target=\"_blank\" rel=\"noopener\">Chip Huyen’s GenAI Platform<\/a>\n<\/div>\n\n<nav class=\"design-index\" aria-label=\"Reference designs\">\n  <span class=\"design-index-label\">Jump to essay:<\/span>\n  <a href=\"#recommender\" data-design-jump=\"recommender\">1. Recommender &amp; Ads Marketplace<\/a>\n  <a href=\"#rag-design\" data-design-jump=\"rag-design\">2. Enterprise RAG<\/a>\n  <a href=\"#knowledge-agent\" data-design-jump=\"knowledge-agent\">3. Knowledge Agent<\/a>\n  <a href=\"#coding-agent\" data-design-jump=\"coding-agent\">4. Coding Agent<\/a>\n  <a href=\"#scarce-labels\" data-design-jump=\"scarce-labels\">5. Scarce-Label Bootstrapping<\/a>\n<\/nav>\n\n<article class=\"design-essay\" id=\"recommender\">\n  <header class=\"essay-header\">\n    <span class=\"essay-kicker\">Reference Design 01 · Discovery, Feature Stores &amp; Monetization<\/span>\n    <h2>Designing a Recommender &amp; Ads Marketplace<\/h2>\n    <p class=\"essay-lede\">Imagine opening a home feed or marketplace search with 10 million eligible items and 150 milliseconds to return 20 results. Optimize purely for clicks and clickbait wins within a week; score every item with a deep network and your servers melt; rewrite offline SQL features in online Java and silent bugs sink your A/B test. Here is how Staff-level designs navigate those trade-offs from a week-one baseline to production scale.<\/p>\n  <\/header>\n\n  <div class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1100 430\" role=\"img\" aria-labelledby=\"title desc\"><title id=\"title\">Recommender · serving + learning loop<\/title><desc id=\"desc\">Online request path above; offline ingestion and training below. Dashed arrows deploy artifacts into serving.<\/desc><defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6\" fill=\"none\" stroke=\"#52647b\"/><\/marker><\/defs><rect width=\"1100\" height=\"430\" rx=\"14\" fill=\"#f6f8fc\"/><g font-family=\"system-ui\" fill=\"#20334d\"><text x=\"24\" y=\"35\" font-size=\"21\" font-weight=\"700\">Recommender · serving + learning loop<\/text><text x=\"24\" y=\"70\" font-size=\"13\">ONLINE · request path<\/text><text x=\"24\" y=\"260\" font-size=\"13\">OFFLINE / STREAMING · data and artifacts<\/text><rect x=\"25\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"120\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">UI / load balancer<\/text><text x=\"120\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Recommendation API<\/text><text x=\"120\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Request cache<\/text><path d=\"M215,140 H237\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"240\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"335\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Candidate generation<\/text><text x=\"335\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">ANN + follows + fresh<\/text><text x=\"335\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Merge / deduplicate<\/text><path d=\"M430,140 H452\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"455\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"550\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Eligibility + features<\/text><text x=\"550\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">ACL / seen / available<\/text><text x=\"550\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Online feature store<\/text><path d=\"M645,140 H667\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"670\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"765\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Ranking<\/text><text x=\"765\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Light → heavy ranker<\/text><text x=\"765\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Score candidates<\/text><path d=\"M860,140 H882\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"885\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"980\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Policy + response<\/text><text x=\"980\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Diversity / freshness<\/text><text x=\"980\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Log impressions<\/text><rect x=\"25\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"120\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Events + item data<\/text><text x=\"120\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Kafka / stream + batch<\/text><text x=\"120\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Point-in-time joins<\/text><path d=\"M215,330 H237\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"240\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"335\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Embedding training<\/text><text x=\"335\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Catalog embeddings<\/text><text x=\"335\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Versioned ANN index<\/text><path d=\"M430,330 H452\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"455\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"550\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Feature pipelines<\/text><text x=\"550\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Offline / online stores<\/text><text x=\"550\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Consistent transforms<\/text><path d=\"M645,330 H667\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"670\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"765\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Ranker training<\/text><text x=\"765\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Temporal validation<\/text><text x=\"765\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Registry → deploy<\/text><path d=\"M860,330 H882\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"885\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"980\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Evaluate + monitor<\/text><text x=\"980\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Quality / drift / latency<\/text><text x=\"980\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Experiment / rollback<\/text><path d=\"M335,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><path d=\"M550,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><path d=\"M765,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><text x=\"25\" y=\"410\" font-size=\"13\">Log impressions / responses + outcomes → event stream → offline evaluation and monitoring → retrain or rollback<\/text><\/g><\/svg><\/div>\n\n  <h3>1. Candidate retrieval &amp; the ID vs. content embedding dilemma<\/h3>\n  <p>Start every interview with a zero-ML baseline: recent posts from followed accounts/topics backfilled with locale-trending items. That ships in days, proves out logging, and sets your latency floor. Once users need personalized discovery beyond their explicit graph, scoring 10 million items at 0.1 ms each would take 16 minutes—so, following <a href=\"https://eugeneyan.com/writing/system-design-for-discovery\" target=\"_blank\" rel=\"noopener\">Eugene Yan’s discovery funnel<\/a>, you retrieve ~500 candidates in parallel using fast sources (<button type=\"button\" class=\"concept-term\" data-tip=\"two-tower\">two-tower ANN retrieval<\/button>, follow-graph lookups, lexical/geo filters, co-engagement graphs, and a dedicated fresh-item pool) before running a heavy ranker. Allocate each source’s candidate quota by marginal <code>Recall@500<\/code> per millisecond: a brilliant ranker can never rescue an item retrieval missed.<\/p>\n\n  <p>Inside the item tower, interviewers love probing <strong>when and why to use <button type=\"button\" class=\"concept-term\" data-tip=\"id-vs-content\">ID embeddings vs. content embeddings<\/button><\/strong>. Think in terms of <em>catalog churn and interaction density<\/em>:<\/p>\n  <ul>\n    <li><strong>When ID embeddings shine:<\/strong> Low-churn, dense-engagement catalogs (Netflix shows, Spotify tracks, evergreen e-commerce SKUs, top creators). Once <code>item_8492<\/code> has 50,000 interactions, a dedicated 64-d lookup vector captures collaborative nuances—humor, pacing, subtle quality—that no text or image encoder can infer from metadata alone.<\/li>\n    <li><strong>When content/multimodal embeddings shine:<\/strong> High-churn or long-tail feeds (breaking news with a 6-hour lifespan, fresh job listings, classifieds, new short-form videos) where 70% of impressions hit items under 24 hours old. Pure ID tables initialize cold items to zeros/noise, starving them of retrieval recall.<\/li>\n    <li><strong>How combining both goes wrong (and how to fix it):<\/strong> If you naively sum or concatenate <code>ID_vec + Content_vec<\/code>, historical logs are dominated by popular warm items—so the network lazily memorizes <code>ID_vec<\/code> and starves the content weights of gradient! Prevent that with <button type=\"button\" class=\"concept-term\" data-tip=\"id-dropout\">ID dropout &amp; frequency thresholds<\/button>: only mint dedicated ID rows after <em>K<\/em> interactions, randomly mask <code>item_id → &lt;UNK&gt;<\/code> on 15–30% of training steps so content features <em>must<\/em> stay predictive (as in <a href=\"https://www.linkedin.com/blog/engineering/ai/rebuilding-linkedins-follows-recommendations-with-llm-based-semantic-retrieval-and-ranking\" target=\"_blank\" rel=\"noopener\">LinkedIn’s LLM-based Follows<\/a>), and avoid modulo <button type=\"button\" class=\"concept-term\" data-tip=\"hash-collisions\">hash-trick collisions<\/button> using expiring collisionless tables like <a href=\"https://arxiv.org/abs/2209.07663\" target=\"_blank\" rel=\"noopener\">ByteDance’s Monolith<\/a>.<\/li>\n  <\/ul>\n\n  <h3>2. What loss should train your retrieval embeddings?<\/h3>\n  <p>Why don’t modern two-tower systems train with classic pairwise (“double”) contrastive loss or triplet margin loss <code>max(0, d(u, v+) − d(u, v−) + m)<\/code>? Because once 90% of random negatives sit safely past margin <code>m<\/code>, 90% of your GPU batch produces <strong>exact zero gradient<\/strong>, stalling learning unless you maintain brittle online hard-negative miners. Instead, industrial retrievers use <strong>multi-class in-batch softmax (InfoNCE)<\/strong>: in a batch of <code>B = 2,048<\/code> positive pairs, computing <code>U @ V.T<\/code> contrasts every user against 2,047 negatives at once, automatically putting the steepest softmax gradient on whichever distractors currently fool the model most!<\/p>\n\n  <p>Three practical subtleties separate senior from staff answers here. First, naive in-batch softmax punishes popular items unfairly because hits appear as negatives in almost every batch—fix this with <button type=\"button\" class=\"concept-term\" data-tip=\"inbatch-logq\">in-batch negatives + log-Q correction<\/button> plus 2–4 mined hard negatives per row (items ranked top-50 by your current retriever that weren’t clicked, as in <a href=\"https://airbnb.tech/ai-ml/embedding-based-retrieval-for-airbnb-search/\" target=\"_blank\" rel=\"noopener\">Airbnb’s search retrieval<\/a>—filtering out other items the user also liked!). Second, if users routinely engage with several batch items simultaneously, switch softmax to independent pairwise sigmoid loss (<code>SigLIP<\/code>-style BCE) so valid co-positives don’t fight each other. Third, choose deliberately between <strong>cosine vs. raw dot product<\/strong>: L2-normalized cosine + temperature <code>τ<\/code> strips vector length so popularity can’t hijack similarity (great for search and tail fairness), whereas unnormalized dot product lets <code>‖v‖<\/code> naturally encode a global item-quality prior. Always monitor singular-value spread to catch <button type=\"button\" class=\"concept-term\" data-tip=\"embedding-collapse\">embedding collapse<\/button> (<a href=\"https://blog.reachsumit.com/posts/2024/11/embedding-collapse-recsys/\" target=\"_blank\" rel=\"noopener\">Sumit’s Diary<\/a>).<\/p>\n\n  <h3>3. Feature stores: zero online–offline skew &amp; streaming vs. batch tiers<\/h3>\n  <p>Nothing quietly ruins more ML launches than <strong>online–offline skew<\/strong>: a data scientist writes a Spark SQL window feature on historical Hive tables, a backend engineer rewrites “the same” counter in Go + Redis for serving, and subtle differences in null defaults, timezones, or window edges tank online conversion. As documented in <a href=\"https://airbnb.tech/opensource/chronon/\" target=\"_blank\" rel=\"noopener\">Airbnb’s Chronon architecture<\/a>, there are only two honest ways to eliminate skew:<\/p>\n  <ol class=\"framework-list\">\n    <li><strong>Log-and-Wait (Request-Time Feature Logging):<\/strong> When the online ranker fetches features from Redis at 10:02:14 AM to score 500 items, write that exact feature vector straight to Kafka alongside <code>request_id<\/code>. Offline training joins those logged snapshots with matured labels (respecting attribution windows: minutes for clicks, 7 days for job applications or purchases!). <em>Pros:<\/em> 100% immune to time-travel leakage and code skew. <em>Cons:<\/em> zero ability to backfill—if you invent a new feature today, you must deploy it and wait weeks to accumulate training logs!<\/li>\n    <li><strong>Declarative Write-Once Feature Platform (<button type=\"button\" class=\"concept-term\" data-tip=\"chronon-skew\">Chronon / Tecton unified DSL<\/button>):<\/strong> Define each transformation <em>once<\/em> in Python/SQL; the platform compiles that single spec into both Spark <button type=\"button\" class=\"concept-term\" data-tip=\"pit-joins\">point-in-time historical joins<\/button> (instant 1-year backfills for new feature experiments!) and stateful Flink streaming jobs writing into Redis/DynamoDB—continuously running a 1% parity audit comparing live logged values against offline backfills.<\/li>\n  <\/ol>\n\n  <p>Nor should every feature be streamed in real time! Continuous Flink jobs backed by SSD RocksDB state and high-write Redis clusters cost 3–5× more to operate than nightly Spark jobs (<a href=\"https://eugeneyan.com/writing/real-time-recommendations\" target=\"_blank\" rel=\"noopener\">Eugene Yan’s real-time ML guide<\/a>). Match each feature to the cheapest freshness tier that captures its signal, and use <button type=\"button\" class=\"concept-term\" data-tip=\"tiled-windows\">tiled windows<\/button> (e.g., summing a 29-day nightly batch counter with today’s live Flink counter) instead of keeping 30 days of raw events in streaming RAM:<\/p>\n\n  <div class=\"clean-table-wrap\"><table><thead><tr><th>Freshness tier &amp; plumbing<\/th><th>Concrete features that belong here<\/th><th>Latency, cost &amp; failure trade-off<\/th><\/tr><\/thead><tbody>\n  <tr><td><strong>Daily batch<\/strong><br>Spark/Iceberg → bulk load to online KV<\/td><td>90-day category affinities, creator quality scores, graph embeddings, lifetime purchase rates, static item content embeddings.<\/td><td>Cheapest compute &amp; arbitrarily big multi-table joins; up to 24h stale (useless for sudden in-session pivots).<\/td><\/tr>\n  <tr><td><strong>Hourly micro-batch<\/strong><br>Scheduled Spark / incremental SQL<\/td><td>Regional trending pools, ad campaign budget pacing multipliers, 24h rolling item CTR priors with Laplace smoothing.<\/td><td>Simple retryable ops without 24/7 Flink state headaches; misses minute-by-minute viral spikes.<\/td><\/tr>\n  <tr><td><strong>Streaming nearline (1–15s)<\/strong><br>Kafka → Flink → Redis / RocksDB<\/td><td><code>user_last_20_clicked_ids<\/code>, in-session category counts, <code>item_impressions_15m<\/code>, live cart contents, 5-min fraud velocity.<\/td><td>Captures live session intent &amp; breaking trends; expensive state checkpoints &amp; Redis write amplification—keep windows short!<\/td><\/tr>\n  <tr><td><strong>Request-time on-the-fly (0s)<\/strong><br>Computed inside Ranker CPU/GPU<\/td><td>Haversine distance from live GPS, time-of-day, query-title token overlap, <code>price / user_avg_spend<\/code>, live user×item dot products.<\/td><td>Zero staleness and enables true query×item crosses; directly eats into your 150 ms p99 serving budget.<\/td><\/tr>\n  <\/tbody><\/table><\/div>\n\n  <h3>4. Heavy ranking, multi-task utility &amp; ads auction calibration<\/h3>\n  <p>With ~500 candidates hydrated (pruned through a fast GBDT/MLP light ranker first only if sequence math blows your SLA, as in <a href=\"https://www.linkedin.com/blog/engineering/feed/engineering-the-next-generation-of-linkedins-feed\" target=\"_blank\" rel=\"noopener\">LinkedIn’s Feed<\/a>), the heavy ranker jointly scores user, context, and item. Combine explicit <button type=\"button\" class=\"concept-term\" data-tip=\"dcnv2\">DCNv2 feature crosses<\/button> with a short live-action Transformer (<a href=\"https://arxiv.org/abs/2306.00248\" target=\"_blank\" rel=\"noopener\">Pinterest’s TransAct<\/a>, <a href=\"https://airbnb.tech/ai-ml/personalizing-airbnb-search-by-learning-from-the-guest-journey/\" target=\"_blank\" rel=\"noopener\">Airbnb’s guest journey<\/a>) whose user-sequence representation is computed <em>once per request<\/em> and broadcast across all 500 items—or evaluate whether <button type=\"button\" class=\"concept-term\" data-tip=\"semantic-ids\">Semantic IDs &amp; generative recommenders<\/button> (<a href=\"https://netflixtechblog.com/genrec-towards-llm-native-recommendation-at-netflix-f20be6f643e3\" target=\"_blank\" rel=\"noopener\">Netflix GenRec<\/a>, <a href=\"https://arxiv.org/abs/2402.17152\" target=\"_blank\" rel=\"noopener\">Meta HSTU<\/a>) justify their GPU serving footprint.<\/p>\n\n  <p>Because feeds balance competing behaviors—clicks, long dwell, saves, purchases, and hides—use pointwise cross-entropy heads routed through <button type=\"button\" class=\"concept-term\" data-tip=\"mmoe-seesaw\">MMoE or PLE<\/button> (<a href=\"https://blog.reachsumit.com/posts/2024/01/multi-task-learning-recsys/\" target=\"_blank\" rel=\"noopener\">Sumit’s multi-task deep dive<\/a>) so dense click gradients don’t corrupt sparse conversion or hide heads. To blend sponsored ads alongside organic items (<a href=\"https://www.uber.com/us/en/blog/transforming-ads-personalization/\" target=\"_blank\" rel=\"noopener\">Uber’s Hetero-MMoE ads stack<\/a>), filter ads through a relevance floor <em>before<\/em> bidding, then merge in a common expected-value currency: <code>AdScore = bid × pCTR × pCVR − UX_penalty(pHide)<\/code>. Emphasize why <button type=\"button\" class=\"concept-term\" data-tip=\"auction-calibration\">auction calibration<\/button> is mandatory here: uncalibrated logits can still win on <code>NDCG<\/code> while mispricing millions in ad spend!<\/p>\n\n  <p>Finally, debias historical rank #1 visibility with <button type=\"button\" class=\"concept-term\" data-tip=\"ips-shallow-tower\">IPS or a shallow position tower<\/button>, diversify the final 20-item slate with <button type=\"button\" class=\"concept-term\" data-tip=\"mmr-diversity\">MMR<\/button> and marketplace supply/congestion caps, suppress repeats via a per-user <button type=\"button\" class=\"concept-term\" data-tip=\"bloom-filter\">Bloom filter<\/button>, and reserve 2–5% contextual-bandit traffic (<a href=\"https://research.atspotify.com/2025/9/calibrated-recommendations-with-contextual-bandits-on-spotify-homepage\" target=\"_blank\" rel=\"noopener\">Spotify homepage bandits<\/a>, <a href=\"https://eugeneyan.com/writing/bandits\" target=\"_blank\" rel=\"noopener\">Eugene Yan’s bandit guide<\/a>) so cold items earn unbiased impressions.<\/p>\n\n  <div class=\"essay-qa\">\n    <h3>How interviewers poke at this design<\/h3>\n    <p><strong>“Brand-new items almost never get shown—where is the bug?”<\/strong> Check four places in funnel order: (1) ID-only item tower with zero ID-dropout so cold items get useless vectors and lack a dedicated fresh-item retrieval pool; (2) ranker dominated by cumulative historical counters (<code>total_7d_clicks = 0<\/code>) instead of smoothed rates or content features; (3) no bandit exploration budget; or (4) stale hourly index lag.<\/p>\n    <p><strong>“Offline NDCG jumped +2%, so why did 30-day retention drop in A/B?”<\/strong> Suspect online–offline feature skew on a streaming counter first, then p99 latency timeouts triggering unpersonalized fallbacks, clickbait objective weights (<code>click<\/code> up while <code>hide<\/code>/bounce also rose), or offline replay rewarding the old ranker’s position bias.<\/p>\n  <\/div>\n\n  <aside class=\"design-reading\"><h3>Recommended engineering reading<\/h3><p><a href=\"https://eugeneyan.com/writing/system-design-for-discovery\" target=\"_blank\" rel=\"noopener\">Eugene Yan: Discovery Design<\/a> · <a href=\"https://airbnb.tech/opensource/chronon/\" target=\"_blank\" rel=\"noopener\">Airbnb: Chronon Feature Platform<\/a> · <a href=\"https://airbnb.tech/ai-ml/embedding-based-retrieval-for-airbnb-search/\" target=\"_blank\" rel=\"noopener\">Airbnb: EBR<\/a> · <a href=\"https://www.uber.com/us/en/blog/transforming-ads-personalization/\" target=\"_blank\" rel=\"noopener\">Uber: Hetero-MMoE Ads<\/a><\/p><\/aside>\n<\/article>\n\n<article class=\"design-
