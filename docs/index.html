<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI & ML Interview Guide</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script src="vendor/katex/katex.min.js"></script>
<style>:root {
  --bg: #f6f7f9;
  --card: #ffffff;
  --ink: #111827;
  --sub: #4b5563;
  --muted: #6b7280;
  --line: #e5e7eb;
  --line-strong: #d1d5db;
  --accent: #2563eb;
  --accent-bg: #eff6ff;
  --teal: #0f766e;
  --teal-bg: #f0fdfa;
  --purple: #6d28d9;
  --purple-bg: #f5f3ff;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14.5px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1080px;
  margin: 0 auto;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.brand {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.3px;
  color: var(--ink);
  text-decoration: none !important;
}
.tabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.tabs a {
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--sub);
  text-decoration: none;
  transition: background 0.12s, color 0.12s;
}
.tabs a:hover { background: #f3f4f6; color: var(--ink); }
.tabs a.active {
  background: var(--ink);
  color: #ffffff;
}

.container {
  max-width: 1080px;
  margin: 0 auto;
  padding: 32px 24px 72px;
}

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin: 34px 0 14px;
  flex-wrap: wrap;
}
.section-head:first-child { margin-top: 0; }
.section-head h2 {
  margin: 0;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.section-head span {
  font-size: 12.5px;
  color: var(--muted);
}

/* Framework switching pills */
.seg-bar {
  display: inline-flex;
  background: #eaecef;
  padding: 3px;
  border-radius: 8px;
  gap: 2px;
  margin-bottom: 18px;
}
.seg-btn {
  border: 0;
  background: transparent;
  padding: 6px 14px;
  border-radius: 6px;
  font: 600 13px var(--sans);
  color: var(--sub);
  cursor: pointer;
}
.seg-btn.active {
  background: var(--card);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
}

/* Visual Pipeline Strip */
.flow-strip {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 16px;
}
.flow-step {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 600;
  background: #f8fafc;
  border: 1px solid var(--line);
}
.flow-step small {
  font-weight: 400;
  color: var(--muted);
  font-size: 11.5px;
}
.flow-arrow {
  color: #9ca3af;
  font-size: 14px;
  user-select: none;
}

/* Visual Framework Cards */
.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.fw-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px 20px;
  box-shadow: 0 1px 2px rgba(17, 24, 39, 0.03);
}
.fw-card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.step-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 6px;
  font: 700 11.5px var(--sans);
  background: var(--accent-bg);
  color: var(--accent);
  flex-shrink: 0;
}
.theme-teal .step-num { background: var(--teal-bg); color: var(--teal); }
.theme-purple .step-num { background: var(--purple-bg); color: var(--purple); }

.fw-card h3 {
  margin: 0;
  font-size: 14.5px;
  font-weight: 650;
  letter-spacing: -0.15px;
}
.fw-card ul {
  margin: 0;
  padding-left: 17px;
  color: var(--sub);
  font-size: 13.5px;
}
.fw-card li { margin: 5px 0; }
.fw-card li strong { color: var(--ink); font-weight: 600; }

.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.chip {
  display: inline-block;
  font-size: 11.5px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 999px;
  background: #f3f4f6;
  color: var(--sub);
}

/* Accordion prompts & solutions */
details.clean-acc {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  margin-bottom: 8px;
}
details.clean-acc > summary {
  padding: 12px 16px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
details.clean-acc > summary::-webkit-details-marker { display: none; }
details.clean-acc > summary::after {
  content: "+";
  color: var(--muted);
  font-weight: 500;
  font-size: 16px;
}
details.clean-acc[open] > summary::after { content: "−"; }
details.clean-acc[open] > summary { border-bottom: 1px solid var(--line); }
.acc-body {
  padding: 14px 18px;
  font-size: 13.5px;
  color: var(--sub);
}
.acc-body ul { margin: 0; padding-left: 18px; }
.acc-body li { margin: 5px 0; }

/* LeetCode 75 Checklist */
.lc-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.lc-stats {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 13.5px;
  font-weight: 600;
}
.lc-bar {
  width: 140px;
  height: 7px;
  background: #e5e7eb;
  border-radius: 999px;
  overflow: hidden;
}
.lc-bar-fill {
  height: 100%;
  background: #10b981;
  transition: width 0.15s ease;
}
.lc-filters {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.filter-btn {
  border: 1px solid var(--line);
  background: #f9fafb;
  color: var(--sub);
  border-radius: 6px;
  padding: 5px 10px;
  font: 500 12.5px var(--sans);
  cursor: pointer;
}
.filter-btn.active {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}
.reset-btn {
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 12px;
  cursor: pointer;
  padding: 4px 6px;
}
.reset-btn:hover { color: #dc2626; }

.lc-group {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.lc-group-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 11px 16px;
  background: #f9fafb;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  font-weight: 650;
}
.lc-group-head span {
  font-weight: 500;
  font-size: 12px;
  color: var(--muted);
}
.lc-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 16px;
  border-bottom: 1px solid #f3f4f6;
  font-size: 13.5px;
}
.lc-row:last-child { border-bottom: 0; }
.lc-row:hover { background: #fafbfc; }
.lc-row input[type="checkbox"] {
  width: 15px;
  height: 15px;
  accent-color: #10b981;
  cursor: pointer;
  margin: 0;
  flex-shrink: 0;
}
.lc-num {
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  min-width: 34px;
}
.lc-title {
  color: var(--ink);
  font-weight: 500;
  flex: 1;
}
.lc-row.done .lc-title {
  color: #9ca3af;
  text-decoration: line-through;
}
.diff {
  font-size: 11px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 999px;
}
.diff-E { background: #ecfdf5; color: #047857; }
.diff-M { background: #fffbeb; color: #b45309; }
.diff-H { background: #fef2f2; color: #b91c1c; }
.local-pill {
  font-size: 10.5px;
  padding: 1px 6px;
  border-radius: 4px;
  background: #eff6ff;
  color: #1d4ed8;
}

/* Tables & Code Snippets (used sparingly where genuinely code/tabular) */
.clean-table-wrap {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
}
th, td {
  padding: 11px 14px;
  border-bottom: 1px solid #f1f5f9;
  text-align: left;
  vertical-align: top;
}
tr:last-child td { border-bottom: 0; }
th {
  background: #f8fafc;
  font-size: 12px;
  font-weight: 650;
  color: var(--sub);
  border-bottom: 1px solid var(--line);
}

code {
  font: 12.5px/1.4 var(--mono);
  background: #f1f5f9;
  padding: 2px 5px;
  border-radius: 4px;
}
pre {
  margin: 10px 0 0;
  padding: 13px 15px;
  background: #0f172a;
  color: #e2e8f0;
  border-radius: 8px;
  overflow-x: auto;
  font: 12px/1.6 var(--mono);
}
pre code { background: transparent; padding: 0; color: inherit; }

@media (max-width: 860px) {
  .grid-3, .grid-2 { grid-template-columns: 1fr; }
}

/* Reading-first design layout and offline syntax colors. */
.framework-list {max-width:900px;padding-left:26px}.framework-list>li{padding:12px 0;border-bottom:1px solid #e3e7ec}.framework-list h3{margin:0 0 8px}.framework-list ul{line-height:1.8}.design-list{display:block}.design-list .fw-card{border:0;border-bottom:1px solid #e3e7ec;border-radius:0;margin-bottom:12px}.diagram{overflow-x:auto;margin:24px 0}.diagram svg{display:block;width:100%;min-width:760px;height:auto}pre{background:#f5f7fb!important;color:#23334b!important;line-height:1.65;tab-size:4}.syntax-keyword{color:#7337a3;font-weight:600}.syntax-string{color:#166941}.syntax-comment{color:#5d6879;font-style:italic}.syntax-number{color:#a34519}section{margin-bottom:28px}.tabs{flex-wrap:wrap}

/* Theory is a continuous chapter, with no answer accordions. */
.theory-reader { max-width: 850px; margin: 0 auto; }
.theory-reader h1 { font-size: 28px; letter-spacing: -.6px; margin: 0 0 12px; }
.theory-intro { font-size: 16px; color: var(--sub); }
.theory-toc { margin: 26px 0; padding: 20px 24px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.theory-toc h2 { margin: 0 0 10px; font-size: 17px; }
.theory-toc ol { margin: 0; padding-left: 22px; }
.theory-toc ol > li { margin: 12px 0; font-weight: 600; }
.theory-toc ul { display: flex; flex-wrap: wrap; gap: 4px 18px; list-style: none; padding: 3px 0 0; font-size: 13px; font-weight: 400; }
.theory-toc ul a { color: var(--sub); }
.theory-section { margin-top: 48px; }
.theory-section > h2 { font-size: 24px; letter-spacing: -.4px; border-bottom: 2px solid var(--line-strong); padding-bottom: 12px; }
.theory-section-number { color: var(--muted); }
.theory-subsection { margin-top: 32px; }
.theory-subsection > h3 { font-size: 18px; color: var(--teal); margin: 0 0 6px; }
.theory-section, .theory-subsection { scroll-margin-top: 120px; }
.theory-topic { padding: 20px 0; border-bottom: 1px solid var(--line); }
.theory-topic:last-child { border-bottom: 0; }
.theory-topic h4 { font-size: 16px; margin: 0 0 10px; }
.theory-topic p { margin: 10px 0; line-height: 1.8; }
.theory-formula { background: var(--card); border-left: 3px solid var(--accent); padding: 14px 18px; margin: 16px 0 8px; overflow-x: auto; font-size: 16px; }
.theory-formula > div { white-space: nowrap; }
.theory-formula .katex-display { margin: .7em 0; text-align: left; }
.theory-formula .katex-display > .katex { text-align: left; }
.theory-formula .katex { font-size: 1.12em; }
.theory-notation, .theory-follow { color: var(--sub); font-size: 13.5px; }
.theory-sources { font-size: 12.5px; color: var(--muted); }
.theory-topic .clean-table-wrap { margin: 16px 0; }
.theory-topic tbody th { background: #fff; font-size: 13.5px; color: var(--ink); min-width: 120px; }
.theory-topic table { min-width: 560px; }
.theory-reader a:focus-visible, .theory-reader [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
@media (max-width: 600px) {
  .theory-toc { padding: 16px; }
  .theory-toc ul { display: block; }
  .theory-toc ul li { margin: 4px 0; }
  .theory-section > h2 { font-size: 21px; }
  .theory-formula { padding: 10px 12px; font-size: 16px; }
}
@media print {
  .theory-toc, .theory-reader > a { display: none; }
  .theory-reader { max-width: none; }
  .theory-topic h4, .theory-subsection > h3 { break-after: avoid; }
  .theory-formula { overflow: visible; }
  .theory-formula > div { white-space: normal; }
  .theory-topic table { min-width: 0; }
}
</style>
</head>

<script>const COURSE = {"frameworks": {"ml": {"theme": "", "flow": [{"name": "Formulation", "note": "goals & SLAs"}, {"name": "Metrics", "note": "online + offline"}, {"name": "Retrieval", "note": "candidates"}, {"name": "Ranking", "note": "light → heavy"}, {"name": "Policy Layer", "note": "diversity / rules"}, {"name": "Monitoring", "note": "drift & retrain"}], "steps": [{"title": "Problem Formulation", "items": ["<strong>Goals:<\/strong> business objective → ML objective", "<strong>Functional:<\/strong> what is in scope? multi-modal? live or batch?", "<strong>Non-functional:<\/strong> latency, number of users, items, QPS"], "tags": ["Scope", "Live vs Batch", "Latency"]}, {"title": "Metrics", "items": ["<strong>Online:<\/strong> CTR / conversion / engagement + guardrails (latency, hide rate)", "<strong>Offline:<\/strong> <code>Recall@K<\/code>, <code>NDCG@K<\/code>, <code>LogLoss / NE<\/code>, calibration (<code>ECE<\/code>)"], "tags": ["Online", "Offline", "Guardrails"]}, {"title": "High-Level Components", "items": ["Major pipeline stages end-to-end", "Candidate retrieval → Light ranker → Heavy ranker → Re-ranker / Policy"], "tags": ["Two-Stage Funnel"]}, {"title": "Data", "items": ["<strong>Labels &amp; signals:<\/strong> explicit vs implicit, negatives (in-batch + log-Q, hard)", "<strong>Features:<\/strong> scaling, missing values, ID / sequence / multimodal encoding", "<strong>Splits:<\/strong> sampling, temporal / user-stratified train-test split (zero leakage)"], "tags": ["Labels", "Features", "Temporal Split"]}, {"title": "Modeling", "items": ["<strong>Progression:<\/strong> heuristic / GBDT baseline → neural / sequence / multi-task architecture", "<strong>Loss &amp; eval:<\/strong> pointwise BCE vs pairwise/listwise; offline slice checks"], "tags": ["Baseline First", "Loss", "Calibration"]}, {"title": "Deployment & Scaling", "items": ["<strong>Serving:<\/strong> end-to-end prediction service + non-ML policy/filtering layers", "<strong>Operations:<\/strong> monitoring, alerts, feature/label drift, retraining cadence"], "tags": ["Serving", "Policy Layer", "Drift"]}]}}, "theory": [{"group": "ML foundations", "subgroup": "Learning setups", "q": "Supervised, unsupervised, self-supervised and reinforcement learning?", "a": "Supervised learning uses input–target examples. Unsupervised learning looks for structure without provided task labels. Self-supervised learning builds targets from data itself, such as the next token or another view of an image. Reinforcement learning optimizes expected return from interaction with an environment.", "nuance": "Self-supervision is a way to obtain a training signal, not a model architecture. An autoregressive language model can be pretrained with self-supervision, instruction-tuned with supervision, then optimized using preference feedback."}, {"group": "ML foundations", "subgroup": "Learning setups", "q": "Discriminative versus generative models?", "a": "A discriminative classifier models \\(P(y\\mid x)\\) or a decision boundary. A generative classifier models \\(P(x\\mid y)\\) and P(y), then uses Bayes’ rule; Naive Bayes is an example. A generative language model instead models a distribution over token sequences.", "nuance": "“Generative” is broader than chat or image generation. Logistic regression and Naive Bayes can solve the same classification task with different modeling assumptions.", "formula": "P(y \\mid x) = \\frac{P(x \\mid y)\\,P(y)}{P(x)}"}, {"group": "ML foundations", "q": "L1 versus L2 regularization?", "a": "Add lambda times the L1 norm or squared L2 norm to the loss. L1 can create exact zeros; L2 shrinks weights smoothly. Scale features first. Choose lambda on validation data; more regularization can underfit.", "follow": "Why does the intercept often remain unpenalized?", "subgroup": "Linear models & probability", "formula": "\\mathcal{L}_{L_1}(w) = \\mathcal{L}_{\\mathrm{data}}(w) + \\lambda \\sum_j |w_j|\n\\mathcal{L}_{L_2}(w) = \\mathcal{L}_{\\mathrm{data}}(w) + \\lambda \\sum_j w_j^2", "notation": "\\(\\lambda\\ge 0\\) controls penalty strength; whether the loss is a sum or mean changes its effective scale.", "nuance": "With correlated features, L1 may select one arbitrarily; L2 tends to distribute weight. Elastic net combines both penalties. L2 regularization and decoupled weight decay are not equivalent for adaptive optimizers."}, {"group": "ML foundations", "q": "Linear versus logistic regression?", "a": "Linear regression predicts a real value and commonly minimizes squared error. Logistic regression models \\(P(y=1\\mid x)=\\sigma(w^\\top x+b)\\), minimizing binary cross entropy. Both are linear in their score; logistic predictions are nonlinear probabilities.", "follow": "Derive the logistic gradient \\(X^\\top(p-y)/n\\).", "subgroup": "Linear models & probability", "formula": "\\hat y = x^\\top w + b\np = \\sigma(x^\\top w+b) = \\frac{1}{1+\\exp(-x^\\top w-b)}\n\\mathcal{L}_{\\mathrm{BCE}} = -\\frac{1}{n}\\sum_{i=1}^n \\left[y_i\\log p_i + (1-y_i)\\log(1-p_i)\\right]", "notation": "Rows of X are examples; p and y are length-n vectors. For mean BCE, \\(\\nabla_w\\mathcal{L}=X^\\top(p-y)/n\\).", "nuance": "Logistic regression learns a linear decision boundary in its input features. Polynomial or other feature transforms can make that boundary nonlinear in the original input space."}, {"group": "ML foundations", "q": "Why not invert XᵀX?", "a": "The normal equation requires full column rank, not merely enough rows. Correlated columns can make it singular or ill-conditioned. Use least squares via QR/SVD; ridge adds a regularization term but changes the objective.", "follow": "Show a matrix with n>d and duplicate columns.", "subgroup": "Linear models & probability", "formula": "\\hat w_{\\mathrm{OLS}} = (X^\\top X)^{-1}X^\\top y\n\\hat w_{\\mathrm{ridge}} = (X^\\top X+\\lambda I)^{-1}X^\\top y", "notation": "The displayed ridge form penalizes all columns. If X includes an intercept, normally exclude that coordinate from the penalty.", "nuance": "These are algebraic solutions, not instructions to explicitly compute an inverse. QR/SVD avoids squaring the condition number through \\(X^\\top X\\); use a solver for ridge."}, {"group": "ML foundations", "q": "What does Naive Bayes assume?", "a": "Features are conditionally independent given the class, not unconditionally independent. Sum log likelihoods plus log prior; smoothing prevents unseen categories from forcing zero likelihood. Gaussian, categorical and multinomial variants use different likelihoods.", "follow": "Why can it classify well but be poorly calibrated?", "subgroup": "Linear models & probability", "formula": "\\log P(y\\mid x) = C(x) + \\log P(y) + \\sum_j \\log P(x_j\\mid y)", "nuance": "Repeated correlated evidence gets counted more than once, which can make probabilities overconfident even when the winning class is correct.", "notation": "\\(C(x)=-\\log P(x)\\) does not depend on the class, so it can be omitted when choosing the most likely class."}, {"group": "ML foundations", "q": "When are linear regression assumptions needed?", "a": "Least squares does not require normally distributed input features. Full column rank gives a unique coefficient solution; zero conditional mean errors support unbiasedness. Homoscedasticity and uncorrelated errors underpin classical variance formulas; normal errors support exact small-sample inference. Prediction can still be useful when inferential assumptions fail.", "follow": "What changes with heteroscedastic errors?", "subgroup": "Linear models & probability"}, {"group": "ML foundations", "q": "What happens to logistic regression on separable data?", "a": "Without regularization, perfectly separable classes can drive coefficients toward infinity: the likelihood supremum need not occur at finite weights. Regularization gives a controlled solution. This does not imply kNN is universally preferable.", "follow": "What does stronger L2 do to the predicted probabilities?", "subgroup": "Linear models & probability"}, {"group": "ML foundations", "subgroup": "Linear models & probability", "q": "Maximum likelihood versus MAP estimation?", "a": "Maximum likelihood chooses parameters that best explain observed data. Maximum a posteriori estimation also includes a prior over parameters. With Gaussian noise, linear-regression maximum likelihood minimizes squared error; a Gaussian weight prior yields an L2 penalty, and a Laplace prior yields L1.", "formula": "\\hat\\theta_{\\mathrm{MLE}} = \\operatorname*{arg\\,max}_{\\theta}\\log P(D\\mid\\theta)\n\\hat\\theta_{\\mathrm{MAP}} = \\operatorname*{arg\\,max}_{\\theta}\\left[\\log P(D\\mid\\theta)+\\log P(\\theta)\\right]", "nuance": "MAP returns a point estimate, not a full posterior. The exact regularization coefficient depends on the prior scale, likelihood noise and sum-versus-mean loss convention."}, {"group": "ML foundations", "q": "What does k-means optimize?", "a": "Sum of squared distances to assigned centroids. Alternate nearest-center assignment and mean updates. Initialization affects the local optimum; scale features and consider multiple restarts. Retain or reseed an empty center explicitly.", "follow": "Why is a mean appropriate for squared distance but not absolute distance?", "subgroup": "Trees, clustering & features", "formula": "J = \\sum_{i=1}^n \\left\\lVert x_i-\\mu_{c_i}\\right\\rVert_2^2", "notation": "\\(c_i\\) is the cluster assigned to example i; \\(\\mu_{c_i}\\) is its centroid.", "nuance": "It favors roughly spherical groups under the chosen distance. Raw feature scale can dominate; elongated clusters, unequal densities and outliers can make this a poor model."}, {"group": "ML foundations", "q": "Bagging versus boosting?", "a": "Bagging trains models on resampled data and averages them, often reducing variance. Boosting adds models sequentially to address the current loss residuals or gradients. Tree depth, learning rate and number of rounds control capacity.", "follow": "When would a boosted tree beat a neural network on tabular data?", "subgroup": "Trees, clustering & features", "comparison": {"headers": ["Method", "How it learns", "Main tradeoff"], "rows": [["Random forest / bagging", "Fit resampled trees independently; random forests also subsample features.", "Averaging reduces variance when errors are not perfectly correlated; training parallelizes."], ["Gradient boosting", "Add a weak learner fitted to negative loss gradients.", "Strong tabular baseline; sequential fitting and depth/rate/rounds need tuning."]]}}, {"group": "ML foundations", "q": "How do you handle missing and categorical features?", "a": "Fit imputers and encoders on training data only. Consider missingness indicators when absence is informative. One-hot encoding suits low cardinality; hashing bounds memory but creates collisions; embeddings learn compact representations. Target encoding requires out-of-fold construction to avoid leakage.", "follow": "When would median imputation hide an important signal?", "subgroup": "Trees, clustering & features"}, {"group": "ML foundations", "q": "PCA, LDA and feature selection?", "a": "PCA finds orthogonal directions of maximum variance without labels; discriminant LDA uses labels to separate classes. Neither guarantees better downstream predictions. Filter selection scores features independently of a fitted predictor; wrappers search feature subsets using validation; embedded selection occurs during training, as with L1. L2 usually shrinks rather than selects exact zeros.", "follow": "Why fit dimensionality reduction inside each validation fold?", "subgroup": "Trees, clustering & features", "nuance": "Center data before PCA; standardize if differences in units should not determine importance. High variance need not mean useful signal. Here LDA means linear discriminant analysis, not latent Dirichlet allocation."}, {"group": "ML foundations", "q": "Does k-means converge to the global optimum?", "a": "Standard Lloyd updates do not increase the squared-Euclidean objective. With consistent tie and empty-cluster handling they reach a fixed assignment/local solution, not necessarily the global optimum. The joint problem is nonconvex; initialization and multiple restarts matter. Absolute-distance clustering generally needs medians, not mean updates.", "follow": "What does k-means++ improve?", "subgroup": "Trees, clustering & features"}, {"group": "ML foundations", "subgroup": "Trees, clustering & features", "q": "Decision tree versus linear model versus neural network?", "a": "Start with the data and constraints. Linear models are cheap, interpretable baselines when additive effects suffice. Trees capture nonlinear feature interactions without standardizing every feature. Neural networks learn representations and work well with large unstructured datasets.", "comparison": {"headers": ["Model", "Strength", "Caveat"], "rows": [["Linear / logistic", "Fast, transparent coefficients after accounting for scaling.", "Needs engineered interactions for nonlinear boundaries."], ["Boosted trees", "Strong on heterogeneous tabular features.", "Piecewise predictions extrapolate poorly; preprocessing and leakage still matter."], ["Neural network", "Shared representations for text, images and multimodal input.", "More choices in architecture, data and optimization; not automatically better on small tables."]]}}, {"group": "Evaluation & generalization", "q": "Bias versus variance?", "a": "High training error suggests underfitting or an optimization/data issue; low training error with a large validation gap suggests overfitting. Compare learning curves before choosing more data, capacity or regularization.", "follow": "What if both errors rise after a data refresh?", "subgroup": "Generalization & validation", "nuance": "Bias–variance is a decomposition of expected squared prediction error across possible training sets, not a diagnosis you can read directly from one loss curve. An irreducible noise term remains even with a perfect model.", "formula": "\\mathbb{E}\\!\\left[(Y-\\hat f(x))^2\\mid x\\right] = \\operatorname{Bias}[\\hat f(x)]^2 + \\operatorname{Var}[\\hat f(x)] + \\sigma^2(x)", "notation": "At a fixed input \\(x\\), expectation averages over training sets and a fresh outcome. \\(\\sigma^2(x)=\\operatorname{Var}(Y\\mid x)\\) is irreducible noise."}, {"group": "Evaluation & generalization", "q": "How do you prevent leakage?", "a": "Split before fitting scalers, imputers or feature selection. Use time splits for forecasting and group splits for repeated entities. Features must exist at prediction time; tune on validation, evaluate once on held-out test.", "follow": "Why can random splitting inflate a recommender metric?", "subgroup": "Generalization & validation", "nuance": "A random split can put the same user, near-duplicate document or future interaction on both sides. Choose the split that matches the actual deployment question; an unseen-user split tests something different from predicting future activity for existing users."}, {"group": "Evaluation & generalization", "subgroup": "Generalization & validation", "q": "Training, validation, test and cross-validation?", "a": "Fit parameters on training data. Select hyperparameters and thresholds on validation data. Use the test set for a final estimate after those choices. Cross-validation repeats train/validation splits to reduce dependence on a single split; transformations must be fitted inside each fold.", "nuance": "Repeatedly checking the test set turns it into validation data. For small datasets and extensive tuning, nested cross-validation separates selection from evaluation. Use grouped or chronological folds when observations are dependent."}, {"group": "Evaluation & generalization", "q": "Metrics for imbalanced classification?", "a": "Precision measures correctness among predicted positives; recall measures coverage of actual positives. Choose the threshold using error costs or a precision/recall constraint. PR curves emphasize rare-positive performance; ROC-AUC alone can hide a poor operating point.", "follow": "Can a high-AUC model have bad probability calibration?", "subgroup": "Metrics, thresholds & ranking", "formula": "\\mathrm{Precision} = \\frac{\\mathrm{TP}}{\\mathrm{TP}+\\mathrm{FP}}\n\\mathrm{Recall} = \\frac{\\mathrm{TP}}{\\mathrm{TP}+\\mathrm{FN}}\nF_1 = \\frac{2\\,\\mathrm{Precision}\\,\\mathrm{Recall}}{\\mathrm{Precision}+\\mathrm{Recall}}", "nuance": "F1 ignores true negatives and assumes a particular balance between precision and recall. PR performance depends on prevalence: compare on the same population. Define how zero denominators are handled."}, {"group": "Evaluation & generalization", "q": "Offline versus online recommender quality?", "a": "Recall@K measures candidate coverage; NDCG rewards relevant results near the top. Neither proves engagement or retention improves. Run controlled experiments with latency, negative feedback and diversity guardrails; watch exposure and selection bias.", "follow": "How do you evaluate items that the old policy never showed?", "subgroup": "Metrics, thresholds & ranking"}, {"group": "Evaluation & generalization", "q": "How do you calibrate a classifier?", "a": "Calibration asks whether predictions near 0.8 are correct about 80% of the time. Inspect reliability plots, log loss or Brier score, and subgroup behavior. Fit Platt scaling or isotonic regression on disjoint calibration data. Resampling or class weighting can change probabilities; validate calibration under the serving distribution.", "follow": "Can calibration improve while AUC stays unchanged?", "subgroup": "Metrics, thresholds & ranking", "formula": "\\mathrm{Brier} = \\frac{1}{n}\\sum_{i=1}^n (p_i-y_i)^2", "nuance": "Ranking and calibration are different: strictly increasing score transforms preserve AUC but can change calibration. Reliability diagrams depend on binning; log loss strongly punishes confidently wrong predictions."}, {"group": "Evaluation & generalization", "q": "MRR, MAP, NDCG and MMR?", "a": "MRR averages the reciprocal rank of the first relevant result. MAP considers precision at relevant ranks across the result list. NDCG discounts graded relevance by position and normalizes by the ideal ranking. MMR is a relevance–redundancy reranking strategy, not mean reciprocal rank.", "follow": "Which metric fits a query with several required evidence documents?", "subgroup": "Metrics, thresholds & ranking", "formula": "\\mathrm{DCG}@K = \\sum_{r=1}^K \\frac{2^{\\mathrm{rel}(r)}-1}{\\log_2(r+1)}\n\\mathrm{NDCG}@K = \\frac{\\mathrm{DCG}@K}{\\mathrm{IDCG}@K}", "notation": "\\(\\mathrm{rel}(r)\\) is relevance at rank \\(r\\); \\(\\mathrm{IDCG}\\) is DCG under the ideal ordering. State the gain convention and how queries with no relevant results are handled.", "nuance": "MRR emphasizes the first useful result; recall@K emphasizes finding all required evidence; NDCG handles graded relevance and ordering. A reranker cannot recover a relevant document missing from its candidate set."}, {"group": "Evaluation & generalization", "q": "Micro versus macro metrics for multilabel tasks?", "a": "Micro aggregation pools label decisions before computing a metric; macro averages per-label scores, giving rare labels equal weight. Subset accuracy requires the entire label set to match. Independent sigmoid outputs with BCE are a common baseline; label dependencies can motivate richer models.", "follow": "When would a good micro score hide a failed rare label?", "subgroup": "Metrics, thresholds & ranking"}, {"group": "Evaluation & generalization", "subgroup": "Metrics, thresholds & ranking", "q": "ROC-AUC versus PR-AUC versus log loss?", "a": "ROC-AUC summarizes ranking across true-positive/false-positive operating points. PR curves emphasize the quality and coverage of positive predictions. Log loss scores probabilities, penalizing confidently wrong answers. None alone tells you which threshold meets a business constraint.", "comparison": {"headers": ["Measure", "What it captures", "Watch out"], "rows": [["ROC-AUC", "Probability a positive outranks a negative, with tie convention.", "Many true negatives can coexist with too many false alerts."], ["PR-AUC / average precision", "Precision–recall tradeoff; AP uses recall-weighted precision increments.", "Depends on prevalence; trapezoidal PR-AUC and AP are not identical."], ["Log loss", "Quality of predicted probabilities.", "Sensitive to confidently wrong labels and label noise."]]}}, {"group": "Evaluation & generalization", "subgroup": "Metrics, thresholds & ranking", "q": "Statistical significance versus practical significance?", "a": "A tiny effect can be statistically detectable with enough data but not worth deployment. Report an effect size and uncertainty interval, choose the unit of randomization, and define the primary metric before testing.", "nuance": "Repeated peeking and testing many metrics inflate false positives without an appropriate design. Bootstrap users or another independent unit rather than correlated rows; paired evaluation helps compare models on the same examples."}, {"group": "Evaluation & generalization", "q": "Data drift versus concept drift?", "a": "Data drift changes the input distribution P(X); concept drift changes P(y|X). Covariate drift alone need not reduce quality. Monitor input health and delayed outcome metrics, check logging and seasonality, then determine whether retraining addresses the actual cause.", "follow": "What can you detect before labels arrive?", "subgroup": "Data shifts & production checks", "nuance": "Label shift changes P(y) while P(X | y) stays fixed. These are assumptions, not exhaustive labels for real incidents; multiple distributions can change together."}, {"group": "Evaluation & generalization", "q": "ARMA, ARIMA and stationarity?", "a": "ARMA typically models a stationary series; ARIMA incorporates differencing to address nonstationarity. The ADF test has a unit-root null: a small p-value is evidence against that null, not a generic proof of every kind of stationarity. Evaluate with time-ordered backtests and account for seasonality.", "follow": "Why can ordinary shuffled cross-validation mislead?", "subgroup": "Data shifts & production checks"}, {"group": "Evaluation & generalization", "q": "How do you test an ML pipeline beyond accuracy?", "a": "Test schemas, null rates, label quality, feature transformations, point-in-time joins and training/serving parity. Use ablations to test feature value, perturbations for robustness and justified invariances for expected behavior. Trace examples end to end and compare to a simple baseline.", "follow": "What would you inspect first after a sudden quality regression?", "subgroup": "Data shifts & production checks"}, {"group": "Evaluation & generalization", "q": "Shadow, canary and blue-green deployment?", "a": "Shadow traffic exercises a new model without changing user-facing decisions. Canary exposes a limited cohort and ramps after checks. Blue-green retains two environments for switching and rollback; it is not inherently an A/B experiment. Randomized experiments need separate assignment and measurement design.", "follow": "How do you ensure a shadow model cannot cause tool side effects?", "subgroup": "Data shifts & production checks"}, {"group": "Deep learning", "q": "What is backpropagation?", "a": "Apply the chain rule through a computation graph, accumulating gradients for parameters used along multiple paths. The optimizer then updates parameters. Gradients accumulate in PyTorch, so clear them at the intended update boundary.", "follow": "Explain why detach breaks a gradient path.", "subgroup": "Optimization & numerical stability", "formula": "w \\leftarrow w - \\eta\\,\\nabla_w\\mathcal{L}", "notation": "η is the learning rate. Backprop computes \\(\\nabla_w\\mathcal{L}\\); the optimizer decides how to use it.", "nuance": "Accumulate correctly scaled microbatch losses to emulate a larger batch, then update once. Batch-dependent layers and stochastic effects can still make the result differ from a single large-batch pass."}, {"group": "Deep learning", "q": "Why do gradients vanish or explode?", "a": "Repeated Jacobian products can shrink or grow gradients. Saturating activations worsen vanishing; initialization, residual connections and normalization help. Gradient clipping addresses large gradients but does not fix incorrect objectives or data.", "follow": "What would you inspect when the loss becomes NaN?", "subgroup": "Optimization & numerical stability", "nuance": "For NaNs, inspect the first nonfinite activation/gradient, learning rate, division/log inputs, masks and low-precision overflow. Clipping can contain an explosion but cannot repair an all-masked softmax."}, {"group": "Deep learning", "q": "SGD, momentum and Adam?", "a": "SGD follows the minibatch gradient. Momentum averages gradient directions. Adam tracks first and second moments for coordinate-wise adaptation with bias correction. Learning rate still matters; AdamW decouples weight decay from the adaptive gradient update.", "follow": "Why might you use a warmup schedule?", "subgroup": "Optimization & numerical stability", "nuance": "Warmup limits disruptive early updates before optimizer statistics settle. A larger batch reduces gradient noise but changes the update count per epoch; tune schedules by steps/tokens, not just epochs."}, {"group": "Deep learning", "subgroup": "Optimization & numerical stability", "q": "MSE, MAE and cross-entropy: how do you choose?", "a": "Squared error targets the conditional mean and strongly penalizes large residuals. Absolute error targets a conditional median and is less sensitive to extreme residuals. Cross-entropy is the negative log likelihood for categorical outcomes; use binary cross-entropy for independent binary labels.", "formula": "\\mathrm{MSE} = \\frac{1}{n}\\sum_{i=1}^n (\\hat y_i-y_i)^2\n\\mathrm{MAE} = \\frac{1}{n}\\sum_{i=1}^n |\\hat y_i-y_i|\n\\mathcal{L}_{\\mathrm{CE}} = -\\sum_c y_c\\log p_c", "nuance": "Use logits-based loss APIs for stability. A multiclass softmax forces classes to compete; independent sigmoids allow several labels at once. Huber loss provides a smooth quadratic-to-linear regression compromise."}, {"group": "Deep learning", "subgroup": "Optimization & numerical stability", "q": "Why subtract the maximum before softmax?", "a": "Exponentiating large logits can overflow. Subtracting a common constant preserves softmax probabilities; choosing the largest logit makes every exponent at most one. Compute log probabilities using log-sum-exp rather than taking log of an underflowed probability.", "formula": "\\operatorname{softmax}(z)_i = \\frac{\\exp(z_i-m)}{\\sum_j\\exp(z_j-m)},\\qquad m=\\max_j z_j", "nuance": "A row containing only −∞ still needs special handling: subtracting −∞ from −∞ is undefined. Adding ε after softmax does not repair the cause."}, {"group": "Deep learning", "q": "BatchNorm versus LayerNorm?", "a": "BatchNorm uses batch-dependent statistics during training and typically running statistics at inference. LayerNorm normalizes specified feature dimensions per example/token and does not depend on other batch members. Their normalization axes matter.", "follow": "Why is LayerNorm convenient for variable-length language modeling?", "subgroup": "Architecture & regularization", "comparison": {"headers": ["Normalization", "Statistics", "Consequence"], "rows": [["BatchNorm", "Per channel, over batch and often spatial axes.", "Typically uses running statistics at inference; small or shifted batches can be problematic."], ["LayerNorm", "Across hidden features of each example/token.", "Same computation in train/eval; independent of other examples."], ["RMSNorm", "Root mean square across hidden features; does not subtract the mean.", "Rescales magnitudes with fewer operations; not identical to LayerNorm."]]}, "formula": "\\operatorname{LayerNorm}(x) = \\gamma\\odot\\frac{x-\\mu}{\\sqrt{\\sigma^2+\\varepsilon}}+\\beta\n\\operatorname{RMSNorm}(x) = \\gamma\\odot\\frac{x}{\\sqrt{\\operatorname{mean}(x^2)+\\varepsilon}}", "notation": "Statistics use the chosen normalization axes; γ and β are learned, ε stabilizes division."}, {"group": "Deep learning", "q": "Dropout, eval and no_grad?", "a": "Dropout randomly removes activations during training with compensating scaling. model.eval changes behavior of modules such as dropout and BatchNorm; it does not disable autograd. no_grad disables graph recording but does not switch module mode.", "follow": "What goes wrong if validation runs in train mode?", "subgroup": "Architecture & regularization"}, {"group": "Deep learning", "subgroup": "Architecture & regularization", "q": "ReLU versus sigmoid, tanh and GELU?", "a": "Sigmoid and tanh saturate, shrinking derivatives at large magnitudes. ReLU is simple and avoids positive-side saturation but has zero gradient for negative inputs. GELU smoothly weights inputs by magnitude and is common in Transformer feed-forward layers.", "nuance": "Use sigmoid for an independent binary probability and softmax for mutually exclusive classes; hidden-layer activation choice is a different decision. Stacking only affine layers collapses to one affine map, so nonlinearities create additional expressiveness."}, {"group": "Deep learning", "subgroup": "Architecture & regularization", "q": "Residual connections versus normalization?", "a": "A residual connection adds the input to a learned transformation: y = x + F(x). It provides a direct path for information and gradients. Normalization controls activation scale along specified axes. They solve related optimization problems but are not interchangeable.", "nuance": "The addition requires compatible shapes; use a projection when widths differ. A residual path helps train deep networks but does not guarantee nonvanishing gradients or good generalization."}, {"group": "Embeddings & representation learning", "q": "What if labels are scarce?", "a": "Transfer learning reuses representations; weak supervision combines noisy labeling sources; semi-supervised methods exploit unlabeled examples. Pseudo-labels can reinforce mistakes, so use confidence controls and a genuinely labeled held-out set. Augmentation must preserve the target semantics.", "follow": "How do you assess correlated weak labeling sources?", "subgroup": "Representations & supervision"}, {"group": "Embeddings & representation learning", "subgroup": "Representations & supervision", "q": "What is an embedding, and what does its geometry mean?", "a": "An embedding maps an object to a vector. Token lookup tables, contextual token states and pooled sentence/document vectors are different representations. Closeness is meaningful only relative to the training objective: topic similarity is not necessarily query–answer relevance.", "nuance": "For example, “how to cancel” and “how to renew” may be linguistically similar but require different evidence. For retrieval, train and evaluate the geometry around relevance rather than assuming any language-model hidden state is a good search vector."}, {"group": "Embeddings & representation learning", "subgroup": "Representations & supervision", "q": "How do you train useful retrieval embeddings?", "a": "Start from a pretrained text encoder. Build representative query–relevant-document pairs, split by document/entity/time to limit leakage, and learn a pooled vector using a retrieval objective. Include realistic distractors, then validate recall@K and downstream answer quality on held-out queries.", "nuance": "Keep the pooling, normalization, truncation and query/document prompts consistent between training and indexing. Changing the encoder generally requires re-embedding the corpus and rebuilding the index; mixing incompatible vector spaces breaks similarity search."}, {"group": "Embeddings & representation learning", "subgroup": "Representations & supervision", "q": "Bi-encoder versus cross-encoder versus late interaction?", "a": "A bi-encoder separately embeds queries and documents, enabling precomputed vectors and fast approximate search. A cross-encoder jointly processes each query–document pair, allowing richer token interactions at a higher per-pair cost. Late interaction retains token vectors and aggregates token-level matches.", "comparison": {"headers": ["Approach", "Typical role", "Cost / limitation"], "rows": [["Bi-encoder / two-tower", "Retrieve from a large corpus.", "One compact vector may lose fine detail."], ["Cross-encoder", "Rerank a smaller candidate set.", "Cannot precompute a universal query-independent relevance score."], ["Late interaction", "Retrieve or rerank with richer matching.", "More storage and scoring work than one vector per document."]]}, "nuance": "Two-tower models may share encoder weights or use separate encoders. Query–document relevance is often asymmetric, even if the final score is a symmetric dot product.", "sources": [{"title": "Sentence-BERT", "url": "https://arxiv.org/abs/1908.10084"}, {"title": "ColBERT", "url": "https://arxiv.org/abs/2004.12832"}]}, {"group": "Embeddings & representation learning", "subgroup": "Contrastive objectives & negatives", "q": "What is contrastive learning?", "a": "Train an anchor to be close to positive examples and distinguishable from negatives. In self-supervised learning, two augmentations can define a positive pair; in supervised contrastive learning, labels define which examples are positives. Retrieval can use a query and relevant passage as a pair.", "nuance": "The positive definition teaches the desired invariances. An augmentation that removes a negation or changes the answer can teach the wrong similarity. Not all representation learning uses negatives: reconstruction, distillation and noncontrastive methods are alternatives.", "sources": [{"title": "SimCLR", "url": "https://arxiv.org/abs/2002.05709"}, {"title": "Supervised Contrastive Learning", "url": "https://arxiv.org/abs/2004.11362"}]}, {"group": "Embeddings & representation learning", "subgroup": "Contrastive objectives & negatives", "q": "InfoNCE / in-batch contrastive loss: what is optimized?", "a": "Treat matching the anchor to its positive as a classification problem over candidate positives and negatives. For a batch of N query–positive pairs, each query scores all N documents; off-diagonal documents act as negatives.", "formula": "\\mathcal{L}_i = -\\log\\frac{\\exp\\!\\left(s(q_i,d_i)/\\tau\\right)}{\\sum_{j=1}^N\\exp\\!\\left(s(q_i,d_j)/\\tau\\right)}\n\\mathcal{L} = \\frac{1}{N}\\sum_{i=1}^N\\mathcal{L}_i", "notation": "s is a similarity score; τ > 0 is temperature. The denominator includes the positive. With multiple relevant documents, define a multi-positive loss or mask false negatives.", "nuance": "Lower temperature sharpens the distribution and emphasizes high-scoring mistakes; it is not unconditionally better. More batch candidates offer more discrimination but also more false negatives. Symmetric query→document and document→query losses are optional, task-dependent choices.", "sources": [{"title": "MultipleNegativesRankingLoss", "url": "https://www.sbert.net/docs/package_reference/sentence_transformer/losses.html"}]}, {"group": "Embeddings & representation learning", "subgroup": "Contrastive objectives & negatives", "q": "Triplet loss versus contrastive softmax?", "a": "Triplet loss asks an anchor to be closer to a positive than to a negative by a margin. A softmax contrastive objective compares an anchor against a candidate set and continues to calibrate relative scores. Both depend heavily on the examples selected.", "formula": "\\mathcal{L}_{\\mathrm{triplet}} = \\max\\!\\left(0,\\,d(a,p)-d(a,n)+m\\right)", "notation": "\\(m>0\\) is a margin; \\(d(\\cdot,\\cdot)\\) is the chosen distance. State whether it is Euclidean, squared Euclidean or another metric.", "nuance": "An easy triplet beyond the margin gives zero loss and gradient. Very hard negatives may be mislabeled positives. Contrastive training is not automatically superior if the supervision or candidate construction is wrong."}, {"group": "Embeddings & representation learning", "subgroup": "Contrastive objectives & negatives", "q": "Random, hard and false negatives?", "a": "Random negatives are often easy. Hard negatives look similar to the query but are actually irrelevant, such as the right product with the wrong version. Mine them using an existing retriever, then filter or label them. A false negative is relevant material mistakenly pushed away.", "nuance": "Use a mix of difficulty levels, remove duplicates and inspect the hardest cases. A guide model or human labels can filter likely false negatives but are not perfect ground truth. Unclicked impressions are not guaranteed irrelevant.", "sources": [{"title": "Hard-negative mining", "url": "https://sbert.net/docs/package_reference/util/hard_negatives.html"}]}, {"group": "Embeddings & representation learning", "subgroup": "Geometry & evaluation", "q": "Cosine similarity versus dot product versus Euclidean distance?", "a": "Dot product depends on direction and vector magnitude. Cosine removes magnitude by normalizing both vectors. Euclidean distance measures straight-line separation. On unit-normalized vectors, maximizing cosine or dot product is equivalent to minimizing squared Euclidean distance.", "formula": "\\cos(u,v) = \\frac{u^\\top v}{\\lVert u\\rVert_2\\,\\lVert v\\rVert_2}\n\\lVert u\\rVert_2=\\lVert v\\rVert_2=1\\quad\\Longrightarrow\\quad\\lVert u-v\\rVert_2^2=2-2u^\\top v", "nuance": "A zero vector needs an explicit policy before normalization. Norms may encode useful confidence or popularity, so removing them changes the task. Match the ANN index metric to the trained scoring function."}, {"group": "Embeddings & representation learning", "subgroup": "Geometry & evaluation", "q": "Pooling, collapse and embedding evaluation?", "a": "Convert token states to one vector using a trained CLS representation, masked mean pooling or another task-trained pooler. Mean pooling must ignore padding. Collapse maps unrelated inputs to nearly identical vectors; inspect vector norms, variance and similarity distributions.", "nuance": "Unsupervised SimCSE uses independent dropout views of the same sentence as positives. Its results illustrate why the training signal and noise matter; pooling an arbitrary language model is not equivalent to training a sentence encoder. Evaluate retrieval by domain, length, language and rare entities, then check ANN recall against exact search.", "sources": [{"title": "SimCSE", "url": "https://arxiv.org/abs/2104.08821"}]}, {"group": "Tokenizers & Transformers", "subgroup": "Tokenization & language-model objectives", "q": "What is a tokenizer, and what is its goal?", "a": "A tokenizer converts text into a sequence of discrete token IDs that a model can consume. It balances vocabulary size, sequence length and coverage of rare strings or languages. Tokens are not necessarily words, characters or semantic units; the embedding lookup happens after tokenization.", "nuance": "The pipeline can include normalization, pre-tokenization, subword segmentation and special tokens. Decoding recovers text under that pipeline’s rules; normalization can discard information. IDs are arbitrary vocabulary indices, not numerical measures of similarity.", "sources": [{"title": "Tokenizer components", "url": "https://huggingface.co/docs/tokenizers/python/latest/components.html"}]}, {"group": "Tokenizers & Transformers", "subgroup": "Tokenization & language-model objectives", "q": "BPE versus WordPiece versus Unigram?", "a": "All three split text into reusable subword units, but learn or select pieces differently. Vocabulary training is usually separate from neural-model weight training.", "comparison": {"headers": ["Algorithm", "Vocabulary / segmentation idea", "Useful distinction"], "rows": [["BPE", "Repeatedly merge frequent adjacent symbol pairs; apply learned merges.", "Byte-level BPE starts from bytes and can represent arbitrary text without an unknown token."], ["WordPiece", "Common accounts score merges by association relative to piece frequencies; tokenize with longest matching pieces.", "Greedy segmentation is different from replaying BPE merges; exact training implementations vary."], ["Unigram", "Begin with a candidate vocabulary and prune under a probabilistic model; choose a likely segmentation.", "Can support multiple segmentations and sampling rather than one fixed merge path."]]}, "nuance": "SentencePiece is a tokenizer toolkit, not a synonym for Unigram; it supports BPE too. Byte fallback is a configuration choice, not a guarantee of every subword tokenizer.", "sources": [{"title": "BPE", "url": "https://huggingface.co/learn/llm-course/chapter6/5"}, {"title": "WordPiece", "url": "https://huggingface.co/learn/llm-course/chapter6/6"}, {"title": "Unigram", "url": "https://huggingface.co/learn/llm-course/chapter6/7"}]}, {"group": "Tokenizers & Transformers", "subgroup": "Tokenization & language-model objectives", "q": "Why does tokenization affect cost and quality?", "a": "More tokens mean less text fits into a fixed context window and more attention and decoding work. A larger vocabulary can shorten sequences but enlarges embedding/output tables and softmax work. Different languages, code and numbers may fragment very differently.", "nuance": "Count tokens with the model’s exact tokenizer, including chat-template special tokens. Token IDs and embedding rows must stay aligned; swapping tokenizers is not a harmless preprocessing change. Compare perplexity only with compatible tokenization and evaluation conventions."}, {"group": "Tokenizers & Transformers", "subgroup": "Tokenization & language-model objectives", "q": "Causal language modeling versus masked language modeling?", "a": "Causal language modeling predicts the next token from the preceding prefix. Masked language modeling predicts selected hidden tokens using the visible surrounding context. A standard causal loss is teacher-forced: each position sees ground-truth earlier tokens during training.", "formula": "\\mathcal{L}_{\\mathrm{causal}} = -\\frac{1}{N}\\sum_t\\log P(x_t\\mid x_1,\\ldots,x_{t-1})\n\\mathrm{Perplexity} = \\exp\\!\\left(\\mathcal{L}_{\\mathrm{causal}}\\right)", "notation": "The prefix contains only earlier tokens. N counts scored tokens, excluding ignored padding; exponentiation assumes natural logarithms.", "nuance": "At generation time, the model conditions on its own outputs, so errors can compound. Encoder–decoder models use bidirectional source attention and causal target attention, with cross-attention connecting them."}, {"group": "Tokenizers & Transformers", "q": "Derive attention and shapes.", "a": "For input X with shape (B, T, E), project Q and K to \\((B,T,d_k)\\), and V to \\((B,T,d_v)\\). Scores and attention weights have shape (B, T, T). Softmax runs across key positions; weighted values produce \\((B,T,d_v)\\).", "follow": "Why divide by \\(\\sqrt{d_k}\\)?", "subgroup": "Attention & block structure", "formula": "\\operatorname{Attention}(Q,K,V) = \\operatorname{softmax}\\!\\left(\\frac{QK^\\top}{\\sqrt{d_k}}+M\\right)V", "notation": "Transpose only the final two axes of K. M is an additive mask: 0 for allowed pairs, −∞ for masked pairs.", "nuance": "If query/key coordinates are independent with unit variance, their dot product has variance dₖ. Dividing by \\(\\sqrt{d_k}\\) keeps initial logits from growing with head width and saturating softmax.", "sources": [{"title": "Attention Is All You Need", "url": "https://arxiv.org/abs/1706.03762"}]}, {"group": "Tokenizers & Transformers", "q": "Causal versus padding masks?", "a": "Causal masks prevent attending to future tokens; padding masks exclude padding keys. Apply masks to logits before softmax, typically with negative infinity. Define behavior for fully masked rows to avoid NaNs.", "follow": "Why does multiplying logits by zero not mask them?", "subgroup": "Attention & block structure"}, {"group": "Tokenizers & Transformers", "q": "What makes a Transformer block?", "a": "Multi-head attention combines learned attention subspaces; a position-wise feed-forward network transforms features. Residual connections and normalization stabilize depth. Position information is required because unpositioned self-attention is permutation equivariant.", "follow": "Contrast encoder self-attention, decoder masked attention and cross-attention.", "subgroup": "Attention & block structure", "formula": "H = X + \\operatorname{Attention}(\\operatorname{LayerNorm}(X))\nY = H + \\operatorname{FFN}(\\operatorname{LayerNorm}(H))", "notation": "This is pre-norm, omitting dropout. The attention output projection returns to the residual width. FFN typically expands then contracts each token’s features.", "nuance": "Pre-norm keeps an identity residual path and often eases optimization at depth. Post-norm normalizes after the residual addition. Neither ordering replaces positional information.", "sources": [{"title": "Transformer reference", "url": "https://d2l.ai/chapter_attention-mechanisms-and-transformers/transformer.html"}]}, {"group": "Tokenizers & Transformers", "subgroup": "Attention & block structure", "q": "Self-attention versus cross-attention; encoder versus decoder?", "a": "Self-attention derives Q, K and V from the same sequence. Cross-attention takes Q from one sequence and K/V from another; query and key sequence lengths can differ. An encoder commonly uses bidirectional self-attention, while a generative decoder uses a causal mask.", "nuance": "“Decoder-only” models have causal self-attention but typically no encoder cross-attention. Multi-head attention uses multiple projected subspaces, concatenates head outputs, then projects back to model width."}, {"group": "Tokenizers & Transformers", "subgroup": "Attention & block structure", "q": "Absolute positions versus RoPE?", "a": "Absolute positional embeddings add a position-dependent vector to token representations. Rotary position embeddings rotate query/key coordinate pairs according to position so their dot products encode relative offsets. Attention without position information cannot generally distinguish reordered inputs.", "nuance": "RoPE does not by itself guarantee reliable extrapolation beyond training length. Changing position scaling, extending the context and validating long-distance retrieval are separate considerations.", "sources": [{"title": "RoFormer / RoPE", "url": "https://arxiv.org/abs/2104.09864"}]}, {"group": "Tokenizers & Transformers", "q": "What does KV caching save?", "a": "During autoregressive decoding, reuse old keys and values instead of recomputing them. Each new query still attends to the available context. Cache memory per token is 2×layers×KV_heads×head_dim×bytes, per sequence; query heads may differ under GQA.", "follow": "Why cache K and V but usually not old Q?", "subgroup": "Efficient attention & inference", "formula": "\\text{KV bytes} \\approx 2\\,B\\,T\\,L\\,H_{\\mathrm{KV}}\\,d_h\\,b_{\\mathrm{elem}}", "notation": "\\(B\\) = batch size, \\(T\\) = cached tokens, \\(L\\) = layers, \\(H_{\\mathrm{KV}}\\) = KV heads, \\(d_h\\) = head width, \\(b_{\\mathrm{elem}}\\) = bytes per stored element. Excludes weights, activations and allocator overhead.", "nuance": "Old Q is unnecessary because only the new token’s output is being computed. Cache reuse requires a matching prefix, model and position/mask convention; training usually processes full sequences without this decode cache."}, {"group": "Tokenizers & Transformers", "q": "Attention cost and FlashAttention?", "a": "Dense attention interactions scale quadratically with sequence length. FlashAttention uses tiled exact attention to reduce memory traffic and avoid materializing the full attention matrix; it does not make dense attention mathematically linear-time.", "follow": "How do prefill and one-token decode differ?", "subgroup": "Efficient attention & inference", "nuance": "Prefill processes the prompt in parallel; decode produces one token at a time and often becomes memory-bandwidth limited. Dense prefill attention is \\(O(T^2d)\\); each decode step attends over T cached tokens in \\(O(Td)\\) per head.", "sources": [{"title": "FlashAttention paper", "url": "https://arxiv.org/abs/2205.14135"}]}, {"group": "Tokenizers & Transformers", "subgroup": "Efficient attention & inference", "q": "MHA versus MQA versus GQA?", "a": "Multi-head attention gives each query head its own key/value head. Multi-query attention shares one KV head across all query heads. Grouped-query attention shares a KV head within each group of query heads, trading cache bandwidth and capacity between those extremes.", "nuance": "GQA reduces KV storage, not the number of query heads. It still attends to explicit previous token positions; it is not a recurrent compression of the whole sequence.", "sources": [{"title": "Grouped-query attention", "url": "https://arxiv.org/abs/2305.13245"}]}, {"group": "Tokenizers & Transformers", "subgroup": "Efficient attention & inference", "q": "Softmax, sparse and linear attention: what changes?", "a": "Dense softmax attention compares each query with every allowed key. Sparse or sliding-window attention restricts which token pairs interact. Recurrent linear attention summarizes earlier keys/values in a fixed-size state for fixed head dimensions, changing the representation of history.", "comparison": {"headers": ["Approach", "What is saved", "What stays / changes"], "rows": [["FlashAttention", "Memory traffic and materialized score storage.", "Computes dense softmax attention; quadratic pairwise work remains."], ["Sliding-window attention", "Only a bounded neighborhood is scored per layer.", "Distant access needs propagation, global tokens or other mechanisms."], ["Recurrent linear attention", "No growing token-by-token cache in those layers.", "Compresses history; it is not identical to softmax and may lose fine-grained recall."]]}, "nuance": "“Linear” is scaling in sequence length with width held fixed, not a linear function of the input. Parallel chunk algorithms can train recurrent-style layers efficiently; a mathematical recurrence need not imply a fully sequential training kernel.", "sources": [{"title": "FlashAttention", "url": "https://arxiv.org/abs/2205.14135"}, {"title": "Transformers are RNNs: linear attention", "url": "https://arxiv.org/abs/2006.16236"}]}, {"group": "Tokenizers & Transformers", "subgroup": "Efficient attention & inference", "q": "What is Kimi Delta Attention (KDA)?", "a": "KDA is a gated recurrent linear-attention mechanism. Its memory stores key–value associations; a delta-rule update writes a correction to the value currently predicted for a key. KDA adds feature-wise forgetting, finer-grained than a single scalar decay per head.", "formula": "\\text{Ungated delta-rule intuition:}\nS_t = S_{t-1} + \\beta_t\\left(v_t-S_{t-1}k_t\\right)k_t^\\top\no_t = S_tq_t", "notation": "Use column vectors and S of shape \\((d_v,d_k)\\). \\(\\beta_t\\) controls the write. This is the ungated intuition, not the full KDA equation.", "nuance": "Kimi Linear (2025) interleaves three KDA layers with one full-attention MLA layer. KDA layers keep fixed-size state, but the hybrid still has growing caches in its full-attention layers. Compressed memory trades exact historical access for efficiency; this is an architecture change, unlike FlashAttention’s exact-attention kernel optimization.", "sources": [{"title": "Kimi Linear technical report, §§2–4", "url": "https://arxiv.org/html/2510.26692v1"}]}, {"group": "Tokenizers & Transformers", "q": "Fine-tuning, LoRA or RAG?", "a": "Fine-tuning changes model behavior/weights; LoRA trains low-rank updates to selected weights. RAG supplies retrieved context at inference and supports updating knowledge separately. They can be combined; assess answer quality and retrieval quality separately.", "follow": "When is prompt engineering enough?", "subgroup": "Training objectives & adaptation", "nuance": "LoRA reduces trainable parameters and optimizer state, but the frozen base weights still need to be stored or quantized. RAG cannot fix a model that consistently ignores supplied evidence; fine-tuning cannot guarantee fresh facts.", "sources": [{"title": "LoRA paper", "url": "https://arxiv.org/abs/2106.09685"}]}, {"group": "Tokenizers & Transformers", "subgroup": "Training objectives & adaptation", "q": "Pretraining versus SFT versus preference optimization?", "a": "Pretraining learns broad patterns from a large corpus. Supervised fine-tuning (SFT) learns desired responses from demonstrations. Preference optimization uses comparisons or rewards to favor better responses; DPO learns directly from chosen/rejected pairs, while RL methods optimize rewards through policy updates.", "nuance": "Better preference scores do not guarantee factuality or task success. The preference data, rubric and reward model can be biased or exploitable; keep held-out task evaluations and inspect regressions.", "sources": [{"title": "Direct Preference Optimization", "url": "https://arxiv.org/abs/2305.18290"}]}, {"group": "Tokenizers & Transformers", "subgroup": "Training objectives & adaptation", "q": "Temperature versus top-k versus top-p sampling?", "a": "Temperature divides logits before softmax: lower values sharpen the distribution, higher values flatten it. Top-k retains a fixed number of high-probability tokens. Top-p retains a smallest high-probability set whose cumulative mass reaches a threshold, then renormalizes.", "formula": "p_i(T) = \\frac{\\exp(z_i/T)}{\\sum_j\\exp(z_j/T)},\\qquad T>0", "nuance": "Greedy decoding takes the maximum directly rather than dividing by zero. Sampling temperature is a decoding choice; contrastive-loss temperature shapes a training objective. Reducing randomness does not guarantee truth or globally optimal sequences."}], "diagrams": {"recommender": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1100 430\" role=\"img\" aria-labelledby=\"title desc\"><title id=\"title\">Recommender · serving + learning loop<\/title><desc id=\"desc\">Online request path above; offline ingestion and training below. Dashed arrows deploy artifacts into serving.<\/desc><defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6\" fill=\"none\" stroke=\"#52647b\"/><\/marker><\/defs><rect width=\"1100\" height=\"430\" rx=\"14\" fill=\"#f6f8fc\"/><g font-family=\"system-ui\" fill=\"#20334d\"><text x=\"24\" y=\"35\" font-size=\"21\" font-weight=\"700\">Recommender · serving + learning loop<\/text><text x=\"24\" y=\"70\" font-size=\"13\">ONLINE · request path<\/text><text x=\"24\" y=\"260\" font-size=\"13\">OFFLINE / STREAMING · data and artifacts<\/text><rect x=\"25\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"120\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">UI / load balancer<\/text><text x=\"120\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Recommendation API<\/text><text x=\"120\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Request cache<\/text><path d=\"M215,140 H237\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"240\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"335\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Candidate generation<\/text><text x=\"335\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">ANN + follows + fresh<\/text><text x=\"335\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Merge / deduplicate<\/text><path d=\"M430,140 H452\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"455\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"550\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Eligibility + features<\/text><text x=\"550\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">ACL / seen / available<\/text><text x=\"550\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Online feature store<\/text><path d=\"M645,140 H667\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"670\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"765\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Ranking<\/text><text x=\"765\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Light → heavy ranker<\/text><text x=\"765\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Score candidates<\/text><path d=\"M860,140 H882\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"885\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"980\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Policy + response<\/text><text x=\"980\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Diversity / freshness<\/text><text x=\"980\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Log impressions<\/text><rect x=\"25\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"120\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Events + item data<\/text><text x=\"120\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Kafka / stream + batch<\/text><text x=\"120\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Point-in-time joins<\/text><path d=\"M215,330 H237\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"240\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"335\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Embedding training<\/text><text x=\"335\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Catalog embeddings<\/text><text x=\"335\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Versioned ANN index<\/text><path d=\"M430,330 H4 RAG · permission-aware retrieval + grounded answers<\/title><desc id=\"desc\">Online request path above; offline ingestion and training below. Dashed arrows deploy artifacts into serving.<\/desc><defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6\" fill=\"none\" stroke=\"#52647b\"/><\/marker><\/defs><rect width=\"1100\" height=\"430\" rx=\"14\" fill=\"#f6f8fc\"/><g font-family=\"system-ui\" fill=\"#20334d\"><text x=\"24\" y=\"35\" font-size=\"21\" font-weight=\"700\">RAG · permission-aware retrieval + grounded answers<\/text><text x=\"24\" y=\"70\" font-size=\"13\">ONLINE · request path<\/text><text x=\"24\" y=\"260\" font-size=\"13\">OFFLINE / STREAMING · data and artifacts<\/text><rect x=\"25\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"120\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">User / API<\/text><text x=\"120\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Identity + query<\/text><text x=\"120\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Scoped cache<\/text><path d=\"M215,140 H237\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"240\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"335\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Hybrid retrieval<\/text><text x=\"335\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Lexical + vector index<\/text><text x=\"335\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">ACL / tenant filtering<\/text><path d=\"M430,140 H452\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"455\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"550\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Rerank + context<\/text><text x=\"550\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Dedup / token budget<\/text><text x=\"550\"
