ll=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"550\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Retrieval evaluation<\/text><text x=\"550\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Gold query / doc pairs<\/text><text x=\"550\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Recall + rerank quality<\/text><path d=\"M645,330 H667\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"670\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"765\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Prompt/model versions<\/text><text x=\"765\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Answer eval + safety<\/text><text x=\"765\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Canary / rollback<\/text><path d=\"M860,330 H882\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"885\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"980\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Monitoring<\/text><text x=\"980\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Grounding / access<\/text><text x=\"980\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Freshness + failures<\/text><path d=\"M335,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><path d=\"M550,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><path d=\"M765,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><text x=\"25\" y=\"410\" font-size=\"13\">Log impressions / responses + outcomes → event stream → offline evaluation and monitoring → retrain or rollback<\/text><\/g><\/svg>"}, "classics": [{"label": "Linear Regression", "path": "ml_coding/classics/linear_regression.py", "code": "import numpy as np\n\n# Your fit/predict structure, with a stable least-squares solve.\nclass LinearRegressor:\n    def __init__(self):\n        self.W = None\n\n    def fit(self, X, y):\n        # X: (n, d), y: (n,). Add intercept, then solve least squares.\n        n, d = X.shape\n        X = np.concatenate([np.ones((n, 1)), X], axis=1)\n        # n >= d+1 does NOT guarantee independent columns.\n        self.W = np.linalg.lstsq(X, y, rcond=None)[0]\n        return self\n\n    def predict(self, X):\n        # Add the same intercept column, then multiply by fitted weights.\n        # Output: (n,).\n        n, _ = X.shape\n        X = np.concatenate([np.ones((n, 1)), X], axis=1)\n        return X @ self.W\n"}, {"label": "Kmeans", "path": "ml_coding/classics/kmeans.py", "code": "import numpy as np\n\nclass Kmeans:\n    def __init__(self, k, seed=0):\n        self.k = k\n        self.seed = seed\n        self.centroids = None  # (k, d)\n\n    def calc_pairwise_distances(self, X, centroids):\n        # Calculate squared distance from every point to every center.\n        # X: (n, d); centroids: (k, d); returns: (n, k).\n        # (n, 1, d) - (1, k, d) -> (n, k, d) -> (n, k)\n        # Squared distance has the same argmin; no sqrt needed.\n        return ((X[:, None, :] - centroids[None, :, :]) ** 2).sum(axis=2)\n\n    def get_assignments(self, distances):\n        # Assign each point to its nearest center; returns (n,).\n        return np.argmin(distances, axis=1)\n\n    def get_updated_centroids(self, X, assignments):\n        # Make each center the mean of its assigned points; returns (k, d).\n        # Keep the previous center if no points were assigned to it.\n        centers = self.centroids.copy()\n        for i in range(self.k):\n            points = X[assignments == i]\n            if len(points):  # Keep previous center for an empty cluster.\n                centers[i] = points.mean(axis=0)\n        return centers\n\n    def fit(self, X, max_iter=100, tol=1e-6):\n        # X: (n, d). Convert to float so centroid means are not truncated.\n        X = np.asarray(X, dtype=float)\n        if not 1 <= self.k <= len(X) or max_iter < 1:\n            raise ValueError('Require 1 <= k <= n and max_iter >= 1')\n        # 1. Assign initial centroids by sampling k data points.\n        rng = np.random.default_rng(self.seed)\n        self.centroids = X[rng.choice(len(X), self.k, replace=False)].copy()\n        # 2. Alternate assignments and centroid updates until convergence.\n        for _ in range(max_iter):\n            # Calculate pairwise distances and assign nearest centers.\n            labels = self.predict(X)\n            # Make each centroid the average of the points assigned to it.\n            updated = self.get_updated_centroids(X, labels)\n            # Check whether centers stopped moving (or hit max_iter).\n            converged = np.max(np.abs(updated - self.centroids)) <= tol\n            self.centroids = updated\n            if converged:\n                break\n        # 3. Compute final loss: sum of squared distances to nearest centers.\n        self.inertia_ = np.min(self.calc_pairwise_distances(X, self.centroids), axis=1).sum()\n        return self\n\n    def predict(self, X):\n        # Calculate distances, then return nearest-center labels: (n,).\n        return self.get_assignments(self.calc_pairwise_distances(X, self.centroids))\n"}, {"label": "Naive Bayes", "path": "ml_coding/classics/naive_bayes.py", "code": "import math\nfrom collections import Counter, defaultdict\n\n# Categorical features, hashable labels; positive alpha, nonempty training data.\nclass NaiveBayes:\n    def __init__(self, nclass=None, alpha=1.0):\n        if alpha <= 0:\n            raise ValueError('alpha must be positive')\n        self.alpha = alpha\n\n    def fit(self, X, y):\n        # Count class priors and feature values conditioned on each class.\n        self.count_y = Counter(y)\n        self.count_x_y = defaultdict(lambda: defaultdict(Counter))\n        self.vocab = [set() for _ in X[0]]\n        for row, label in zip(X, y):\n            for i, value in enumerate(row):\n                self.vocab[i].add(value)\n                self.count_x_y[label][i][value] += 1\n        return self\n\n    def predict(self, X):\n        # For each row: log prior + sum of log conditional likelihoods.\n        # Choose the label with the largest score; no normalization needed.\n        labels = []\n        total = sum(self.count_y.values())\n        for row in X:\n            scores = {}\n            for label, count in self.count_y.items():\n                score = math.log(count / total)\n                for i, value in enumerate(row):\n                    # Reserve one unknown category per feature.\n                    denominator = count + self.alpha * (len(self.vocab[i]) + 1)\n                    numerator = self.count_x_y[label][i][value] + self.alpha\n                    score += math.log(numerator / denominator)\n                scores[label] = score\n            labels.append(max(scores, key=scores.get))\n        return labels\n"}, {"label": "Self Attention", "path": "ml_coding/classics/self_attention.py", "code": "import torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\n# Your single-head, unmasked baseline. Add causal masking as a follow-up.\nclass SelfAttention(nn.Module):\n    def __init__(self, embed_dim, key_dim, val_dim):\n        super().__init__()\n        self.key_dim = key_dim\n        self.Wk = nn.Linear(embed_dim, key_dim)\n        self.Wq = nn.Linear(embed_dim, key_dim)\n        self.Wv = nn.Linear(embed_dim, val_dim)\n\n    def forward(self, X):\n        # X: (batch, seq_len, embed_dim)\n        # 1. Project tokens to Q/K: (B, T, key_dim), V: (B, T, val_dim).\n        K = self.Wk(X)\n        Q = self.Wq(X)\n        V = self.Wv(X)\n        # 2. Compare every query to every key and scale: (B, T, T).\n        scores = torch.bmm(Q, K.transpose(1, 2)) / self.key_dim ** 0.5\n        # 3. Normalize over key positions for each query.\n        attention = F.softmax(scores, dim=2)\n        # 4. Weighted sum of values for every query.\n        return torch.bmm(attention, V)  # (batch, seq_len, val_dim)\n\n\nclass TransformerBlock(nn.Module):\n    # Minimal encoder-style block: one attention head, no masking or dropout.\n    def __init__(self, embed_dim, hidden_dim):\n        super().__init__()\n        self.attention = SelfAttention(embed_dim, embed_dim, embed_dim)\n        self.norm1 = nn.LayerNorm(embed_dim, eps=1e-5)\n        self.norm2 = nn.LayerNorm(embed_dim, eps=1e-5)\n        self.ffn = nn.Sequential(\n            nn.Linear(embed_dim, hidden_dim),\n            nn.ReLU(),\n            nn.Linear(hidden_dim, embed_dim),\n        )\n\n    def forward(self, X):\n        # Input / output: (batch, seq_len, embed_dim).\n        # 1. Normalize, mix information across tokens, then add the residual.\n        X = X + self.attention(self.norm1(X))\n        # 2. Normalize, transform each token independently, add the residual.\n        X = X + self.ffn(self.norm2(X))\n        return X\n"}, {"label": "Self Attention Numpy", "path": "ml_coding/classics/self_attention_numpy.py", "code": "import numpy as np\n\n\nclass SelfAttentionNumpy:\n    # Single head, no mask, no bias. Weights are supplied so tests are repeatable.\n    def __init__(self, Wq, Wk, Wv):\n        # Wq, Wk: (embed_dim, key_dim); Wv: (embed_dim, val_dim)\n        self.Wq, self.Wk, self.Wv = Wq, Wk, Wv\n\n    def forward(self, X):\n        # Input: (batch, seq_len, embed_dim)\n        # Outline: project Q/K/V -> scaled scores -> softmax -> weighted values.\n        # einsum labels: b=batch, t=query position, s=key position,\n        # e=embedding feature, k=key feature, v=value feature.\n\n        # 1. Project each token into query, key and value vectors.\n        Q = np.einsum('bte,ek->btk', X, self.Wq)  # (B, T, K)\n        K = np.einsum('bse,ek->bsk', X, self.Wk)  # (B, S, K); S=T\n        V = np.einsum('bse,ev->bsv', X, self.Wv)  # (B, S, V)\n\n        # 2. Dot each query with every key, summing over key features.\n        scores = np.einsum('btk,bsk->bts', Q, K) / np.sqrt(Q.shape[-1])\n        # scores: (B, T, S). A causal mask would go here, before softmax.\n\n        # 3. Stable softmax over keys for each query (last axis).\n        scores = scores - scores.max(axis=-1, keepdims=True)\n        weights = np.exp(scores)\n        weights = weights / weights.sum(axis=-1, keepdims=True)\n\n        # 4. Sum values weighted by attention, contracting key positions.\n        return np.einsum('bts,bsv->btv', weights, V)  # (B, T, V)\n\n\nclass TransformerBlockNumpy:\n    # Same pre-norm structure as PyTorch; no learned norm scale/bias or biases.\n    def __init__(self, Wq, Wk, Wv, W1, W2):\n        # Wq/Wk/Wv: (E, E); W1: (E, H); W2: (H, E).\n        # Attention must return E features so the residual shapes match.\n        self.attention = SelfAttentionNumpy(Wq, Wk, Wv)\n        self.W1, self.W2 = W1, W2\n\n    def layer_norm(self, X):\n        # Normalize features independently for each token: (B, T, E).\n        mean = X.mean(axis=-1, keepdims=True)\n        variance = X.var(axis=-1, keepdims=True)\n        return (X - mean) / np.sqrt(variance + 1e-5)\n\n    def forward(self, X):\n        # 1. Normalize -> self-attention -> residual: (B, T, E).\n        X = X + self.attention.forward(self.layer_norm(X))\n\n        # 2. Normalize -> expand -> ReLU -> project back -> residual.\n        normalized = self.layer_norm(X)\n        hidden = np.einsum('bte,eh->bth', normalized, self.W1)\n        hidden = np.maximum(hidden, 0)  # ReLU: (B, T, H)\n        output = np.einsum('bth,he->bte', hidden, self.W2)\n        return X + output  # (B, T, E)\n"}], "designReferences": "<nav class=\"design-index\" aria-label=\"Reference designs\"><a href=\"#recommender\" data-design-jump=\"recommender\">Recommender<\/a> · <a href=\"#rag-design\" data-design-jump=\"rag-design\">RAG<\/a> · <a href=\"#knowledge-agent\" data-design-jump=\"knowledge-agent\">Agentic knowledge work<\/a><\/nav>\n<section id=\"recommender\"><h2>Reference design: recommender system<\/h2>\n<p><strong>Scenario:<\/strong> a personalized home feed mixing followed topics, followed users and recommended content. Optimize useful engagement with freshness, diversity and negative-feedback guardrails. Start with popular/recent content before adding learned retrieval and ranking.<\/p>\n<div class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1100 430\" role=\"img\" aria-labelledby=\"title desc\"><title id=\"title\">Recommender · serving + learning loop<\/title><desc id=\"desc\">Online request path above; offline ingestion and training below. Dashed arrows deploy artifacts into serving.<\/desc><defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6\" fill=\"none\" stroke=\"#52647b\"/><\/marker><\/defs><rect width=\"1100\" height=\"430\" rx=\"14\" fill=\"#f6f8fc\"/><g font-family=\"system-ui\" fill=\"#20334d\"><text x=\"24\" y=\"35\" font-size=\"21\" font-weight=\"700\">Recommender · serving + learning loop<\/text><text x=\"24\" y=\"70\" font-size=\"13\">ONLINE · request path<\/text><text x=\"24\" y=\"260\" font-size=\"13\">OFFLINE / STREAMING · data and artifacts<\/text><rect x=\"25\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"120\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">UI / load balancer<\/text><text x=\"120\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Recommendation API<\/text><text x=\"120\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Request cache<\/text><path d=\"M215,140 H237\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"240\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"335\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Candidate generation<\/text><text x=\"335\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">ANN + follows + fresh<\/text><text x=\"335\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Merge / deduplicate<\/text><path d=\"M430,140 H452\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"455\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"550\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Eligibility + features<\/text><text x=\"550\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">ACL / seen / available<\/text><text x=\"550\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Online feature store<\/text><path d=\"M645,140 H667\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"670\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"765\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Ranking<\/text><text x=\"765\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Light → heavy ranker<\/text><text x=\"765\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Score candidates<\/text><path d=\"M860,140 H882\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"885\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"980\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Policy + response<\/text><text x=\"980\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Diversity / freshness<\/text><text x=\"980\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Log impressions<\/text><rect x=\"25\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"120\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Events + item data<\/text><text x=\"120\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Kafka / stream + batch<\/text><text x=\"120\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Point-in-time joins<\/text><path d=\"M215,330 H237\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"240\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"335\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Embedding training<\/text><text x=\"335\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Catalog embeddings<\/text><text x=\"335\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Versioned ANN index<\/text><path d=\"M430,330 H452\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"455\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"550\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Feature pipelines<\/text><text x=\"550\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Offline / online stores<\/text><text x=\"550\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Consistent transforms<\/text><path d=\"M645,330 H667\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"670\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"765\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Ranker training<\/text><text x=\"765\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Temporal validation<\/text><text x=\"765\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Registry → deploy<\/text><path d=\"M860,330 H882\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"885\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"980\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Evaluate + monitor<\/text><text x=\"980\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Quality / drift / latency<\/text><text x=\"980\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Experiment / rollback<\/text><path d=\"M335,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><path d=\"M550,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><path d=\"M765,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><text x=\"25\" y=\"410\" font-size=\"13\">Log impressions / responses + outcomes → event stream → offline evaluation and monitoring → retrain or rollback<\/text><\/g><\/svg><\/div>\n<h3>Retrieval and data<\/h3><ul>\n<li><strong>Candidate sources:<\/strong> combine two-tower ANN retrieval with follows, co-engagement and a fresh/cold-start pool. Allocate candidate budgets by marginal recall and latency. A strong ranker cannot recover an item never retrieved.<\/li>\n<li><strong>Embedding design:<\/strong> ID embeddings capture known preferences; text/image/metadata features help unseen items. Train query and item towers together, but precompute item embeddings. Deploy compatible query models and index versions together.<\/li>\n<li><strong>Negative sampling:<\/strong> in-batch negatives are cheap but popularity-skewed; random negatives are easy; hard negatives improve discrimination but may be unlabeled positives. Mix sources and inspect false negatives. Sampling-probability corrections such as log-Q require a justified sampling model, not a universal subtraction rule.<\/li>\n<li><strong>Training data:<\/strong> log impressions, positions, clicks, dwell and hides; unexposed items are not observed negative outcomes. Use point-in-time feature joins, temporal evaluation and checks for delayed labels. Nearline session features improve responsiveness but add consistency and freshness requirements.<\/li><\/ul>\n<h3>Ranking and policy<\/h3><ul>\n<li><strong>One ranker or a cascade:<\/strong> start with one affordable ranker. Add a light stage to prune candidates when expensive cross-features or sequence models exceed the latency budget. Measure quality lost at each cutoff.<\/li>\n<li><strong>Loss:<\/strong> pointwise BCE learns click probabilities under the training distribution; it does not guarantee calibrated serving probabilities. Pairwise/listwise losses emphasize relative ordering. If combining click, dwell and hide predictions into expected value, validate calibration and objective weights separately.<\/li>\n<li><strong>Exposure bias:<\/strong> position features can encode the previous policy. Use randomized exposure where feasible, or propensity weighting with overlap assumptions and variance controls. A position-aware model needs an explicit serving convention; setting position to zero is not a universal correction.<\/li>\n<li><strong>Diversity and freshness:<\/strong> apply eligibility before ranking; use category/creator caps, freshness boosts or MMR-style relevance–similarity tradeoffs afterward. Tune for utility loss versus variety. Maintain a fresh-item source because post-ranking boosts cannot rescue missing candidates.<\/li><\/ul>\n<h3>Serving, evaluation and failure paths<\/h3>\n<ul><li><strong>Feature-store placement:<\/strong> upstream stream/batch jobs compute features; the online store serves low-latency lookups and the offline store supports point-in-time training joins. Store definitions, timestamps and versions together. The feature store does not itself decide ranking.<\/li><li><strong>Large catalogs:<\/strong> keep only hot serving features in memory, use a durable distributed store for the rest, fetch only retrieved candidates and batch requests. Choose partition keys and replication from access patterns; putting every item in Redis is not a requirement.<\/li><li><strong>When to infer:<\/strong> precompute stable item features and embeddings; compute fast-changing user/session scores at request time. For predictable events, such as incoming messages, precompute suggestions on arrival when the freshness/compute tradeoff is favorable.<\/li><li><strong>Exploration:<\/strong> cold-start metadata and onboarding preferences help before interaction history exists. A controlled exploration budget can collect new-item feedback; log exposure probabilities if later evaluation needs propensity correction.<\/li><\/ul><ul>\n<li><strong>Online/offline split:<\/strong> stream events into an online feature store and offline training data; retain consistent feature definitions. Training publishes models and ANN artifacts through versioned storage/registry. The recommendation service orchestrates retrieval, filtering, feature lookup, ranking and policy.<\/li>\n<li><strong>Cache and fallback:<\/strong> scope request caches to user/context and versions; invalidate or shorten TTL for rapidly changing interests. If a ranker or store fails, serve an eligible popular/recent pool. A Bloom filter may accelerate seen-item checks but can drop valid items through false positives; it is not an authoritative ACL check.<\/li>\n<li><strong>Measure:<\/strong> retrieval Recall@K, ranking NDCG, probability log loss/calibration, then online useful engagement or retention with hide-rate and latency guardrails. Segment new users/items. Inspect exposure feedback loops, stale features and logging failures before retraining after a regression.<\/li><\/ul><\/section>\n<section id=\"rag-design\"><h2>Reference design: permission-aware RAG<\/h2>\n<p><strong>Scenario:<\/strong> answer questions over versioned enterprise documents, with verifiable sources and tenant/user access control. Start with a fixed retrieve → rerank → generate pipeline; add iteration only for queries that benefit from it.<\/p>\n<div class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1100 430\" role=\"img\" aria-labelledby=\"title desc\"><title id=\"title\">RAG · permission-aware retrieval + grounded answers<\/title><desc id=\"desc\">Online request path above; offline ingestion and training below. Dashed arrows deploy artifacts into serving.<\/desc><defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6\" fill=\"none\" stroke=\"#52647b\"/><\/marker><\/defs><rect width=\"1100\" height=\"430\" rx=\"14\" fill=\"#f6f8fc\"/><g font-family=\"system-ui\" fill=\"#20334d\"><text x=\"24\" y=\"35\" font-size=\"21\" font-weight=\"700\">RAG · permission-aware retrieval + grounded answers<\/text><text x=\"24\" y=\"70\" font-size=\"13\">ONLINE · request path<\/text><text x=\"24\" y=\"260\" font-size=\"13\">OFFLINE / STREAMING · data and artifacts<\/text><rect x=\"25\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"120\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">User / API<\/text><text x=\"120\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Identity + query<\/text><text x=\"120\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Scoped cache<\/text><path d=\"M215,140 H237\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"240\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"335\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Hybrid retrieval<\/text><text x=\"335\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Lexical + vector index<\/text><text x=\"335\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">ACL / tenant filtering<\/text><path d=\"M430,140 H452\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"455\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"550\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Rerank + context<\/text><text x=\"550\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Dedup / token budget<\/text><text x=\"550\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Source IDs retained<\/text><path d=\"M645,140 H667\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"670\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"765\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Generate + validate<\/text><text x=\"765\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">LLM + citations<\/text><text x=\"765\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Abstain / timeout<\/text><path d=\"M860,140 H882\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"885\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"980\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Answer + feedback<\/text><text x=\"980\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Citations / audit<\/text><text x=\"980\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Latency + cost<\/text><rect x=\"25\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"120\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Documents + ACLs<\/text><text x=\"120\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Parse / chunk / version<\/text><text x=\"120\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Deletes + updates<\/text><path d=\"M215,330 H237\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"240\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"335\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Embedding pipeline<\/text><text x=\"335\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Index text + vectors<\/text><text x=\"335\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Metadata / ACL sync<\/text><path d=\"M430,330 H452\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"455\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"550\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Retrieval evaluation<\/text><text x=\"550\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Gold query / doc pairs<\/text><text x=\"550\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Recall + rerank quality<\/text><path d=\"M645,330 H667\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"670\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"765\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Prompt/model versions<\/text><text x=\"765\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Answer eval + safety<\/text><text x=\"765\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Canary / rollback<\/text><path d=\"M860,330 H882\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"885\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"980\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Monitoring<\/text><text x=\"980\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Grounding / access<\/text><text x=\"980\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Freshness + failures<\/text><path d=\"M335,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><path d=\"M550,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><path d=\"M765,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><text x=\"25\" y=\"410\" font-size=\"13\">Log impressions / responses + outcomes → event stream → offline evaluation and monitoring → retrain or rollback<\/text><\/g><\/svg><\/div>\n<h3>Ingestion and chunking<\/h3><ul>\n<li><strong>Fixed versus structure-aware chunks:<\/strong> fixed token windows are simple; heading/paragraph-aware chunks preserve meaning. Small chunks improve retrieval precision but lose context; large chunks dilute matches and consume generation budget. Evaluate sizes on actual query types rather than choosing one universal length.<\/li>\n<li><strong>Overlap and parent context:<\/strong> modest overlap protects boundary facts but creates duplicates. Retrieve small child chunks, then expand to a bounded parent section when needed. Deduplicate overlapping evidence before generation.<\/li>\n<li><strong>Tables and metadata:<\/strong> preserve column headers, units, entity and reporting period with rows; avoid splitting a number from its meaning. Store document ID, span/page, version, timestamp and ACLs alongside each chunk. Citation IDs must resolve to the version used.<\/li>\n<li><strong>Updates and deletes:<\/strong> incremental content hashes reduce re-embedding. Version embeddings with the model and chunking policy. Track index lag; use authoritative revocation/deletion checks when stale indexes could expose removed content.<\/li><\/ul>\n<h3>Retrieval and reranking<\/h3><ul>\n<li><strong>Lexical versus dense:<\/strong> BM25 handles exact names, identifiers and unusual terms; dense retrieval helps semantic paraphrases. Hybrid retrieval broadens coverage. Fuse rankings with reciprocal rank fusion or validated score normalization; raw scores from different retrievers are not inherently comparable.<\/li>\n<li><strong>Permission boundary:<\/strong> filter by tenant and ACL in retrieval where supported, and recheck authoritative eligibility before model context. Restrictive post-filtering can underfill top-k; fetch additional eligible candidates without allowing denied content into prompts or caches.<\/li>\n<li><strong>Reranker choice:<\/strong> a cross-encoder scores query–passage pairs jointly and often improves precision at extra cost. An LLM reranker can use richer instructions but adds latency, expense and variability. Rerank a bounded candidate set; compare quality gain against a no-reranker baseline.<\/li>\n<li><strong>Context packing:<\/strong> choose evidence under a token budget, remove redundant chunks, preserve source labels and leave output headroom. Select diverse evidence for multi-document questions; more retrieved text is not automatically better.<\/li><\/ul>\n<h3>One-shot versus agentic retrieval<\/h3><ul>\n<li><strong>Fixed pipeline:<\/strong> best starting point for direct questions with a known corpus; predictable latency, cost and evaluation. A deterministic query rewrite or decomposition step may be enough without an open-ended agent.<\/li>\n<li><strong>Bounded iteration:<\/strong> use when the next search depends on discovered entities or missing evidence. Let the system inspect results, refine queries and retrieve again, with explicit limits on calls, elapsed time and tokens. Stop when evidence is sufficient or abstain when the budget is exhausted.<\/li>\n<li><strong>Routing:<\/strong> compare fixed and iterative paths on the same query set. Adopt agentic retrieval only where its incremental answer quality justifies extra latency and failure opportunities. Tool-using workflows that act on external systems belong in the next reference design.<\/li><\/ul>\n<h3>Automatic evaluation scorecard<\/h3><ul><li><strong>Retrieval:<\/strong> evidence Recall@K and ranked relevance; evaluate the final context packet as well as raw retrieval.<\/li><li><strong>Groundedness:<\/strong> decompose answers into factual claims and check support in context. A supported claim can still be wrong if its source is outdated.<\/li><li><strong>Correctness and completeness:<\/strong> compare against verified reference facts and the question’s required parts; use deterministic arithmetic/date checks when possible.<\/li><li><strong>Citations:<\/strong> check source IDs and claim-to-cited-span support, plus coverage of claims needing citations.<\/li><li><strong>Abstention:<\/strong> measure unsupported answers on insufficient-evidence cases separately from unnecessary refusals on answerable cases.<\/li><li><strong>Trust the evaluator only after validation:<\/strong> calibrate narrow semantic judge rubrics against human labels; require evidence spans. Keep access failures as hard gates and cost/latency alongside quality. Run with gold context to distinguish retrieval failures from generation failures.<\/li><\/ul>\n<h3>Grounding and operations<\/h3><ul>\n<li><strong>Answer contract:<\/strong> cite supporting passages, distinguish conflicting versions and abstain on insufficient evidence. Citation membership is necessary but does not prove a claim follows from the source; use evidence/entailment checks and human evaluation.<\/li>\n<li><strong>Security and fallback:<\/strong> treat retrieved instructions as untrusted data. Keep access checks outside the model; send fallback models only data permitted for that destination. Key caches by access scope, corpus and prompt/model versions.<\/li>\n<li><strong>Evaluation:<\/strong> separate retrieval recall, reranker quality and answer correctness/grounding. Include multi-hop, stale-document, no-answer and permission-denied cases. Monitor index freshness, p95 latency, token cost and access violations; canary changes to chunking, embeddings and prompts independently.<\/li><\/ul><\/section>\n<section id=\"knowledge-agent\"><h2>Reference design: agentic knowledge work<\/h2>\n<p><strong>Scenario:<\/strong> research across documents, sheets and email, reconcile evidence, produce a report and optionally stage updates. Success is a correct deliverable or authorized final state, not a plausible conversation.<\/p>\n<div class=\"flow-strip\" aria-label=\"Agent workflow\">Request + identity → scope and route → bounded plan / tool loop → verify → preview writes → commit + audit<\/div>\n<h3>Workflow and autonomy<\/h3><ul>\n<li><strong>Fixed workflow first:<\/strong> use a prescribed sequence for repeatable tasks such as filling a report template. Use an agent loop when tool choice genuinely depends on intermediate results. Route simple questions to the RAG path.<\/li>\n<li><strong>State:<\/strong> persist task ID, plan, evidence references, tool results, pending actions and budget counters. Checkpoint around durable operations so a restart resumes safely. A model-generated plan is a proposal, not authorization.<\/li>\n<li><strong>Parallelism:<\/strong> batch independent reads to reduce serial latency; keep dependent calls ordered. Bound concurrency and handle partial failures. Add subagents only for separable subtasks whose outputs can be verified; coordination can cost more than it saves.<\/li>\n<li><strong>Termination:<\/strong> enforce step/time/token limits, detect repeated failed calls and return a partial result with missing evidence rather than loop indefinitely. Define when the user must resolve ambiguity.<\/li><\/ul>\n<h3>Context, tools and memory<\/h3><ul>\n<li><strong>Progressive disclosure:<\/strong> fetch titles, schemas and summaries before full content. Pass large tables through authorized typed handles and request relevant rows/aggregates. Handles must enforce scope and lifetime; they are not permission bypasses.<\/li>\n<li><strong>Compaction:<\/strong> retain goals, constraints, evidence IDs, decisions and outstanding work. Summaries can lose details, so keep retrievable originals. Stable system/tool prefixes may improve prefix-cache reuse; do not freeze stale task facts merely for caching.<\/li>\n<li><strong>Memory tiers:<\/strong> current task state is distinct from project history and durable user facts. Store provenance, timestamps and deletion controls; retrieve only relevant authorized memory and resolve contradictions before using it.<\/li>\n<li><strong>Tools:<\/strong> expose narrow typed operations, validate arguments server-side and return actionable errors. Retry transient read failures within a budget. For writes, use idempotency keys and reconcile unknown outcomes before retrying.<\/li><\/ul>\n<h3>Action safety and evaluation<\/h3><ul>\n<li><strong>Read versus write:<\/strong> scope connectors to the user, enforce ACLs for every call and isolate untrusted document/email content from authorization decisions. Stage consequential actions as a concrete preview; approval must bind to the exact action before execution.<\/li>\n<li><strong>Verification:<\/strong> check output schemas, spreadsheet formulas, citations and destination identities deterministically where possible. Verify the final state after writes and keep an audit trail. Prompt-injection filters alone do not create a security boundary.<\/li>\n<li><strong>Test worlds:<\/strong> seed consistent docs/sheets/emails with distractors, missing permissions and conflicting facts. Grade expected deliverables/state changes plus forbidden side effects, not a single prescribed tool sequence. Hold out world templates and compare with real task samples to detect synthetic overfitting.<\/li>\n<li><strong>Reliability:<\/strong> track single-run success, repeated-run consistency, cost, latency and unwanted actions. At-least-one success across several attempts is not the reliability of one user run. Calibrate subjective rubric judges against human labels and report disagreement.<\/li>\n<li><strong>Improve from failures:<\/strong> cluster traces into retrieval misses, incorrect arguments, context loss, premature completion and verification failures. Fix the dominant cause, compare on paired tasks and report uncertainty; do not promise a fixed lift. Route simple steps to smaller models only after quality checks, then canary and retain rollback versions.<\/li><\/ul>\n<h3 id=\"model-upgrades\">Upgrading the model powering the agent<\/h3>\n<p><strong>Goal:<\/strong> determine whether a new model improves task quality or lowers cost without introducing regressions.<\/p>\n<ol class=\"framework-list\">\n<li><strong>Build the evaluation set.<\/strong> Sample representative tasks with restorable initial state, plus a separate suite of known failures. Review thumbs-up, thumbs-down and unrated cases to discover failure modes; feedback is a signal, not ground truth.<\/li>\n<li><strong>Define and validate the rubric.<\/strong> Combine task requirements with the failure taxonomy: completion, correctness/grounding, completeness, permitted actions and appropriate refusal. Use deterministic outcome checks where possible and LLM judges for semantic criteria. Validate graders against held-out human labels.<\/li>\n<li><strong>Rerun asynchronously.<\/strong> A model-release event queues incumbent/candidate runs on the same tasks in isolated environments, followed by grading jobs. Freeze harness, data and grader versions. Let each model choose its own actions: replaying the old transcript cannot measure a changed trajectory. Sandbox writes, bound retries and distinguish infrastructure errors from agent failures.<\/li>\n<li><strong>Compare quality and cost.<\/strong> Measure absolute rubric scores and blinded pairwise win/tie/loss, with repeated trials, uncertainty and important task slices. Count whole-task tokens, tools and retries; report cost per task and spend per successful task. Keep authorization failures as hard gates.<\/li>\n<li><strong>Validate online before ramping.<\/strong> Offline gates earn a small canary, then a controlled A/B test with stable assignment and rollback. Track task completion, thumbs feedback <em>and rating participation<\/em>, edits/retries, latency and cost. Test the actual serving policy: best-of-N is only relevant if production also generates and selects among N attempts.<\/li>\n<\/ol>\n<p class=\"muted\">Further reading: <a href=\"https://www.anthropic.com/research/demystifying-evals-for-ai-agents\">agent outcomes and graders<\/a> · <a href=\"https://people.eecs.berkeley.edu/~bjoern/papers/shankar-validators-uist2024.pdf\">rubric alignment with human judgments<\/a> · <a href=\"https://arxiv.org/abs/2306.05685\">judge biases<\/a>.<\/p>\n<\/section>\n", "lcGroups": [{"category": "Arrays, Hashing & Prefix Sums", "problems": [{"n": 1, "title": "Two Sum", "slug": "two-sum", "diff": "E", "tier": "core"}, {"n": 49, "title": "Group Anagrams", "slug": "group-anagrams", "diff": "M", "tier": "core"}, {"n": 238, "title": "Product of Array Except Self", "slug": "product-of-array-except-self", "diff": "M", "tier": "core"}, {"n": 128, "title": "Longest Consecutive Sequence", "slug": "longest-consecutive-sequence", "diff": "M", "tier": "core"}, {"n": 347, "title": "Top K Frequent Elements", "slug": "top-k-frequent-elements", "diff": "M", "tier": "core"}, {"n": 560, "title": "Subarray Sum Equals K", "slug": "subarray-sum-equals-k", "diff": "M", "tier": "core"}, {"n": 36, "title": "Valid Sudoku", "slug": "valid-sudoku", "diff": "M", "tier": "core"}]}, {"category": "Two Pointers & Sliding Window", "problems": [{"n": 125, "title": "Valid Palindrome", "slug": "valid-palindrome", "diff": "E", "tier": "core"}, {"n": 15, "title": "3Sum", "slug": "3sum", "diff": "M", "tier": "core"}, {"n": 11, "title": "Container With Most Water", "slug": "container-with-most-water", "diff": "M", "tier": "core"}, {"n": 3, "title": "Longest Substring Without Repeating Characters", "slug": "longest-substring-without-repeating-characters", "diff": "M", "tier": "core"}, {"n": 424, "title": "Longest Repeating Character Replacement", "slug": "longest-repeating-character-replacement", "diff": "M", "tier": "core"}, {"n": 567, "title": "Permutation in String", "slug": "permutation-in-string", "diff": "M", "tier": "core"}, {"n": 76, "title": "Minimum Window Substring", "slug": "minimum-window-substring", "diff": "H", "tier": "core"}]}, {"category": "Binary Search", "problems": [{"n": 704, "title": "Binary Search", "slug": "binary-search", "diff": "E", "tier": "core"}, {"n": 33, "title": "Search in Rotated Sorted Array", "slug": "search-in-rotated-sorted-array", "diff": "M", "tier": "core"}, {"n": 153, "title": "Find Minimum in Rotated Sorted Array", "slug": "find-minimum-in-rotated-sorted-array", "diff": "M", "tier": "core"}, {"n": 875, "title": "Koko Eating Bananas", "slug": "koko-eating-bananas", "diff": "M", "tier": "core"}, {"n": 34, "title": "Find First and Last Position of Element", "slug": "find-first-and-last-position-of-element-in-sorted-array", "diff": "M", "tier": "core"}]}, {"category": "Stacks & Intervals", "problems": [{"n": 20, "title": "Valid Parentheses", "slug": "valid-parentheses", "diff": "E", "tier": "core"}, {"n": 155, "title": "Min Stack", "slug": "min-stack", "diff": "M", "tier": "core"}, {"n": 739, "title": "Daily Temperatures", "slug": "daily-temperatures", "diff": "M", "tier": "core"}, {"n": 56, "title": "Merge Intervals", "slug": "merge-intervals", "diff": "M", "tier": "core"}, {"n": 57, "title": "Insert Interval", "slug": "insert-interval", "diff": "M", "tier": "core"}, {"n": 435, "title": "Non-overlapping Intervals", "slug": "non-overlapping-intervals", "diff": "M", "tier": "core"}]}, {"category": "Linked Lists & LRU", "problems": [{"n": 206, "title": "Reverse Linked List", "slug": "reverse-linked-list", "diff": "E", "tier": "core"}, {"n": 21, "title": "Merge Two Sorted Lists", "slug": "merge-two-sorted-lists", "diff": "E", "tier": "core"}, {"n": 141, "title": "Linked List Cycle", "slug": "linked-list-cycle", "diff": "E", "tier": "core"}, {"n": 143, "title": "Reorder List", "slug": "reorder-list", "diff": "M", "tier": "core"}, {"n": 146, "title": "LRU Cache", "slug": "lru-cache", "diff": "M", "tier": "core"}]}, {"category": "Trees", "problems": [{"n": 104, "title": "Maximum Depth of Binary Tree", "slug": "maximum-depth-of-binary-tree", "diff": "E", "tier": "core"}, {"n": 102, "title": "Binary Tree Level Order Traversal", "slug": "binary-tree-level-order-traversal", "diff": "M", "tier": "core"}, {"n": 98, "title": "Validate Binary Search Tree", "slug": "validate-binary-search-tree", "diff": "M", "tier": "core"}, {"n": 236, "title": "Lowest Common Ancestor of a Binary Tree", "slug": "lowest-common-ancestor-of-a-binary-tree", "diff": "M", "tier": "core"}, {"n": 543, "title": "Diameter of Binary Tree", "slug": "diameter-of-binary-tree", "diff": "E", "tier": "core"}, {"n": 230, "title": "Kth Smallest Element in a BST", "slug": "kth-smallest-element-in-a-bst", "diff": "M", "tier": "core"}, {"n": 105, "title": "Construct Binary Tree from Preorder and Inorder", "slug": "construct-binary-tree-from-preorder-and-inorder-traversal", "diff": "M", "tier": "core"}]}, {"category": "Graphs, BFS & DFS", "problems": [{"n": 200, "title": "Number of Islands", "slug": "number-of-islands", "diff": "M", "tier": "core"}, {"n": 133, "title": "Clone Graph", "slug": "clone-graph", "di
