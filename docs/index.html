essay\" id=\"rag-design\">\n  <header class=\"essay-header\">\n    <span class=\"essay-kicker\">Reference Design 02 · Grounded Search, Reranking &amp; Agentic Navigation<\/span>\n    <h2>Designing Permission-Aware Enterprise RAG<\/h2>\n    <p class=\"essay-lede\">Answering questions over internal filings, Slack threads, and spreadsheets looks effortless in a prototype—until a 300-token chunk loses which company or quarter a revenue figure came from, a revoked memo leaks via cache, or you have to decide whether an agent should iteratively browse surrounding pages. Great enterprise RAG is an information-retrieval and security architecture first, and an LLM prompt last.<\/p>\n  <\/header>\n\n  <div class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1100 430\" role=\"img\" aria-labelledby=\"title desc\"><title id=\"title\">RAG · permission-aware retrieval + grounded answers<\/title><desc id=\"desc\">Online request path above; offline ingestion and training below. Dashed arrows deploy artifacts into serving.<\/desc><defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6\" fill=\"none\" stroke=\"#52647b\"/><\/marker><\/defs><rect width=\"1100\" height=\"430\" rx=\"14\" fill=\"#f6f8fc\"/><g font-family=\"system-ui\" fill=\"#20334d\"><text x=\"24\" y=\"35\" font-size=\"21\" font-weight=\"700\">RAG · permission-aware retrieval + grounded answers<\/text><text x=\"24\" y=\"70\" font-size=\"13\">ONLINE · request path<\/text><text x=\"24\" y=\"260\" font-size=\"13\">OFFLINE / STREAMING · data and artifacts<\/text><rect x=\"25\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"120\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">User / API<\/text><text x=\"120\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Identity + query<\/text><text x=\"120\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Scoped cache<\/text><path d=\"M215,140 H237\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"240\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"335\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Hybrid retrieval<\/text><text x=\"335\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Lexical + vector index<\/text><text x=\"335\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">ACL / tenant filtering<\/text><path d=\"M430,140 H452\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"455\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"550\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Rerank + context<\/text><text x=\"550\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Dedup / token budget<\/text><text x=\"550\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Source IDs retained<\/text><path d=\"M645,140 H667\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"670\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"765\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Generate + validate<\/text><text x=\"765\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">LLM + citations<\/text><text x=\"765\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Abstain / timeout<\/text><path d=\"M860,140 H882\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"885\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"980\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Answer + feedback<\/text><text x=\"980\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Citations / audit<\/text><text x=\"980\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Latency + cost<\/text><rect x=\"25\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"120\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Documents + ACLs<\/text><text x=\"120\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Parse / chunk / version<\/text><text x=\"120\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Deletes + updates<\/text><path d=\"M215,330 H237\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"240\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"335\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Embedding pipeline<\/text><text x=\"335\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Index text + vectors<\/text><text x=\"335\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Metadata / ACL sync<\/text><path d=\"M430,330 H452\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"455\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"550\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Retrieval evaluation<\/text><text x=\"550\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Gold query / doc pairs<\/text><text x=\"550\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Recall + rerank quality<\/text><path d=\"M645,330 H667\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"670\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"765\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Prompt/model versions<\/text><text x=\"765\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Answer eval + safety<\/text><text x=\"765\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Canary / rollback<\/text><path d=\"M860,330 H882\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"885\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"980\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Monitoring<\/text><text x=\"980\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Grounding / access<\/text><text x=\"980\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Freshness + failures<\/text><path d=\"M335,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><path d=\"M550,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><path d=\"M765,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><text x=\"25\" y=\"410\" font-size=\"13\">Log impressions / responses + outcomes → event stream → offline evaluation and monitoring → retrain or rollback<\/text><\/g><\/svg><\/div>\n\n  <h3>1. Three ways to solve “lost chunk context” &amp; dual-path ingestion<\/h3>\n  <p>Slice a 100-page SEC filing into blind 400-token chunks and chunk #47 reads: <em>“Operating revenue grew 3% over the prior period.”<\/em> The company name and quarter sat 10 pages earlier, so neither BM25 nor dense search matches it to <em>“What was Acme’s Q3 2025 growth?”<\/em> Staff designs weigh three distinct remedies—plus how to handle tables and live edits:<\/p>\n\n  <div class=\"clean-table-wrap\"><table><thead><tr><th>Context-preservation pattern<\/th><th>How it works<\/th><th>Ingest cost vs. query latency trade-off<\/th><\/tr><\/thead><tbody>\n  <tr><td><strong>Contextual Retrieval<\/strong><br>(<a href=\"https://www.anthropic.com/research/contextual-retrieval\" target=\"_blank\" rel=\"noopener\">Anthropic pattern<\/a>)<\/td><td>An LLM prepends a 50-token header (<em>“Acme Q3 2025 10-Q, MD&amp;A…”<\/em>) to each chunk’s text before both BM25 and vector indexing.<\/td><td>Higher one-time ingest LLM cost (slashed ~80% via prompt caching over the full doc); <strong>zero runtime latency hit<\/strong> and boosts BM25 too!<\/td><\/tr>\n  <tr><td><strong><button type=\"button\" class=\"concept-term\" data-tip=\"late-chunking\">Late Chunking<\/button><\/strong><br>(<a href=\"https://jina.ai/news/what-late-chunking-really-is-and-what-its-not-part-ii/\" target=\"_blank\" rel=\"noopener\">Jina pattern<\/a>)<\/td><td>Run the entire 8k-token doc through a long-context bi-encoder <em>first<\/em> so token states attend globally, then mean-pool chunk spans afterward.<\/td><td>Cheap, fast ingest with zero LLM summary hallucinations; requires a long-context encoder and does <em>not<\/em> enrich lexical BM25.<\/td><\/tr>\n  <tr><td><strong>Static Parent Swap vs. Agentic Neighbor Tools<\/strong><\/td><td><em>Static:<\/em> index small 150-tok child spans, always swap in their 600-tok parent section.<br><em>Agentic:<\/em> expose <code>read_neighbor_chunks(doc_id, idx ± 2)<\/code> &amp; <code>open_section()<\/code> tools.<\/td><td>Static parent swap adds <strong>0 ms<\/strong> extra turns (best default!). Agentic navigation shines on sprawling contracts/filings (<em>“See Note 14 on p. 82”<\/em>) at the cost of +1–3s extra LLM round-trips.<\/td><\/tr>\n  <\/tbody><\/table><\/div>\n\n  <p>Never shred financial or product tables mid-row: serialize column headers, units, entity, and period onto every row chunk, and route arithmetic/aggregations to a read-only SQL/dataframe tool rather than asking an LLM to add 40 chunks in its head. For freshness at scale, follow <a href=\"https://www.notion.com/blog/two-years-of-vector-search-at-notion\" target=\"_blank\" rel=\"noopener\">Notion’s dual-path vector architecture<\/a>: Spark batch jobs handle bulk backfills and encoder version upgrades, while a sub-minute Kafka stream re-embeds edited blocks by content hash and writes immediate <button type=\"button\" class=\"concept-term\" data-tip=\"tombstones-acl\">tombstones &amp; ACL updates<\/button>.<\/p>\n\n  <h3>2. Embedding training, RRF vs. cross-encoders &amp; permission gates<\/h3>\n  <p>If off-the-shelf embeddings miss domain jargon, how do you fine-tune retrieval encoders? Unlike symmetric sentence similarity, QA retrieval is <strong>asymmetric<\/strong> (a 9-word question matching a 300-word passage), so prepend role prefixes (<code>\"query: \"<\/code> vs. <code>\"passage: \"<\/code>) and train with <strong>L2-normalized cosine InfoNCE<\/strong> (so verbose chunks can’t win via huge norms) over in-batch negatives + mined BM25 hard negatives. Better yet, distill soft margin scores (<code>KL divergence<\/code>) from an offline cross-encoder teacher so unlabeled “hard negatives” that actually answer the query aren’t falsely pushed away!<\/p>\n\n  <p>At query time, pair <button type=\"button\" class=\"concept-term\" data-tip=\"bm25-vs-dense\">BM25 with dense search<\/button> (<a href=\"https://tech.instacart.com/optimizing-search-relevance-at-instacart-using-hybrid-retrieval-88cb579b959c\" target=\"_blank\" rel=\"noopener\">Instacart’s hybrid retrieval<\/a>), enforcing tenant/ACL filters inside the index query <em>and<\/em> re-verifying authoritative permissions before prompt assembly (<a href=\"https://dropbox.tech/machine-learning/building-dash-rag-multi-step-ai-agents-business-users\" target=\"_blank\" rel=\"noopener\">Dropbox Dash<\/a>). Then interviewers love asking: <strong>when do you use heuristic rank fusion vs. a neural cross-encoder?<\/strong> Use both at different funnel depths—never confuse their jobs:<\/p>\n  <ul>\n    <li><strong><button type=\"button\" class=\"concept-term\" data-tip=\"rrf-fusion\">Reciprocal Rank Fusion (RRF)<\/button> is a 0.1 ms CPU list-merger:<\/strong> It combines 200 BM25 hits and 200 vector hits down to ~60 candidates with zero score-calibration fragility. <em>Limitation:<\/em> RRF never reads a single word of text—if a keyword-stuffed 2023 doc ranks #3 in both lists for a 2025 query, RRF happily promotes it to #1! Use RRF <em>alone<\/em> only on ultra-cheap, GPU-free <50 ms typeahead/search endpoints.<\/li>\n    <li><strong>A <button type=\"button\" class=\"concept-term\" data-tip=\"cross-encoder\">cross-encoder reranker<\/button> (100–400M params) is your 30 ms GPU precision filter:<\/strong> Running joint token-to-token attention across those 60 RRF survivors catches negations (<em>“excludes New York”<\/em>), exact dates, and entity bindings before you pack the top 6–10 deduplicated chunks into the LLM prompt. (Reserve heavy 500 ms LLM listwise rerankers for offline teacher labeling, not live serving.)<\/li>\n  <\/ul>\n\n  <h3>3. Should we allow re-querying? Routing, loops &amp; safe caching<\/h3>\n  <p>Separate <strong>two very different kinds of “re-querying”<\/strong> when discussing latency and quality (<a href=\"https://blog.reachsumit.com/series/selective-retrieval/\" target=\"_blank\" rel=\"noopener\">Sumit’s Adaptive RAG<\/a>):<\/p>\n  <ul>\n    <li><strong>Pre-retrieval query rewriting / decomposition (~150 ms, almost always worth it):<\/strong> In multi-turn chat, raw user input like <em>“how did that compare to Q2?”<\/em> fails retrieval completely. A tiny fast model rewrites coreferences into standalone queries, extracts structured metadata filters (<code>ticker=\"ACME\", year=2025<\/code>), or splits a comparison into 2 parallel searches in one shot.<\/li>\n    <li><strong>Closed-loop agentic re-querying (+1.5–5s, gate strictly!):<\/strong> Letting the model read retrieved chunks, judge them insufficient, and fire new searches rescues hard multi-hop investigations—but doubles/triples TTFT and risks rabbit-hole drift. Gate iterative loops behind a router or trigger a second hop <em>only<\/em> when the cross-encoder’s max relevance score falls below a calibrated confidence threshold, hard-capping at 2–3 hops before clean abstention.<\/li>\n  <\/ul>\n\n  <p>Finally, avoid security footguns in caching and fallbacks: static system-prompt <button type=\"button\" class=\"concept-term\" data-tip=\"prefix-vs-semantic-cache\">prefix KV caching vs. semantic caching<\/button> is night and day—prefix KV caches are lossless and safe, whereas fuzzy semantic answer caches risk cross-user ACL leaks and serving Q2 numbers for Q3 queries. On internal-cluster timeouts, strip non-external-safe docs before calling an external fallback API and verify every citation ID against the exact subset sent.<\/p>\n\n  <div class=\"essay-qa\">\n    <h3>How interviewers poke at this design<\/h3>\n    <p><strong>“Answers are wrong 20% of the time—is retrieval or generation broken?”<\/strong> Run a <em>gold-context<\/em> test (<a href=\"https://applied-llms.org/\" target=\"_blank\" rel=\"noopener\">Applied LLMs<\/a>) feeding human-verified passages directly to the generator: if accuracy jumps to 95%+, fix chunking/hybrid recall/reranking; if it stays low, fix prompt framing, lost-in-the-middle packing, or table-to-SQL routing.<\/p>\n    <p><strong>“Why not just dump the whole 500k-token folder into a long-context LLM and skip RAG?”<\/strong> Do the math aloud: 500k prefill tokens at 10 QPS burns ~$5–$15/sec in GPU compute, pushes TTFT to 10–20 seconds, still degrades on multi-needle reasoning (“context rot”), and doesn’t scale to 50M enterprise docs!<\/p>\n  <\/div>\n\n  <aside class=\"design-reading\"><h3>Recommended engineering reading<\/h3><p><a href=\"https://www.anthropic.com/research/contextual-retrieval\" target=\"_blank\" rel=\"noopener\">Anthropic: Contextual Retrieval<\/a> · <a href=\"https://jina.ai/news/what-late-chunking-really-is-and-what-its-not-part-ii/\" target=\"_blank\" rel=\"noopener\">Jina: Late Chunking<\/a> · <a href=\"https://www.notion.com/blog/two-years-of-vector-search-at-notion\" target=\"_blank\" rel=\"noopener\">Notion: Vector Search<\/a> · <a href=\"https://dropbox.tech/machine-learning/building-dash-rag-multi-step-ai-agents-business-users\" target=\"_blank\" rel=\"noopener\">Dropbox: Dash<\/a> · <a href=\"https://applied-llms.org/\" target=\"_blank\" rel=\"noopener\">Applied LLMs<\/a><\/p><\/aside>\n<\/article>\n\n<article class=\"design-essay\" id=\"knowledge-agent\">\n  <header class=\"essay-header\">\n    <span class=\"essay-kicker\">Reference Design 03 · Tool Orchestration, CodeAct &amp; Evals<\/span>\n    <h2>Designing an Agent for Enterprise Knowledge Work<\/h2>\n    <p class=\"essay-lede\">When an AI coworker pulls Q3 variances across Snowflake, Google Sheets, and email—and stages updates back into a tracker—success is a verified final state with zero unauthorized mutations. Staff architectures stay deterministic everywhere possible, isolate writes behind single-threaded state logs, and prevent tool outputs from rotting the context window.<\/p>\n  <\/header>\n\n  <h3>1. Execution topology (Service RPC vs. Sandbox VM) &amp; interface (MCP vs. CLI)<\/h3>\n  <p>Start with the golden rule from <a href=\"https://www.anthropic.com/research/building-effective-agents\" target=\"_blank\" rel=\"noopener\">Anthropic’s Building Effective Agents<\/a> and <a href=\"https://cdn.openai.com/business-guides-and-resources/a-practical-guide-to-building-agents.pdf\" target=\"_blank\" rel=\"noopener\">OpenAI’s Agent Guide<\/a>: use a deterministic code DAG whenever steps are fixed, and switch to an agent loop (<a href=\"https://lilianweng.github.io/posts/2023-06-23-agent/\" target=\"_blank\" rel=\"noopener\">Lilian Weng<\/a>) only when step 2 genuinely depends on what step 1 uncovered. Once you need an agent, Staff interviewers increasingly probe two orthogonal architecture choices that people often conflate—<strong>where the agent executes<\/strong> versus <strong>how tools are exposed<\/strong>:<\/p>\n\n  <div class=\"clean-table-wrap\"><table><thead><tr><th>Architectural pattern<\/th><th>How it executes &amp; calls tools<\/th><th>When it wins vs. where it hurts<\/th><\/tr><\/thead><tbody>\n  <tr><td><strong>Stateless Service Agent<\/strong><br>(JSON Function Calls / MCP over RPC)<\/td><td>No per-session VM. A backend worker sends JSON tool schemas in the prompt, receives <code>tool_call(name, args)<\/code>, and hits internal REST/gRPC/MCP APIs directly.<\/td><td><strong>Wins:<\/strong> sub-second latency, 50k+ cheap concurrent chats (support, CRM, payments), strict per-endpoint RBAC.<br><strong>Hurts:<\/strong> 50+ tool schemas bloat the prompt; chaining 15 calls takes 15 LLM turns and dumps raw JSON into context.<\/td><\/tr>\n  <tr><td><strong>Sandboxed VM Agent<\/strong><br>(“Give the Agent a Computer”: Bash + <button type=\"button\" class=\"concept-term\" data-tip=\"cli-vs-mcp\">CLI + Filesystem<\/button>)<\/td><td>Each session gets an isolated microVM/container with <code>bash<\/code>, files, Python, and CLIs (<code>jq<\/code>, <code>duckdb<\/code>, internal CLIs), decoupled via <button type=\"button\" class=\"concept-term\" data-tip=\"brain-hands-split\">Brain vs. Hands isolation<\/button>.<\/td><td><strong>Wins:<\/strong> zero schema bloat (runs <code>cli --help<\/code> on demand), OS pipes (<code>cmd | jq | head<\/code>) compose in 1 turn (<a href=\"https://lucumr.pocoo.org/2025/7/3/tools/\" target=\"_blank\" rel=\"noopener\">Ronacher<\/a>), and disk acts as infinite scratchpad memory (<a href=\"https://manus.im/blog/Context-Engineering-for-AI-Agents-Lessons-from-Building-Manus\" target=\"_blank\" rel=\"noopener\">Manus<\/a>).<br><strong>Hurts:<\/strong> VM boot/idle cost &amp; wider shell surface—keep secrets in an external proxy, never VM env vars!<\/td><\/tr>\n  <tr><td><strong>Hybrid “Code Mode”<\/strong><br>(<button type=\"button\" class=\"concept-term\" data-tip=\"codeact-tools\">Programmatic Tool Execution<\/button>)<\/td><td>Backend keeps strict typed MCP/RPC servers, but exposes them as Python/TS SDK stubs inside a lightweight sandbox (<a href=\"https://www.anthropic.com/research/code-execution-with-mcp\" target=\"_blank\" rel=\"noopener\">Anthropic<\/a>, <a href=\"https://blog.cloudflare.com/code-mode-mcp\" target=\"_blank\" rel=\"noopener\">Cloudflare Code Mode<\/a>).<\/td><td><strong>Best of both for enterprise data work:<\/strong> loops, joins, and filtering run in sandbox code in 1 turn while auth, rate limits, and write approvals stay locked outside the sandbox.<\/td><\/tr>\n  <\/tbody><\/table><\/div>\n\n  <p>What about spinning up multi-agent swarms? Parallel subagents shine on <em>read-only<\/em> fan-out (summarizing five independent 10-Ks simultaneously into clean briefs), whereas parallel <em>writers<\/em> clash over unspoken assumptions, as shown in <a href=\"https://cognition.com/blog/dont-build-multi-agents\" target=\"_blank\" rel=\"noopener\">Cognition’s Don’t Build Multi-Agents<\/a>. Keep a <strong>single-writer orchestrator<\/strong> backed by an external durable event log (<a href=\"https://www.anthropic.com/research/managed-agents\" target=\"_blank\" rel=\"noopener\">Anthropic’s Managed Agents<\/a>) with <button type=\"button\" class=\"concept-term\" data-tip=\"idempotency-keys\">idempotency keys<\/button> so stateless workers can crash and resume without double-firing completed writes.<\/p>\n\n  <h3>2. Tool pruning, memory tiers &amp; write-safety boundaries<\/h3>\n  <p>Exposing 100 overlapping tools or 1,200 SQL columns degrades tool selection. Route to a domain workspace first and prune down to the relevant tables, columns, and narrow tools (<a href=\"https://www.uber.com/us/en/blog/query-gpt/\" target=\"_blank\" rel=\"noopener\">Uber’s QueryGPT<\/a>, <a href=\"https://www.anthropic.com/research/writing-tools-for-agents\" target=\"_blank\" rel=\"noopener\">Anthropic’s tool guide<\/a>). Keep prompts lean via <button type=\"button\" class=\"concept-term\" data-tip=\"compaction-handles\">scoped handles &amp; context compaction<\/button> (<a href=\"https://www.anthropic.com/research/effective-context-engineering-for-ai-agents\" target=\"_blank\" rel=\"noopener\">context engineering<\/a>), keeping static instructions/schemas at the prompt prefix for KV-cache reuse. Separate <strong>three memory tiers<\/strong> cleanly so agents don’t poison themselves over weeks: (1) ephemeral working scratchpad, (2) durable task event log, and (3) user/project memory stored as auditable, timestamped key-value facts with user edit/delete controls—never blindly auto-saving unverified model guesses into a permanent vector DB!<\/p>\n\n  <p>Use <button type=\"button\" class=\"concept-term\" data-tip=\"constrained-decoding\">constrained decoding<\/button> for syntax-safe tool calls while validating ranges, ACLs, and business invariants server-side. Isolate untrusted retrieved content from write authority: high-stakes writes stage a diff preview for human sign-off bound to that exact payload and carry idempotency keys (<a href=\"https://stripe.dev/blog/scaling-radar-fighting-fraud-with-agent-assisted-machine-learning\" target=\"_blank\" rel=\"noopener\">Stripe’s agent-assisted risk workflows<\/a>).<\/p>\n\n  <h3 id=\"model-upgrades\">3. Grading outcomes &amp; safely upgrading the backing model<\/h3>\n  <p>To verify whether a newer or smaller model improves quality/cost without silent regressions (<a href=\"https://www.anthropic.com/research/demystifying-evals-for-ai-agents\" target=\"_blank\" rel=\"noopener\">Anthropic agent evals<\/a>, <a href=\"https://eugeneyan.com/writing/llm-evaluators\" target=\"_blank\" rel=\"noopener\">Eugene Yan’s evaluator guide<\/a>):<\/p>\n  <ol class=\"framework-list\">\n    <li><strong>Seed resettable test worlds:<\/strong> Snapshot realistic sandboxes with distractors, stale docs, and permission traps, plus past production failures.<\/li>\n    <li><strong>Grade final state, not one rigid trajectory:<\/strong> Check final database/sheet state and zero forbidden calls deterministically; calibrate narrow binary LLM judges against human labels (<a href=\"https://people.eecs.berkeley.edu/~bjoern/papers/shankar-validators-uist2024.pdf\" target=\"_blank\" rel=\"noopener\">Shankar et al.<\/a>) while blinding/swapping order (<a href=\"https://arxiv.org/abs/2306.05685\" target=\"_blank\" rel=\"noopener\">Zheng et al.<\/a>).<\/li>\n    <li><strong>Run fresh trajectories end-to-end:<\/strong> Let candidate and incumbent models choose their own actions in isolated sandboxes rather than replaying stale transcripts.<\/li>\n    <li><strong>Compare <button type=\"button\" class=\"concept-term\" data-tip=\"pass-hat-k\">pass^k vs. pass@k<\/button> &amp; cost per solved task:<\/strong> Track multi-run reliability alongside total retries/tokens, with zero-tolerance gates on ACL/safety violations.<\/li>\n    <li><strong>Canary &amp; A/B behind a router:<\/strong> Ramp gradually while monitoring completion rate, manual user edits/retries, rating participation, and p95 latency.<\/li>\n  <\/ol>\n\n  <aside class=\"design-reading\"><h3>Recommended engineering reading<\/h3><p><a href=\"https://www.anthropic.com/research/building-effective-agents\" target=\"_blank\" rel=\"noopener\">Anthropic: Effective Agents<\/a> · <a href=\"https://www.anthropic.com/research/code-execution-with-mcp\" target=\"_blank\" rel=\"noopener\">Anthropic: Code Execution with MCP<\/a> · <a href=\"https://cognition.com/blog/dont-build-multi-agents\" target=\"_blank\" rel=\"noopener\">Cognition: Multi-Agents<\/a> · <a href=\"https://www.uber.com/us/en/blog/query-gpt/\" target=\"_blank\" rel=\"noopener\">Uber: QueryGPT<\/a><\/p><\/aside>\n<\/article>\n\n<article class=\"design-essay\" id=\"coding-agent\">\n  <header class=\"essay-header\">\n    <span class=\"essay-kicker\">Reference Design 04 · Repo Graphs, Edit Formats &amp; VM Harnesses<\/span>\n    <h2>Designing a Repository-Scale Coding Agent<\/h2>\n    <p class=\"essay-lede\">Turning a bug report on a 30,000-file monorepo into a clean pull request tests harness design more than prompt wording. As <a href=\"https://openai.com/index/harness-engineering/\" target=\"_blank\" rel=\"noopener\">OpenAI’s Harness Engineering<\/a> and <a href=\"https://builders.ramp.com/post/why-we-built-our-background-agent\" target=\"_blank\" rel=\"noopener\">Ramp’s Inspect<\/a> demonstrated, Staff-level coding agents live or die on sub-second Copy-on-Write sandboxes, structural repo navigation, reliable edit formats, and tamper-proof verification.<\/p>\n  <\/header>\n\n  <h3>The 6-step closed loop—and the key trade-offs inside each step<\/h3>\n  <ol class=\"framework-list\">\n    <li><strong>Boot instant Copy-on-Write sandboxes.<\/strong> Waiting 6 minutes for <code>docker build &amp;&amp; npm install<\/code> on every task kills interactive UX and parallel eval throughput. Snapshot pre-warmed microVM disk/memory images (Firecracker / OverlayFS, as in <a href=\"https://builders.ramp.com/post/why-we-built-our-background-agent\" target=\"_blank\" rel=\"noopener\">Ramp’s Inspect<\/a>) so isolated checkouts fork in &lt;500 ms with compilers, DBs, and test runners hot; run target tests immediately to confirm baseline state.<\/li>\n    <li><strong>Combine lexical search, call-graph RepoMaps &amp; incremental vectors.<\/strong> Don’t rely on vector search alone—chunk embeddings blur exact symbol names and miss cross-file blast radius! Pair exact <code>ripgrep<\/code>/LSP jump-to-definition with a structural <strong>repository map<\/strong> (<a href=\"https://aider.chat/2023/10/22/repomap.html\" target=\"_blank\" rel=\"noopener\">Aider’s tree-sitter + PageRank RepoMap<\/a> ranks which imported symbols/files matter most to active files in ~1k tokens), backed by <a href=\"https://cursor.com/blog/secure-codebase-indexing\" target=\"_blank\" rel=\"noopener\">Cursor-style indexing<\/a> using <button type=\"button\" class=\"concept-term\" data-tip=\"ast-chunking\">AST-aware chunking<\/button> and <button type=\"button\" class=\"concept-term\" data-tip=\"merkle-sync\">Merkle-tree repo sync<\/button> for broad conceptual discovery.<\/li>\n    <li><strong>Pick a reliable code-edit format (and validate syntax immediately).<\/strong> How the model emits edits dramatically changes patch failure rates (<a href=\"https://aider.chat/docs/more/edit-formats.html\" target=\"_blank\" rel=\"noopener\">Aider’s edit-format benchmarks<\/a>): raw line-numbered diffs fail constantly because LLMs miscount line numbers; whole-file rewrites are simple on tiny files but slow on 800-line files unless paired with <button type=\"button\" class=\"concept-term\" data-tip=\"speculative-apply\">speculative fast apply<\/button> (<a href=\"https://cursor.com/blog/instant-apply\" target=\"_blank\" rel=\"noopener\">Cursor Instant Apply<\/a>); anchored <code>SEARCH / REPLACE<\/code> or line-free unified diffs + immediate <code>tree-sitter<\/code> parse checks bounce malformed edits before wasting a full test run! Persist progress notes to disk (<a href=\"https://www.anthropic.com/research/effective-harnesses-for-long-running-agents\" target=\"_blank\" rel=\"noopener\">Anthropic long-running harnesses<\/a>) across compactions.<\/li>\n    <li><strong>Isolate execution from credentials.<\/strong> Run untrusted builds/tests inside unprivileged VMs with strict CPU/RAM timeouts, allowlisted package-mirror egress, and zero production/git-push credentials (the host harness pushes via a scoped proxy only after checks pass).<\/li>\n    <li><strong>Close the verification loop &amp; protect tests from reward hacking.<\/strong> Run the reproduction test, impacted test targets, typecheckers, linters, and UI preview screenshots. Crucially, make existing test assertions read-only or run hidden acceptance checks in CI/eval—otherwise RL-trained or persistent agents learn they can turn a red suite green by deleting the failing test!<\/li>\n    <li><strong>Return an auditable PR.<\/strong> Output a minimal diff, root-cause write-up, and exact verification logs.<\/li>\n  <\/ol>\n\n  <div class=\"essay-qa\">\n    <h3>How interviewers poke at this design<\/h3>\n    <p><strong>“Two background agents fix bugs in the same repo simultaneously—how do you prevent clobbering?”<\/strong> Each task gets its own Copy-on-Write worktree/VM branched off <code>main<\/code> (never sharing a mutable working directory!). At PR merge time, rebase onto latest <code>main<\/code> and re-run fast impacted CI checks inside the merge queue before landing.<\/p>\n    <p><strong>“3% of integration tests are flaky—how do you stop the agent from chasing ghosts?”<\/strong> Track rolling per-test flake rates on <code>main<\/code>: auto-retry known flaky failures once, run suspect failures against the unedited base commit to prove causality, and cap identical edit-test retry loops at 2–3 attempts.<\/p>\n  <\/div>\n\n  <aside class=\"design-reading\"><h3>Recommended engineering reading<\/h3><p><a href=\"https://builders.ramp.com/post/why-we-built-our-background-agent\" target=\"_blank\" rel=\"noopener\">Ramp: Inspect<\/a> · <a href=\"https://aider.chat/2023/10/22/repomap.html\" target=\"_blank\" rel=\"noopener\">Aider: Tree-Sitter RepoMap<\/a> · <a href=\"https://cursor.com/blog/secure-codebase-indexing\" target=\"_blank\" rel=\"noopener\">Cursor: Codebase Indexing<\/a> · <a href=\"https://openai.com/index/harness-engineering/\" target=\"_blank\" rel=\"noopener\">OpenAI: Harness Engineering<\/a><\/p><\/aside>\n<\/article>\n\n<article class=\"design-essay\" id=\"scarce-labels\">\n  <header class=\"essay-header\">\n    <span class=\"essay-kicker\">Reference Design 05 · Cold-Start Supervision, Distillation &amp; Selective Labels<\/span>\n    <h2>Bootstrapping an ML System from Scarce Labels<\/h2>\n    <p class=\"essay-lede\">A classic Staff design prompt goes: <em>“Classify 10 million transactions, merchants, or policy violations at 15 ms latency—starting with 150 labeled rows and $150/hour domain experts.”<\/em> Standard supervised training stalls on Day 1; your real job is matching model capacity to your data regime while building a bias-aware data flywheel.<\/p>\n  <\/header>\n\n  <h3>1. Lock your human benchmark first, then match model capacity to N<\/h3>\n  <p>Never dump all 150 expert labels into <code>model.fit()<\/code>—if you do, you have zero honest signal to tell whether rules or synthetic labels actually help! Spend your initial SME budget writing a crisp adjudication rubric (checking inter-annotator Cohen’s κ) and locking a <strong>held-out gold evaluation + calibration set<\/strong> split by time or entity. Every noisy training trick gets graded strictly against that human gold slice.<\/p>\n\n  <p>Next, show Staff judgment by evolving your model architecture along the <strong>label-volume crossover curve<\/strong> rather than jumping straight to heavy fine-tuning:<\/p>\n  <ul>\n    <li><strong>Regime 1 (~100–500 labels, Day 1):<\/strong> End-to-end fine-tuning a 300M encoder memorizes noise immediately. Freeze strong pretrained embeddings (<code>CLIP<\/code> or a dense text bi-encoder) + simple domain counters and fit an L2-regularized logistic probe or shallow LightGBM—shipping a working baseline in an afternoon (<a href=\"https://builders.ramp.com/post/industry_classification\" target=\"_blank\" rel=\"noopener\">Ramp’s merchant taxonomy playbook<\/a>).<\/li>\n    <li><strong>Regime 2 (~2k–15k human + high-precision silver labels):<\/strong> Add LoRA / contrastive encoder fine-tuning so domain-specific phrases separate cleanly in embedding space.<\/li>\n    <li><strong>Regime 3 (~50k–200k+ teacher/weak labels):<\/strong> Distill into a compact 10 ms production student (GBDT or small DeBERTa/tiny encoder) that captures 95%+ of a slow frontier LLM’s accuracy at ~1/50th the serving cost.<\/li>\n  <\/ul>\n\n  <h3>2. Scaling noisy supervision &amp; distilling without amplifying errors<\/h3>\n  <p>To reach Regime 3 without waiting a year for human labels, combine offline <strong>LLM-as-Teacher annotation<\/strong> (structured JSON rubrics, prompt caching, and dropping low-margin disagreements across multi-prompt votes) with <button type=\"button\" class=\"concept-term\" data-tip=\"weak-supervision\">programmatic weak supervision<\/button> (<a href=\"https://arxiv.org/abs/1711.10160\" target=\"_blank\" rel=\"noopener\">Snorkel’s generative label model<\/a> weighting correlated regex/graph/SQL heuristics properly instead of naive majority voting).<\/p>\n\n  <p>Train the fast student with <button type=\"button\" class=\"concept-term\" data-tip=\"soft-distillation\">soft-label distillation<\/button> (<code>KL<\/code> on temperature-scaled teacher probabilities for silver rows + up-weighted exact cross-entropy on gold human train rows), avoiding hard <code>0/1<\/code> pseudo-label cutoffs (<code>p > 0.95<\/code>) that starve the student of informative borderline cases! Finish with Platt or isotonic calibration on your clean human calibration slice so serving thresholds reflect real-world prevalence.<\/p>\n\n  <div class=\"clean-table-wrap\"><table><thead><tr><th>Supervision lever<\/th><th>Shines when<\/th><th>Classic trap &amp; Staff mitigation<\/th><\/tr><\/thead><tbody>\n  <tr><td>LLM teacher + soft distillation<\/td><td>Nuanced text/multimodal rubrics an offline frontier LLM already solves well.<\/td><td>Student inherits teacher blind spots → audit teacher slice precision against human gold labels first.<\/td><\/tr>\n  <tr><td>Weak supervision (Snorkel)<\/td><td>Analysts have high-precision keywords, IP/device graph rules, or SQL signals.<\/td><td>5 copycat rules outvote 1 independent rule → fit a correlation-aware label model, not majority vote.<\/td><\/tr>\n  <tr><td>Active learning (HITL)<\/td><td>Huge unlabeled stream with a trickle of SME hours (e.g., 300 reviews/week).<\/td><td>Pure uncertainty sampling chases gibberish outliers → combine cluster diversity + 5–10% random exploration.<\/td><\/tr>\n  <tr><td>Self-training / pseudo-labels<\/td><td>Strong initial model + millions of unlabeled in-domain records.<\/td><td>Early confident mistakes snowball → enforce class-balanced quotas and validate every round on human gold data.<\/td><\/tr>\n  <\/tbody><\/table><\/div>\n\n  <h3>3. Active learning &amp; defeating selective-label bias in production<\/h3>\n  <p>Once v1 ships, route weekly SME labeling budgets using <button type=\"button\" class=\"concept-term\" data-tip=\"active-coreset\">core-set diversity + uncertainty active learning<\/button>. Even more importantly in enforcement systems—fraud blocks, spam takedowns, credit declines—account for <button type=\"button\" class=\"concept-term\" data-tip=\"selective-labels\">selective-label (censorship) bias<\/button>, a core lesson from <a href=\"https://stripe.dev/blog/how-we-built-it-stripe-radar\" target=\"_blank\" rel=\"noopener\">Stripe Radar<\/a> and <a href=\"https://stripe.dev/blog/scaling-radar-fighting-fraud-with-agent-assisted-machine-learning\" target=\"_blank\" rel=\"noopener\">agent-assisted risk pipelines<\/a>: if your model automatically blocks everything with <code>score &gt; 0.85<\/code>, you never observe whether blocked users would have paid honestly or charged back! Training v2 only on approved traffic blinds it to blocked patterns. Keep a tiny, dollar-capped <strong>0.5–1% randomized let-through control group<\/strong> (or stratified human audit of blocked items) weighted by inverse propensity so precision tracking and v2 retraining stay unbiased.<\/p>\n\n  <div class=\"essay-qa\">\n    <h3>How interviewers poke at this design<\/h3>\n    <p><strong>“Abuse prevalence is 0.02% (1-in-5,000)—labeling 2,000 random rows for your gold test set finds zero positives!”<\/strong> Use stratified importance sampling: partition traffic into high weak-signal/embedding score, medium score, and uniform random background strata; sample and human-label inside all three; then weight each stratum’s confusion matrix by its exact share of total traffic (<code>P(stratum)<\/code>) to recover an unbiased estimate of real-traffic precision and recall.<\/p>\n  <\/div>\n\n  <aside class=\"design-reading\"><h3>Recommended engineering reading<\/h3><p><a href=\"https://builders.ramp.com/post/industry_classification\" target=\"_blank\" rel=\"noopener\">Ramp: Industry Classification<\/a> · <a href=\"https://stripe.dev/blog/how-we-built-it-stripe-radar\" target=\"_blank\" rel=\"noopener\">Stripe: Building Radar<\/a> · <a href=\"https://stripe.dev/blog/scaling-radar-fighting-fraud-with-agent-assisted-machine-learning\" target=\"_blank\" rel=\"noopener\">Stripe: Agent-Assisted Fraud ML<\/a> · <a href=\"https://arxiv.org/abs/1711.10160\
