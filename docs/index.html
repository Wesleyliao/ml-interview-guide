)", "slug": "insert-delete-getrandom-o1", "diff": "M", "tier": "ext"}, {"n": 208, "title": "Implement Trie (Prefix Tree)", "slug": "implement-trie-prefix-tree", "diff": "M", "tier": "ext"}, {"n": 295, "title": "Find Median from Data Stream", "slug": "find-median-from-data-stream", "diff": "H", "tier": "ext"}, {"n": 1570, "title": "Dot Product of Two Sparse Vectors", "slug": "dot-product-of-two-sparse-vectors", "diff": "M", "tier": "ext", "local": true}, {"n": 311, "title": "Sparse Matrix Multiplication", "slug": "sparse-matrix-multiplication", "diff": "M", "tier": "ext", "local": true}, {"n": 588, "title": "Design In-Memory File System", "slug": "design-in-memory-file-system", "diff": "H", "tier": "ext", "local": true}]}, {"category": "Additional: Advanced Graphs", "problems": [{"n": 210, "title": "Course Schedule II", "slug": "course-schedule-ii", "diff": "M", "tier": "ext"}, {"n": 127, "title": "Word Ladder", "slug": "word-ladder", "diff": "H", "tier": "ext"}, {"n": 332, "title": "Reconstruct Itinerary", "slug": "reconstruct-itinerary", "diff": "H", "tier": "ext"}, {"n": 684, "title": "Redundant Connection", "slug": "redundant-connection", "diff": "M", "tier": "ext"}, {"n": 1584, "title": "Min Cost to Connect All Points", "slug": "min-cost-to-connect-all-points", "diff": "M", "tier": "ext"}]}, {"category": "Additional: DP, Greedy & Selected Hards", "problems": [{"n": 416, "title": "Partition Equal Subset Sum", "slug": "partition-equal-subset-sum", "diff": "M", "tier": "ext"}, {"n": 72, "title": "Edit Distance", "slug": "edit-distance", "diff": "M", "tier": "ext"}, {"n": 45, "title": "Jump Game II", "slug": "jump-game-ii", "diff": "M", "tier": "ext"}, {"n": 239, "title": "Sliding Window Maximum", "slug": "sliding-window-maximum", "diff": "H", "tier": "ext"}, {"n": 23, "title": "Merge k Sorted Lists", "slug": "merge-k-sorted-lists", "diff": "H", "tier": "ext"}, {"n": 297, "title": "Serialize and Deserialize Binary Tree", "slug": "serialize-and-deserialize-binary-tree", "diff": "H", "tier": "ext"}, {"n": 42, "title": "Trapping Rain Water", "slug": "trapping-rain-water", "diff": "H", "tier": "ext"}, {"n": 124, "title": "Binary Tree Maximum Path Sum", "slug": "binary-tree-maximum-path-sum", "diff": "H", "tier": "ext"}]}], "mlFiles": [{"label": "PyTorch Lab 1: Losses, K-Means & Naive Bayes", "path": "ml_coding/pytorch_transformers/ex1_classical_and_losses.py", "code": "\"\"\"Lab 1 (45 min): Classical ML From Scratch & Numerically Stable Losses in PyTorch.\n\nCovers the three most common ML-coding warmups and screen questions:\n1. `stable_log_softmax` & `masked_cross_entropy` (OpenAI / Anthropic loss & stability check)\n2. `kmeans_pytorch` (Vectorized Lloyd's K-Means — one of the most frequent ML coding screens)\n3. `GaussianNaiveBayes` (Log-space class posteriors without underflow)\n\nRun `.venv/bin/python ml_coding/pytorch_transformers/ex1_classical_and_losses.py` to test your code.\nReference answers: `ml_coding/pytorch_transformers/solutions_pytorch.py`.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport math\nimport torch\n\n\ndef stable_log_softmax(logits: torch.Tensor, dim: int = -1) -> torch.Tensor:\n    \"\"\"Compute log-softmax along `dim` WITHOUT calling `F.log_softmax` or `torch.logsumexp`.\n\n    Must remain finite for extreme inputs like `logits = +/- 1000.0`.\n    \"\"\"\n    raise NotImplementedError(\"Implement stable_log_softmax.\")\n\n\ndef masked_cross_entropy(\n    logits: torch.Tensor,\n    targets: torch.Tensor,\n    ignore_index: int = -100,\n) -> torch.Tensor:\n    \"\"\"Mean cross-entropy over non-ignored tokens WITHOUT calling `F.cross_entropy`.\n\n    Shapes:\n        logits: (B, T, V) or (N, V)\n        targets: (B, T) or (N,) int64 with class indices in [0, V) or `ignore_index`\n\n    Traps to handle:\n        - Clamp ignored targets before `gather` so `-100` never triggers an out-of-bounds index error.\n        - If ALL tokens equal `ignore_index`, return `logits.sum() * 0.0` (differentiable 0.0, not NaN).\n    \"\"\"\n    raise NotImplementedError(\"Implement masked_cross_entropy.\")\n\n\ndef kmeans_pytorch(\n    x: torch.Tensor,\n    k: int,\n    num_iters: int = 20,\n    seed: int = 0,\n) -> tuple[torch.Tensor, torch.Tensor]:\n    \"\"\"Vectorized K-Means on `x` of shape (N, D) -> `(centroids (k, D), assignments (N,))`.\n\n    Rules:\n        1. Sample `k` initial centroids without replacement using `torch.Generator().manual_seed(seed)`.\n        2. Compute `(N, k)` squared Euclidean distances without Python loops over `N`.\n        3. If a cluster becomes empty, re-seed it to the point farthest from its current centroid.\n        4. Stop early when `assignments` stop changing.\n    \"\"\"\n    raise NotImplementedError(\"Implement kmeans_pytorch.\")\n\n\nclass GaussianNaiveBayes:\n    \"\"\"Vectorized Gaussian Naive Bayes classifier computed strictly in log-probability space.\"\"\"\n\n    def fit(self, x: torch.Tensor, y: torch.Tensor, eps: float = 1e-6) -> \"GaussianNaiveBayes\":\n        \"\"\"Estimate per-class log-priors `(C,)`, means `(C, D)`, and variances `(C, D) + eps`.\"\"\"\n        raise NotImplementedError(\"Implement GaussianNaiveBayes.fit.\")\n\n    def predict_log_proba(self, x: torch.Tensor) -> torch.Tensor:\n        \"\"\"Return normalized class log-probabilities `(N, C)` using `stable_log_softmax`.\"\"\"\n        raise NotImplementedError(\"Implement GaussianNaiveBayes.predict_log_proba.\")\n\n    def predict(self, x: torch.Tensor) -> torch.Tensor:\n        \"\"\"Return predicted class labels `(N,)` matching the original class IDs in `y`.\"\"\"\n        raise NotImplementedError(\"Implement GaussianNaiveBayes.predict.\")\n\n\ndef _check() -> None:\n    import torch.nn.functional as F\n\n    torch.manual_seed(0)\n    logits = torch.randn(2, 4, 7, requires_grad=True)\n    assert torch.allclose(stable_log_softmax(logits, -1), F.log_softmax(logits, -1), atol=1e-5)\n    assert torch.isfinite(stable_log_softmax(logits.detach() * 800.0, -1)).all()\n\n    targets = torch.tensor([[1, -100, 3, 0], [-100, -100, -100, -100]])\n    loss = masked_cross_entropy(logits, targets)\n    assert torch.allclose(loss, F.cross_entropy(logits.view(-1, 7), targets.view(-1), ignore_index=-100), atol=1e-5)\n    loss.backward()\n    assert logits.grad is not None and torch.isfinite(logits.grad).all()\n\n    x_km = torch.cat([torch.randn(25, 3) - 4.0, torch.randn(25, 3) + 4.0], dim=0)\n    c, a = kmeans_pytorch(x_km, k=2, seed=42)\n    assert c.shape == (2, 3) and len(set(a[:25].tolist())) == 1 and a[0] != a[25]\n\n    y_nb = torch.tensor([0] * 25 + [1] * 25)\n    gnb = GaussianNaiveBayes().fit(x_km, y_nb)\n    preds = gnb.predict(x_km)\n    assert (preds == y_nb).float().mean().item() > 0.95\n    assert torch.allclose(gnb.predict_log_proba(x_km).exp().sum(dim=-1), torch.ones(50), atol=1e-5)\n    print(\"Lab 1 checks passed!\")\n\n\nif __name__ == \"__main__\":\n    _check()\n"}, {"label": "PyTorch Lab 2: RoPE, Causal GQA & KV Cache", "path": "ml_coding/pytorch_transformers/ex2_attention_and_kvcache.py", "code": "\"\"\"Lab 2 (50–60 min): Causal + Padding Grouped-Query Attention, RoPE & KV Cache.\n\nDirectly targets the classic OpenAI / Anthropic PyTorch Transformer assessment:\n- Phase 1: Implement RoPE (`apply_rope`) with explicit token position indices `(B, T)` or `(T,)`.\n- Phase 2: Implement `CausalGQAWithCache` supporting `num_q_heads >= num_kv_heads`, causal masking,\n           boolean `key_padding_mask`, AND safe handling when a padded query has zero valid keys\n           (no `NaN` in forward OR backward!).\n- Phase 3: Support incremental autoregressive `KVCache` (`prefill` + token-by-token `decode`) with\n           exact logit/hidden-state parity (`atol=1e-5`) against full-sequence causal forward.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom typing import Optional\nimport math\nimport torch\nimport torch.nn as nn\n\n\n@dataclass\nclass KVCache:\n    \"\"\"Stores accumulated key/value tensors of shape `(B, H_kv, T_cached, D_h)`.\"\"\"\n\n    k: torch.Tensor\n    v: torch.Tensor\n\n    @property\n    def seq_len(self) -> int:\n        return int(self.k.shape[2])\n\n\ndef apply_rope(x: torch.Tensor, positions: torch.Tensor, base: float = 10000.0) -> torch.Tensor:\n    \"\"\"Apply Rotary Positional Embeddings to even/odd pairs `(x[..., 0::2], x[..., 1::2])`.\n\n    Shapes:\n        x: `(B, H, T, D_h)` where `D_h` is even\n        positions: `(T,)` or `(B, T)` integer position indices (crucial during cached decode!)\n        returns: `(B, H, T, D_h)` in the same dtype as `x`\n    \"\"\"\n    raise NotImplementedError(\"Implement apply_rope.\")\n\n\nclass CausalGQAWithCache(nn.Module):\n    \"\"\"Grouped-Query Causal Self-Attention with RoPE, Key-Padding Mask, and Optional KV Cache.\"\"\"\n\n    def __init__(self, d_model: int, num_q_heads: int, num_kv_heads: int) -> None:\n        super().__init__()\n        if d_model % num_q_heads != 0:\n            raise ValueError(\"d_model must be divisible by num_q_heads\")\n        if num_q_heads % num_kv_heads != 0:\n            raise ValueError(\"num_q_heads must be divisible by num_kv_heads\")\n        self.d_model = d_model\n        self.num_q_heads = num_q_heads\n        self.num_kv_heads = num_kv_heads\n        self.head_dim = d_model // num_q_heads\n        if self.head_dim % 2 != 0:\n            raise ValueError(\"head_dim must be even for RoPE\")\n        self.group_size = num_q_heads // num_kv_heads\n\n        self.q_proj = nn.Linear(d_model, num_q_heads * self.head_dim, bias=False)\n        self.k_proj = nn.Linear(d_model, num_kv_heads * self.head_dim, bias=False)\n        self.v_proj = nn.Linear(d_model, num_kv_heads * self.head_dim, bias=False)\n        self.o_proj = nn.Linear(d_model, d_model, bias=False)\n\n    def forward(\n        self,\n        x: torch.Tensor,\n        key_padding_mask: Optional[torch.Tensor] = None,\n        kv_cache: Optional[KVCache] = None,\n        use_cache: bool = False,\n    ) -> tuple[torch.Tensor, Optional[KVCache]]:\n        \"\"\"Run causal GQA forward pass.\n\n        Args:\n            x: `(B, T_q, d_model)` input hidden states.\n            key_padding_mask: Optional `(B, T_total)` bool tensor (`True` = valid token, `False` = pad),\n                              where `T_total = (kv_cache.seq_len if kv_cache else 0) + T_q`.\n            kv_cache: Optional previous `KVCache` for incremental decoding.\n            use_cache: If True, return updated `KVCache`; otherwise return `None`.\n\n        Key invariants:\n            1. Query at step `i` (0 <= i < T_q) sits at absolute position `past_len + i` and may ONLY\n               attend to valid keys at absolute positions `j <= past_len + i`.\n            2. Apply `apply_rope` to `q` (at positions `past_len .. past_len + T_q - 1`) and to the NEW\n               `k` slice BEFORE concatenating onto `kv_cache` (so cached keys are never rotated twice!).\n            3. If a query row has ZERO unmasked keys (e.g., leading pad token), its attention output must\n               be `0.0` and `loss.backward()` must NOT produce `NaN` gradients!\n        \"\"\"\n        raise NotImplementedError(\"Implement CausalGQAWithCache.forward.\")\n\n\ndef _check() -> None:\n    torch.manual_seed(7)\n    attn = CausalGQAWithCache(d_model=32, num_q_heads=4, num_kv_heads=2)\n    x = torch.randn(2, 6, 32, requires_grad=True)\n    pad_mask = torch.tensor(\n        [[False, True, True, True, True, False], [True, True, True, True, True, True]],\n        dtype=torch.bool,\n    )\n    out_full, _ = attn(x, key_padding_mask=pad_mask, use_cache=False)\n    assert out_full.shape == (2, 6, 32) and torch.isfinite(out_full).all()\n    out_full.sum().backward()\n    assert x.grad is not None and torch.isfinite(x.grad).all()\n\n    # Prefill (first 3 tokens) + step-by-step decode (last 3 tokens) parity check on unpadded sequence\n    x_clean = torch.randn(2, 6, 32)\n    with torch.no_grad():\n        expected, _ = attn(x_clean, use_cache=False)\n        prefill_out, cache = attn(x_clean[:, :3, :], use_cache=True)\n        decoded = [prefill_out]\n        for step in range(3, 6):\n            step_out, cache = attn(x_clean[:, step : step + 1, :], kv_cache=cache, use_cache=True)\n            decoded.append(step_out)\n        actual = torch.cat(decoded, dim=1)\n        assert torch.allclose(expected, actual, atol=1e-5), f\"Max diff: {(expected - actual).abs().max()}\"\n    print(\"Lab 2 checks passed!\")\n\n\nif __name__ == \"__main__\":\n    _check()\n"}, {"label": "PyTorch Lab 3: LoRA, DPO & GRPO", "path": "ml_coding/pytorch_transformers/ex3_lora_dpo_grpo.py", "code": "\"\"\"Lab 3 (45 min): Post-Training Primitives — LoRA, DPO & GRPO in PyTorch.\n\nFocused, realistic implementations (~15–25 lines per component) commonly tested in\nApplied AI / Post-Training / Research Engineer interviews:\n1. `LoRALinear`: Frozen base linear + rank-`r` adapter (`lora_B == 0` init + `merge_weights()`).\n2. `dpo_loss`: Direct Preference Optimization loss + detached implicit reward margins.\n3. `grpo_loss`: Group Relative Policy Optimization with group-variance collapse guard + k3 KL.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom typing import Optional\nimport math\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\n\nclass LoRALinear(nn.Module):\n    \"\"\"Low-Rank Adaptation wrapper around a frozen `nn.Linear` layer.\"\"\"\n\n    def __init__(self, base_layer: nn.Linear, r: int = 8, alpha: float = 16.0) -> None:\n        super().__init__()\n        if r <= 0:\n            raise ValueError(\"Rank r must be > 0\")\n        self.base_layer = base_layer\n        for p in self.base_layer.parameters():\n            p.requires_grad_(False)\n        self.r = r\n        self.alpha = alpha\n        self.scaling = alpha / r\n\n        # TODO: Initialize `self.lora_A` of shape (r, in_features) with kaiming_uniform_\n        #       and `self.lora_B` of shape (out_features, r) with zeros so initial output == base_layer(x).\n        raise NotImplementedError(\"Initialize LoRA parameters.\")\n\n    def forward(self, x: torch.Tensor) -> torch.Tensor:\n        \"\"\"Compute `base_layer(x) + scaling * (x @ lora_A.T @ lora_B.T)`.\"\"\"\n        raise NotImplementedError(\"Implement LoRALinear.forward.\")\n\n    def merge_weights(self) -> nn.Linear:\n        \"\"\"Return a new standalone `nn.Linear` with `W_merged = W_base + scaling * (B @ A)`.\"\"\"\n        raise NotImplementedError(\"Implement LoRALinear.merge_weights.\")\n\n\ndef dpo_loss(\n    policy_chosen_logps: torch.Tensor,\n    policy_rejected_logps: torch.Tensor,\n    ref_chosen_logps: torch.Tensor,\n    ref_rejected_logps: torch.Tensor,\n    beta: float = 0.1,\n) -> tuple[torch.Tensor, torch.Tensor, torch.Tensor]:\n    \"\"\"Compute DPO loss and detached implicit rewards `(loss, chosen_rewards, rejected_rewards)`.\n\n    Args:\n        policy_chosen_logps, policy_rejected_logps: `(B,)` sequence log-probs under trainable policy\n        ref_chosen_logps, ref_rejected_logps: `(B,)` sequence log-probs under frozen reference model\n        beta: KL temperature parameter (`beta > 0`)\n\n    Returns:\n        loss: scalar `-F.logsigmoid(beta * ((pi_w - pi_l) - (ref_w - ref_l))).mean()`\n        chosen_rewards: detached `(B,)` tensor `beta * (pi_w - ref_w)`\n        rejected_rewards: detached `(B,)` tensor `beta * (pi_l - ref_l)`\n    \"\"\"\n    raise NotImplementedError(\"Implement dpo_loss.\")\n\n\ndef grpo_loss(\n    policy_logps: torch.Tensor,\n    old_logps: torch.Tensor,\n    rewards: torch.Tensor,\n    group_size: int,\n    response_mask: torch.Tensor,\n    ref_logps: Optional[torch.Tensor] = None,\n    clip_eps: float = 0.2,\n    beta_kl: float = 0.04,\n    eps: float = 1e-8,\n) -> torch.Tensor:\n    \"\"\"Compute token-masked GRPO clipped surrogate objective with optional Schulman k3 KL penalty.\n\n    Shapes:\n        policy_logps, old_logps, ref_logps: `(B, T)` token log-probs (`B` is a multiple of `group_size`)\n        rewards: `(B,)` scalar verifier reward per sampled completion\n        response_mask: `(B, T)` float/bool mask (`1` for generated response tokens, `0` for prompt/pad)\n\n    Steps:\n        1. Reshape `rewards` to `(B // group_size, group_size)` and compute detached group-relative\n           advantages: `adv = (r - mean) / (std_unbiased_false + eps)`.\n           Note: Use ` unbiased=False` (population std) + `eps` so constant-reward groups give `adv == 0`\n           instead of `NaN`!\n        2. Detach `old_logps`, compute token importance ratio `exp(policy_logps - old_logps)`, and\n           PPO-clipped surrogate `-min(ratio * adv, clamp(ratio, 1 - clip_eps, 1 + clip_eps) * adv)`.\n        3. If `ref_logps is not None and beta_kl > 0`, add `beta_kl * (exp(ref - pi) - (ref - pi) - 1)`\n           with `ref_logps` detached.\n        4. Average over valid tokens using `response_mask` (returning differentiable 0.0 if mask sum is 0).\n    \"\"\"\n    raise NotImplementedError(\"Implement grpo_loss.\")\n\n\ndef _check() -> None:\n    torch.manual_seed(3)\n    base = nn.Linear(16, 8)\n    lora = LoRALinear(base, r=4, alpha=8.0)\n    x = torch.randn(5, 16)\n    assert torch.allclose(lora(x), base(x), atol=1e-6), \"Initial LoRA delta must be exact zero!\"\n    loss_lora = lora(x).pow(2).mean()\n    loss_lora.backward()\n    assert base.weight.grad is None and lora.lora_B.grad is not None\n    with torch.no_grad():\n        lora.lora_B.normal_(0, 0.2)\n        merged = lora.merge_weights()\n        assert torch.allclose(lora(x), merged(x), atol=1e-5)\n\n    pi_w = torch.tensor([-2.0, -1.5], requires_grad=True)\n    pi_l = torch.tensor([-3.0, -2.5], requires_grad=True)\n    ref_w = torch.tensor([-2.2, -1.6])\n    ref_l = torch.tensor([-2.9, -2.4])\n    dl, rw, rl = dpo_loss(pi_w, pi_l, ref_w, ref_l, beta=0.2)\n    dl.backward()\n    assert not rw.requires_grad and (rw > rl).all() and pi_w.grad is not None\n\n    pol = torch.randn(4, 5, requires_grad=True)\n    old = pol.detach().clone()\n    ref = pol.detach() - 0.1\n    flat_rewards = torch.tensor([0.0, 0.0, 0.0, 0.0])  # zero-variance trap!\n    mask = torch.tensor([[1, 1, 1, 0, 0]] * 4, dtype=torch.float32)\n    gl = grpo_loss(pol, old, flat_rewards, group_size=4, response_mask=mask, ref_logps=ref)\n    gl.backward()\n    assert torch.isfinite(gl) and pol.grad is not None and torch.isfinite(pol.grad).all()\n    print(\"Lab 3 checks passed!\")\n\n\nif __name__ == \"__main__\":\n    _check()\n"}, {"label": "PyTorch Lab 4: Buggy Trainer Audit", "path": "ml_coding/pytorch_transformers/ex4_buggy_pytorch_trainer.py", "code": "\"\"\"Lab 4 (35–45 min): Debug & Repair a Broken PyTorch Sequence Training Pipeline.\n\nModels the live \"debug this broken ML pipeline\" round reported at Meta (E6 MLE), OpenAI,\nAnthropic, Figma, and Decagon.\n\n`buggy_train_and_eval` below runs WITHOUT throwing an exception, yet contains **5 classic bugs**:\n  Bug 1 (Data leakage): Standardizes features using mean/std computed across `train + val` combined.\n  Bug 2 (Mask broadcast / polarity bug): Masks pad tokens by multiplying scores by `0` instead of\n        setting padded key positions to `-inf` before softmax (so padded keys still steal probability mass!).\n  Bug 3 (Gradient accumulation bug): Never calls `optimizer.zero_grad()`, accumulating stale gradients!\n  Bug 4 (Mode toggle bug): Leaves `model` in `.train()` mode (with `Dropout(0.5)` active) and tracks\n        gradients during validation.\n  Bug 5 (Numerical stability bug): Computes `torch.log(torch.softmax(logits, dim=-1))` which yields\n        `NaN` when logits are large, instead of `F.log_softmax` / `F.cross_entropy`.\n\nYour task: Implement `fixed_train_and_eval` below fixing all 5 bugs while keeping the same signature.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\n\nclass TinyPooledClassifier(nn.Module):\n    \"\"\"Single-head attention-pooled binary sequence classifier.\"\"\"\n\n    def __init__(self, in_dim: int, hidden_dim: int = 24, dropout: float = 0.4) -> None:\n        super().__init__()\n        self.proj = nn.Linear(in_dim, hidden_dim)\n        self.query = nn.Parameter(torch.randn(hidden_dim) * 0.1)\n        self.drop = nn.Dropout(dropout)\n        self.head = nn.Linear(hidden_dim, 2)\n\n    def forward(self, x: torch.Tensor, mask: torch.Tensor, buggy_masking: bool = False) -> torch.Tensor:\n        \"\"\"x: (B, T, D), mask: (B, T) bool (`True` = valid token, `False` = pad). Assumes >=1 True per row.\"\"\"\n        h = torch.tanh(self.proj(x))  # (B, T, H)\n        scores = (h * self.query).sum(dim=-1) / (h.shape[-1] ** 0.5)  # (B, T)\n        if buggy_masking:\n            # BUG 2: setting score=0 gives exp(0)=1 weight to PAD tokens!\n            weights = torch.softmax(scores * mask.float(), dim=-1)\n        else:\n            scores = scores.masked_fill(~mask, float(\"-inf\"))\n            weights = torch.softmax(scores, dim=-1)\n        pooled = self.drop((h * weights.unsqueeze(-1)).sum(dim=1))\n        return self.head(pooled)\n\n\ndef buggy_train_and_eval(\n    x_train: torch.Tensor,\n    mask_train: torch.Tensor,\n    y_train: torch.Tensor,\n    x_val: torch.Tensor,\n    mask_val: torch.Tensor,\n    y_val: torch.Tensor,\n    epochs: int = 30,\n    lr: float = 0.05,\n    seed: int = 0,\n) -> dict[str, float]:\n    \"\"\"Reference broken trainer — DO NOT EDIT (used by tests to demonstrate the 5 failure modes).\"\"\"\n    torch.manual_seed(seed)\n    # BUG 1: Fits scaler on train + val combined, AND includes zero-padded positions in mean/std!\n    all_x = torch.cat([x_train, x_val], dim=0)\n    mean = all_x.mean(dim=(0, 1), keepdim=True)\n    std = all_x.std(dim=(0, 1), keepdim=True) + 1e-6\n    x_tr = (x_train - mean) / std\n    x_va = (x_val - mean) / std\n\n    model = TinyPooledClassifier(x_train.shape[-1])\n    opt = torch.optim.AdamW(model.parameters(), lr=lr)\n\n    for _ in range(epochs):\n        # BUG 3: Missing opt.zero_grad()!\n        logits = model(x_tr, mask_train, buggy_masking=True)\n        # BUG 5: Unstable log(softmax(logits)) -> -inf / NaN on large logit margins\n        log_probs = torch.log(torch.softmax(logits, dim=-1))\n        loss = -log_probs[torch.arange(len(y_train)), y_train].mean()\n        loss.backward()\n        opt.step()\n\n    # BUG 4: Never switches to model.eval() or torch.no_grad() -> stochastic dropout corrupts eval!\n    val_logits = model(x_va, mask_val, buggy_masking=True)\n    val_acc = (val_logits.argmax(dim=-1) == y_val).float().mean().item()\n    return {\"train_loss\": float(loss.item()), \"val_acc\": val_acc}\n\n\ndef fixed_train_and_eval(\n    x_train: torch.Tensor,\n    mask_train: torch.Tensor,\n    y_train: torch.Tensor,\n    x_val: torch.Tensor,\n    mask_val: torch.Tensor,\n    y_val: torch.Tensor,\n    epochs: int = 30,\n    lr: float = 0.05,\n    seed: int = 0,\n) -> dict[str, float]:\n    \"\"\"Repair all 5 bugs:\n    1. Compute feature `mean` and `std` ONLY over valid (`mask_train == True`) tokens of `x_train`!\n    2. Use proper `-inf` attention masking (`buggy_masking=False`).\n    3. Call `model.train()` and `opt.zero_grad()` each step.\n    4. Use numerically stable `F.cross_entropy(logits, y_train)`.\n    5. Evaluate under `model.eval()` and `torch.no_grad()`, returning deterministic `val_acc`\n       (and return `{\"train_loss\": ..., \"val_acc\": ..., \"val_acc_repeat\": ...}` or verify determinism).\n    \"\"\"\n    raise NotImplementedError(\"Implement fixed_train_and_eval.\")\n\n\ndef _check() -> None:\n    torch.manual_seed(11)\n    x_tr = torch.randn(64, 8, 6)\n    m_tr = torch.zeros(64, 8, dtype=torch.bool)\n    m_tr[:, :2] = True  # Only first 2 tokens are real; 6 tokens are pure noise padding!\n    x_tr[~m_tr] = 50.0  # Huge pad sentinel values that wreck unmasked pooling & unmasked normalization!\n    y_tr = (x_tr[:, 0, 0] + x_tr[:, 1, 0] > 0).long()\n\n    x_va = torch.randn(64, 8, 6)\n    m_va = torch.zeros(64, 8, dtype=torch.bool)\n    m_va[:, :2] = True\n    x_va[~m_va] = 50.0\n    y_va = (x_va[:, 0, 0] + x_va[:, 1, 0] > 0).long()\n\n    res1 = fixed_train_and_eval(x_tr, m_tr, y_tr, x_va, m_va, y_va, epochs=40, lr=0.05, seed=0)\n    # Changing x_val outliers must NEVER alter how x_train is normalized (zero train/val leakage check!)\n    x_va_corrupted = x_va.clone()\n    x_va_corrupted[:, 0, :] += 10000.0\n    res_leak_check = fixed_train_and_eval(x_tr, m_tr, y_tr, x_va_corrupted, m_va, y_va, epochs=40, lr=0.05, seed=0)\n    assert abs(res1[\"train_loss\"] - res_leak_check[\"train_loss\"]) < 1e-6, \"Validation data leaked into train loss!\"\n    assert res1[\"val_acc\"] >= 0.90, f\"Expected >= 0.90 val_acc, got {res1['val_acc']:.3f}\"\n    print(\"Lab 4 checks passed!\")\n\n\nif __name__ == \"__main__\":\n    _check()\n"}, {"label": "Applied AI: Async RAG Review & Tests", "path": "ml_coding/applied_ai_live/rag.py", "code": "\"\"\"Mock A · review and repair an async RAG answer path\n\n### Goal & real-interview context\nIn Fundamental Equities, an AI research tool might answer an analyst's question using both public SEC filings and internal desk notes, falling back from an internal self-hosted LLM to an external commercial API if the internal cluster times out.\nThis exercise mirrors the **Oct 2026 Point72 GenAI first-round report (`1Point3Acres 1192502`)**: you are given a **short, broken async function** and asked to **spot the bugs, fix them, and write unit tests** using fake async dependencies.\n\n### Function signature & data shapes\n```python\nawait answer_query(question: str, user: str, fetch, primary, fallback) -> dict\n\n# Document dict returned in a list by `await fetch(question)`:\n{\n    \"id\": \"doc_1\",               # unique str\n    \"text\": \"Q3 revenue...\",     # str\n    \"readers\": {\"alice\", \"bob\"}, # set[str] of authorized user IDs\n    \"external_ok\": True,         # bool: True ONLY if safe to send to external fallback API\n}\n\n# Model dict returned by `await primary(question, docs)` or `await fallback(question, docs)`:\n{\"text\": \"Revenue grew 12%.\", \"citations\": [\"doc_1\"]}\n\n# Required return value of `answer_query`:\n{\"status\": \"answered\", \"text\": str, \"citations\": list[str]}\n# OR (when abstaining for any reason below):\n{\"status\": \"abstained\"}\n```\n\n### Step-by-step rules (check the starter code against each!)\n1. **Retrieve & filter access:** Call `await fetch(question)` once. Keep only docs where `user in doc[\"readers\"]`. If **no** readable docs remain, return `{\"status\": \"abstained\"}` **without calling either model**.\n2. **Call primary model:** Call `await primary(question, readable_docs)`.\n3. **Fallback ONLY on `TimeoutError`:**\n   - If `primary` raises `TimeoutError`, filter `readable_docs` further to keep **only** docs with `doc[\"external_ok\"] == True`.\n   - If that external-safe list is empty, return `{\"status\": \"abstained\"}` **without calling `fallback`**.\n   - Otherwise call `await fallback(question, external_safe_docs)`.\n4. **Do NOT swallow other errors:** Any error from `fetch`, any **non-`TimeoutError`** from `primary` (e.g., `RuntimeError`, `ValueError`, `asyncio.CancelledError`), and **any** error from `fallback` must propagate untouched.\n5. **Validate model output & citations against the ACTUAL sent context:**\n   - `result[\"text\"].strip()` must be non-empty.\n   - `result[\"citations\"]` must be non-empty.\n   - **Every** cited ID must belong to the exact document list passed to whichever model (`primary` or `fallback`) produced `result`. (If `fallback` answered, citing an internal-only doc that `fallback` never saw—or an unreadable doc—must abstain!).\n   - If any check fails, return `{\"status\": \"abstained\"}`.\n\n### Self-guided workflow (30–40 min)\n- **Step 1 (5–8 min — Code Review):** Read the 11-line starter below *before* editing. List all 5 bugs in your head or notes (what happens on empty docs? on `ValueError`? what docs go to `fallback`? what if `text` is `\"   \"` or `citations` has `\"secret\"`?).\n- **Step 2 (15 min — Patch):** Fix `answer_query` cleanly (it only takes ~18 lines of Python!).\n- **Step 3 (10–15 min — Write Tests):** Run `check_rag()`, then fill in `my_extra_rag_tests()` to test unexpected errors, empty external context, and invalid citations.\"\"\"\n\nimport asyncio\nimport math\nfrom collections import defaultdict\n\nasync def answer_query(question: str, user: str, fetch, primary, fallback) -> dict:\n    \"\"\"BUGGY STARTER: Review against the 5 rules above, then repair.\"\"\"\n    documents = await fetch(question)\n    readable = [d for d in documents if user in d[\"readers\"]]\n    try:\n        result = await primary(question, readable)\n    except Exception:\n        result = await fallback(question, documents)\n    if not result[\"citations\"]:\n        return {\"status\": \"abstained\"}\n    return {\"status\": \"answered\", \"text\": result[\"text\"],\n            \"citations\": result[\"citations\"]}\n\nasync def check_rag():\n    docs = [\n        {\"id\": \"public\", \"text\": \"10-K fact\", \"readers\": {\"u\"}, \"external_ok\": True},\n        {\"id\": \"internal\", \"text\": \"desk note\", \"readers\": {\"u\"}, \"external_ok\": False},\n        {\"id\": \"secret\", \"text\": \"other pod\", \"readers\": {\"other\"}, \"external_ok\": True},\n    ]\n    calls = []\n\n    async def fetch(q):\n        calls.append(\"fetch\")\n        return docs\n\n    async def primary_timeout(q, context):\n        calls.append((\"primary\", [d[\"id\"] for d in context]))\n        raise TimeoutError(\"internal cluster slow\")\n\n    async def fallback_ok(q, context):\n        calls.append((\"fallback\", [d[\"id\"] for d in context]))\n        return {\"text\": \"Grounded answer\", \"citations\": [\"public\"]}\n\n    # 1. Primary times out -> fallback receives ONLY readable + external_ok docs\n    res = await answer_query(\"q\", \"u\", fetch, primary_timeout, fallback_ok)\n    assert res == {\"status\": \"answered\", \"text\": \"Grounded answer\", \"citations\": [\"public\"]}\n    assert calls == [\n        \"fetch\",\n        (\"primary\", [\"public\", \"internal\"]),\n        (\"fallback\", [\"public\"]),\n    ], f\"Unexpected call trace: {calls}\"\n\n    # 2. User with zero readable docs -> abstains immediately WITHOUT calling any model\n    calls.clear()\n    assert await answer_query(\"q\", \"nobody\", fetch, primary_timeout, fallback_ok) == {\"status\": \"abstained\"}\n    assert calls == [\"fetch\"], f\"Models should not be called when no docs are readable: {calls}\"\n\n    # 3. Model cites an unauthorized doc ID -> abstains\n    async def hallucinate_citation(q, context):\n        return {\"text\": \"Answer\", \"citations\": [\"public\", \"secret\"]}\n\n    assert await answer_query(\"q\", \"u\", fetch, hallucinate_citation, fallback_ok) == {\"status\": \"abstained\"}\n    print(\"RAG sample checks passed! Now implement your own regression tests below.\")\n\nasyncio.run(check_rag())\n\nasync def my_extra_rag_tests():\n    # Practice writing 3 high-signal unit tests (interviewers care heavily about this!):\n    # TODO 1: Primary raises RuntimeError(\"bug\") -> error propagates, fallback is NOT called.\n    # TODO 2: User only has internal docs (external_ok=False) & primary raises TimeoutError -> abstains without calling fallback.\n    # TODO 3: Primary returns whitespace-only text {\"text\": \"   \", \"citations\": [\"public\"]} -> abstains.\n    pass\n\nasyncio.run(my_extra_rag_tests())\n"}, {"label": "Applied AI: Permissioned Cosine Retrieval", "path": "ml_coding/applied_ai_live/retrieval.py", "code": "\"\"\"Mock B · access-aware cosine top-k retrieval\n\n### Goal & real-interview context\nImplement an in-memory vector ranker that scores embedded research chunks against a query embedding while enforcing desk-level read permissions **before** selecting top-`k`.\nIn a live AI Engineer interview, building a clean, dependency-free ranking function tests Python fluency, edge-case discipline (zero vectors, negative cosine similarity, deterministic tie-breaking), and permission-boundary ordering (pre-filtering vs. post-filtering).\n\n### Function signature & data shapes\n```python\nrank_documents(query: list[float], documents: list[dict], user: str, k: int) -> list[str]\n\n# Example `query` (guaranteed non-empty, finite floats, non-zero norm):\n[0.6, 0.8]\n\n# Example item in `documents` (vectors have same length as `query`, finite floats, MAY be all zeros):\n{\n    \"id\": \"nvda_10q_p4\",          # unique str\n    \"readers\": {\"analyst_1\"},     # set[str]\n    \"vector\": [0.0, 5.0],         # list[float] — note: unnormalized magnitudes!\n}\n```\n\n### Step-by-step rules\n1. **Non-positive `k`:** If `k <= 0`, return `[]`.\n2. **Pre-filter permissions:** Ignore any document where `user not in doc[\"readers\"]`. (Never take top-`k` first and filter after—that causes underfilled results!).\n3. **Skip zero vectors:** Compute Euclidean norm `sqrt(sum(x * x for x in vec))`. If a document vector has norm `0.0`, skip it (avoid `ZeroDivisionError`).\n4. **Cosine similarity:** Compute `dot(query, vec) / (norm(query) * norm(vec))`. Note that negative cosine scores (down to `-1.0`) are completely valid and must **not** be dropped!\n5. **Deterministic sort & top-`k`:** Rank eligible docs by:\n   - `cosine_score` **descending**, then\n   - `doc[\"id\"]` **alphabetically ascending** (`\"a\"` before `\"b\"`) on exact score ties.\n6. Return up to `k` document IDs (`list[str]`). Do not mutate `query` or `documents`.\n\n### Worked example\n```python\nquery = [1.0, 0.0]\ndocs = [\n    {\"id\": \"a\",      \"readers\": {\"u\"}, \"vector\": [1.0, 0.0]},   # cos = +1.0\n    {\"id\": \"b\",      \"readers\": {\"u\"}, \"vector\": [0.0, 1.0]},   # cos =  0.0\n    {\"id\": \"c\",      \"readers\": {\"u\"}, \"vector\": [-1.0, 0.0]},  # cos = -1.0 (kept!)\n    {\"id\": \"zero\",   \"readers\": {\"u\"}, \"vector\": [0.0, 0.0]},   # norm 0 -> skipped\n    {\"id\": \"secret\", \"readers\": {\"x\"}, \"vector\": [1.0, 0.0]},   # unreadable -> skipped\n]\nrank_documents(query, docs, user=\"u\", k=3)  # -> [\"a\", \"b\", \"c\"]\n```\n\n### Self-guided workflow (25–30 min)\n- **Step 1 (15 min):** Write a clean `sort`-based baseline first (`scored.sort(key=lambda item: (-item[0], item[1]))`). Don't prematurely optimize with heaps!\n- **Step 2 (10 min):** Run `check_retrieval()`, then write a test where raw dot-product `[100, 100]` disagrees with cosine `[1, 0]`.\"\"\"\n\nimport asyncio\nimport math\nfrom collections import defaultdict\n\ndef rank_documents(query: list[float], documents: list[dict], user: str, k: int) -> list[str]:\n    \"\"\"Return up to k readable non-zero-norm doc IDs ranked by (-cosine_similarity, doc_id).\"\"\"\n    raise NotImplementedError\n\ndef check_retrieval():\n    docs = [\n        {\"id\": \"b\",      \"readers\": {\"u\"}, \"vector\": [0, 1]},\n        {\"id\": \"a\",      \"readers\": {\"u\"}, \"vector\": [1, 0]},\n        {\"id\": \"secret\", \"readers\": {\"x\"}, \"vector\": [1, 0]},\n        {\"id\": \"c\",      \"readers\": {\"u\"}, \"vector\": [-1, 0]},\n        {\"id\": \"z\",      \"readers\": {\"u\"}, \"vector\": [0, 0]},\n    ]\n\n    # 1. Filters unreadable & zero-norm docs; keeps negative cosine scores in order\n    assert rank_documents([1, 0], docs, \"u\", 3) == [\"a\", \"b\", \"c\"]\n\n    # 2. Non-positive k and user with no access return []\n    assert rank_documents([1, 0], docs, \"u\", 0) == []\n    assert rank_documents([1, 0], docs, \"nobody\", 3) == []\n\n    # 3. Exact cosine ties break alphabetically by ID (\"a\" before \"z\")\n    tied = [{\"id\": i, \"readers\": {\"u\"}, \"vector\": [1, 0]} for i in [\"z\", \"a\"]]\n    assert rank_documents([1, 0], tied, \"u\", 1) == [\"a\"]\n\n    print(\"Retrieval sample checks passed! Add a cosine-vs-dot-product test below.\")\n\ncheck_retrieval()\n\ndef my_extra_retrieval_tests():\n    # Practice test: prove cosine beats large-magnitude unnormalized vectors!\n    # e.g., query=[1, 0], doc \"huge\"=[100, 100] (dot=100, cos=0.707) vs doc \"unit\"=[1, 0] (dot=1, cos=1.0)\n    pass\n\nmy_extra_retrieval_tests()\n"}, {"label": "Applied AI: Bounded Tool-Calling Loop", "path": "ml_coding/applied_ai_live/agent.py", "code": "\"\"\"Mock C · a bounded tool-calling agent loop\n\n### Goal & real-interview context\nImplement a synchronous, deterministic tool-calling loop (`run_agent`) around a fake LLM and an allowlisted dictionary of tools (e.g., `get_stock_price`, `fetch_10k_section`).\nApplied AI interviews at OpenAI, Anthropic, and hedge funds love this pattern because it tests state-machine clarity, message-history formatting, strict output validation before executing side effects, and loop-budget enforcement—all in ~30 lines of plain Python.\n\n### Function signature & data shapes\n```python\nrun_agent(question: str, model, tools: dict[str, callable], max_tool_calls: int) -> dict\n\n# `tools` maps approved tool names -> functions taking **kwargs and returning a str:\ntools = {\"lookup_eps\": lambda ticker, year: \"$4.12\"}\n\n# `model(messages)` inspects the conversation list and returns ONE of two exact dict shapes:\n# Shape 1 — Final answer:\n{\"type\": \"final\", \"text\": \"FY25 EPS was $4.12.\"}\n# Shape 2 — Tool call request:\n{\"type\": \"tool\", \"name\": \"lookup_eps\", \"arguments\": {\"ticker\": \"AAPL\", \"year\": 2025}}\n\n# Return value of `run_agent`:\n{\"status\": \"answered\", \"text\": \"FY25 EPS was $4.12.\"}   # when model returns a valid final answer\n{\"status\": \"limit\",    \"text\": None}                    # when model wants a (max_tool_calls + 1)-th tool call\n```\n\n### Conversation `messages` transcript format\n1. Initialize `messages` with the user prompt:\n   `[{\"role\": \"user\", \"content\": question}]`\n2. Each time the model requests a valid, within-budget tool call, append **two** items in order:\n   - Assistant turn: `{\"role\": \"assistant\", \"content\": response}` *(where `response` is the model's tool dict)*\n   - Tool result turn: `{\"role\": \"tool\", \"name\": name, \"content\": result}` *(where `result = tools[name](**arguments)`)*\n3. Pass the updated `messages` list to the next `model(messages)` call.\n\n### Validation & budget rules (order matters!)\n1. **Budget parameter check:** If `max_tool_calls < 0`, raise `ValueError` immediately. (`max_tool_calls == 0` is valid: the model gets 1 call to answer directly, with 0 tool executions allowed).\n2. **Validate EVERY `response` from `model(messages)` BEFORE checking the budget limit or calling a tool:**\n   - `response` must be a `dict`.\n   - If `response.get(\"type\") == \"final\"`: keys must be **exact** `{\"type\", \"text\"}`, and `response[\"text\"]` must be a `str` with `response[\"text\"].strip() != \"\"`. If valid, return `{\"status\": \"answered\", \"text\": response[\"text\"]}`. Otherwise raise `ValueError`.\n   - If `response.get(\"type\") == \"tool\"`: keys must be **exact** `{\"type\", \"name\", \"arguments\"}`, `name` must be a `str` present in `tools`, and `arguments` must be a `dict` whose keys are all `str`. Otherwise raise `ValueError`.\n   - Any other `\"type\"` (or missing `\"type\"`) raises `ValueError`.\n3. **Enforce `max_tool_calls` budget:**\n   - You may execute at most `max_tool_calls` tools.\n   - After executing the `max_tool_calls`-th tool, the model gets **one final turn** (`max_tool_calls + 1` model calls total) to synthesize its `\"final\"` answer from the tool results.\n   - If on that final turn the model *still* requests another (valid!) `\"tool\"`, **do NOT execute the tool or append to `messages`**—return `{\"status\": \"limit\", \"text\": None}`.\n4. **Exceptions:** Let any exception raised inside `model(...)` or `tools[name](...)` propagate naturally (no retries).\n\n### Self-guided workflow (30 min)\n- **Step 1 (5 min):** Trace `max_tool_calls = 1`: `for used in range(max_tool_calls + 1):` runs for `used = 0` (1st model call -> can run 1st tool) and `used = 1` (2nd model call -> must return `\"final\"`, else if `\"tool\"` hit `\"limit\"`!).\n- **Step 2 (15 min):** Implement `run_agent` cleanly using that `for used in range(max_tool_calls + 1):` loop.\n- **Step 3 (10 min):** Run `check_agent()`, then add tests for unknown tools and malformed responses.\"\"\"\n\nimport asyncio\nimport math\nfrom collections import defaultdict\n\ndef run_agent(question: str, model, tools: dict, max_tool_calls: int) -> dict:\n    \"\"\"Run a bounded synchronous tool-calling loop for up to max_tool_calls tool executions.\"\"\"\n    raise NotImplementedError\n\ndef check_agent():\n    calls = []\n\n    def lookup(symbol):\n        calls.append(symbol)\n        return \"42\"\n\n    # 1. Standard 1-tool-then-final trajectory records assistant + tool messages in order\n    def model_once(messages):\n        if len(messages) == 1:\n            assert messages == [{\"role\": \"user\", \"content\": \"price?\"}]\n            return {\"type\": \"tool\", \"name\": \"lookup\", \"arguments\": {\"symbol\": \"A\"}}\n        assert messages[-1] == {\"role\": \"tool\", \"name\": \"lookup\", \"content\": \"42\"}\n        return {\"type\": \"final\", \"text\": \"42\"}\n\n    assert run_agent(\"price?\", model_once, {\"lookup\": lookup}, max_tool_calls=1) == {\n        \"status\": \"answered\",\n        \"text\": \"42\",\n    }\n    assert calls == [\"A\"]\n\n    # 2. Runaway tool loop stops at budget=2 WITHOUT executing a 3rd tool call\n    calls.clear()\n\n    def looping_model(messages):\n        return {\"type\": \"tool\", \"name\": \"lookup\", \"arguments\": {\"symbol\": \"A\"}}\n\n    assert run_agent(\"q\", looping_model, {\"lookup\": lookup}, max_tool_calls=2) == {\n        \"status\": \"limit\",\n        \"text\": None,\n    }\n    assert calls == [\"A\", \"A\"], f\"Expected exactly 2 tool executions, got {calls}\"\n\n    # 3. Zero tool budget still allows an immediate final answer\n    assert run_agent(\"q\", lambda m: {\"type\": \"final\", \"text\": \"ok\"}, {}, max_tool_calls=0) == {\n        \"status\": \"answered\",\n        \"text\": \"ok\",\n    }\n    print(\"Agent sample checks passed! Add validation-before-limit and unknown-tool tests below.\")\n\ncheck_agent()\n\ndef my_extra_agent_tests():\n    # Practice writing 2 edge-case tests:\n    # TODO 1: With max_tool_calls=0, if model returns an UNKNOWN tool {\"type\": \"tool\", \"name\": \"hack\", \"arguments\": {}},\n    #         it must raise ValueError (validation happens BEFORE returning \"limit\"!).\n    # TODO 2: Extra unexpected keys like {\"type\": \"final\", \"text\": \"hi\", \"extra\": 1} raise ValueError.\n    pass\n\nmy_extra_agent_tests()\n"}, {"label": "Applied AI: Macro Retrieval Eval Metrics", "path": "ml_coding/applied_ai_live/evaluation.py", "code": "\"\"\"Fresh mock · retrieval evaluation harness (Precision@k, Recall@k, MRR@k)\n\n### Goal & real-interview context\nKeep this exercise **unseen** until your final 60-minute timed mock!\nEvery Fundamental Equities AI system (search over transcripts, SEC filings, or sell-side notes) lives or dies by offline retrieval evaluation. Subtle bugs in **denominator choice, missing predictions, or duplicate ranked IDs** silently inflate metrics and mislead model decisions.\n\n### Function signature & data shapes\n```python\nevaluate_runs(\n    gold: dict[str, set[str]],   # query_id -> set of relevant doc_ids (may be empty set()!)\n    predictions: Iterable[dict], # one-pass iterable of {\"query_id\": str, \"ranked_ids\": list[str]}\n    k: int,                      # cutoff > 0\n) -> dict[str, int | float]\n\n# Return shape:\n{\n    \"queries\": int,       # count of scored queries (gold queries with NON-EMPTY relevant sets)\n    \"precision\": float,   # macro-average Precision@k across scored queries\n    \"recall\": float,      # macro-average Recall@k across scored queries\n    \"mrr\": float,         # macro-average Reciprocal Rank@k across scored queries\n}\n```\n\n### Step-by-step metric & edge-case rules\n1. **Validate `k`:** Require `k > 0`; otherwise raise `ValueError`.\n2. **Scored query denominator (`queries`):**\n   - Only `query_id`s in `gold` whose relevant set is **non-empty** (`len(gold[qid]) > 0`) are scored.\n   - Queries in `gold` with `set()` (empty relevance set) are **excluded** from `queries` and from all metric denominators.\n   - If `queries == 0`, still consume `predictions` to validate `query_id`s (Rule 3!), then return `{\"queries\": 0, \"precision\": 0.0, \"recall\": 0.0, \"mrr\": 0.0}`.\n3. **One-pass `predictions` & validation:**\n   - `predictions` may be a generator/iterator (iterate over it **once**; at most one record per `query_id` is guaranteed).\n   - If any prediction has a `query_id not in gold` (even when `gold` has only empty sets!), raise `ValueError`.\n   - Any scored query in `gold` that is **absent** from `predictions` counts as having `ranked_ids = []` (contributing `0.0` to `precision`, `recall`, and `mrr`—do **not** drop missing predictions from the denominator!).\n4. **Deduplicate BEFORE truncating to `k`:**\n   - Remove duplicate `doc_id`s in `ranked_ids` keeping **first occurrence** order, *then* take the first `k` unique IDs (`top_k`). (For example, `[\"x\", \"a\", \"a\", \"b\"]` with `k=3` becomes `[\"x\", \"a\", \"b\"]`).\n5. **Per-query formulas (on deduplicated `top_k`):**\n   - Let `hits` = number of docs in `top_k` that appear in `gold[qid]`.\n   - **`precision@k`** = `hits / k` *(always divide by `k`, even if `len(top_k) < k`!)*.\n   - **`recall@k`** = `hits / len(gold[qid])`.\n   - **`rr@k`** = `1 / rank` of the **first** relevant doc in `top_k` (1-indexed: rank 1 -> `1.0`, rank 2 -> `0.5`, ...), or `0.0` if `hits == 0`.\n6. Macro-average `precision@k`, `recall@k`, and `rr@k` by dividing each sum by `queries`.\n\n### Worked trace\n```python\ngold = {\n    \"q1\": {\"a\", \"b\"},   # scored (2 relevant docs)\n    \"q2\": {\"c\"},        # scored, MISSING from predictions -> contributes 0, 0, 0!\n    \"skip\": set(),      # empty gold set -> ignored in denominator\n}\npredictions = [\n    {\"query_id\": \"q1\", \"ranked_ids\": [\"x\", \"a\", \"a\", \"b\"]},\n]\n# With k = 3:\n# - Scored queries = 2 (\"q1\" and \"q2\")\n# - For \"q1\": dedup([\"x\", \"a\", \"a\", \"b\"])[:3] -> [\"x\", \"a\", \"b\"]\n#     hits = 2 (\"a\" at rank 2, \"b\" at rank 3)\n#     P@3 = 2/3,  R@3 = 2/2 = 1.0,  RR@3 = 1/2 = 0.5\n# - For \"q2\": missing -> P@3 = 0.0, R@3 = 0.0, RR@3 = 0.0\n# - Macro means over 2 scored queries:\n#     precision = (2/3 + 0) / 2 = 1/3\n#     recall    = (1.0 + 0) / 2 = 0.5\n#     mrr       = (0.5 + 0) / 2 = 0.25\n```\"\"\"\n\nimport asyncio\nimport math\nfrom collections import defaultdict\n\ndef evaluate_runs(gold: dict[str, set[str]], predictions, k: int) -> dict:\n    \"\"\"Compute macro Precision@k, Recall@k, and MRR@k over non-empty gold queries.\"\"\"\n    raise NotImplementedError\n\ndef check_evaluation():\n    # 1. Worked example: deduplication before top-k, missing prediction (\"q2\"), and empty gold (\"skip\")\n    gold = {\"q1\": {\"a\", \"b\"}, \"q2\": {\"c\"}, \"skip\": set()}\n    result = evaluate_runs(gold, iter([{\"query_id\": \"q1\", \"ranked_ids\": [\"x\", \"a\", \"a\", \"b\"]}]), 3)\n    assert result[\"queries\"] == 2\n    assert math.isclose(result[\"precision\"], 1 / 3)\n    assert math.isclose(result[\"recall\"], 0.5)\n    assert math.isclose(result[\"mrr\"], 0.25)\n\n    # 2. Empty gold dictionary returns 0 queries and 0.0 metrics\n    assert evaluate_runs({}, [], 1) == {\"queries\": 0, \"precision\": 0.0, \"recall\": 0.0, \"mrr\": 0.0}\n\n    # 3. Unknown query_id in predictions still raises ValueError even when no queries are scored\n    try:\n        evaluate_runs({}, [{\"query_id\": \"unknown\", \"ranked_ids\": []}], 1)\n        raise AssertionError(\"Expected ValueError for unknown query_id\")\n    except ValueError:\n        pass\n\n    print(\"Evaluation sample checks passed! Add short-ranking (< k) and duplicate-miss tests below.\")\n\ncheck_evaluation()\n\ndef my_extra_evaluation_tests():\n    # Practice writing 2 edge-case tests during your mock:\n    # TODO 1: Short ranking len(ranked_ids) < k still divides precision@k by k (e.g., 1 hit in 1 result for k=4 -> P@4 = 0.25).\n    # TODO 2: Prediction for an empty-gold query (\"skip\": set()) does NOT raise ValueError and does NOT increment \"queries\".\n    pass\n\nmy_extra_evaluation_tests()\n"}, {"label": "PyTorch Reference Solutions", "path": "ml_coding/pytorch_transformers/solutions_pytorch.py", "code": "\"\"\"Reference Implementations for PyTorch, Transformers & Post-Training Labs (Labs 1–4).\"\"\"\n\nfrom __future__ import annotations\n\nfrom typing import Optional\nimport math\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\nfrom .ex2_attention_and_kvcache import KVCache\nfrom .ex4_buggy_pytorch_trainer import TinyPooledClassifier\n\n\n# ============================================================================\n# Lab 1: Classical ML & Numerically Stable Losses\n# ============================================================================\n\n\ndef stable_log_softmax(logits: torch.Tensor, dim: int = -1) -> torch.Tensor:\n    max_logits = logits.max(dim=dim, keepdim=True).values\n    shifted = logits - max_logits\n    log_denom = torch.log(torch.exp(shifted).sum(dim=dim, keepdim=True))\n    return shifted - log_denom\n\n\ndef masked_cross_entropy(\n    logits: torch.Tensor,\n    targets: torch.Tensor,\n    ignore_index: int = -100,\n) -> torch.Tensor:\n    flat_logits = logits.reshape(-1, logits.shape[-1])\n    flat_targets = targets.reshape(-1)\n    valid_mask = flat_targets != ignore_index\n    valid_count = valid_mask.sum()\n    if valid_count == 0:\n        return flat_logits.sum() * 0.0\n\n    log_probs = stable_log_softmax(flat_logits, dim=-1)\n    safe_targets = flat_targets.masked_fill(~valid_mask, 0).long()\n    picked = log_probs.gather(dim=-1, index=safe_targets.unsqueeze(-1)).squeeze(-1)\n    nll = -picked.masked_fill(~valid_mask, 0.0)\n    return nll.sum() / valid_count\n\n\ndef kmeans_pytorch(\n    x: torch.Tensor,\n    k: int,\n    num_iters: int = 20,\n    seed: int = 0,\n) -> tuple[torch.Tensor, torch.Tensor]:\n    if x.ndim != 2 or k <= 0 or x.shape[0] < k or num_iters <= 0:\n        raise ValueError(\"Expected x of shape (N, D) with N >= k > 0 and num_iters >= 1\")\n\n    gen = torch.Generator(device=x.device).manual_seed(seed)\n    perm = torch.randperm(x.shape[0], generator=gen, device=x.device)\n    centroids = x[perm[:k]].clone()\n    prev_assignments: Optional[torch.Tensor] = None\n\n    for _ in range(num_iters):\n        # ||x - c||^2 = ||x||^2 + ||c||^2 - 2 x @ c^T, clamped for float precision\n        x_sq = (x * x).sum(dim=-1, keepdim=True)  # (N, 1)\n        c_sq = (centroids * centroids).sum(dim=-1).unsqueeze(0)  # (1, k)\n        dists = (x_sq + c_sq - 2.0 * (x @ centroids.T)).clamp_min(0.0)  # (N, k)\n        assignments = dists.argmin(dim=-1)\n\n        if prev_assignments is not None and torch.equal(assignments, prev_assignments):\n            break\n        prev_assignments = assignments\n\n        min_dists = dists.gather(1, assignments.unsqueeze(1)).squeeze(1)\n        new_centroids = torch.zeros_like(centroids)\n        counts = torch.bincount(assignments, minlength=k)\n        new_centroids.index_add_(0, assignments, x)\n\n        non_empty = counts > 0\n        new_centroids[non_empty] /= counts[non_empty].unsqueeze(-1).to(x.dtype)\n\n        if (~non_empty).any():\n            # Deterministic empty-cluster repair: pick farthest points one by one\n            candidate_dists = min_dists.clone()\n            for cluster_id in torch.where(~non_empty)[0].tolist():\n                farthest_idx = int(candidate_dists.argmax().item())\n                new_centroids[cluster_id] = x[farthest_idx]\n                candidate_dists[farthest_idx] = -1.0\n\n        centroids = new_centroids\n\n    # Final assignment sync against returned centroids\n    x_sq = (x * x).sum(dim=-1, keepdim=True)\n    c_sq = (centroids * centroids).sum(dim=-1).unsqueeze(0)\n    final_dists = (x_sq + c_sq - 2.0 * (x @ centroids.T)).clamp_min(0.0)\n    return centroids, final_dists.argmin(dim=-1)\n\n\nclass GaussianNaiveBayes:\n    def __init__(self) -> None:\n        self.classes_: Optional[torch.Tensor] = None\n        self.log_priors_: Optional[torch.Tensor] = None\n        self.means_: Optional[torch.Tensor] = None\n        self.vars_: Optional[torch.Tensor] = None\n\n    def fit(self, x: torch.Tensor, y: torch.Tensor, eps: float = 1e-6) -> \"GaussianNaiveBayes\":\n        classes = torch.unique(y, sorted=True)\n        c_count = classes.numel()\n        d = x.shape[1]\n        means = torch.zeros((c_count, d), dtype=x.dtype, device=x.device)\n        vars_ = torch.zeros((c_count, d), dtype=x.dtype, device=x.device)\n        log_priors = torch.zeros(c_count, dtype=x.dtype, device=x.device)\n\n        n_total = float(x.shape[0])\n        for idx, cls in enumerate(classes):\n            cls_x = x[y == cls]\n            log_priors[idx] = math.log(cls_x.shape[0] / n_total)\n            means[idx] = cls_x.mean(dim=0)\n            vars_[idx] = cls_x.var(dim=0, unbiased=False) + eps\n\n        self.classes_ = classes\n        self.log_priors_ = log_priors\n        self.means_ = means\n        self.vars_ = vars_\n        return self\n\n    def predict_log_proba(self, x: torch.Tensor) -> torch.Tensor:\n        if self.classes_ is None or self.means_ is None or self.vars_ is None or self.log_priors_ is None:\n            raise RuntimeError(\"Call fit() before predict_log_proba().\")\n        # Broadcast (N, 1, D) against (1, C, D)\n        diff = x.unsqueeze(1) - self.means_.unsqueeze(0)\n        log_likelihood = -0.5 * (\n            math.log(2.0 * math.pi) + torch.log(self.vars_.unsqueeze(0)) + (diff * diff) / self.vars_.unsqueeze(0)\n        ).sum(dim=-1)\n        joint_log_prob = self.log_priors_.unsqueeze(0) + log_likelihood  # (N, C)\n        return stable_log_softmax(joint_log_prob, dim=-1)\n\n    def predict(self, x: torch.Tensor) -> torch.Tensor:\n        assert self.classes_ is not None\n        best = self.predict_log_proba(x).argmax(dim=-1)\n        return self.classes_[best]\n\n\n# ============================================================================\n# Lab 2: RoPE & Causal Grouped-Query Attention with KV Cache\n# ============================================================================\n\n\ndef apply_rope(x: torch.Tensor, positions: torch.Tensor, base: float = 10000.0) -> torch.Tensor:\n    \"\"\"x: (B, H, T, D_h), positions: (T,) or (B, T).\"\"\"\n    bsz, _, seq_len, head_dim = x.shape\n    if head_dim % 2 != 0:\n        raise ValueError(\"head_dim must be even\")\n    half = head_dim // 2\n    inv_freq = 1.0 / (\n        base ** (torch.arange(0, half, device=x.device, dtype=torch.float32) / float(half))\n    )  # (D_h/2,)\n\n    if positions.ndim == 1:\n        pos = positions.unsqueeze(0).expand(bsz, seq_len).to(torch.float32)\n    elif positions.ndim == 2:\n        pos = positions.to(torch.float32)\n    else:\n        raise ValueError(\"positions must have shape (T,) or (B, T)\")\n\n    angles = pos.unsqueeze(-1) * inv_freq.view(1, 1, half)  # (B, T, D_h/2)\n    cos = torch.cos(angles).unsqueeze(1).to(x.dtype)  # (B, 1, T, D_h/2)\n    sin = torch.sin(angles).unsqueeze(1).to(x.dtype)  # (B, 1, T, D_h/2)\n\n    x_even = x[..., 0::2]\n    x_odd = x[..., 1::2]\n    rot_even = x_even * cos - x_odd * sin\n    rot_odd = x_even * sin + x_odd * cos\n    return torch.stack((rot_even, rot_odd), dim=-1).flatten(-2)\n\n\nclass ReferenceCausalGQAWithCache(nn.Module):\n    def __init__(self, d_model: int, num_q_heads: int, num_kv_heads: int) -> None:\n        super().__init__()\n        if d_model % num_q_heads != 0 or num_q_heads % num_kv_heads != 0:\n            raise ValueError(\"Invalid head configuration\")\n        self.d_model = d_model\n        self.num_q_heads = num_q_heads\n        self.num_kv_heads = num_kv_heads\n        self.head_dim = d_model // num_q_heads\n        if self.head_dim % 2 != 0:\n            raise ValueError(\"head_dim must be even\")\n        self.group_size = num_q_heads // num_kv_heads\n\n        self.q_proj = nn.Linear(d_model, num_q_heads * self.head_dim, bias=False)\n        self.k_proj = nn.Linear(d_model, num_kv_heads * self.head_dim, bias=False)\n        self.v_proj = nn.Linear(d_model, num_kv_heads * self.head_dim, bias=False)\n        self.o_proj = nn.Linear(d_model, d_model, bias=False)\n\n    def forward(\n        self,\n        x: torch.Tensor,\n        key_padding_mask: Optional[torch.Tensor] = None,\n        kv_cache: Optional[KVCache] = None,\n        use_cache: bool = False,\n    ) -> tuple[torch.Tensor, Optional[KVCache]]:\n        bsz, t_q, _ = x.shape\n        past_len = kv_cache.seq_len if kv_cache is not None else 0\n\n        q = self.q_proj(x).view(bsz, t_q, self.num_q_heads, self.head_dim).transpose(1, 2)\n        k_new = self.k_proj(x).view(bsz, t_q, self.num_kv_heads, self.head_dim).transpose(1, 2)\n        v_new = self.v_proj(x).view(bsz, t_q, self.num_kv_heads, self.head_dim).transpose(1, 2)\n\n        pos = torch.arange(past_len, past_len + t_q, device=x.device)\n        q = apply_rope(q, pos)\n        k_new = apply_rope(k_new, pos)\n\n        if kv_cache is not None:\n            k_all = torch.cat([kv_cache.k, k_new], dim=2)\n            v_all = torch.cat([kv_cache.v, v_new], dim=2)\n        else:\n            k_all, v_all = k_new, v_new\n\n        next_cache = KVCache(k=k_all, v=v_all) if use_cache else None\n        t_k = k_all.shape[2]\n\n        # Expand KV heads to match Q heads without copying memory where possible\n        if self.group_size > 1:\n            k_exp = k_all.repeat_interleave(self.group_size, dim=1)\n            v_exp = v_all.repeat_interleave(self.group_size, dim=1)\n        else:\n            k_exp, v_exp = k_all, v_all\n\n        scores = torch.matmul(q, k_exp.transpose(-2, -1)) / math.sqrt(self.head_dim)  # (B, H_q, T_q, T_k)\n\n        q_idx = torch.arange(past_len, past_len + t_q, device=x.device).unsqueeze(1)  # (T_q, 1)\n        k_idx = torch.arange(0, t_k, device=x.device).unsqueeze(0)  # (1, T_k)\n        allowed = k_idx <= q_idx  # (T_q, T_k)\n        allowed = allowed.view(1, 1, t_q, t_k)\n\n        if key_padding_mask is not None:\n            if key_padding_mask.shape != (bsz, t_k):\n                raise ValueError(f\"Expected key_padding_mask of shape {(bsz, t_k)}, got {tuple(key_padding_mask.shape)}\")\n            allowed = allowed & key_padding_mask.view(bsz, 1, 1, t_k)\n\n        # Prevent all-masked rows from producing softmax([-inf, ...]) -> NaN (and NaN backward!)\n        has_any_valid = allowed.any(dim=-1, keepdim=True)  # (B, 1, T_q, 1)\n        safe_scores = scores.masked_fill(~allowed, float(\"-inf\"))\n        safe_scores = torch.where(has_any_valid, safe_scores, torch.zeros_like(safe_scores))\n        weights = torch.softmax(safe_scores, dim=-1)\n        weights = weights * has_any_valid.to(weights.dtype)\n\n        if key_padding_mask is not None:\n            query_valid = key_padding_mask[:, past_len : past_len + t_q].view(bsz, 1, t_q, 1)\n            weights = weights * query_valid.to(weights.dtype)\n\n        attn_out = torch.matmul(weights, v_exp)  # (B, H_q, T_q, D_h)\n        merged = attn_out.transpose(1, 2).contiguous().view(bsz, t_q, self.d_model)\n        return self.o_proj(merged), next_cache\n\n\n# ============================================================================\n# Lab 3: LoRA, DPO & GRPO\n# ============================================================================\n\n\nclass ReferenceLoRALinear(nn.Module):\n    def __init__(self, base_layer: nn.Linear, r: int = 8, alpha: float = 16.0) -> None:\n        super().__init_ logits = pi_logratios - ref_logratios\n    loss = -F.logsigmoid(beta * logits).mean()\n\n    chosen_rewards = (beta * (policy_chosen_logps - ref_w)).detach()\n    rejected_rewards = (beta * (policy_rejected_logps - ref_l)).detach()\n    return loss, chosen_rewards, rejected_rewards\n\n\ndef grpo_loss(\n    policy_logps: torch.Tensor,\n    old_logps: torch.Tensor,\n    rewards: torch.Tensor,\n    group_size: int,\n    response_mask: torch.Tensor,\n    ref_logps: Optional[torch.Tensor] = None,\n    clip_eps: float = 0.2,\n    beta_kl: float = 0.04,\n    eps: float = 1e-8,\n) -> torch.Tensor:\n    bsz, _ = policy_logps.shape\n    if group_size <= 0 or bsz % group_size != 0:\n        raise ValueError(\"Batch size must be divisible by positive group_size\")\n\n    grouped = rewards.detach().float().view(bsz // group_size, group_size)\n    mean = grouped.mean(dim=-1, keepdim=True)\n    std = grouped.std(dim=-1, unbiased=False, keepdim=True)\n    advantages = ((grouped - mean) / (std + eps)).view(bsz, 1).to(policy_logps.dtype)\n\n    old_detached = old_logps.detach()\n    ratio = torch.exp(policy_logps - old_detached)\n    unclipped = ratio * advantages\n    clipped = torch.clamp(ratio, 1.0 - clip_eps, 1.0 + clip_eps) * advantages\n    per_token_loss = -torch.minimum(unclipped, clipped)\n\n    if ref_logps is not None and beta_kl > 0.0:\n        ref_detached = ref_logps.detach()\n        log_diff = ref_detached - policy_logps\n        kl_k3 = torch.exp(log_diff) - log_diff - 1.0\n        per_token_loss = per_token_loss + beta_kl * kl_k3\n\n    mask = response_mask.to(policy_logps.dtype)\n    denom = mask.sum()\n    if denom == 0:\n        return policy_logps.sum() * 0.0\n    return (per_token_loss * mask).sum() / denom\n\n\n# ============================================================================\n# Lab 4: Repaired PyTorch Sequence Training Pipeline\n# ============================================================================\n\n\ndef fixed_train_and_eval(\n    x_train: torch.Tensor,\n    mask_train: torch.Tensor,\n    y_train: torch.Tensor,\n    x_val: torch.Tensor,\n    mask_val: torch.Tensor,\n    y_val: torch.Tensor,\n    epochs: int = 30,\n    lr: float = 0.05,\n    seed: int = 0,\n) -> dict[str, float]:\n    torch.manual_seed(seed)\n\n    # Fix 1: Fit feature normalizer strictly on valid tokens of x_train ONLY\n    valid_train_tokens = x_train[mask_train]  # (N_valid, D)\n    mean = valid_train_tokens.mean(dim=0).view(1, 1, -1)\n    std = valid_train_tokens.std(dim=0, unbiased=False).view(1, 1, -1).clamp_min(1e-6)\n    x_tr = (x_train - mean) / std\n    x_va = (x_val - mean) / std\n\n    model = TinyPooledClassifier(x_train.shape[-1])\n    opt = torch.optim.AdamW(model.parameters(), lr=lr)\n\n    last_loss = 0.0\n    model.train()\n    for _ in range(epochs):\n        opt.zero_grad()  # Fix 3: Clear stale gradients each step\n        logits = model(x_tr, mask_train, buggy_masking=False)  # Fix 2: -inf pad mask\n        loss = F.cross_entropy(logits, y_train)  # Fix 5: Numerically stable log-sum-exp CE\n        loss.backward()\n        opt.step()\n        last_loss = float(loss.item())\n\n    # Fix 4: Deterministic evaluation with dropout disabled & autograd off\n    model.eval()\n    with torch.no_grad():\n        val_logits = model(x_va, mask_val, buggy_masking=False)\n        val_acc = (val_logits.argmax(dim=-1) == y_val).float().mean().item()\n\n    return {\"train_loss\": last_loss, \"val_acc\": val_acc}\n"}, {"label": "Applied AI Reference Solutions", "path": "ml_coding/foundational_labs/ex6_ai_live/solutions.py", "code": "\"\"\"Answer keys for authored coding mocks. Reveal after an attempt.\"\"\"\nimport asyncio\nimport math\nfrom collections import defaultdict\n\ndef chunk_tokens(tokens: list[str], size: int, overlap: int) -> list[tuple[int, list[str]]]:\n    \"\"\"Return (start_index, token_slice_copy) pairs with stride = size - overlap.\"\"\"\n    if size <= 0 or not 0 <= overlap < size:\n        raise ValueError(\"Require size > 0 and 0 <= overlap < size\")\n    chunks = []\n    start = 0\n    while start < len(tokens):\n        chunks.append((start, tokens[start:start + size]))\n        if start + size >= len(tokens):\n            break\n        start += size - overlap\n    return chunks\n\nasync def answer_query(question: str, user: str, fetch, primary, fallback) -> dict:\n    \"\"\"Repaired async RAG path enforcing read ACLs, external egress, and citation grounding.\"\"\"\n    documents = await fetch(question)\n    context = [d for d in documents if user in d[\"readers\"]]\n    if not context:\n        return {\"status\": \"abstained\"}\n    try:\n        result = await primary(question, context)\n    except TimeoutError:\n        context = [d for d in context if d[\"external_ok\"]]\n        if not context:\n            return {\"status\": \"abstained\"}\n        result = await fallback(question, context)\n    ids = {d[\"id\"] for d in context}\n    if (not result[\"text\"].strip() or not result[\"citations\"]\n            or any(c not in ids for c in result[\"citations\"])):\n        return {\"status\": \"abstained\"}\n    return {\"status\": \"answered\", \"text\": result[\"text\"],\n            \"citations\": result[\"citations\"]}\n\ndef rank_documents(query: list[float], documents: list[dict], user: str, k: int) -> list[str]:\n    \"\"\"Return up to k readable non-zero-norm doc IDs ranked by (-cosine_similarity, doc_id).\"\"\"\n    if k <= 0:\n        return []\n    query_norm = math.sqrt(sum(x * x for x in query))\n    scored = []\n    for doc in documents:\n        if user not in doc[\"readers\"]:\n            continue\n        vector = doc[\"vector\"]\n        norm = math.sqrt(sum(x * x for x in vector))\n        if norm == 0:\n            continue\n        score = sum(a * b for a, b in zip(query, vector)) / (query_norm * norm)\n        scored.append((score, doc[\"id\"]))\n    scored.sort(key=lambda pair: (-pair[0], pair[1]))\n    return [doc_id for _, doc_id in scored[:k]]\n\ndef run_agent(question: str, model, tools: dict, max_tool_calls: int) -> dict:\n    \"\"\"Run a bounded synchronous tool-calling loop for up to max_tool_calls tool executions.\"\"\"\n    if max_tool_calls < 0:\n        raise ValueError(\"Tool budget must be nonnegative\")\n    messages = [{\"role\": \"user\", \"content\": question}]\n    for used in range(max_tool_calls + 1):\n        response = model(messages)\n        if not isinstance(response, dict):\n            raise ValueError(\"Response must be a dictionary\")\n        kind = response.get(\"type\")\n        if kind == \"final\":\n            if (set(response) != {\"type\", \"text\"}\n                    or not isinstance(response[\"text\"], str)\n                    or not response[\"text\"].strip()):\n                raise ValueError(\"Invalid final answer\")\n            return {\"status\": \"answered\", \"text\": response[\"text\"]}\n        if (kind != \"tool\" or set(response) != {\"type\", \"name\", \"arguments\"}\n                or not isinstance(response[\"name\"], str)\n                or response[\"name\"] not in tools\n                or not isinstance(response[\"arguments\"], dict)\n                or not all(isinstance(k, str) for k in response[\"arguments\"])):\n            raise ValueError(\"Invalid tool request\")\n        if used == max_tool_calls:\n            return {\"status\": \"limit\", \"text\": None}\n        name = response[\"name\"]\n        messages.append({\"role\": \"assistant\", \"content\": response})\n        result = tools[name](**response[\"arguments\"])\n        messages.append({\"role\": \"tool\", \"name\": name, \"content\": result})\n\ndef evaluate_runs(gold: dict[str, set[str]], predictions, k: int) -> dict:\n    \"\"\"Compute macro Precision@k, Recall@k, and MRR@k over non-empty gold queries.\"\"\"\n    if k <= 0:\n        raise ValueError(\"k must be positive\")\n    count = sum(bool(relevant) for relevant in gold.values())\n    precision = recall = reciprocal = 0.0\n    for prediction in predictions:\n        query_id = prediction[\"query_id\"]\n        if query_id not in gold:\n            raise ValueError(\"Unknown query ID\")\n        relevant = gold[query_id]\n        if not relevant:\n            continue\n        seen = set()\n        top = []\n        for doc_id in prediction[\"ranked_ids\"]:\n            if doc_id not in seen:\n                seen.add(doc_id)\n                top.append(doc_id)\n                if len(top) == k:\n                    break\n        hits = sum(doc_id in relevant for doc_id in top)\n        precision += hits / k\n        recall += hits / len(relevant)\n        reciprocal += next((1 / rank for rank, doc_id in enumerate(top, 1)\n                            if doc_id in relevant), 0.0)\n    if count:\n        precision /= count\n        recall /= count\n        reciprocal /= count\n    return {\"queries\": count, \"precision\": precision,\n            \"recall\": recall, \"mrr\": reciprocal}\n"}]};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));

const COOKIE_NAME = 'lc75_done';
const STORAGE_FALLBACK = 'lc75_done_fallback';

function loadSolved() {
  const m = document.cookie.match(new RegExp('(?:^|; )' + COOKIE_NAME + '=([^;]*)'));
  let raw = m ? decodeURIComponent(m[1]) : '';
  if (!raw) {
    try { raw = localStorage.getItem(STORAGE_FALLBACK) || ''; } catch {}
  }
  const set = new Set();
  for (const part of raw.split(',')) {
    const n = Number(part);
    if (Number.isInteger(n) && n > 0) set.add(n);
  }
  return set;
}

function saveSolved(set) {
  const csv = Array.from(set).sort((a, b) => a - b).join(',');
  document.cookie = `${COOKIE_NAME}=${encodeURIComponent(csv)}; max-age=31536000; path=/; SameSite=Lax`;
  try { localStorage.setItem(STORAGE_FALLBACK, csv); } catch {}
}

let solved = loadSolved();
let lcFilter = 'all';

  return `<ol class="framework-list">${fw.steps.map(s => `<li><h3>${esc(s.title)}</h3><ul>${s.items.map(item=>`<li>${item}</li>`).join('')}</ul></li>`).join('')}</ol>`;

}
