<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI & ML Interview Guide</title>
<style>:root {
  --bg: #f6f7f9;
  --card: #ffffff;
  --ink: #111827;
  --sub: #4b5563;
  --muted: #6b7280;
  --line: #e5e7eb;
  --line-strong: #d1d5db;
  --accent: #2563eb;
  --accent-bg: #eff6ff;
  --teal: #0f766e;
  --teal-bg: #f0fdfa;
  --purple: #6d28d9;
  --purple-bg: #f5f3ff;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14.5px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1080px;
  margin: 0 auto;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.brand {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.3px;
  color: var(--ink);
  text-decoration: none !important;
}
.tabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.tabs a {
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--sub);
  text-decoration: none;
  transition: background 0.12s, color 0.12s;
}
.tabs a:hover { background: #f3f4f6; color: var(--ink); }
.tabs a.active {
  background: var(--ink);
  color: #ffffff;
}

.container {
  max-width: 1080px;
  margin: 0 auto;
  padding: 32px 24px 72px;
}

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin: 34px 0 14px;
  flex-wrap: wrap;
}
.section-head:first-child { margin-top: 0; }
.section-head h2 {
  margin: 0;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.section-head span {
  font-size: 12.5px;
  color: var(--muted);
}

/* Framework switching pills */
.seg-bar {
  display: inline-flex;
  background: #eaecef;
  padding: 3px;
  border-radius: 8px;
  gap: 2px;
  margin-bottom: 18px;
}
.seg-btn {
  border: 0;
  background: transparent;
  padding: 6px 14px;
  border-radius: 6px;
  font: 600 13px var(--sans);
  color: var(--sub);
  cursor: pointer;
}
.seg-btn.active {
  background: var(--card);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
}

/* Visual Pipeline Strip */
.flow-strip {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 16px;
}
.flow-step {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 600;
  background: #f8fafc;
  border: 1px solid var(--line);
}
.flow-step small {
  font-weight: 400;
  color: var(--muted);
  font-size: 11.5px;
}
.flow-arrow {
  color: #9ca3af;
  font-size: 14px;
  user-select: none;
}

/* Visual Framework Cards */
.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.fw-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px 20px;
  box-shadow: 0 1px 2px rgba(17, 24, 39, 0.03);
}
.fw-card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.step-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 6px;
  font: 700 11.5px var(--sans);
  background: var(--accent-bg);
  color: var(--accent);
  flex-shrink: 0;
}
.theme-teal .step-num { background: var(--teal-bg); color: var(--teal); }
.theme-purple .step-num { background: var(--purple-bg); color: var(--purple); }

.fw-card h3 {
  margin: 0;
  font-size: 14.5px;
  font-weight: 650;
  letter-spacing: -0.15px;
}
.fw-card ul {
  margin: 0;
  padding-left: 17px;
  color: var(--sub);
  font-size: 13.5px;
}
.fw-card li { margin: 5px 0; }
.fw-card li strong { color: var(--ink); font-weight: 600; }

.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.chip {
  display: inline-block;
  font-size: 11.5px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 999px;
  background: #f3f4f6;
  color: var(--sub);
}

/* Accordion prompts & solutions */
details.clean-acc {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  margin-bottom: 8px;
}
details.clean-acc > summary {
  padding: 12px 16px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
details.clean-acc > summary::-webkit-details-marker { display: none; }
details.clean-acc > summary::after {
  content: "+";
  color: var(--muted);
  font-weight: 500;
  font-size: 16px;
}
details.clean-acc[open] > summary::after { content: "−"; }
details.clean-acc[open] > summary { border-bottom: 1px solid var(--line); }
.acc-body {
  padding: 14px 18px;
  font-size: 13.5px;
  color: var(--sub);
}
.acc-body ul { margin: 0; padding-left: 18px; }
.acc-body li { margin: 5px 0; }

/* LeetCode 75 Checklist */
.lc-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.lc-stats {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 13.5px;
  font-weight: 600;
}
.lc-bar {
  width: 140px;
  height: 7px;
  background: #e5e7eb;
  border-radius: 999px;
  overflow: hidden;
}
.lc-bar-fill {
  height: 100%;
  background: #10b981;
  transition: width 0.15s ease;
}
.lc-filters {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.filter-btn {
  border: 1px solid var(--line);
  background: #f9fafb;
  color: var(--sub);
  border-radius: 6px;
  padding: 5px 10px;
  font: 500 12.5px var(--sans);
  cursor: pointer;
}
.filter-btn.active {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}
.reset-btn {
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 12px;
  cursor: pointer;
  padding: 4px 6px;
}
.reset-btn:hover { color: #dc2626; }

.lc-group {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.lc-group-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 11px 16px;
  background: #f9fafb;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  font-weight: 650;
}
.lc-group-head span {
  font-weight: 500;
  font-size: 12px;
  color: var(--muted);
}
.lc-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 16px;
  border-bottom: 1px solid #f3f4f6;
  font-size: 13.5px;
}
.lc-row:last-child { border-bottom: 0; }
.lc-row:hover { background: #fafbfc; }
.lc-row input[type="checkbox"] {
  width: 15px;
  height: 15px;
  accent-color: #10b981;
  cursor: pointer;
  margin: 0;
  flex-shrink: 0;
}
.lc-num {
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  min-width: 34px;
}
.lc-title {
  color: var(--ink);
  font-weight: 500;
  flex: 1;
}
.lc-row.done .lc-title {
  color: #9ca3af;
  text-decoration: line-through;
}
.diff {
  font-size: 11px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 999px;
}
.diff-E { background: #ecfdf5; color: #047857; }
.diff-M { background: #fffbeb; color: #b45309; }
.diff-H { background: #fef2f2; color: #b91c1c; }
.local-pill {
  font-size: 10.5px;
  padding: 1px 6px;
  border-radius: 4px;
  background: #eff6ff;
  color: #1d4ed8;
}

/* Tables & Code Snippets (used sparingly where genuinely code/tabular) */
.clean-table-wrap {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
}
th, td {
  padding: 11px 14px;
  border-bottom: 1px solid #f1f5f9;
  text-align: left;
  vertical-align: top;
}
tr:last-child td { border-bottom: 0; }
th {
  background: #f8fafc;
  font-size: 12px;
  font-weight: 650;
  color: var(--sub);
  border-bottom: 1px solid var(--line);
}

code {
  font: 12.5px/1.4 var(--mono);
  background: #f1f5f9;
  padding: 2px 5px;
  border-radius: 4px;
}
pre {
  margin: 10px 0 0;
  padding: 13px 15px;
  background: #0f172a;
  color: #e2e8f0;
  border-radius: 8px;
  overflow-x: auto;
  font: 12px/1.6 var(--mono);
}
pre code { background: transparent; padding: 0; color: inherit; }

@media (max-width: 860px) {
  .grid-3, .grid-2 { grid-template-columns: 1fr; }
}

/* Reading-first design layout and offline syntax colors. */
.framework-list {max-width:900px;padding-left:26px}.framework-list>li{padding:12px 0;border-bottom:1px solid #e3e7ec}.framework-list h3{margin:0 0 8px}.framework-list ul{line-height:1.8}.design-list{display:block}.design-list .fw-card{border:0;border-bottom:1px solid #e3e7ec;border-radius:0;margin-bottom:12px}.diagram{overflow-x:auto;margin:24px 0}.diagram svg{display:block;width:100%;min-width:760px;height:auto}pre{background:#f5f7fb!important;color:#23334b!important;line-height:1.65;tab-size:4}.syntax-keyword{color:#7337a3;font-weight:600}.syntax-string{color:#166941}.syntax-comment{color:#5d6879;font-style:italic}.syntax-number{color:#a34519}section{margin-bottom:28px}.tabs{flex-wrap:wrap}
</style>
</head>

</header>

<script>const COURSE = {"frameworks": {"ml": {"theme": "", "flow": [{"name": "Formulation", "note": "goals & SLAs"}, {"name": "Metrics", "note": "online + offline"}, {"name": "Retrieval", "note": "candidates"}, {"name": "Ranking", "note": "light → heavy"}, {"name": "Policy Layer", "note": "diversity / rules"}, {"name": "Monitoring", "note": "drift & retrain"}], "steps": [{"title": "Problem Formulation", "items": ["<strong>Goals:<\/strong> business objective → ML objective", "<strong>Functional:<\/strong> what is in scope? multi-modal? live or batch?", "<strong>Non-functional:<\/strong> latency, number of users, items, QPS"], "tags": ["Scope", "Live vs Batch", "Latency"]}, {"title": "Metrics", "items": ["<strong>Online:<\/strong> CTR / conversion / engagement + guardrails (latency, hide rate)", "<strong>Offline:<\/strong> <code>Recall@K<\/code>, <code>NDCG@K<\/code>, <code>LogLoss / NE<\/code>, calibration (<code>ECE<\/code>)"], "tags": ["Online", "Offline", "Guardrails"]}, {"title": "High-Level Components", "items": ["Major pipeline stages end-to-end", "Candidate retrieval → Light ranker → Heavy ranker → Re-ranker / Policy"], "tags": ["Two-Stage Funnel"]}, {"title": "Data", "items": ["<strong>Labels &amp; signals:<\/strong> explicit vs implicit, negatives (in-batch + log-Q, hard)", "<strong>Features:<\/strong> scaling, missing values, ID / sequence / multimodal encoding", "<strong>Splits:<\/strong> sampling, temporal / user-stratified train-test split (zero leakage)"], "tags": ["Labels", "Features", "Temporal Split"]}, {"title": "Modeling", "items": ["<strong>Progression:<\/strong> heuristic / GBDT baseline → neural / sequence / multi-task architecture", "<strong>Loss &amp; eval:<\/strong> pointwise BCE vs pairwise/listwise; offline slice checks"], "tags": ["Baseline First", "Loss", "Calibration"]}, {"title": "Deployment & Scaling", "items": ["<strong>Serving:<\/strong> end-to-end prediction service + non-ML policy/filtering layers", "<strong>Operations:<\/strong> monitoring, alerts, feature/label drift, retraining cadence"], "tags": ["Serving", "Policy Layer", "Drift"]}]}}, "theory": [{"group": "ML basics", "q": "Bias versus variance?", "a": "High training error suggests underfitting or an optimization/data issue; low training error with a large validation gap suggests overfitting. Compare learning curves before choosing more data, capacity or regularization.", "follow": "What if both errors rise after a data refresh?"}, {"group": "ML basics", "q": "How do you prevent leakage?", "a": "Split before fitting scalers, imputers or feature selection. Use time splits for forecasting and group splits for repeated entities. Features must exist at prediction time; tune on validation, evaluate once on held-out test.", "follow": "Why can random splitting inflate a recommender metric?"}, {"group": "ML basics", "q": "L1 versus L2 regularization?", "a": "Add lambda times the L1 norm or squared L2 norm to the loss. L1 can create exact zeros; L2 shrinks weights smoothly. Scale features first. Choose lambda on validation data; more regularization can underfit.", "follow": "Why does the intercept often remain unpenalized?"}, {"group": "ML basics", "q": "Linear versus logistic regression?", "a": "Linear regression predicts a real value and commonly minimizes squared error. Logistic regression models p(y=1|x)=sigmoid(w·x+b), minimizing binary cross entropy. Both are linear in their score; logistic predictions are nonlinear probabilities.", "follow": "Derive the logistic gradient Xᵀ(p−y)/n."}, {"group": "ML basics", "q": "Why not invert XᵀX?", "a": "The normal equation requires full column rank, not merely enough rows. Correlated columns can make it singular or ill-conditioned. Use least squares via QR/SVD; ridge adds a regularization term but changes the objective.", "follow": "Show a matrix with n>d and duplicate columns."}, {"group": "ML basics", "q": "What does Naive Bayes assume?", "a": "Features are conditionally independent given the class, not unconditionally independent. Sum log likelihoods plus log prior; smoothing prevents unseen categories from forcing zero likelihood. Gaussian, categorical and multinomial variants use different likelihoods.", "follow": "Why can it classify well but be poorly calibrated?"}, {"group": "ML basics", "q": "What does k-means optimize?", "a": "Sum of squared distances to assigned centroids. Alternate nearest-center assignment and mean updates. Initialization affects the local optimum; scale features and consider multiple restarts. Retain or reseed an empty center explicitly.", "follow": "Why is a mean appropriate for squared distance but not absolute distance?"}, {"group": "ML basics", "q": "Bagging versus boosting?", "a": "Bagging trains models on resampled data and averages them, often reducing variance. Boosting adds models sequentially to address the current loss residuals or gradients. Tree depth, learning rate and number of rounds control capacity.", "follow": "When would a boosted tree beat a neural network on tabular data?"}, {"group": "ML basics", "q": "Metrics for imbalanced classification?", "a": "Precision measures correctness among predicted positives; recall measures coverage of actual positives. Choose the threshold using error costs or a precision/recall constraint. PR curves emphasize rare-positive performance; ROC-AUC alone can hide a poor operating point.", "follow": "Can a high-AUC model have bad probability calibration?"}, {"group": "ML basics", "q": "Offline versus online recommender quality?", "a": "Recall@K measures candidate coverage; NDCG rewards relevant results near the top. Neither proves engagement or retention improves. Run controlled experiments with latency, negative feedback and diversity guardrails; watch exposure and selection bias.", "follow": "How do you evaluate items that the old policy never showed?"}, {"group": "Deep learning", "q": "What is backpropagation?", "a": "Apply the chain rule through a computation graph, accumulating gradients for parameters used along multiple paths. The optimizer then updates parameters. Gradients accumulate in PyTorch, so clear them at the intended update boundary.", "follow": "Explain why detach breaks a gradient path."}, {"group": "Deep learning", "q": "Why do gradients vanish or explode?", "a": "Repeated Jacobian products can shrink or grow gradients. Saturating activations worsen vanishing; initialization, residual connections and normalization help. Gradient clipping addresses large gradients but does not fix incorrect objectives or data.", "follow": "What would you inspect when the loss becomes NaN?"}, {"group": "Deep learning", "q": "BatchNorm versus LayerNorm?", "a": "BatchNorm uses batch-dependent statistics during training and typically running statistics at inference. LayerNorm normalizes specified feature dimensions per example/token and does not depend on other batch members. Their normalization axes matter.", "follow": "Why is LayerNorm convenient for variable-length language modeling?"}, {"group": "Deep learning", "q": "Dropout, eval and no_grad?", "a": "Dropout randomly removes activations during training with compensating scaling. model.eval changes behavior of modules such as dropout and BatchNorm; it does not disable autograd. no_grad disables graph recording but does not switch module mode.", "follow": "What goes wrong if validation runs in train mode?"}, {"group": "Deep learning", "q": "SGD, momentum and Adam?", "a": "SGD follows the minibatch gradient. Momentum averages gradient directions. Adam tracks first and second moments for coordinate-wise adaptation with bias correction. Learning rate still matters; AdamW decouples weight decay from the adaptive gradient update.", "follow": "Why might you use a warmup schedule?"}, {"group": "Transformers", "q": "Derive attention and shapes.", "a": "For X of shape B×T×E, project Q,K to B×T×d_k and V to B×T×d_v. softmax(QKᵀ/√d_k) has shape B×T×T; multiplying V yields B×T×d_v. Normalize over key positions.", "follow": "Why divide by √d_k?"}, {"group": "Transformers", "q": "Causal versus padding masks?", "a": "Causal masks prevent attending to future tokens; padding masks exclude padding keys. Apply masks to logits before softmax, typically with negative infinity. Define behavior for fully masked rows to avoid NaNs.", "follow": "Why does multiplying logits by zero not mask them?"}, {"group": "Transformers", "q": "What makes a Transformer block?", "a": "Multi-head attention combines learned attention subspaces; a position-wise feed-forward network transforms features. Residual connections and normalization stabilize depth. Position information is required because unpositioned self-attention is permutation equivariant.", "follow": "Contrast encoder self-attention, decoder masked attention and cross-attention."}, {"group": "Transformers", "q": "What does KV caching save?", "a": "During autoregressive decoding, reuse old keys and values instead of recomputing them. Each new query still attends to the available context. Cache memory per token is 2×layers×KV_heads×head_dim×bytes, per sequence; query heads may differ under GQA.", "follow": "Why cache K and V but usually not old Q?"}, {"group": "Transformers", "q": "Attention cost and FlashAttention?", "a": "Dense attention interactions scale quadratically with sequence length. FlashAttention uses tiled exact attention to reduce memory traffic and avoid materializing the full attention matrix; it does not make dense attention mathematically linear-time.", "follow": "How do prefill and one-token decode differ?"}, {"group": "Transformers", "q": "Fine-tuning, LoRA or RAG?", "a": "Fine-tuning changes model behavior/weights; LoRA trains low-rank updates to selected weights. RAG supplies retrieved context at inference and supports updating knowledge separately. They can be combined; assess answer quality and retrieval quality separately.", "follow": "When is prompt engineering enough?"}, {"group": "ML basics", "q": "When are linear regression assumptions needed?", "a": "Least squares does not require normally distributed input features. Full column rank gives a unique coefficient solution; zero conditional mean errors support unbiasedness. Homoscedasticity and uncorrelated errors underpin classical variance formulas; normal errors support exact small-sample inference. Prediction can still be useful when inferential assumptions fail.", "follow": "What changes with heteroscedastic errors?"}, {"group": "ML basics", "q": "How do you handle missing and categorical features?", "a": "Fit imputers and encoders on training data only. Consider missingness indicators when absence is informative. One-hot encoding suits low cardinality; hashing bounds memory but creates collisions; embeddings learn compact representations. Target encoding requires out-of-fold construction to avoid leakage.", "follow": "When would median imputation hide an important signal?"}, {"group": "ML basics", "q": "PCA, LDA and feature selection?", "a": "PCA finds orthogonal directions of maximum variance without labels; discriminant LDA uses labels to separate classes. Neither guarantees better downstream predictions. Filter selection scores features independently of a fitted predictor; wrappers search feature subsets using validation; embedded selection occurs during training, as with L1. L2 usually shrinks rather than selects exact zeros.", "follow": "Why fit dimensionality reduction inside each validation fold?"}, {"group": "ML basics", "q": "What if labels are scarce?", "a": "Transfer learning reuses representations; weak supervision combines noisy labeling sources; semi-supervised methods exploit unlabeled examples. Pseudo-labels can reinforce mistakes, so use confidence controls and a genuinely labeled held-out set. Augmentation must preserve the target semantics.", "follow": "How do you assess correlated weak labeling sources?"}, {"group": "ML basics", "q": "How do you calibrate a classifier?", "a": "Calibration asks whether predictions near 0.8 are correct about 80% of the time. Inspect reliability plots, log loss or Brier score, and subgroup behavior. Fit Platt scaling or isotonic regression on disjoint calibration data. Resampling or class weighting can change probabilities; validate calibration under the serving distribution.", "follow": "Can calibration improve while AUC stays unchanged?"}, {"group": "ML basics", "q": "Data drift versus concept drift?", "a": "Data drift changes the input distribution P(X); concept drift changes P(y|X). Covariate drift alone need not reduce quality. Monitor input health and delayed outcome metrics, check logging and seasonality, then determine whether retraining addresses the actual cause.", "follow": "What can you detect before labels arrive?"}, {"group": "ML basics", "q": "ARMA, ARIMA and stationarity?", "a": "ARMA typically models a stationary series; ARIMA incorporates differencing to address nonstationarity. The ADF test has a unit-root null: a small p-value is evidence against that null, not a generic proof of every kind of stationarity. Evaluate with time-ordered backtests and account for seasonality.", "follow": "Why can ordinary shuffled cross-validation mislead?"}, {"group": "ML basics", "q": "Does k-means converge to the global optimum?", "a": "Standard Lloyd updates do not increase the squared-Euclidean objective. With consistent tie and empty-cluster handling they reach a fixed assignment/local solution, not necessarily the global optimum. The joint problem is nonconvex; initialization and multiple restarts matter. Absolute-distance clustering generally needs medians, not mean updates.", "follow": "What does k-means++ improve?"}, {"group": "ML basics", "q": "What happens to logistic regression on separable data?", "a": "Without regularization, perfectly separable classes can drive coefficients toward infinity: the likelihood supremum need not occur at finite weights. Regularization gives a controlled solution. This does not imply kNN is universally preferable.", "follow": "What does stronger L2 do to the predicted probabilities?"}, {"group": "ML basics", "q": "MRR, MAP, NDCG and MMR?", "a": "MRR averages the reciprocal rank of the first relevant result. MAP considers precision at relevant ranks across the result list. NDCG discounts graded relevance by position and normalizes by the ideal ranking. MMR is a relevance–redundancy reranking strategy, not mean reciprocal rank.", "follow": "Which metric fits a query with several required evidence documents?"}, {"group": "ML basics", "q": "Micro versus macro metrics for multilabel tasks?", "a": "Micro aggregation pools label decisions before computing a metric; macro averages per-label scores, giving rare labels equal weight. Subset accuracy requires the entire label set to match. Independent sigmoid outputs with BCE are a common baseline; label dependencies can motivate richer models.", "follow": "When would a good micro score hide a failed rare label?"}, {"group": "ML basics", "q": "How do you test an ML pipeline beyond accuracy?", "a": "Test schemas, null rates, label quality, feature transformations, point-in-time joins and training/serving parity. Use ablations to test feature value, perturbations for robustness and justified invariances for expected behavior. Trace examples end to end and compare to a simple baseline.", "follow": "What would you inspect first after a sudden quality regression?"}, {"group": "ML basics", "q": "Shadow, canary and blue-green deployment?", "a": "Shadow traffic exercises a new model without changing user-facing decisions. Canary exposes a limited cohort and ramps after checks. Blue-green retains two environments for switching and rollback; it is not inherently an A/B experiment. Randomized experiments need separate assignment and measurement design.", "follow": "How do you ensure a shadow model cannot cause tool side effects?"}], "diagrams": {"recommender": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1100 430\" role=\"img\" aria-labelledby=\"title desc\"><title id=\"title\">Recommender · serving + learning loop<\/title><desc id=\"desc\">Online request path above; offline ingestion and training below. Dashed arrows deploy artifacts into serving.<\/desc><defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6\" fill=\"none\" stroke=\"#52647b\"/><\/marker><\/defs><rect width=\"1100\" height=\"430\" rx=\"14\" fill=\"#f6f8fc\"/><g font-family=\"system-ui\" fill=\"#20334d\"><text x=\"24\" y=\"35\" font-size=\"21\" font-weight=\"700\">Recommender · serving + learning loop<\/text><text x=\"24\" y=\"70\" font-size=\"13\">ONLINE · request path<\/text><text x=\"24\" y=\"260\" font-size=\"13\">OFFLINE / STREAMING · data and artifacts<\/text><rect x=\"25\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"120\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">UI / load balancer<\/text><text x=\"120\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Recommendation API<\/text><text x=\"120\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Request cache<\/text><path d=\"M215,140 H237\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"240\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"335\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Candidate generation<\/text><text x=\"335\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">ANN + follows + fresh<\/text><text x=\"335\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Merge / deduplicate<\/text><path d=\"M430,140 H452\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"455\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"550\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Eligibility + features<\/text><text x=\"550\" y=\"145\" text-anchor=\"mid s<\/title><desc id=\"desc\">Online request path above; offline ingestion and training below. Dashed arrows deploy artifacts into serving.<\/desc><defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6\" fill=\"none\" stroke=\"#52647b\"/><\/marker><\/defs><rect width=\"1100\" height=\"430\" rx=\"14\" fill=\"#f6f8fc\"/><g font-family=\"system-ui\" fill=\"#20334d\"><text x=\"24\" y=\"35\" font-size=\"21\" font-weight=\"700\">RAG · permission-aware retrieval + grounded answers<\/text><text x=\"24\" y=\"70\" font-size=\"13\">ONLINE · request path<\/text><text x=\"24\" y=\"260\" font-size=\"13\">OFFLINE / STREAMING · data and artifacts<\/text><rect x=\"25\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"120\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">User / API<\/text><text x=\"120\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Identity + query<\/text><text x=\"120\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Scoped cache<\/text><path d=\"M215,140 H237\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"240\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"335\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Hybrid retrieval<\/text><text x=\"335\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Lexical + vector index<\/text><text x=\"335\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">ACL / tenant filtering<\/text><path d=\"M430,140 H452\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"455\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"550\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Rerank + context<\/text><text x=\"550\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Dedup / token budget<\/text><text x=\"550\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Source IDs retained<\/text><path d=\"M645,140 H667\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"670\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"765\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Generate + validate<\/text><text x=\"765\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">LLM + citations<\/text><text x=\"765\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Abstain / timeout<\/text><path d=\"M860,140 H882\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"885\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"980\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Answer + feedback<\/text><text x=\"980\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Citations / audit<\/text><text x=\"980\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Latency + cost<\/text><rect x=\"25\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"120\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Documents + ACLs<\/text><text x=\"120\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Parse / chunk / version<\/text><text x=\"120\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Deletes + updates<\/text><path d=\"M215,330 H237\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"240\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"335\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Embedding pipeline<\/text><text x=\"335\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Index text + vectors<\/text><text x=\"335\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Metadata / ACL sync<\/text><path d=\"M430,330 H452\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"455\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"550\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Retrieval evaluation<\/text><text x=\"550\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Gold query / doc pairs<\/text><text x=\"550\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Recall + rerank quality<\/text><path d=\"M645,330 H667\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"670\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"765\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Prompt/model versions<\/text><text x=\"765\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Answer eval + safety<\/text><text x=\"765\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Canary / rollback<\/text><path d=\"M860,330 H882\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"885\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"980\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Monitoring<\/text><text x=\"980\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Grounding / access<\/text><text x=\"980\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Freshness + failures<\/text><path d=\"M335,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><path d=\"M550,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><path d=\"M765,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><text x=\"25\" y=\"410\" font-size=\"13\">Log impressions / responses + outcomes → event stream → offline evaluation and monitoring → retrain or rollback<\/text><\/g><\/svg>"}, "classics": [{"label": "Linear Regression", "path": "ml_coding/classics/linear_regression.py", "code": "import numpy as np\n\n# Your fit/predict structure, with a stable least-squares solve.\nclass LinearRegressor:\n    def __init__(self):\n        self.W = None\n\n    def fit(self, X, y):\n        # X: (n, d), y: (n,). Add intercept, then solve least squares.\n        n, d = X.shape\n        X = np.concatenate([np.ones((n, 1)), X], axis=1)\n        # n >= d+1 does NOT guarantee independent columns.\n        self.W = np.linalg.lstsq(X, y, rcond=None)[0]\n        return self\n\n    def predict(self, X):\n        # Add the same intercept column, then multiply by fitted weights.\n        # Output: (n,).\n        n, _ = X.shape\n        X = np.concatenate([np.ones((n, 1)), X], axis=1)\n        return X @ self.W\n"}, {"label": "Kmeans", "path": "ml_coding/classics/kmeans.py", "code": "import numpy as np\n\nclass Kmeans:\n    def __init__(self, k, seed=0):\n        self.k = k\n        self.seed = seed\n        self.centroids = None  # (k, d)\n\n    def calc_pairwise_distances(self, X, centroids):\n        # Calculate squared distance from every point to every center.\n        # X: (n, d); centroids: (k, d); returns: (n, k).\n        # (n, 1, d) - (1, k, d) -> (n, k, d) -> (n, k)\n        # Squared distance has the same argmin; no sqrt needed.\n        return ((X[:, None, :] - centroids[None, :, :]) ** 2).sum(axis=2)\n\n    def get_assignments(self, distances):\n        # Assign each point to its nearest center; returns (n,).\n        return np.argmin(distances, axis=1)\n\n    def get_updated_centroids(self, X, assignments):\n        # Make each center the mean of its assigned points; returns (k, d).\n        # Keep the previous center if no points were assigned to it.\n        centers = self.centroids.copy()\n        for i in range(self.k):\n            points = X[assignments == i]\n            if len(points):  # Keep previous center for an empty cluster.\n                centers[i] = points.mean(axis=0)\n        return centers\n\n    def fit(self, X, max_iter=100, tol=1e-6):\n        # X: (n, d). Convert to float so centroid means are not truncated.\n        X = np.asarray(X, dtype=float)\n        if not 1 <= self.k <= len(X) or max_iter < 1:\n            raise ValueError('Require 1 <= k <= n and max_iter >= 1')\n        # 1. Assign initial centroids by sampling k data points.\n        rng = np.random.default_rng(self.seed)\n        self.centroids = X[rng.choice(len(X), self.k, replace=False)].copy()\n        # 2. Alternate assignments and centroid updates until convergence.\n        for _ in range(max_iter):\n            # Calculate pairwise distances and assign nearest centers.\n            labels = self.predict(X)\n            # Make each centroid the average of the points assigned to it.\n            updated = self.get_updated_centroids(X, labels)\n            # Check whether centers stopped moving (or hit max_iter).\n            converged = np.max(np.abs(updated - self.centroids)) <= tol\n            self.centroids = updated\n            if converged:\n                break\n        # 3. Compute final loss: sum of squared distances to nearest centers.\n        self.inertia_ = np.min(self.calc_pairwise_distances(X, self.centroids), axis=1).sum()\n        return self\n\n    def predict(self, X):\n        # Calculate distances, then return nearest-center labels: (n,).\n        return self.get_assignments(self.calc_pairwise_distances(X, self.centroids))\n"}, {"label": "Naive Bayes", "path": "ml_coding/classics/naive_bayes.py", "code": "import math\nfrom collections import Counter, defaultdict\n\n# Categorical features, hashable labels; positive alpha, nonempty training data.\nclass NaiveBayes:\n    def __init__(self, nclass=None, alpha=1.0):\n        if alpha <= 0:\n            raise ValueError('alpha must be positive')\n        self.alpha = alpha\n\n    def fit(self, X, y):\n        # Count class priors and feature values conditioned on each class.\n        self.count_y = Counter(y)\n        self.count_x_y = defaultdict(lambda: defaultdict(Counter))\n        self.vocab = [set() for _ in X[0]]\n        for row, label in zip(X, y):\n            for i, value in enumerate(row):\n                self.vocab[i].add(value)\n                self.count_x_y[label][i][value] += 1\n        return self\n\n    def predict(self, X):\n        # For each row: log prior + sum of log conditional likelihoods.\n        # Choose the label with the largest score; no normalization needed.\n        labels = []\n        total = sum(self.count_y.values())\n        for row in X:\n            scores = {}\n            for label, count in self.count_y.items():\n                score = math.log(count / total)\n                for i, value in enumerate(row):\n                    # Reserve one unknown category per feature.\n                    denominator = count + self.alpha * (len(self.vocab[i]) + 1)\n                    numerator = self.count_x_y[label][i][value] + self.alpha\n                    score += math.log(numerator / denominator)\n                scores[label] = score\n            labels.append(max(scores, key=scores.get))\n        return labels\n"}, {"label": "Self Attention", "path": "ml_coding/classics/self_attention.py", "code": "import torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\n# Your single-head, unmasked baseline. Add causal masking as a follow-up.\nclass SelfAttention(nn.Module):\n    def __init__(self, embed_dim, key_dim, val_dim):\n        super().__init__()\n        self.key_dim = key_dim\n        self.Wk = nn.Linear(embed_dim, key_dim)\n        self.Wq = nn.Linear(embed_dim, key_dim)\n        self.Wv = nn.Linear(embed_dim, val_dim)\n\n    def forward(self, X):\n        # X: (batch, seq_len, embed_dim)\n        # 1. Project tokens to Q/K: (B, T, key_dim), V: (B, T, val_dim).\n        K = self.Wk(X)\n        Q = self.Wq(X)\n        V = self.Wv(X)\n        # 2. Compare every query to every key and scale: (B, T, T).\n        scores = torch.bmm(Q, K.transpose(1, 2)) / self.key_dim ** 0.5\n        # 3. Normalize over key positions for each query.\n        attention = F.softmax(scores, dim=2)\n        # 4. Weighted sum of values for every query.\n        return torch.bmm(attention, V)  # (batch, seq_len, val_dim)\n\n\nclass TransformerBlock(nn.Module):\n    # Minimal encoder-style block: one attention head, no masking or dropout.\n    def __init__(self, embed_dim, hidden_dim):\n        super().__init__()\n        self.attention = SelfAttention(embed_dim, embed_dim, embed_dim)\n        self.norm1 = nn.LayerNorm(embed_dim, eps=1e-5)\n        self.norm2 = nn.LayerNorm(embed_dim, eps=1e-5)\n        self.ffn = nn.Sequential(\n            nn.Linear(embed_dim, hidden_dim),\n            nn.ReLU(),\n            nn.Linear(hidden_dim, embed_dim),\n        )\n\n    def forward(self, X):\n        # Input / output: (batch, seq_len, embed_dim).\n        # 1. Normalize, mix information across tokens, then add the residual.\n        X = X + self.attention(self.norm1(X))\n        # 2. Normalize, transform each token independently, add the residual.\n        X = X + self.ffn(self.norm2(X))\n        return X\n"}, {"label": "Self Attention Numpy", "path": "ml_coding/classics/self_attention_numpy.py", "code": "import numpy as np\n\n\nclass SelfAttentionNumpy:\n    # Single head, no mask, no bias. Weights are supplied so tests are repeatable.\n    def __init__(self, Wq, Wk, Wv):\n        # Wq, Wk: (embed_dim, key_dim); Wv: (embed_dim, val_dim)\n        self.Wq, self.Wk, self.Wv = Wq, Wk, Wv\n\n    def forward(self, X):\n        # Input: (batch, seq_len, embed_dim)\n        # Outline: project Q/K/V -> scaled scores -> softmax -> weighted values.\n        # einsum labels: b=batch, t=query position, s=key position,\n        # e=embedding feature, k=key feature, v=value feature.\n\n        # 1. Project each token into query, key and value vectors.\n        Q = np.einsum('bte,ek->btk', X, self.Wq)  # (B, T, K)\n        K = np.einsum('bse,ek->bsk', X, self.Wk)  # (B, S, K); S=T\n        V = np.einsum('bse,ev->bsv', X, self.Wv)  # (B, S, V)\n\n        # 2. Dot each query with every key, summing over key features.\n        scores = np.einsum('btk,bsk->bts', Q, K) / np.sqrt(Q.shape[-1])\n        # scores: (B, T, S). A causal mask would go here, before softmax.\n\n        # 3. Stable softmax over keys for each query (last axis).\n        scores = scores - scores.max(axis=-1, keepdims=True)\n        weights = np.exp(scores)\n        weights = weights / weights.sum(axis=-1, keepdims=True)\n\n        # 4. Sum values weighted by attention, contracting key positions.\n        return np.einsum('bts,bsv->btv', weights, V)  # (B, T, V)\n\n\nclass TransformerBlockNumpy:\n    # Same pre-norm structure as PyTorch; no learned norm scale/bias or biases.\n    def __init__(self, Wq, Wk, Wv, W1, W2):\n        # Wq/Wk/Wv: (E, E); W1: (E, H); W2: (H, E).\n        # Attention must return E features so the residual shapes match.\n        self.attention = SelfAttentionNumpy(Wq, Wk, Wv)\n        self.W1, self.W2 = W1, W2\n\n    def layer_norm(self, X):\n        # Normalize features independently for each token: (B, T, E).\n        mean = X.mean(axis=-1, keepdims=True)\n        variance = X.var(axis=-1, keepdims=True)\n        return (X - mean) / np.sqrt(variance + 1e-5)\n\n    def forward(self, X):\n        # 1. Normalize -> self-attention -> residual: (B, T, E).\n        X = X + self.attention.forward(self.layer_norm(X))\n\n        # 2. Normalize -> expand -> ReLU -> project back -> residual.\n        normalized = self.layer_norm(X)\n        hidden = np.einsum('bte,eh->bth', normalized, self.W1)\n        hidden = np.maximum(hidden, 0)  # ReLU: (B, T, H)\n        output = np.einsum('bth,he->bte', hidden, self.W2)\n        return X + output  # (B, T, E)\n"}], "designReferences": "<nav class=\"design-index\" aria-label=\"Reference designs\"><a href=\"#recommender\" data-design-jump=\"recommender\">Recommender<\/a> · <a href=\"#rag-design\" data-design-jump=\"rag-design\">RAG<\/a> · <a href=\"#knowledge-agent\" data-design-jump=\"knowledge-agent\">Agentic knowledge work<\/a><\/nav>\n<section id=\"recommender\"><h2>Reference design: recommender system<\/h2>\n<p><strong>Scenario:<\/strong> a personalized home feed mixing followed topics, followed users and recommended content. Optimize useful engagement with freshness, diversity and negative-feedback guardrails. Start with popular/recent content before adding learned retrieval and ranking.<\/p>\n<div class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1100 430\" role=\"img\" aria-labelledby=\"title desc\"><title id=\"title\">Recommender · serving + learning loop<\/title><desc id=\"desc\">Online request path above; offline ingestion and training below. Dashed arrows deploy artifacts into serving.<\/desc><defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6\" fill=\"none\" stroke=\"#52647b\"/><\/marker><\/defs><rect width=\"1100\" height=\"430\" rx=\"14\" fill=\"#f6f8fc\"/><g font-family=\"system-ui\" fill=\"#20334d\"><text x=\"24\" y=\"35\" font-size=\"21\" font-weight=\"700\">Recommender · serving + learning loop<\/text><text x=\"24\" y=\"70\" font-size=\"13\">ONLINE · request path<\/text><text x=\"24\" y=\"260\" font-size=\"13\">OFFLINE / STREAMING · data and artifacts<\/text><rect x=\"25\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"120\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">UI / load balancer<\/text><text x=\"120\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Recommendation API<\/text><text x=\"120\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Request cache<\/text><path d=\"M215,140 H237\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"240\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"335\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Candidate generation<\/text><text x=\"335\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">ANN + follows + fresh<\/text><text x=\"335\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Merge / deduplicate<\/text><path d=\"M430,140 H452\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"455\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"550\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Eligibility + features<\/text><text x=\"550\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">ACL / seen / available<\/text><text x=\"550\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Online feature store<\/text><path d=\"M645,140 H667\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"670\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"765\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Ranking<\/text><text x=\"765\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Light → heavy ranker<\/text><text x=\"765\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Score candidates<\/text><path d=\"M860,140 H882\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"885\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"980\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Policy + response<\/text><text x=\"980\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Diversity / freshness<\/text><text x=\"980\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Log impressions<\/text><rect x=\"25\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"120\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Events + item data<\/text><text x=\"120\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Kafka / stream + batch<\/text><text x=\"120\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Point-in-time joins<\/text><path d=\"M215,330 H237\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"240\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"335\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Embedding training<\/text><text x=\"335\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Catalog embeddings<\/text><text x=\"335\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Versioned ANN index<\/text><path d=\"M430,330 H452\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"455\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"550\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Feature pipelines<\/text><text x=\"550\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Offline / online stores<\/text><text x=\"550\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Consistent transforms<\/text><path d=\"M645,330 H667\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"670\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"765\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Ranker training<\/text><text x=\"765\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Temporal validation<\/text><text x=\"765\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Registry → deploy<\/text><path d=\"M860,330 H882\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"885\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"980\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Evaluate + monitor<\/text><text x=\"980\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Quality / drift / latency<\/text><text x=\"980\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Experiment / rollback<\/text><path d=\"M335,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><path d=\"M550,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><path d=\"M765,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><text x=\"25\" y=\"410\" font-size=\"13\">Log impressions / responses + outcomes → event stream → offline evaluation and monitoring → retrain or rollback<\/text><\/g><\/svg><\/div>\n<h3>Retrieval and data<\/h3><ul>\n<li><strong>Candidate sources:<\/strong> combine two-tower ANN retrieval with follows, co-engagement and a fresh/cold-start pool. Allocate candidate budgets by marginal recall and latency. A strong ranker cannot recover an item never retrieved.<\/li>\n<li><strong>Embedding design:<\/strong> ID embeddings capture known preferences; text/image/metadata features help unseen items. Train query and item towers together, but precompute item embeddings. Deploy compatible query models and index versions together.<\/li>\n<li><strong>Negative sampling:<\/strong> in-batch negatives are cheap but popularity-skewed; random negatives are easy; hard negatives improve discrimination but may be unlabeled positives. Mix sources and inspect false negatives. Sampling-probability corrections such as log-Q require a justified sampling model, not a universal subtraction rule.<\/li>\n<li><strong>Training data:<\/strong> log impressions, positions, clicks, dwell and hides; unexposed items are not observed negative outcomes. Use point-in-time feature joins, temporal evaluation and checks for delayed labels. Nearline session features improve responsiveness but add consistency and freshness requirements.<\/li><\/ul>\n<h3>Ranking and policy<\/h3><ul>\n<li><strong>One ranker or a cascade:<\/strong> start with one affordable ranker. Add a light stage to prune candidates when expensive cross-features or sequence models exceed the latency budget. Measure quality lost at each cutoff.<\/li>\n<li><strong>Loss:<\/strong> pointwise BCE learns click probabilities under the training distribution; it does not guarantee calibrated serving probabilities. Pairwise/listwise losses emphasize relative ordering. If combining click, dwell and hide predictions into expected value, validate calibration and objective weights separately.<\/li>\n<li><strong>Exposure bias:<\/strong> position features can encode the previous policy. Use randomized exposure where feasible, or propensity weighting with overlap assumptions and variance controls. A position-aware model needs an explicit serving convention; setting position to zero is not a universal correction.<\/li>\n<li><strong>Diversity and freshness:<\/strong> apply eligibility before ranking; use category/creator caps, freshness boosts or MMR-style relevance–similarity tradeoffs afterward. Tune for utility loss versus variety. Maintain a fresh-item source because post-ranking boosts cannot rescue missing candidates.<\/li><\/ul>\n<h3>Serving, evaluation and failure paths<\/h3>\n<ul><li><strong>Feature-store placement:<\/strong> upstream stream/batch jobs compute features; the online store serves low-latency lookups and the offline store supports point-in-time training joins. Store definitions, timestamps and versions together. The feature store does not itself decide ranking.<\/li><li><strong>Large catalogs:<\/strong> keep only hot serving features in memory, use a durable distributed store for the rest, fetch only retrieved candidates and batch requests. Choose partition keys and replication from access patterns; putting every item in Redis is not a requirement.<\/li><li><strong>When to infer:<\/strong> precompute stable item features and embeddings; compute fast-changing user/session scores at request time. For predictable events, such as incoming messages, precompute suggestions on arrival when the freshness/compute tradeoff is favorable.<\/li><li><strong>Exploration:<\/strong> cold-start metadata and onboarding preferences help before interaction history exists. A controlled exploration budget can collect new-item feedback; log exposure probabilities if later evaluation needs propensity correction.<\/li><\/ul><ul>\n<li><strong>Online/offline split:<\/strong> stream events into an online feature store and offline training data; retain consistent feature definitions. Training publishes models and ANN artifacts through versioned storage/registry. The recommendation service orchestrates retrieval, filtering, feature lookup, ranking and policy.<\/li>\n<li><strong>Cache and fallback:<\/strong> scope request caches to user/context and versions; invalidate or shorten TTL for rapidly changing interests. If a ranker or store fails, serve an eligible popular/recent pool. A Bloom filter may accelerate seen-item checks but can drop valid items through false positives; it is not an authoritative ACL check.<\/li>\n<li><strong>Measure:<\/strong> retrieval Recall@K, ranking NDCG, probability log loss/calibration, then online useful engagement or retention with hide-rate and latency guardrails. Segment new users/items. Inspect exposure feedback loops, stale features and logging failures before retraining after a regression.<\/li><\/ul><\/section>\n<section id=\"rag-design\"><h2>Reference design: permission-aware RAG<\/h2>\n<p><strong>Scenario:<\/strong> answer questions over versioned enterprise documents, with verifiable sources and tenant/user access control. Start with a fixed retrieve → rerank → generate pipeline; add iteration only for queries that benefit from it.<\/p>\n<div class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1100 430\" role=\"img\" aria-labelledby=\"title desc\"><title id=\"title\">RAG · permission-aware retrieval + grounded answers<\/title><desc id=\"desc\">Online request path above; offline ingestion and training below. Dashed arrows deploy artifacts into serving.<\/desc><defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6\" fill=\"none\" stroke=\"#52647b\"/><\/marker><\/defs><rect width=\"1100\" height=\"430\" rx=\"14\" fill=\"#f6f8fc\"/><g font-family=\"system-ui\" fill=\"#20334d\"><text x=\"24\" y=\"35\" font-size=\"21\" font-weight=\"700\">RAG · permission-aware retrieval + grounded answers<\/text><text x=\"24\" y=\"70\" font-size=\"13\">ONLINE · request path<\/text><text x=\"24\" y=\"260\" font-size=\"13\">OFFLINE / STREAMING · data and artifacts<\/text><rect x=\"25\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"120\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">User / API<\/text><text x=\"120\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Identity + query<\/text><text x=\"120\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Scoped cache<\/text><path d=\"M215,140 H237\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"240\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"335\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Hybrid retrieval<\/text><text x=\"335\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Lexical + vector index<\/text><text x=\"335\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">ACL / tenant filtering<\/text><path d=\"M430,140 H452\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"455\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"550\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Rerank + context<\/text><text x=\"550\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Dedup / token budget<\/text><text x=\"550\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Source IDs retained<\/text><path d=\"M645,140 H667\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"670\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"765\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Generate + validate<\/text><text x=\"765\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">LLM + citations<\/text><text x=\"765\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Abstain / timeout<\/text><path d=\"M860,140 H882\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"885\" y=\"95\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#2575a6\" stroke-width=\"2\"/><text x=\"980\" y=\"123\" text-anchor=\"middle\" font-size=\"14\">Answer + feedback<\/text><text x=\"980\" y=\"145\" text-anchor=\"middle\" font-size=\"14\">Citations / audit<\/text><text x=\"980\" y=\"167\" text-anchor=\"middle\" font-size=\"14\">Latency + cost<\/text><rect x=\"25\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"120\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Documents + ACLs<\/text><text x=\"120\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Parse / chunk / version<\/text><text x=\"120\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Deletes + updates<\/text><path d=\"M215,330 H237\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"240\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"335\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Embedding pipeline<\/text><text x=\"335\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Index text + vectors<\/text><text x=\"335\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Metadata / ACL sync<\/text><path d=\"M430,330 H452\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"455\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"550\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Retrieval evaluation<\/text><text x=\"550\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Gold query / doc pairs<\/text><text x=\"550\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Recall + rerank quality<\/text><path d=\"M645,330 H667\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"670\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"765\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Prompt/model versions<\/text><text x=\"765\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Answer eval + safety<\/text><text x=\"765\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Canary / rollback<\/text><path d=\"M860,330 H882\" stroke=\"#52647b\" marker-end=\"url(#arrow)\"/><rect x=\"885\" y=\"285\" width=\"190\" height=\"90\" rx=\"9\" fill=\"white\" stroke=\"#7c64a6\" stroke-width=\"2\"/><text x=\"980\" y=\"313\" text-anchor=\"middle\" font-size=\"14\">Monitoring<\/text><text x=\"980\" y=\"335\" text-anchor=\"middle\" font-size=\"14\">Grounding / access<\/text><text x=\"980\" y=\"357\" text-anchor=\"middle\" font-size=\"14\">Freshness + failures<\/text><path d=\"M335,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><path d=\"M550,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><path d=\"M765,285 V188\" stroke=\"#7c64a6\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/><text x=\"25\" y=\"410\" font-size=\"13\">Log impressions / responses + outcomes → event stream → offline evaluation and monitoring → retrain or rollback<\/text><\/g><\/svg><\/div>\n<h3>Ingestion and chunking<\/h3><ul>\n<li><strong>Fixed versus structure-aware chunks:<\/strong> fixed token windows are simple; heading/paragraph-aware chunks preserve meaning. Small chunks improve retrieval precision but lose context; large chunks dilute matches and consume generation budget. Evaluate sizes on actual query types rather than choosing one universal length.<\/li>\n<li><strong>Overlap and parent context:<\/strong> modest overlap protects boundary facts but creates duplicates. Retrieve small child chunks, then expand to a bounded parent section when needed. Deduplicate overlapping evidence before generation.<\/li>\n<li><strong>Tables and metadata:<\/strong> preserve column headers, units, entity and reporting period with rows; avoid splitting a number from its meaning. Store document ID, span/page, version, timestamp and ACLs alongside each chunk. Citation IDs must resolve to the version used.<\/li>\n<li><strong>Updates and deletes:<\/strong> incremental content hashes reduce re-embedding. Version embeddings with the model and chunking policy. Track index lag; use authoritative revocation/deletion checks when stale indexes could expose removed content.<\/li><\/ul>\n<h3>Retrieval and reranking<\/h3><ul>\n<li><strong>Lexical versus dense:<\/strong> BM25 handles exact names, identifiers and unusual terms; dense retrieval helps semantic paraphrases. Hybrid retrieval broadens coverage. Fuse rankings with reciprocal rank fusion or validated score normalization; raw scores from different retrievers are not inherently comparable.<\/li>\n<li><strong>Permission boundary:<\/strong> filter by tenant and ACL in retrieval where supported, and recheck authoritative eligibility before model context. Restrictive post-filtering can underfill top-k; fetch additional eligible candidates without allowing denied content into prompts or caches.<\/li>\n<li><strong>Reranker choice:<\/strong> a cross-encoder scores query–passage pairs jointly and often improves precision at extra cost. An LLM reranker can use richer instructions but adds latency, expense and variability. Rerank a bounded candidate set; compare quality gain against a no-reranker baseline.<\/li>\n<li><strong>Context packing:<\/strong> choose evidence under a token budget, remove redundant chunks, preserve source labels and leave output headroom. Select diverse evidence for multi-document questions; more retrieved text is not automatically better.<\/li><\/ul>\n<h3>One-shot versus agentic retrieval<\/h3><ul>\n<li><strong>Fixed pipeline:<\/strong> best starting point for direct questions with a known corpus; predictable latency, cost and evaluation. A deterministic query rewrite or decomposition step may be enough without an open-ended agent.<\/li>\n<li><strong>Bounded iteration:<\/strong> use when the next search depends on discovered entities or missing evidence. Let the system inspect results, refine queries and retrieve again, with explicit limits on calls, elapsed time and tokens. Stop when evidence is sufficient or abstain when the budget is exhausted.<\/li>\n<li><strong>Routing:<\/strong> compare fixed and iterative paths on the same query set. Adopt agentic retrieval only where its incremental answer quality justifies extra latency and failure opportunities. Tool-using workflows that act on external systems belong in the next reference design.<\/li><\/ul>\n<h3>Automatic evaluation scorecard<\/h3><ul><li><strong>Retrieval:<\/strong> evidence Recall@K and ranked relevance; evaluate the final context packet as well as raw retrieval.<\/li><li><strong>Groundedness:<\/strong> decompose answers into factual claims and check support in context. A supported claim can still be wrong if its source is outdated.<\/li><li><strong>Correctness and completeness:<\/strong> compare against verified reference facts and the question’s required parts; use deterministic arithmetic/date checks when possible.<\/li><li><strong>Citations:<\/strong> check source IDs and claim-to-cited-span support, plus coverage of claims needing citations.<\/li><li><strong>Abstention:<\/strong> measure unsupported answers on insufficient-evidence cases separately from unnecessary refusals on answerable cases.<\/li><li><strong>Trust the evaluator only after validation:<\/strong> calibrate narrow semantic judge rubrics against human labels; require evidence spans. Keep access failures as hard gates and cost/latency alongside quality. Run with gold context to distinguish retrieval failures from generation failures.<\/li><\/ul>\n<h3>Grounding and operations<\/h3><ul>\n<li><strong>Answer contract:<\/strong> cite supporting passages, distinguish conflicting versions and abstain on insufficient evidence. Citation membership is necessary but does not prove a claim follows from the source; use evidence/entailment checks and human evaluation.<\/li>\n<li><strong>Security and fallback:<\/strong> treat retrieved instructions as untrusted data. Keep access checks outside the model; send fallback models only data permitted for that destination. Key caches by access scope, corpus and prompt/model versions.<\/li>\n<li><strong>Evaluation:<\/strong> separate retrieval recall, reranker quality and answer correctness/grounding. Include multi-hop, stale-document, no-answer and permission-denied cases. Monitor index freshness, p95 latency, token cost and access violations; canary changes to chunking, embeddings and prompts independently.<\/li><\/ul><\/section>\n<section id=\"knowledge-agent\"><h2>Reference design: agentic knowledge work<\/h2>\n<p><strong>Scenario:<\/strong> research across documents, sheets and email, reconcile evidence, produce a report and optionally stage updates. Success is a correct deliverable or authorized final state, not a plausible conversation.<\/p>\n<div class=\"flow-strip\" aria-label=\"Agent workflow\">Request + identity → scope and route → bounded plan / tool loop → verify → preview writes → commit + audit<\/div>\n<h3>Workflow and autonomy<\/h3><ul>\n<li><strong>Fixed workflow first:<\/strong> use a prescribed sequence for repeatable tasks such as filling a report template. Use an agent loop when tool choice genuinely depends on intermediate results. Route simple questions to the RAG path.<\/li>\n<li><strong>State:<\/strong> persist task ID, plan, evidence references, tool results, pending actions and budget counters. Checkpoint around durable operations so a restart resumes safely. A model-generated plan is a proposal, not authorization.<\/li>\n<li><strong>Parallelism:<\/strong> batch independent reads to reduce serial latency; keep dependent calls ordered. Bound concurrency and handle partial failures. Add subagents only for separable subtasks whose outputs can be verified; coordination can cost more than it saves.<\/li>\n<li><strong>Termination:<\/strong> enforce step/time/token limits, detect repeated failed calls and return a partial result with missing evidence rather than loop indefinitely. Define when the user must resolve ambiguity.<\/li><\/ul>\n<h3>Context, tools and memory<\/h3><ul>\n<li><strong>Progressive disclosure:<\/strong> fetch titles, schemas and summaries before full content. Pass large tables through authorized typed handles and request relevant rows/aggregates. Handles must enforce scope and lifetime; they are not permission bypasses.<\/li>\n<li><strong>Compaction:<\/strong> retain goals, constraints, evidence IDs, decisions and outstanding work. Summaries can lose details, so keep retrievable originals. Stable system/tool prefixes may improve prefix-cache reuse; do not freeze stale task facts merely for caching.<\/li>\n<li><strong>Memory tiers:<\/strong> current task state is distinct from project history and durable user facts. Store provenance, timestamps and deletion controls; retrieve only relevant authorized memory and resolve contradictions before using it.<\/li>\n<li><strong>Tools:<\/strong> expose narrow typed operations, validate arguments server-side and return actionable errors. Retry transient read failures within a budget. For writes, use idempotency keys and reconcile unknown outcomes before retrying.<\/li><\/ul>\n<h3>Action safety and evaluation<\/h3><ul>\n<li><strong>Read versus write:<\/strong> scope connectors to the user, enforce ACLs for every call and isolate untrusted document/email content from authorization decisions. Stage consequential actions as a concrete preview; approval must bind to the exact action before execution.<\/li>\n<li><strong>Verification:<\/strong> check output schemas, spreadsheet formulas, citations and destination identities deterministically where possible. Verify the final state after writes and keep an audit trail. Prompt-injection filters alone do not create a security boundary.<\/li>\n<li><strong>Test worlds:<\/strong> seed consistent docs/sheets/emails with distractors, missing permissions and conflicting facts. Grade expected deliverables/state changes plus forbidden side effects, not a single prescribed tool sequence. Hold out world templates and compare with real task samples to detect synthetic overfitting.<\/li>\n<li><strong>Reliability:<\/strong> track single-run success, repeated-run consistency, cost, latency and unwanted actions. At-least-one success across several attempts is not the reliability of one user run. Calibrate subjective rubric judges against human labels and report disagreement.<\/li>\n<li><strong>Improve from failures:<\/strong> cluster traces into retrieval misses, incorrect arguments, context loss, premature completion and verification failures. Fix the dominant cause, compare on paired tasks and report uncertainty; do not promise a fixed lift. Route simple steps to smaller models only after quality checks, then canary and retain rollback versions.<\/li><\/ul>\n<h3 id=\"model-upgrades\">Upgrading the model powering the agent<\/h3>\n<p><strong>Goal:<\/strong> determine whether a new model improves task quality or lowers cost without introducing regressions.<\/p>\n<ol class=\"framework-list\">\n<li><strong>Build the evaluation set.<\/strong> Sample representative tasks with restorable initial state, plus a separate suite of known failures. Review thumbs-up, thumbs-down and unrated cases to discover failure modes; feedback is a signal, not ground truth.<\/li>\n<li><strong>Define and validate the rubric.<\/strong> Combine task requirements with the failure taxonomy: completion, correctness/grounding, completeness, permitted actions and appropriate refusal. Use deterministic outcome checks where possible and LLM judges for semantic criteria. Validate graders against held-out human labels.<\/li>\n<li><strong>Rerun asynchronously.<\/strong> A model-release event queues incumbent/candidate runs on the same tasks in isolated environments, followed by grading jobs. Freeze harness, data and grader versions. Let each model choose its own actions: replaying the old transcript cannot measure a changed trajectory. Sandbox writes, bound retries and distinguish infrastructure errors from agent failures.<\/li>\n<li><strong>Compare quality and cost.<\/strong> Measure absolute rubric scores and blinded pairwise win/tie/loss, with repeated trials, uncertainty and important task slices. Count whole-task tokens, tools and retries; report cost per task and spend per successful task. Keep authorization failures as hard gates.<\/li>\n<li><strong>Validate online before ramping.<\/strong> Offline gates earn a small canary, then a controlled A/B test with stable assignment and rollback. Track task completion, thumbs feedback <em>and rating participation<\/em>, edits/retries, latency and cost. Test the actual serving policy: best-of-N is only relevant if production also generates and selects among N attempts.<\/li>\n<\/ol>\n<p class=\"muted\">Further reading: <a href=\"https://www.anthropic.com/research/demystifying-evals-for-ai-agents\">agent outcomes and graders<\/a> · <a href=\"https://people.eecs.berkeley.edu/~bjoern/papers/shankar-validators-uist2024.pdf\">rubric alignment with human judgments<\/a> · <a href=\"https://arxiv.org/abs/2306.05685\">judge biases<\/a>.<\/p>\n<\/section>\n", "lcGroups": [{"category": "Arrays, Hashing & Prefix Sums", "problems": [{"n": 1, "title": "Two Sum", "slug": "two-sum", "diff": "E", "tier": "core"}, {"n": 49, "title": "Group Anagrams", "slug": "group-anagrams", "diff": "M", "tier": "core"}, {"n": 238, "title": "Product of Array Except Self", "slug": "product-of-array-except-self", "diff": "M", "tier": "core"}, {"n": 128, "title": "Longest Consecutive Sequence", "slug": "longest-consecutive-sequence", "diff": "M", "tier": "core"}, {"n": 347, "title": "Top K Frequent Elements", "slug": "top-k-frequent-elements", "diff": "M", "tier": "core"}, {"n": 560, "title": "Subarray Sum Equals K", "slug": "subarray-sum-equals-k", "diff": "M", "tier": "core"}, {"n": 36, "title":
