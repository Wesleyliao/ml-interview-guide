<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc"><title id="title">RAG · permission-aware retrieval + grounded answers</title><desc id="desc">Online request path above; offline ingestion and training below. Dashed arrows deploy artifacts into serving.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#52647b"/></marker></defs><rect width="1100" height="430" rx="14" fill="#f6f8fc"/><g font-family="system-ui" fill="#20334d"><text x="24" y="35" font-size="21" font-weight="700">RAG · permission-aware retrieval + grounded answers</text><text x="24" y="70" font-size="13">ONLINE · request path</text><text x="24" y="260" font-size="13">OFFLINE / STREAMING · data and artifacts</text><rect x="25" y="95" width="190" height="90" rx="9" fill="white" stroke="#2575a6" stroke-width="2"/><text x="120" y="123" text-anchor="middle" font-size="14">User / API</text><text x="120" y="145" text-anchor="middle" font-size="14">Identity + query</text><text x="120" y="167" text-anchor="middle" font-size="14">Scoped cache</text><path d="M215,140 H237" stroke="#52647b" marker-end="url(#arrow)"/><rect x="240" y="95" width="190" height="90" rx="9" fill="white" stroke="#2575a6" stroke-width="2"/><text x="335" y="123" text-anchor="middle" font-size="14">Hybrid retrieval</text><text x="335" y="145" text-anchor="middle" font-size="14">Lexical + vector index</text><text x="335" y="167" text-anchor="middle" font-size="14">ACL / tenant filtering</text><path d="M430,140 H452" stroke="#52647b" marker-end="url(#arrow)"/><rect x="455" y="95" width="190" height="90" rx="9" fill="white" stroke="#2575a6" stroke-width="2"/><text x="550" y="123" text-anchor="middle" font-size="14">Rerank + context</text><text x="550" y="145" text-anchor="middle" font-size="14">Dedup / token budget</text><text x="550" y="167" text-anchor="middle" font-size="14">Source IDs retained</text><