<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc"><title id="title">Recommender · serving + learning loop</title><desc id="desc">Online request path above; offline ingestion and training below. Dashed arrows deploy artifacts into serving.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#52647b"/></marker></defs><rect width="1100" height="430" rx="14" fill="#f6f8fc"/><g font-family="system-ui" fill="#20334d"><text x="24" y="35" font-size="21" font-weight="700">Recommender · serving + learning loop</text><text x="24" y="70" font-size="13">ONLINE · request path</text><text x="24" y="260" font-size="13">OFFLINE / STREAMING · data and artifacts</text><rect x="25" y="95" width="190" height="90" rx="9" fill="white" stroke="#2575a6" stroke-width="2"/><text x="120" y="123" text-anchor="middle" font-size="14">UI / load balancer</text><text x="120" y="145" text-anchor="middle" font-size="14">Recommendation API</text><text x="120" y="167" text-anchor="middle" font-size="14">Request cache</text><path d="M215,140 H237" stroke="#52647b" marker-end="url(#arrow)"/><rect x="240" y="95" width="190" height="90" rx="9" fill="white" stroke="#2575a6" stroke-width="2"/><text x="335" y="123" text-anchor="middle" font-size="14">Candidate generation</text><text x="335" y="145" text-anchor="middle" font-size="14">ANN + follows + fresh</text><text x="335" y="167" text-anchor="middle" font-size="14">Merge / deduplicate</text><path d="M430,140 H452" stroke="#52647b" marker-end="url(#arrow)"/><rect x="455" y="95" width="190" height="90" rx="9" fill="white" stroke="#2575a6" stroke-width="2"/><text x="550" y="123" text-anchor="middle" font-size="14">Eligibility + features</text><text x="550" y="145" text-anchor="middle" font-size="14">ACL / seen / available</text><text x="550" y="167" text-anchor="middle" font-size="14">Online feature store</text><path d="M645,140 H667" stroke="#52647b" marker-end="url(#arrow)"/><rect x="670" y="95" width="190" height="90" rx="9" fill="white" stroke="#2575a6" stroke-width="2"/><text x="765" y="123" text-anchor="middle" font-size="14">Ranking</text><text x="765" y="145" text-anchor="middle" font-size="14">Light → heavy ranker</text><text x="765" y="167" text-anchor="middle" font-size="14">Score candidates</text><path d="M860,140 H882" stroke="#52647b" marker-end="url(#arrow)"/><rect x="885" y="95" width="190" height="90" rx="9" fill="white" stroke="#2575a6" stroke-width="2"/><text x="980" y="123" text-anchor="middle" font-size="14">Policy + response</text><text x="980" y="145" text-anchor="middle" font-size="14">Diversity / freshness</text><text x="980" y="167" text-anchor="middle" font-size="14">Log impressions</text><rect x="25" y="285" width="190" height="90" rx="9" fill="white" stroke="#7c64a6" stroke-width="2"/><text x="120" y="313" text-anchor="middle" font-size="14">Events + item data</text><text x="120" y="335" text-anchor="middle" font-size="14">Kafka / stream + batch</text><text x="120" y="357" text-anchor="middle" font-size="14">Point-in-time joins</text><path d="M215,330 H237" stroke="#52647b" marker-end="url(#arrow)"/><rect x="240" y="285" width="190" height="90" rx="9" fill="white" stroke="#7c64a6" stroke-width="2"/><text x="335" y="313" text-anchor="middle" font-size="14">Embedding training</text><text x="335" y="335" text-anchor="middle" font-size="14">Catalog embeddings</text><text x="335" y="357" text-anchor="middle" font-size="14">Versioned ANN index</text><path d="M430,330 H452" stroke="#52647b" marker-end="url(#arrow)"/><rect x="455" y="285" width="190" height="90" rx="9" fill="white" stroke="#7c64a6" stroke-width="2"/><text x="550" y="313" text-anchor="middle" font-size="14">Feature pipelines</text><text x="550" y="335" text-anchor="middle" font-size="14">Offline / online stores</text><text x="550" y="357" text-anchor="middle" font-size="14">Consistent transforms</text><path d="M645,330 H667" stroke="#52647b" marker-end="url(#arrow)"/><rect x="670" y="285" width="190" height="90" rx="9" fill="white" stroke="#7c64a6" stroke-width="2"/><text x="765" y="313" text-anchor="middle" font-size="14">Ranker training</text><text x="765" y="335" text-anchor="middle" font-size="14">Temporal validation</text><text x="765" y="357" text-anchor="middle" font-size="14">Registry → deploy</text><path d="M860,330 H882" stroke="#52647b" marker-end="url(#arrow)"/><rect x="885" y="285" width="190" height="90" rx="9" fill="white" stroke="#7c64a6" stroke-width="2"/><text x="980" y="313" text-anchor="middle" font-size="14">Evaluate + monitor</text><text x="980" y="335" text-anchor="middle" font-size="14">Quality / drift / latency</text><text x="980" y="357" text-anchor="middle" font-size="14">Experiment / rollback</text><path d="M335,285 V188" stroke="#7c64a6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M550,285 V188" stroke="#7c64a6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M765,285 V188" stroke="#7c64a6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="25" y="410" font-size="13">Log impressions / responses + outcomes → event stream → offline evaluation and monitoring → retrain or rollback</text></g></svg>